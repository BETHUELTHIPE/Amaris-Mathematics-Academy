global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    monitor: amaris-docker

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          source: monitoring-host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          source: monitoring-host

  - job_name: flower
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]
        labels:
          source: celery-observer

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox:9115"]
        labels:
          source: monitoring-host

  - job_name: amaris-django
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["amaris-production-web.onrender.com"]
        labels:
          source: render
          service: backend

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://amaris-mathematics-academy-live-students.onrender.com/
        labels:
          service: student-frontend
          source: render
      - targets:
          - https://amaris-production-web.onrender.com/health/ready/
        labels:
          service: production-backend
          source: render
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
