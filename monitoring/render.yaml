# Separate monitoring Blueprint. Link this exact path and the ops branch in Render.
# Do NOT merge it into or replace the root production render.yaml.
services:
  - type: pserv
    name: amaris-monitoring-prometheus
    runtime: docker
    plan: standard
    region: frankfurt
    repo: https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
    branch: ops/amaris-monitoring-20261014
    dockerContext: .
    dockerfilePath: monitoring/prometheus/Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /-/ready
    disk:
      name: amaris-prometheus-data
      mountPath: /prometheus-data
      sizeGB: 1
    envVars:
      - key: AMARIS_DJANGO_TARGET
        fromService:
          type: web
          name: amaris-production-web
          property: hostport
      - key: AMARIS_FLOWER_TARGET
        fromService:
          type: pserv
          name: amaris-monitoring-flower
          property: hostport

  - type: pserv
    name: amaris-monitoring-flower
    runtime: docker
    plan: starter
    region: frankfurt
    repo: https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
    branch: ops/amaris-monitoring-20261014
    dockerContext: .
    dockerfilePath: monitoring/flower/Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString

  - type: web
    name: amaris-monitoring-grafana
    runtime: docker
    plan: starter
    region: frankfurt
    repo: https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
    branch: ops/amaris-monitoring-20261014
    dockerContext: .
    dockerfilePath: monitoring/grafana/Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /api/health
    disk:
      name: amaris-grafana-data
      mountPath: /var/lib/grafana
      sizeGB: 1
    envVars:
      - key: PROMETHEUS_HOSTPORT
        fromService:
          type: pserv
          name: amaris-monitoring-prometheus
          property: hostport
      - key: GF_SERVER_HTTP_PORT
        value: "10000"
      - key: GF_SERVER_ROOT_URL
        value: https://amaris-monitoring-grafana.onrender.com/
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        generateValue: true
      - key: GF_SECURITY_COOKIE_SECURE
        value: "true"
      - key: GF_AUTH_ANONYMOUS_ENABLED
        value: "false"
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_USERS_DEFAULT_THEME
        value: dark
      - key: GF_ANALYTICS_REPORTING_ENABLED
        value: "false"
      - key: GF_ANALYTICS_CHECK_FOR_UPDATES
        value: "false"
