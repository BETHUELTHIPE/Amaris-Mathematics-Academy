name: Protected Render RUM Secret Provision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rum-render-secret-provision.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rum-render-token-secure-provision
  cancel-in-progress: false

jobs:
  configure-rum-token:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Set matching private RUM secret without logging it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hmac
          import json
          import os
          import secrets
          import urllib.error
          import urllib.request

          api_key = os.environ.get("RENDER_API_KEY", "")
          if not api_key:
              raise SystemExit("BLOCK: protected RENDER_API_KEY unavailable")
          services = {
              "backend": "srv-dapn6b3tqb8s73d3r7n0",
              "frontend": "srv-damn6d2d0e5s73d02j5g",
          }
          token_key = "WEB_VITALS_INGEST_TOKEN"

          def read_token(service_id):
              url = f"https://api.render.com/v1/services/{service_id}/env-vars/{token_key}"
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + api_key,
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=18) as response:
                      obj = json.load(response)
                  value = obj.get("value", "")
                  return value if isinstance(value, str) and len(value) >= 32 else ""
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return ""
                  raise SystemExit(f"BLOCK: Render read denied, HTTP {exc.code}")
              except Exception as exc:
                  raise SystemExit(f"BLOCK: Render read unavailable ({type(exc).__name__})")

          before = {label: read_token(service_id) for label, service_id in services.items()}
          # If one service already has a strong valid token, reuse it; otherwise
          # generate a cryptographically secure, new private secret in this runner.
          selected = before["backend"] or before["frontend"] or secrets.token_urlsafe(48)
          if len(selected) < 32:
              raise SystemExit("BLOCK: selected secret does not meet token policy")

          for label, service_id in services.items():
              if before[label] and hmac.compare_digest(before[label], selected):
                  print(f"PASS: {label} existing private RUM token retained")
                  continue
              url = f"https://api.render.com/v1/services/{service_id}/env-vars/{token_key}"
              body = json.dumps({"value": selected}).encode("utf-8")
              request = urllib.request.Request(
                  url, data=body, method="PUT",
                  headers={
                      "Authorization": "Bearer " + api_key,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status != 200:
                          raise RuntimeError("Unexpected Render API update status")
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"BLOCK: could not set {label} RUM token (HTTP {exc.code})")
              except Exception as exc:
                  raise SystemExit(f"BLOCK: could not set {label} RUM token ({type(exc).__name__})")
              print(f"PASS: {label} Render secret configured without revealing its value")

          final = {label: read_token(service_id) for label, service_id in services.items()}
          if any(len(value) < 32 for value in final.values()):
              raise SystemExit("BLOCK: one or more Render tokens are unavailable")
          if not hmac.compare_digest(final["backend"], final["frontend"]):
              raise SystemExit("BLOCK: Render backend/frontend token mismatch")
          print("PASS: backend and frontend private RUM tokens match exactly; values were never logged")
          print("NOTE: Render environment updates require later application deployment to take effect")
          PY
