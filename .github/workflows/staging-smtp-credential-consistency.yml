name: Staging SMTP Credential Consistency (No Login or Send)
on:
  push:
    branches: ["qa/staging-django-letterhead-inbox-20261028"]
    paths: ["ops/staging-smtp-credential-consistency-request.txt"]
permissions:
  contents: read
jobs:
  compare-credentials-without-disclosing:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 4
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GITHUB_STAGING_SMTP_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
    steps:
      - name: Compare protected SMTP configuration sources without exposing values
        run: |
          python3 - <<'PY'
          import json,os,hmac,urllib.request
          from urllib.parse import urlsplit
          token=os.environ.get("RENDER_API_KEY","")
          sid="srv-dam2iivcgkoc7383tq50"
          if not token: raise SystemExit("BLOCK: missing protected Render API credential")
          base="https://api.render.com/v1/services/"+sid
          def get(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response: return json.load(response)
              except Exception:
                  raise SystemExit("BLOCK: Cannot inspect staging Render configuration") from None
          svc=get(base)
          if svc.get("id")!=sid or svc.get("ownerId")!="tea-csppi8l6l47c73dk9c90" or svc.get("branch")!="ops/staging-known-good-af8709c-20261019":
              raise SystemExit("BLOCK: Render service identity mismatch")
          raw=get(base+"/env-vars?limit=100")
          if isinstance(raw,dict): raw=raw.get("envVars",raw.get("data",[]))
          env={e.get("envVar",e).get("key"):e.get("envVar",e).get("value","") for e in raw if isinstance(e.get("envVar",e),dict)}
          db=urlsplit(env.get("DATABASE_URL",""))
          if env.get("SUPABASE_PROJECT_REF")!="atyhhjwwxgzeurnwayay" or "atyhhjwwxgzeurnwayay" not in ((db.hostname or "")+" "+(db.username or "")):
              raise SystemExit("BLOCK: staging database identity mismatch")
          github_pw=os.environ.get("GITHUB_STAGING_SMTP_PASSWORD","")
          render_pw=env.get("EMAIL_HOST_PASSWORD","")
          if not github_pw or not render_pw: raise SystemExit("BLOCK: staging SMTP credential missing from one source")
          print("PASS: Credential values available on both staging stores")
          print("PASSWORDS_MATCH_EXACTLY:", "YES" if hmac.compare_digest(github_pw,render_pw) else "NO")
          print("PASSWORDS_MATCH_IGNORING_SPACES:", "YES" if hmac.compare_digest(github_pw.replace(" ",""),render_pw.replace(" ","")) else "NO")
          for name,pw in [("GITHUB_STAGING",github_pw),("RENDER_STAGING",render_pw)]:
              actual=pw
              print(name+"_PASSWORD_HAS_16_NONSPACE_CHARACTERS:", "YES" if len(actual.replace(" ",""))==16 else "NO")
          user=str(env.get("EMAIL_HOST_USER","")).strip().lower()
          sender=str(env.get("DEFAULT_FROM_EMAIL","")).strip().lower()
          print("SMTP_USER_IS_CONNECTED_TEST_GMAIL:", "YES" if user=="bethuelmoukangwe8@gmail.com" else "NO")
          print("SENDER_EQUALS_SMTP_USER:", "YES" if sender==user else "NO")
          print("PASS: No passwords, token values or email messages disclosed")
          PY
