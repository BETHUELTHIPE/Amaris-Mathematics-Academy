name: Staging real PayFast live-class email acceptance
on:
  push:
    branches: [fix/staging-booking-receipt-before-email-20261019]
    paths: [backend/scripts/staging_liveclass_receipt_acceptance.py, .github/workflows/staging-liveclass-receipt-acceptance.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-liveclass-real-email-acceptance
  cancel-in-progress: false
jobs:
  fail-closed-script-check:
    name: Validate protected acceptance without secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify syntax and fail-closed prerequisites
        shell: bash
        run: |
          python -m py_compile backend/scripts/staging_liveclass_receipt_acceptance.py
          python backend/scripts/staging_liveclass_receipt_acceptance.py --syntax-only
          python - <<'PY'
          import runpy
          module=runpy.run_path("backend/scripts/staging_liveclass_receipt_acceptance.py")
          try:
              module["check_environment"]()
          except RuntimeError:
              print("ACCEPTANCE_WITHOUT_CREDENTIALS=CORRECTLY_BLOCKED")
          else:
              raise AssertionError("Missing credentials failed to stop acceptance")
          PY
  real-sandbox-invoice-receipt:
    name: Manual real PayFast sandbox → Django → Gmail
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/ops/staging-known-good-af8709c-20261019' || github.ref == 'refs/heads/fix/staging-booking-receipt-before-email-20261019')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 18
    defaults:
      run:
        working-directory: backend
    env:
      STAGING_RECEIPT_ACCEPTANCE_ENABLED: ${{ secrets.STAGING_RECEIPT_ACCEPTANCE_ENABLED }}
      STAGING_VERIFIED_BOOKING_REFERENCE: ${{ secrets.STAGING_VERIFIED_BOOKING_REFERENCE }}
      STAGING_PAYFAST_SANDBOX_TRANSACTION_ID: ${{ secrets.STAGING_PAYFAST_SANDBOX_TRANSACTION_ID }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_TEST_STUDENT_PASSWORD: ${{ secrets.STAGING_TEST_STUDENT_PASSWORD }}
      STAGING_GMAIL_IMAP_APP_PASSWORD: ${{ secrets.STAGING_GMAIL_IMAP_APP_PASSWORD }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.STAGING_SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_SUPABASE_S3_SECRET_ACCESS_KEY }}
      SUPABASE_S3_ADMIN_BUCKET: ${{ secrets.STAGING_SUPABASE_S3_ADMIN_BUCKET }}
      SUPABASE_S3_STUDENT_BUCKET: ${{ secrets.STAGING_SUPABASE_S3_STUDENT_BUCKET }}
      EMAIL_HOST: ${{ secrets.STAGING_SMTP_HOST }}
      EMAIL_PORT: ${{ secrets.STAGING_SMTP_PORT }}
      EMAIL_HOST_USER: ${{ secrets.STAGING_SMTP_USERNAME }}
      EMAIL_HOST_PASSWORD: ${{ secrets.STAGING_SMTP_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.STAGING_SMTP_FROM_EMAIL }}
      DJANGO_SECRET_KEY: ${{ secrets.STAGING_DJANGO_SECRET_KEY }}
      STAGING_API_BASE_URL: "https://amaris-mathematics-academy-staging.onrender.com"
      STAGING_SUPABASE_URL: "https://atyhhjwwxgzeurnwayay.supabase.co"
      STAGING_SUPABASE_PROJECT_REF: "atyhhjwwxgzeurnwayay"
      STAGING_TEST_STUDENT_EMAIL: "bethuelmoukangwe8@gmail.com"
      STAGING_GMAIL_IMAP_USER: "bethuelmoukangwe8@gmail.com"
      DATABASE_SSL_REQUIRED: "true"
      SUPABASE_DATABASE_REQUIRED: "true"
      SUPABASE_S3_REQUIRED: "true"
      SUPABASE_S3_ENDPOINT_URL: "https://atyhhjwwxgzeurnwayay.storage.supabase.co/storage/v1/s3"
      EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
      EMAIL_USE_TLS: "true"
      EMAIL_USE_SSL: "false"
      PAYFAST_ENV: "sandbox"
      PAYFAST_MODE: "sandbox"
      DJANGO_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Fail before contacting a service if protected secrets are missing
        run: |
          python - <<'PY'
          import os
          required=["STAGING_RECEIPT_ACCEPTANCE_ENABLED","STAGING_VERIFIED_BOOKING_REFERENCE","STAGING_PAYFAST_SANDBOX_TRANSACTION_ID","STAGING_SUPABASE_PUBLISHABLE_KEY","STAGING_TEST_STUDENT_PASSWORD","STAGING_GMAIL_IMAP_APP_PASSWORD","DATABASE_URL","SUPABASE_S3_ACCESS_KEY_ID","SUPABASE_S3_SECRET_ACCESS_KEY","SUPABASE_S3_ADMIN_BUCKET","SUPABASE_S3_STUDENT_BUCKET","EMAIL_HOST","EMAIL_PORT","EMAIL_HOST_USER","EMAIL_HOST_PASSWORD","DEFAULT_FROM_EMAIL","DJANGO_SECRET_KEY"]
          missing=[name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing staging environment keys: "+", ".join(missing))
          if os.getenv("STAGING_RECEIPT_ACCEPTANCE_ENABLED") != "true":
              raise SystemExit("Manual real acceptance is disabled.")
          PY
      - name: Install locked Django requirements
        run: python -m pip install -r requirements.txt
      - name: Verify provider-verified booking and execute real Django SMTP confirmation
        run: python scripts/staging_liveclass_receipt_acceptance.py
      - name: Archive PDF digest-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-liveclass-real-smtp-gmail-evidence
          path: /tmp/amaris-staging-liveclass-acceptance.json
          if-no-files-found: error
          retention-days: 7
