name: Private analytics API checks
on:
  push:
    branches: [feat/student-tutor-analytics-api-20261105]
  pull_request:
    branches: [production-release-20260923]
    paths: [backend/content/analytics_views.py, backend/content/services/analytics.py, backend/content/test_analytics.py, backend/content/urls.py, .github/workflows/analytics-api.yml]
permissions:
  contents: read
concurrency:
  group: analytics-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: analytics_ci
          POSTGRES_USER: analytics_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_ci -d analytics_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://analytics_ci@127.0.0.1:5432/analytics_ci
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      SUPABASE_S3_REQUIRED: "false"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      PAYFAST_MODE: sandbox
      PAYFAST_ENV: sandbox
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Formatting, lint and schema
        run: |
          export DJANGO_SECRET_KEY="$(openssl rand -hex 48)"
          python -m black --check content/analytics_views.py content/services/analytics.py content/test_analytics.py content/urls.py
          python -m ruff check content/analytics_views.py content/services/analytics.py content/test_analytics.py content/urls.py
          python manage.py check
          python manage.py spectacular --file /tmp/analytics-api.yaml --validate --fail-on-warn
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
      - name: Type checks and owner-isolation tests
        run: |
          export DJANGO_SECRET_KEY="$(openssl rand -hex 48)"
          python -m mypy
          python manage.py test content.test_analytics --verbosity 2 --noinput
      - name: Full backend regressions
        run: |
          export DJANGO_SECRET_KEY="$(openssl rand -hex 48)"
          python manage.py test --verbosity 1 --noinput

