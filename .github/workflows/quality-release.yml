name: Quality Gates and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Promote the tested release to production
        required: true
        type: boolean
        default: false
      migration_risk:
        description: Database migration risk for this release
        required: true
        type: choice
        options: [low, high]
        default: low

concurrency:
  group: amaris-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  REGISTRY_IMAGE: docker.io/bethuelm/amaris-mathematics-academy

jobs:
  backend-quality:
    name: Python quality and Django checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: "false"
      # Django TestCase deliberately keeps transactions open; production remains 30s by default.
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Generate an ephemeral Django secret
        shell: bash
        run: printf 'DJANGO_SECRET_KEY=%s\n' "$(openssl rand -hex 64)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Python formatting
        run: black --check --diff .
      - name: Python linting
        run: ruff check .
      - name: Static type checks
        run: mypy
      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Django migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations in CI
        run: python manage.py migrate --noinput
      - name: Collect production static assets
        run: python manage.py collectstatic --noinput
      - name: Unit tests
        run: python manage.py test content.tests.HealthAndMetricsTests content.tests.ErrorRecoveryTests
      - name: Integration tests
        run: python manage.py test content.tests.PublicContentApiTests content.test_integrations
      - name: Load/capacity harness contract (no traffic)
        run: |
          python -m unittest load_tests.test_contract
          python -m compileall -q load_tests
      - name: Permission tests
        run: python manage.py test content.tests.AdminRegistrationTests content.tests.PermissionTests
      - name: Payment tests
        run: python manage.py test content.tests.PaymentReconciliationTests content.test_payments
      - name: Full Django regression suite
        run: python manage.py test
      - name: Production-acceptance gate contract
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s scripts/release -p 'test_*.py'

  frontend-quality:
    name: Frontend, accessibility, Lighthouse, and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend linting
        run: npm run lint
      - name: TypeScript checks
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Frontend performance budgets
        run: npm run check:performance
      - name: Frontend unit tests
        run: npm run test:unit
      - name: Accessibility tests
        shell: bash
        run: |
          npm run dev:ci > /tmp/amaris-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/amaris-site.log; exit 1; fi
            sleep 2
          done
          npm run test:accessibility
      - name: Lighthouse CI
        run: npm run test:lighthouse
      - name: Generate frontend CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: frontend
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json
      - name: Preserve frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-evidence
          path: |
            frontend/.lighthouseci/
            frontend-sbom.cdx.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  responsive-browser:
    name: Responsive browser E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: frontend/e2e/requirements.txt
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install Playwright test dependency
        run: python -m pip install --upgrade pip && pip install -r e2e/requirements.txt
      - name: Install Chromium, Firefox, and WebKit
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Run mobile, tablet, and desktop browser tests
        shell: bash
        env:
          NODE_ENV: development
          E2E_SYNTHETIC_STUDENT: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_ARTIFACT_DIR: artifacts/e2e
          CMS_API_URL: http://127.0.0.1:3001/api/v1
          CSP_REPORT_ONLY: "true"
        run: |
          python -u - <<'PY' > /tmp/amaris-e2e-cms.log 2>&1 &
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return

              def do_GET(self):
                  if self.path == "/health":
                      self.send_response(204)
                      self.end_headers()
                      return
                  self.send_response(404)
                  self.end_headers()

              def do_POST(self):
                  if self.path != "/api/v1/enquiries/":
                      self.send_response(404)
                      self.end_headers()
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  if length:
                      self.rfile.read(length)
                  self.send_response(201)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'{"status":"accepted"}')

          ThreadingHTTPServer(("127.0.0.1", 3001), Handler).serve_forever()
          PY
          cms_pid=$!

          npm run dev:ci > /tmp/amaris-e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" "$cms_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then break; fi
            if [ "$attempt" -eq 20 ]; then cat /tmp/amaris-e2e-cms.log; exit 1; fi
            sleep 1
          done

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            if [ "$attempt" -eq 45 ]; then cat /tmp/amaris-e2e-server.log; exit 1; fi
            sleep 2
          done
          python e2e/responsive_browser.py
      - name: Preserve responsive-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-evidence
          path: |
            frontend/artifacts/e2e/
            /tmp/amaris-e2e-server.log
          if-no-files-found: warn
          retention-days: 30

  dependency-security:
    name: Dependency vulnerability gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/e2e/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          pip-audit --requirement backend/requirements.txt
          pip-audit --requirement backend/requirements-load.txt
          pip-audit --requirement frontend/e2e/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Node dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  secret-security:
    name: Repository secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: Docker, Compose, HIGH/CRITICAL image scan, and SBOM
    runs-on: ubuntu-latest
    # Container security is intentionally independent of Lighthouse timing noise.
    # Overall release/publish still requires both this job and frontend-quality.
    needs: [backend-quality, responsive-browser, dependency-security, secret-security]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        shell: bash
        run: |
          cp backend/.env.example backend/.env
          docker compose --env-file backend/.env -f backend/docker-compose.yml config --quiet
      - name: Build production backend image
        run: docker build --tag amaris-backend:${{ github.sha }} backend
      - name: Generate CycloneDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: amaris-backend:${{ github.sha }}
          format: cyclonedx-json
          output-file: amaris-backend-sbom.cdx.json
      - name: Scan container for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: amaris-backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
      - name: Upload container scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Upload software bill of materials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amaris-backend-sbom
          path: amaris-backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  publish-image:
    name: Publish release image to Docker Hub
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [container-security, frontend-quality, responsive-browser, backend-quality, dependency-security, secret-security]
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: bethuelm
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        name: Create Docker image tags and labels
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=amaris-backend
          cache-to: type=gha,mode=max,scope=amaris-backend
      - id: image
        name: Record immutable image reference
        run: echo "reference=${REGISTRY_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy and verify staging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [publish-image]
    permissions:
      contents: write
      id-token: write
    environment:
      name: staging
      url: https://amaris-mathematics-academy-staging.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote exact main commit to Render staging branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${GITHUB_SHA}:refs/heads/staging" --force

      - name: Wait for exact Render staging release
        shell: bash
        run: |
          set -euo pipefail
          base="https://amaris-mathematics-academy-staging.onrender.com"
          for attempt in $(seq 1 60); do
            ready=$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' --max-time 15 "$base/health/ready/" || true)
            version=$(curl --silent --show-error --output /tmp/version.json --write-out '%{http_code}' --max-time 15 "$base/health/version/" || true)
            deployed_sha=$(python -c 'import json; print(json.load(open("/tmp/version.json", encoding="utf-8")).get("git_sha", ""))' 2>/dev/null || true)
            echo "attempt=$attempt ready=$ready version=$version deployed_sha=$deployed_sha expected=${GITHUB_SHA}"
            if [ "$ready" = "200" ] && [ "$version" = "200" ] && [ "$deployed_sha" = "${GITHUB_SHA}" ]; then
              cat /tmp/ready.json
              cat /tmp/version.json
              exit 0
            fi
            sleep 10
          done
          echo "Render staging did not reach the exact expected Git SHA." >&2
          cat /tmp/ready.json 2>/dev/null || true
          cat /tmp/version.json 2>/dev/null || true
          exit 1

      - name: Verify real staging checkout and resume journey
        shell: bash
        env:
          STAGING_BASE_URL: https://amaris-mathematics-academy-staging.onrender.com
        run: |
          set -euo pipefail
          oidc_response=$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=amaris-staging")
          oidc_token=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_response")
          echo "::add-mask::$oidc_token"
          auth=(-H "Authorization: Bearer $oidc_token" -H "X-Amaris-Acceptance: github-actions")

          seed=$(curl --fail --silent --show-error "${auth[@]}" -H "Content-Type: application/json" -X POST "$STAGING_BASE_URL/api/v1/student/acceptance/seed/" -d '{}')
          course_slug=$(python -c 'import json,sys; print(json.load(sys.stdin)["course_slug"])' <<<"$seed")
          lesson_slug=$(python -c 'import json,sys; print(json.load(sys.stdin)["lesson_slug"])' <<<"$seed")
          test "$course_slug" = "acceptance-capacity-mathematics"
          test "$lesson_slug" = "acceptance-algebra"

          search=$(curl --fail --silent --show-error "$STAGING_BASE_URL/api/v1/courses/?search=acceptance")
          python -c 'import json,sys; p=json.load(sys.stdin); slugs=[item["slug"] for item in p["results"]]; assert "acceptance-capacity-mathematics" in slugs' <<<"$search"

          key="acceptance-${GITHUB_SHA:0:32}"
          checkout_body=$(COURSE_SLUG="$course_slug" CHECKOUT_KEY="$key" python -c 'import json,os; print(json.dumps({"course_slug":os.environ["COURSE_SLUG"],"idempotency_key":os.environ["CHECKOUT_KEY"]}))')
          checkout=$(curl --fail --silent --show-error "${auth[@]}" -H "Content-Type: application/json" -X POST "$STAGING_BASE_URL/api/v1/student/checkout/" -d "$checkout_body")
          reference=$(python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"]=="pending"; assert "sandbox.payfast.co.za" in p["gateway_url"]; print(p["payment_reference"])' <<<"$checkout")

          payment=$(curl --fail --silent --show-error "${auth[@]}" "$STAGING_BASE_URL/api/v1/student/payments/$reference/")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"]=="pending"; assert p["enrollment_status"] is None' <<<"$payment"

          completed=$(curl --fail --silent --show-error "${auth[@]}" -H "Content-Type: application/json" -X POST "$STAGING_BASE_URL/api/v1/student/acceptance/payments/$reference/complete/" -d '{}')
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"]=="paid"; assert p["enrollment_status"]=="active"' <<<"$completed"
          payment=$(curl --fail --silent --show-error "${auth[@]}" "$STAGING_BASE_URL/api/v1/student/payments/$reference/")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"]=="paid"; assert p["enrollment_status"]=="active"; assert p["paid_at"]' <<<"$payment"

          progress_body=$(COURSE_SLUG="$course_slug" LESSON_SLUG="$lesson_slug" python -c 'import json,os; print(json.dumps({"course_slug":os.environ["COURSE_SLUG"],"lesson_slug":os.environ["LESSON_SLUG"],"position_seconds":347,"progress_percent":42}))')
          progress=$(curl --fail --silent --show-error "${auth[@]}" -H "Content-Type: application/json" -X PATCH "$STAGING_BASE_URL/api/v1/student/progress/" -d "$progress_body")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["last_lesson"]["slug"]=="acceptance-algebra"; assert p["last_position_seconds"]==347; assert p["progress_percent"]==42' <<<"$progress"

          resume=$(curl --fail --silent --show-error "${auth[@]}" "$STAGING_BASE_URL/api/v1/student/resume/$course_slug/")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["last_lesson"]["slug"]=="acceptance-algebra"; assert p["last_position_seconds"]==347; assert p["progress_percent"]==42' <<<"$resume"

          lesson=$(curl --fail --silent --show-error "${auth[@]}" "$STAGING_BASE_URL/api/v1/student/lessons/$course_slug/$lesson_slug/")
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["lesson"]["slug"]=="acceptance-algebra"; assert p["resume"]["last_position_seconds"]==347' <<<"$lesson"
          echo "Real staging search/checkout/synthetic-paid/status/progress/resume/lesson journey passed without a real PayFast charge."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-load.txt

      - name: Install controlled capacity dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-load.txt

      - name: Run controlled 100-user staging capacity gate
        working-directory: backend
        shell: bash
        env:
          LOADTEST_TARGET_URL: https://amaris-mathematics-academy-staging.onrender.com
          LOADTEST_ENVIRONMENT: capacity
          LOADTEST_ALLOWED_HOSTS: amaris-mathematics-academy-staging.onrender.com
          LOADTEST_ALLOW_PRODUCTION: "false"
          LOADTEST_ALLOW_LIVE_PAYFAST: "false"
          CAPACITY_USERS: "100"
          CAPACITY_RAMP_SECONDS: "60"
          CAPACITY_HOLD_SECONDS: "300"
          CAPACITY_REQUIRE_AUTH: "true"
          CAPACITY_MAX_FAILURE_PCT: "1.0"
          CAPACITY_MAX_5XX_PCT: "0.1"
          CAPACITY_MAX_P95_MS: "1000"
          CAPACITY_MAX_P99_MS: "2000"
          LOADTEST_ACCEPTANCE_HEADER: "true"
          LOADTEST_HOMEPAGE_PATH: /api/v1/bootstrap/
          LOADTEST_CATALOGUE_PATH: /api/v1/courses/
          LOADTEST_SEARCH_PATH: /api/v1/courses/?search=algebra
          LOADTEST_COURSE_DETAIL_PATH: /api/v1/courses/acceptance-capacity-mathematics/
          LOADTEST_LOGIN_PAGE_PATH: /api/v1/bootstrap/
          LOADTEST_DASHBOARD_PATH: /api/v1/student/courses/
          LOADTEST_LESSON_PATH: /api/v1/student/lessons/acceptance-capacity-mathematics/acceptance-algebra/
        run: |
          set -euo pipefail
          mkdir -p load_tests/results
          oidc_response=$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=amaris-staging")
          oidc_token=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_response")
          echo "::add-mask::$oidc_token"
          export LOADTEST_AUTH_BEARER="$oidc_token"

          auth=(-H "Authorization: Bearer $oidc_token" -H "X-Amaris-Acceptance: github-actions")
          seed=$(curl --fail --silent --show-error "${auth[@]}" -H "Content-Type: application/json" -X POST "$LOADTEST_TARGET_URL/api/v1/student/acceptance/seed/" -d '{}')
          course_slug=$(python -c 'import json,sys; print(json.load(sys.stdin)["course_slug"])' <<<"$seed")
          key="acceptance-${GITHUB_SHA:0:32}"
          checkout_body=$(COURSE_SLUG="$course_slug" CHECKOUT_KEY="$key" python -c 'import json,os; print(json.dumps({"course_slug":os.environ["COURSE_SLUG"],"idempotency_key":os.environ["CHECKOUT_KEY"]}))')
          checkout=$(curl --fail --silent --show-error "${auth[@]}" -H "Content-Type: application/json" -X POST "$LOADTEST_TARGET_URL/api/v1/student/checkout/" -d "$checkout_body")
          reference=$(python -c 'import json,sys; print(json.load(sys.stdin)["payment_reference"])' <<<"$checkout")
          export LOADTEST_PAYMENT_STATUS_PATH="/api/v1/student/payments/$reference/"
          export CAPACITY_LOCUST_RESULT="load_tests/results/capacity-100-locust.json"

          python -m locust -f load_tests/capacity_locustfile.py --headless --host "$LOADTEST_TARGET_URL" --processes 4 --csv load_tests/results/locust-100 --csv-full-history --html load_tests/results/locust-100.html

      - name: Publish 100-user capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-capacity-100-${{ github.run_id }}
          path: backend/load_tests/results/
          if-no-files-found: error
          retention-days: 90

  deploy-production:
    name: Approve, deploy, and verify production
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    runs-on: ubuntu-latest
    needs: [publish-image, deploy-staging]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all professional acceptance evidence
        run: python scripts/release/verify_acceptance.py acceptance/criteria.json
      - name: Create recovery point before high-risk migration
        if: inputs.migration_risk == 'high'
        env:
          BACKUP_WEBHOOK_URL: ${{ secrets.PRODUCTION_BACKUP_WEBHOOK_URL }}
          BACKUP_TOKEN: ${{ secrets.PRODUCTION_BACKUP_TOKEN }}
        run: scripts/release/backup-before-migration.sh production
      - name: Promote reversible production release
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: scripts/release/promote.sh production "${{ needs.publish-image.outputs.image }}"
