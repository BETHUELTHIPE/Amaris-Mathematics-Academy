name: Quality Gates and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Promote the tested release to production
        required: true
        type: boolean
        default: false
      migration_risk:
        description: Database migration risk for this release
        required: true
        type: choice
        options: [low, high]
        default: low
      rollback_test:
        description: Deploy N+1 to staging, force rollback, and verify version N is restored
        required: true
        type: boolean
        default: false

concurrency:
  group: amaris-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: docker.io/bethuelm/amaris-mathematics-academy

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  e2e:
    name: E2E and accessibility
    uses: ./.github/workflows/e2e.yml

  performance-smoke:
    name: Performance smoke
    uses: ./.github/workflows/performance-smoke.yml

  publish-image:
    name: Publish release image to Docker Hub
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [ci, security, e2e, performance-smoke]
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: bethuelm
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        name: Create Docker image tags and labels
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=amaris-backend
          cache-to: type=gha,mode=max,scope=amaris-backend
      - id: image
        name: Record immutable release identity
        shell: bash
        run: |
          image_reference="${REGISTRY_IMAGE}:${GITHUB_SHA}"
          echo "reference=$image_reference" >> "$GITHUB_OUTPUT"
          {
            echo "## Immutable release identity"
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Docker image: \`$image_reference\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Staging
    if: github.event_name != 'pull_request'
    needs: [publish-image]
    uses: ./.github/workflows/deploy-staging.yml
    with:
      image: ${{ needs.publish-image.outputs.image }}
      rollback_test: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_test }}
    secrets: inherit

  deploy-production:
    name: Production
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production == true &&
      inputs.rollback_test == false
    needs: [publish-image, deploy-staging]
    uses: ./.github/workflows/deploy-production.yml
    with:
      image: ${{ needs.publish-image.outputs.image }}
      migration_risk: ${{ inputs.migration_risk }}
    secrets: inherit
