name: Quality Gates and Release

on:
  push:
    branches: [ops/dockerhub-trusted-advisor-20261125]

concurrency:
  group: amaris-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.13.15"
  NODE_VERSION: "24"
  REGISTRY_IMAGE: docker.io/bethuelm/amaris-mathematics-academy
  IMAGE_SOURCE_SHA: fb81ed871e8d26434f59ae3d32fd4896e2bad856

jobs:
  backend-quality:
    name: Python quality and Django checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false" # Ephemeral CI PostgreSQL; real staging/production enforcement remains on.
      # Django TestCase deliberately keeps transactions open; production remains 30s by default.
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Generate an ephemeral Django secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Python formatting
        run: black --check --diff .
      - name: Python linting
        run: ruff check .
      - name: Static type checks
        run: mypy
      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: OpenAPI schema validation
        run: python manage.py spectacular --file /tmp/amaris-openapi.yaml --validate --fail-on-warn
      - name: Django migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations in CI
        run: python manage.py migrate --noinput
      - name: Collect production static assets
        run: python manage.py collectstatic --noinput
      - name: Unit tests
        run: python manage.py test content.tests.HealthAndMetricsTests content.tests.ErrorRecoveryTests tests.test_monitoring_admin
      - name: Integration tests
        run: python manage.py test content.tests.PublicContentApiTests content.test_integrations
      - name: Load/capacity harness contract (no traffic)
        run: |
          python -m unittest load_tests.test_contract
          python -m compileall -q load_tests
      - name: Permission tests
        run: python manage.py test content.tests.AdminRegistrationTests content.tests.PermissionTests
      - name: Payment tests
        run: python manage.py test content.tests.PaymentReconciliationTests content.test_payments
      - name: Full Django regression suite
        run: python manage.py test
      - name: Production-acceptance gate contract
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check operator backup and restore shell scripts syntax
        working-directory: ${{ github.workspace }}
        run: |
          bash -n scripts/release/export_production_supabase_backup.sh
          bash -n scripts/release/verify_production_supabase_restore.sh

  frontend-quality:
    name: Frontend, accessibility, Lighthouse, and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend linting
        run: npm run lint
      - name: TypeScript checks
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Frontend performance budgets
        run: npm run check:performance
      - name: Frontend unit tests
        run: npm run test:unit
      - name: Accessibility tests
        shell: bash
        run: |
          npm run dev:ci > /tmp/amaris-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/amaris-site.log; exit 1; fi
            sleep 2
          done
          npm run test:accessibility
      - name: Lighthouse CI
        run: npm run test:lighthouse
      - name: Generate frontend CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: frontend
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json
      - name: Preserve frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-evidence
          path: |
            frontend/.lighthouseci/
            frontend-sbom.cdx.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  responsive-browser:
    name: Responsive browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Match frontend/e2e/requirements.txt. The official image includes all three
    # browser builds and OS libraries, avoiding slow runner apt-mirror installs.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --init --ipc=host --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # The official container omits lsb_release, which setup-python's
          # optional pip-cache lookup requires. Install the pinned package below.
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install Playwright test dependency
        run: python -m pip install --upgrade pip && pip install -r e2e/requirements.txt
      - name: Verify Chromium, Firefox, and WebKit are installed and launch
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee /tmp/amaris-playwright-launch.log
          from importlib.metadata import version
          from playwright.sync_api import sync_playwright

          assert version("playwright") == "1.62.0", "Match the pinned official browser image"
          with sync_playwright() as playwright:
              for engine in (playwright.chromium, playwright.firefox, playwright.webkit):
                  browser = engine.launch(headless=True)
                  browser.close()
                  print(f"BROWSER_LAUNCH=PASS {engine.name}", flush=True)
          PY
      - name: Run mobile, tablet, and desktop browser tests
        shell: bash
        env:
          NODE_ENV: development
          E2E_SYNTHETIC_STUDENT: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_ARTIFACT_DIR: artifacts/e2e
          CMS_API_URL: http://127.0.0.1:3001/api/v1
          CSP_REPORT_ONLY: "true"
        run: |
          python -u - <<'PY' > /tmp/amaris-e2e-cms.log 2>&1 &
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return

              def do_GET(self):
                  if self.path == "/health":
                      self.send_response(204)
                      self.end_headers()
                      return
                  self.send_response(404)
                  self.end_headers()

              def do_POST(self):
                  if self.path != "/api/v1/enquiries/":
                      self.send_response(404)
                      self.end_headers()
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  if length:
                      self.rfile.read(length)
                  self.send_response(201)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'{"status":"accepted"}')

          ThreadingHTTPServer(("127.0.0.1", 3001), Handler).serve_forever()
          PY
          cms_pid=$!

          npm run dev:ci > /tmp/amaris-e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" "$cms_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then break; fi
            if [ "$attempt" -eq 20 ]; then cat /tmp/amaris-e2e-cms.log; exit 1; fi
            sleep 1
          done

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            if [ "$attempt" -eq 45 ]; then cat /tmp/amaris-e2e-server.log; exit 1; fi
            sleep 2
          done
          python e2e/responsive_browser.py
      - name: Preserve responsive-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-evidence
          path: |
            frontend/artifacts/e2e/
            /tmp/amaris-e2e-server.log
            /tmp/amaris-playwright-*.log
          if-no-files-found: warn
          retention-days: 30

  dependency-security:
    name: Dependency vulnerability gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/e2e/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          pip-audit --requirement backend/requirements.txt
          pip-audit --requirement backend/requirements-load.txt
          pip-audit --requirement frontend/e2e/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Node dependencies
        working-directory: frontend
        # The deployed bundle excludes devDependencies; build/test tooling is
        # isolated in CI and is not part of the production runtime image.
        run: npm audit --omit=dev --audit-level=high

  secret-security:
    name: Repository secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: Docker, Compose, HIGH/CRITICAL image scan, and SBOM
    runs-on: ubuntu-latest
    # Container security is intentionally independent of Lighthouse timing noise.
    # Overall release/publish still requires both this job and frontend-quality.
    needs: [backend-quality, responsive-browser, dependency-security, secret-security]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        shell: bash
        run: |
          cp backend/.env.example backend/.env
          docker compose --env-file backend/.env -f backend/docker-compose.yml config --quiet
      - name: Build production backend image
        run: docker build --tag amaris-backend:${{ github.sha }} backend
      - name: Generate CycloneDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: amaris-backend:${{ github.sha }}
          format: cyclonedx-json
          output-file: amaris-backend-sbom.cdx.json
      - name: Scan container for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: amaris-backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
      - name: Explain blocking HIGH/CRITICAL container findings
        if: failure() && hashFiles('trivy-results.sarif') != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          scan = json.loads(Path("trivy-results.sarif").read_text(encoding="utf-8"))
          count = 0
          for run in scan.get("runs", []):
              rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for result in run.get("results", []):
                  rule = rules.get(result.get("ruleId"), {})
                  props = rule.get("properties", {})
                  locations = result.get("locations") or []
                  location = locations[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "") if locations else ""
                  print("BLOCKING_CVE", result.get("ruleId"), "package_location=", location,
                        "finding=", result.get("message", {}).get("text", "")[:300],
                        "rule=", rule.get("shortDescription", {}).get("text", ""),
                        "metadata=", str(props)[:800], flush=True)
                  count += 1
          print("BLOCKING_FINDINGS_TOTAL", count)
          PY
      - name: Upload container scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Upload software bill of materials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amaris-backend-sbom
          path: amaris-backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  publish-image:
    name: Publish release image to Docker Hub
    if: github.event_name == 'push' && github.ref_name == 'ops/dockerhub-trusted-advisor-20261125'
    runs-on: ubuntu-latest
    needs: [container-security, frontend-quality, responsive-browser, backend-quality, dependency-security, secret-security]
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$IMAGE_SOURCE_SHA"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: bethuelm
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: publish
        name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SOURCE_SHA }}
          cache-from: type=gha,scope=amaris-backend
          cache-to: type=gha,mode=max,scope=amaris-backend
      - id: image
        name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "reference=${REGISTRY_IMAGE}:${IMAGE_SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Published ${REGISTRY_IMAGE}:${IMAGE_SOURCE_SHA} at ${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
