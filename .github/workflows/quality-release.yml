name: Quality Gates and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: On a manual main run, continue to the production approval gate
        required: true
        type: boolean
        default: false
      migration_risk:
        description: Database migration risk for a manual production release
        required: true
        type: choice
        options: [low, high]
        default: low
      rollback_test:
        description: Deploy N+1 to staging, force rollback, and verify version N is restored
        required: true
        type: boolean
        default: false

concurrency:
  group: amaris-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: docker.io/bethuelm/amaris-mathematics-academy

jobs:
  ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml

  security:
    name: Security
    needs: [ci]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  build-image:
    name: Build immutable Docker image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [security]
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
      build_digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.identity.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        name: Create immutable image metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: type=sha,format=long,prefix=
      - id: build
        name: Build multi-platform OCI release artifact
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/amaris-backend.oci.tar
          cache-from: type=gha,scope=amaris-backend
          cache-to: type=gha,mode=max,scope=amaris-backend
      - id: identity
        name: Record immutable build evidence
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_reference="${REGISTRY_IMAGE}:${GITHUB_SHA}"
          artifact_name="amaris-release-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive_sha=$(sha256sum "$RUNNER_TEMP/amaris-backend.oci.tar" | awk '{print $1}')
          jq -n \
            --arg git_sha "$GITHUB_SHA" \
            --arg image "$image_reference" \
            --arg build_digest "$BUILD_DIGEST" \
            --arg archive_sha256 "$archive_sha" \
            '{git_sha: $git_sha, image: $image, build_digest: $build_digest,
              archive_sha256: $archive_sha256}' \
            > "$RUNNER_TEMP/release-image.json"
          echo "artifact=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "reference=$image_reference" >> "$GITHUB_OUTPUT"
          {
            echo "## Immutable build"
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Docker image: \`$image_reference\`"
            echo "- OCI digest: \`$BUILD_DIGEST\`"
            echo "- Archive SHA-256: \`$archive_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the exact release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            ${{ runner.temp }}/amaris-backend.oci.tar
            ${{ runner.temp }}/release-image.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  push-image:
    name: Push immutable Docker image
    runs-on: ubuntu-latest
    needs: [build-image]
    permissions:
      contents: read
    outputs:
      image: ${{ needs.build-image.outputs.image }}
      registry_digest: ${{ steps.published.outputs.digest }}
    steps:
      - name: Restore the tested OCI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-image.outputs.artifact }}
          path: ${{ runner.temp }}/amaris-release
      - name: Verify artifact identity and checksum
        shell: bash
        env:
          RELEASE_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          record="$RUNNER_TEMP/amaris-release/release-image.json"
          archive="$RUNNER_TEMP/amaris-release/amaris-backend.oci.tar"
          jq -e --arg git_sha "$GITHUB_SHA" --arg image "$RELEASE_IMAGE" \
            '.git_sha == $git_sha and .image == $image' "$record" >/dev/null
          expected_sha=$(jq -r '.archive_sha256' "$record")
          actual_sha=$(sha256sum "$archive" | awk '{print $1}')
          [ "$actual_sha" = "$expected_sha" ] || {
            echo "The restored OCI artifact checksum does not match the build record." >&2
            exit 1
          }
      - name: Install OCI registry transport
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Push the immutable full-SHA tag
        shell: bash
        env:
          DOCKERHUB_USERNAME: bethuelm
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          skopeo copy --all \
            --dest-creds "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            "oci-archive:$RUNNER_TEMP/amaris-release/amaris-backend.oci.tar" \
            "docker://$RELEASE_IMAGE"
      - name: Update convenience latest tag
        if: >-
          github.ref == 'refs/heads/main' &&
          !(github.event_name == 'workflow_dispatch' && inputs.rollback_test == true)
        shell: bash
        env:
          DOCKERHUB_USERNAME: bethuelm
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          skopeo copy --all \
            --src-creds "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            --dest-creds "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            "docker://$RELEASE_IMAGE" \
            "docker://${REGISTRY_IMAGE}:latest"
      - id: published
        name: Verify and record the registry digest
        shell: bash
        env:
          DOCKERHUB_USERNAME: bethuelm
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          manifest_sha=$(skopeo inspect --raw \
            --creds "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            "docker://$RELEASE_IMAGE" | sha256sum | awk '{print $1}')
          published_digest="sha256:$manifest_sha"
          echo "digest=$published_digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Published release"
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Docker image: \`$RELEASE_IMAGE\`"
            echo "- Registry digest: \`$published_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy staging
    needs: [push-image]
    uses: ./.github/workflows/deploy-staging.yml
    with:
      image: ${{ needs.push-image.outputs.image }}
      rollback_test: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_test }}

  staging-e2e:
    name: Staging E2E
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rollback_test == true) }}
    needs: [deploy-staging]
    uses: ./.github/workflows/e2e.yml

  staging-security:
    name: Staging security verification
    needs: [staging-e2e]
    uses: ./.github/workflows/staging-security.yml

  performance-smoke:
    name: Performance smoke
    needs: [staging-security]
    uses: ./.github/workflows/performance-smoke.yml

  post-deploy-health:
    name: Health and readiness
    needs: [push-image, performance-smoke]
    uses: ./.github/workflows/post-deploy.yml
    with:
      image: ${{ needs.push-image.outputs.image }}

  deploy-production:
    name: Production approval gate
    permissions:
      contents: read
      actions: read
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy_production == true &&
          inputs.rollback_test == false
        )
      )
    needs: [push-image, post-deploy-health]
    uses: ./.github/workflows/deploy-production.yml
    with:
      image: ${{ needs.push-image.outputs.image }}
      registry_digest: ${{ needs.push-image.outputs.registry_digest }}
      migration_risk: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_risk || 'high' }}

