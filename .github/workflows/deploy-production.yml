name: Production Release Gate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact production commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production source
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Django checks
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Payment and invoice archive regression
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"
        run: |
          python manage.py test             content.test_payments             content.test_payfast_security             content.test_invoice_archive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend auth/storage checks
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save nitro @tailwindcss/vite@4.3.3
          npm run typecheck
          node --test             tests/auth-identity.test.mjs             tests/auth-session-actions.test.mjs             tests/google-oauth.test.mjs             tests/social-oauth.test.mjs             tests/registration-actions.test.mjs             tests/recovery-safety.test.mjs             tests/student-storage.test.mjs
      - name: Require deploy hook configuration
        env:
          RENDER_PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
          PRODUCTION_HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          test -n "$RENDER_PRODUCTION_DEPLOY_HOOK_URL"
          test -n "$PRODUCTION_HEALTHCHECK_URL"

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger exact approved production deploy
        env:
          RENDER_PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_PRODUCTION_DEPLOY_HOOK_URL"

  health:
    name: Production health verification
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for readiness
        env:
          PRODUCTION_HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PRODUCTION_HEALTHCHECK_URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
