name: Run and verify Celery on Amaris AWS staging

on:
  push:
    branches: [ops/aws-staging-celery-20261126]
    paths: [.github/workflows/aws-staging-celery.yml, deploy/aws/celery/staging_celery.py, deploy/aws/celery/render-task.py, deploy/aws/celery/deploy.sh, deploy/aws/celery/verify-host.sh]

permissions: {}
concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_PAGER: ''
      AWS_REGION: eu-north-1
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Authenticate with the staging deployment role
        if: env.STAGING_AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Authenticate with existing staging credentials
        if: env.STAGING_AWS_ROLE == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Check the staging website and apply the worker and Beat containers
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fSs --retry 3 --max-time 12 https://16.171.164.5/health/ready/ | jq -e '.status=="ready"'
          bash deploy/aws/celery/deploy.sh
      - name: Verify the ECS service and ALB target
        shell: bash
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster amaris-ecs-staging --services amaris-web-staging-alb
          aws ecs describe-services --cluster amaris-ecs-staging --services amaris-web-staging-alb \
            --query 'services[0]' --output json | jq -e --arg revision "$CELERY_STAGING_REVISION" \
            '.taskDefinition==$revision and .runningCount==1 and .desiredCount==1'
          aws elbv2 describe-target-health --target-group-arn "$CELERY_STAGING_TARGET" --query TargetHealthDescriptions --output json \
            | jq -e '[.[]|select(.TargetHealth.State=="healthy")]|length==1'
      - name: Verify all queues and observe both scheduled booking jobs
        run: bash deploy/aws/ecs/run-on-host.sh "$CELERY_STAGING_INSTANCE" deploy/aws/celery/verify-host.sh
      - name: Verify the website after Celery starts
        shell: bash
        run: |
          set -euo pipefail
          curl -fSs --retry 3 --max-time 12 https://16.171.164.5/health/dependencies/ \
            | jq -e '.dependencies.postgresql and .dependencies.redis'
          curl -fSsI --retry 3 --max-time 12 https://16.171.164.5/health/ready/ | grep -Eiq '^X-Amaris-Network: public-alb'
      - name: Restore the prior task if the new revision fails verification
        if: failure() && steps.deploy.outcome == 'success' && env.CELERY_STAGING_PREVIOUS_REVISION != env.CELERY_STAGING_REVISION
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service --cluster amaris-ecs-staging --service amaris-web-staging-alb \
            --task-definition "$CELERY_STAGING_PREVIOUS_REVISION" --query service.taskDefinition --output text
          aws ecs wait services-stable --cluster amaris-ecs-staging --services amaris-web-staging-alb
          curl -fSs --retry 3 --max-time 12 https://16.171.164.5/health/ready/ | jq -e '.status=="ready"'
