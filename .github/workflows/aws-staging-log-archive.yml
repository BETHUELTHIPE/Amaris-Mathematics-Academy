name: Amaris AWS application log archive

on:
  push:
    branches: [ops/aws-staging-log-archive-20261127]
    paths: [.github/workflows/aws-staging-log-archive.yml, deploy/aws/log-archive/**]

permissions: {}

jobs:
  archive:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Identify Academy logging sources
        run: |
          set -euo pipefail
          source deploy/aws/log-archive/hosts.sh
          aws logs describe-log-groups --query 'logGroups[].logGroupName' --output json | jq '[.[] | select(test("amaris|mathematics";"i"))]'
          aws ecs list-services --cluster "$cluster" --query serviceArns --output json
          for host in "${hosts[@]}"; do
            aws ec2 describe-instances --instance-ids "$host" --query 'Reservations[].Instances[].{instance:InstanceId,profile:IamInstanceProfile.Arn}' --output json
            bash deploy/aws/ecs/run-on-host.sh "$host" deploy/aws/log-archive/inventory-host.sh
          done
