name: Amaris AWS application log archive

on:
  push:
    branches: [ops/aws-staging-log-archive-20261127]
    paths: [.github/workflows/aws-staging-log-archive.yml, deploy/aws/log-archive/**]

permissions: {}
concurrency:
  group: amaris-aws-staging-log-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Provision the staging log archive
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 110156539003
          role="$(aws cloudformation describe-stack-resource --stack-name amaris-aws-staging \
            --logical-resource-id StagingInstanceRole --query StackResourceDetail.PhysicalResourceId --output text)"
          stack=amaris-staging-log-archive
          status="$(aws cloudformation describe-stacks --stack-name "$stack" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [[ "$status" == ROLLBACK_COMPLETE ]]; then
            # A failed first creation can leave an empty stack record.
            aws cloudformation list-stack-resources --stack-name "$stack" --output json |
              jq -e 'all(.StackResourceSummaries[]; .ResourceStatus == "DELETE_COMPLETE" or
                   (.ResourceStatus == "CREATE_FAILED" and (.PhysicalResourceId // "") == ""))' >/dev/null
            aws cloudformation delete-stack --stack-name "$stack"
            aws cloudformation wait stack-delete-complete --stack-name "$stack"
          fi
          aws cloudformation deploy --stack-name "$stack" \
            --template-file deploy/aws/log-archive/stack.yml --capabilities CAPABILITY_IAM \
            --parameter-overrides "InstanceRoleName=$role" --no-fail-on-empty-changeset --tags Application=Amaris-Mathematics-Academy Environment=staging
      - name: Verify CloudWatch to Lambda to S3 delivery
        run: |
          python -m pip -q install boto3
          python deploy/aws/log-archive/verify-archive.py
      - name: Report archive provisioning failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events --stack-name amaris-staging-log-archive --output json |
            jq '[.StackEvents[] | select(.ResourceStatus | endswith("FAILED")) | {LogicalResourceId, ResourceStatusReason}][:6]'
      - name: Collect running Academy application logs from both hosts
        run: |
          set -euo pipefail
          source deploy/aws/log-archive/hosts.sh
          for host in "${hosts[@]}"; do
            bash deploy/aws/ecs/run-on-host.sh "$host" deploy/aws/log-archive/collect-host.sh
          done
      - name: Verify application streams in the encrypted archive
        run: python deploy/aws/log-archive/verify-archive.py --application
