name: Synchronize npm lockfile

on:
  push:
    branches: [security/owasp-test-suite]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/sync-lockfile-temporary.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/owasp-test-suite
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile from package.json without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install from refreshed lockfile
        run: npm ci
      - name: Commit synchronized lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin HEAD:security/owasp-test-suite
