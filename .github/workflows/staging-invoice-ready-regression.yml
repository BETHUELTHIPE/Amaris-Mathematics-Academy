name: Staging Private Invoice Readiness Regression
on:
  push:
    branches: [stage/receipt-ready-before-smtp-20261019]
    paths:
      - backend/content/student_views.py
      - backend/content/test_student_api.py
      - .github/workflows/staging-invoice-ready-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: amaris_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d amaris_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://test:local-ci-only@localhost:5432/amaris_test
      DATABASE_SSL_REQUIRED: 'false'
      SUPABASE_DATABASE_REQUIRED: 'false'
      SUPABASE_S3_REQUIRED: 'false'
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: synthetic-test-only
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      PAYFAST_ENV: sandbox
      PAYFAST_MODE: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked Django dependencies
        run: pip install -r backend/requirements.txt
      - name: Django migration and authenticated payment invoice regression
        working-directory: backend
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test content.test_student_api.StudentJourneyApiTests.test_booking_and_video_history_never_exposes_another_student_or_private_payloads --noinput
