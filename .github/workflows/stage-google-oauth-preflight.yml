name: Staging Google OAuth and Render Environment Preflight
on:
  push:
    branches: [stage/students-google-receipts-pinned-20261019]
    paths: [.github/workflows/stage-google-oauth-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Check dedicated staging frontend isolation and Google OAuth redirect
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          branch="stage/students-google-receipts-pinned-20261019"
          project="atyhhjwwxgzeurnwayay"
          site="https://amaris-mathematics-academy-staging-x4ax.onrender.com"
          if os.getenv("GITHUB_REF")!="refs/heads/"+branch:
              raise SystemExit("BLOCK: wrong GitHub branch")
          key=os.getenv("RENDER_API_KEY","")
          if not key: raise SystemExit("BLOCK: Render credential is unavailable")
          base="https://api.render.com/v1/services/srv-daqf69qd0e5s73ac62n0"
          h={"Authorization":"Bearer "+key,"Accept":"application/json"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=20) as x:
                  return json.load(x)
          svc=get(base)
          if svc.get("id")!="srv-daqf69qd0e5s73ac62n0" or svc.get("ownerId")!="tea-csppi8l6l47c73dk9c90":
              raise SystemExit("BLOCK: unexpected Render service")
          raw=get(base+"/env-vars?limit=100")
          if isinstance(raw,dict): raw=raw.get("envVars",raw.get("data",[]))
          env={}
          for row in raw:
              a=row.get("envVar",row)
              if isinstance(a,dict) and isinstance(a.get("key"),str): env[a["key"]]=a.get("value") or ""
          public_url=env.get("SUPABASE_URL","")
          cms=env.get("CMS_API_URL","").rstrip("/")
          dest=env.get("SITE_URL","").rstrip("/")
          auth_key=env.get("SUPABASE_PUBLISHABLE_KEY","")
          database=urllib.parse.urlsplit(env.get("DATABASE_URL",""))
          db_stage=not database.hostname or database.hostname==f"db.{project}.supabase.co" or project in (database.username or "")
          print("SUPABASE_STAGING_MATCH="+str(public_url==f"https://{project}.supabase.co"))
          print("CMS_API_STAGING_MATCH="+str(cms in ("https://amaris-mathematics-academy-staging.onrender.com","https://amaris-mathematics-academy-staging.onrender.com/api/v1")))
          print("SITE_URL_STAGING_MATCH="+str(dest==site))
          print("FRONTEND_DB_NOT_PRODUCTION="+str(db_stage))
          print("FRONTEND_PUBLISHABLE_KEY_PRESENT="+str(bool(auth_key)))
          if not(db_stage and public_url==f"https://{project}.supabase.co" and dest==site and auth_key and cms.startswith("https://amaris-mathematics-academy-staging.onrender.com")):
              raise SystemExit("BLOCK: staging frontend Render configuration must be isolated before Google deployment")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url): return None
          opener=urllib.request.build_opener(NoRedirect())
          params=urllib.parse.urlencode({"provider":"google","redirect_to":site+"/auth/callback?next=/dashboard"})
          req=urllib.request.Request(f"https://{project}.supabase.co/auth/v1/authorize?{params}",headers={"User-Agent":"Amaris-staging-Google-preflight"})
          try:
              r=opener.open(req,timeout=25)
              status,location=r.status,r.headers.get("Location","")
              r.close()
          except urllib.error.HTTPError as e:
              status,location=e.code,e.headers.get("Location","")
              e.close()
          u=urllib.parse.urlsplit(location)
          qs=urllib.parse.parse_qs(u.query)
          ok=status in (302,303,307,308) and u.scheme=="https" and u.hostname=="accounts.google.com" and any(v.endswith(".apps.googleusercontent.com") for v in qs.get("client_id",[]))
          print("STAGING_GOOGLE_PROVIDER_REDIRECT_PASS="+str(ok))
          if not ok: raise SystemExit("BLOCK: Google provider is not correctly enabled for the isolated staging Supabase project")
          print("PASS: stage-only Google OAuth preflight; actual Google login/callback still requires signed-in acceptance")
          PY
