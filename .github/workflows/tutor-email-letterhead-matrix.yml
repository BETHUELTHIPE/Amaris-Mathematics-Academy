name: Tutor Email Letterhead and Workflow Matrix
on:
  push:
    branches: [feat/backend-official-email-letterhead-20261028]
    paths:
      - "backend/content/**"
      - "backend/templates/emails/**"
      - ".github/workflows/tutor-email-letterhead-matrix.yml"
permissions:
  contents: read
jobs:
  tutor-email-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_tutor_email_ci
          POSTGRES_USER: amaris_tutor_email_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_tutor_email_ci -d amaris_tutor_email_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgresql://amaris_tutor_email_ci@127.0.0.1:5432/amaris_tutor_email_ci"
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      PAYFAST_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated Django test secret
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax and email formatting
        run: |
          python -m compileall -q content/services/tutor_applications.py content/services/branded_email.py content/tutor_finance_tasks.py content/tasks.py
          black --check content/services/tutor_applications.py content/services/branded_email.py content/tutor_finance_tasks.py content/tasks.py content/test_tutor_applications.py content/test_live_classes.py
          ruff check content/services/tutor_applications.py content/services/branded_email.py content/tutor_finance_tasks.py content/tasks.py content/test_tutor_applications.py content/test_live_classes.py
      - name: Run genuine Django workflows with isolated Postgres and locmem email
        run: |
          python manage.py test \
            content.test_branded_email \
            content.test_tutor_applications \
            content.test_tutor_finance \
            content.test_live_classes \
            content.test_enquiry_autoreply \
            content.test_payments \
            content.test_invoice_archive --noinput
      - name: Check all key tutor email implementations call the shared letterhead
        run: |
          python - <<'PY'
          from pathlib import Path
          cases={
              "tutor application acknowledgement":"content/services/tutor_applications.py",
              "tutor payout proof of payment":"content/tutor_finance_tasks.py",
              "class confirmation / reminder / course invoice / video workflow":"content/tasks.py",
              "support/contact enquiry":"content/services/enquiry_autoreply.py",
          }
          for label,file in cases.items():
              data=Path(file).read_text()
              if "render_branded_email(" not in data:
                  raise SystemExit(f"FAIL: Missing official Amaris letterhead for {label}")
              print(f"PASS: Shared official letterhead referenced for {label}")
          PY
