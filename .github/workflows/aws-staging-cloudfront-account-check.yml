name: Check Amaris staging CloudFront availability

on:
  push:
    branches: [ops/aws-staging-cloudfront-course-video]
    paths: [.github/workflows/aws-staging-cloudfront-account-check.yml]

permissions: {}

concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false

jobs:
  account:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Look for an existing distribution for the Academy staging media origin
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 110156539003
          origin=amaris-mathematics-academy-media-stage-110156539003-eu-north-1.s3.eu-north-1.amazonaws.com
          aws cloudfront list-distributions --output json | jq --arg origin "$origin" '
            [.DistributionList.Items[]? | select(any(.Origins.Items[]; .DomainName == $origin)) |
              {Id,Enabled,Status}] | {existing_staging_media_distributions:length,distributions:.}'
      - name: Clear the empty failed stack record to allow a clean retry
        run: |
          set -euo pipefail
          stack=amaris-staging-course-video-cdn
          snapshot="$(aws cloudformation describe-stacks --stack-name "$stack" --output json)"
          if ! jq -e '.Stacks[0].StackStatus == "ROLLBACK_COMPLETE"' <<< "$snapshot" >/dev/null; then
            echo 'The stack is not a rolled-back creation. Leaving it in place.'
            exit 0
          fi
          jq -e '
            .Stacks[0].StackName=="amaris-staging-course-video-cdn" and
            any(.Stacks[0].Tags[]; .Key=="Application" and .Value=="Amaris-Mathematics-Academy") and
            any(.Stacks[0].Tags[]; .Key=="Environment" and .Value=="staging")' <<< "$snapshot" >/dev/null
          aws cloudformation list-stack-resources --stack-name "$stack" --output json |
            jq -e 'all(.StackResourceSummaries[];
               .ResourceStatus == "DELETE_COMPLETE" or
               (.ResourceStatus == "CREATE_FAILED" and (.PhysicalResourceId // "") == ""))' >/dev/null
          stack_id="$(jq -er '.Stacks[0].StackId' <<< "$snapshot")"
          aws cloudformation delete-stack --stack-name "$stack_id"
          aws cloudformation wait stack-delete-complete --stack-name "$stack_id"
          echo 'Removed the empty rollback record. No live resources were deleted.'
