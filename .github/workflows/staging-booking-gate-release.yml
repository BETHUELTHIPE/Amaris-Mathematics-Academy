name: Staging Verified Student Booking Gate Release
on:
  push:
    branches: ["stage/verified-booking-main-page-20261026"]
    paths:
      - "frontend/app/book-online-live-class/page.tsx"
      - "frontend/tests/live-class-booking-contract.test.mjs"
      - "frontend/tests/booking-staging-gate.test.mjs"
      - "frontend/scripts/verify-booking-page.mjs"
      - ".github/workflows/staging-booking-gate-release.yml"
permissions:
  contents: read
jobs:
  staging-booking-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Type-check verified-only class booking
        working-directory: frontend
        run: npm run typecheck
      - name: Verify protected booking, student identity and recovery regressions
        working-directory: frontend
        run: node --test tests/live-class-booking-contract.test.mjs tests/booking-staging-gate.test.mjs tests/registration-actions.test.mjs tests/password-recovery-proof.test.mjs tests/password-recovery.test.mjs
