name: Universal Email Verification Security Gate
on:
  push:
    branches: ["fix/universal-email-verification-gate-20261025"]
    paths:
      - "frontend/app/auth/**"
      - "frontend/app/api/auth-state/**"
      - "frontend/app/tutor/**"
      - "frontend/lib/verified-account-email.ts"
      - "frontend/tests/registration-actions.test.mjs"
      - "frontend/tests/tutor-applications.test.mjs"
      - "frontend/tests/universal-email-verification.test.mjs"
      - ".github/workflows/universal-email-verification.yml"
permissions:
  contents: read
jobs:
  verify-all-current-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Type-check frontend security changes
        working-directory: frontend
        run: npm run typecheck
      - name: Test verified email policy, students, tutors and applicants
        working-directory: frontend
        run: node --test tests/universal-email-verification.test.mjs tests/registration-actions.test.mjs tests/tutor-applications.test.mjs tests/tutor-portal-contract.test.mjs tests/google-registration.test.mjs
