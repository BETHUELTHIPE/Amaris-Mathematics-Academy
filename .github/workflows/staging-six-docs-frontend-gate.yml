name: Staging Six Tutor Documents Frontend Reconciliation Gate
on:
  push:
    branches: ["ops/staging-six-docs-frontend-reconcile-20261027"]
    paths:
      - "frontend/**"
      - ".github/workflows/staging-six-docs-frontend-gate.yml"
permissions:
  contents: read
jobs:
  validate-staging-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --include=dev
      - name: Type-check six-upload and existing student forms
        run: npm run typecheck
      - name: Unit tests including rejected missing files and private BFF
        run: node --test tests/tutor-applications.test.mjs tests/tutor-portal-contract.test.mjs tests/registration-actions.test.mjs tests/google-registration.test.mjs
      - name: Build staging Node production bundle
        run: NODE_ENV=production NITRO_PRESET=node npx vite build --config vite.node.config.ts
