name: Staging Google and Invoice Frontend Quality
on:
  push:
    branches: [stage/students-google-receipts-pinned-20261019]
    paths:
      - 'frontend/**'
      - '.github/workflows/stage-google-invoice-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-build-private-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: TypeScript and ESLint
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm run typecheck
          npm run lint
      - name: Full existing frontend contract tests
        working-directory: frontend
        run: npm test
      - name: Enforce staging-only Google and PDF route contracts
        working-directory: frontend
        run: node --test tests/staging-google-invoice.test.mjs
  google-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check real staging Supabase initiates Google OAuth
        run: |
          python3 - <<'PY'
          import urllib.parse,urllib.request,urllib.error
          project="atyhhjwwxgzeurnwayay"
          origin="https://amaris-mathematics-academy-staging-x4ax.onrender.com"
          p=urllib.parse.urlencode({"provider":"google","redirect_to":origin+"/auth/callback?next=/dashboard"})
          req=urllib.request.Request(f"https://{project}.supabase.co/auth/v1/authorize?{p}",headers={"User-Agent":"Amaris-staging-auth-preflight"})
          class NoFollow(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          try:
              r=urllib.request.build_opener(NoFollow()).open(req,timeout=22)
              status,location=r.status,r.headers.get("Location","")
              r.close()
          except urllib.error.HTTPError as e:
              status,location=e.code,e.headers.get("Location","")
              e.close()
          u=urllib.parse.urlsplit(location)
          q=urllib.parse.parse_qs(u.query)
          passed=(status in (302,303,307,308) and u.scheme=="https" and u.hostname=="accounts.google.com" and any(v.endswith(".apps.googleusercontent.com") for v in q.get("client_id",[])))
          print("GOOGLE_STAGING_PROVIDER_ENABLED="+str(passed))
          if not passed: raise SystemExit("BLOCK: stage Supabase Google provider must be enabled with correct callback")
          print("PASS Google OAuth provider initiation; an actual signed-in callback remains unverified")
          PY
