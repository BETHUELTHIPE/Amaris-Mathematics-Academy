name: Amaris Official Letterhead Acceptance
on:
  push:
    branches: [feat/official-letterhead-formal-communications-20261027]
    paths:
      - "backend/content/services/official_letterhead.py"
      - "backend/content/services/enquiry_autoreply.py"
      - "backend/content/tasks.py"
      - "backend/content/test_official_letterhead.py"
      - "backend/content/test_enquiry_autoreply.py"
      - "frontend/email-templates/**"
      - "frontend/tests/letterhead-policy-contract.test.mjs"
      - ".github/workflows/amaris-official-letterhead-acceptance.yml"
permissions:
  contents: read
jobs:
  brand-and-communication-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Validate approved letterhead and account templates
        working-directory: frontend
        run: node --test tests/letterhead-policy-contract.test.mjs
      - name: Validate Supabase OTP template contract without deployment
        run: python -m unittest discover -s tests -p test_configure_supabase_auth_otp.py -v
      - name: Python syntax validation for email workflows
        run: python -m compileall -q backend/content/services/official_letterhead.py backend/content/services/enquiry_autoreply.py backend/content/tasks.py backend/content/test_official_letterhead.py

  django-letterhead-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral Django secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Format and lint affected Python files
        run: |
          black --check --diff content/services/official_letterhead.py content/services/enquiry_autoreply.py content/tasks.py content/test_official_letterhead.py content/test_enquiry_autoreply.py
          ruff check content/services/official_letterhead.py content/services/enquiry_autoreply.py content/tasks.py content/test_official_letterhead.py content/test_enquiry_autoreply.py
      - name: Test official letterhead and legacy paid invoice archival
        run: python manage.py test content.test_official_letterhead content.test_enquiry_autoreply content.test_invoice_archive
