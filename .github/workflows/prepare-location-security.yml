name: Prepare patched Next dependencies
on:
  push:
    branches:
      - feat/african-location-api-20261022
      - feat/african-location-forms-20261022
    paths:
      - .github/workflows/prepare-location-security.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate dependency lock without running package scripts
        working-directory: frontend
        run: |
          npm pkg set dependencies.next=16.4.2 devDependencies.eslint-config-next=16.4.2
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Commit dependency files to the same feature branch
        run: |
          test "${GITHUB_REF_NAME}" = feat/african-location-api-20261022 || test "${GITHUB_REF_NAME}" = feat/african-location-forms-20261022
          git config user.name 'Amaris dependency maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git commit -m 'Fix Next.js security advisories with 16.4.2 and matching ESLint'
          git push origin "HEAD:${GITHUB_REF_NAME}"
