name: Amaris Staging Auth Templates Only
on:
  push:
    branches: ["ops/otp-staging-apply-20261025"]
    paths: ["ops/staging-auth-smtp-bootstrap-request.txt"]
permissions:
  contents: read
jobs:
  apply-staging-auth-templates:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTH_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply only Supabase signup/login email templates and six-digit defaults
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          from pathlib import Path
          PROJECT="atyhhjwwxgzeurnwayay"
          if os.getenv("GITHUB_REF")!="refs/heads/ops/otp-staging-apply-20261025" or os.getenv("GITHUB_REPOSITORY")!="BETHUELTHIPE/Amaris-Mathematics-Academy":
              raise SystemExit("BLOCK: wrong GitHub branch or repository")
          token=os.environ.get("SUPABASE_ACCESS_TOKEN","")
          if not token:
              raise SystemExit("BLOCK: missing scoped Supabase GitHub secret")
          url=f"https://api.supabase.com/v1/projects/{PROJECT}/config/auth"

          def api(method,payload=None):
              head={"Authorization":"Bearer "+token,"Accept":"application/json"}
              data=None
              if payload is not None:
                  head["Content-Type"]="application/json"
                  data=json.dumps(payload).encode()
              req=urllib.request.Request(url,headers=head,method=method,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  try:
                      obj=json.loads(exc.read(2048).decode("utf-8"))
                  except (ValueError,UnicodeError):
                      obj={}
                  if isinstance(obj,dict):
                      for field in ("code","message","error"):
                          val=obj.get(field)
                          if not isinstance(val,str): continue
                          val=val.replace(token,"[REDACTED]")
                          val=re.sub(r"[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}","[EMAIL]",val)
                          val=re.sub(r"[^\x20-\x7E]"," ",val)[:300]
                          print("PROVIDER_"+field.upper()+"="+val)
                  raise SystemExit(f"BLOCK: Supabase Auth {method} returned HTTP {exc.code}")
          expected={
              "mailer_templates_confirmation_content":Path("frontend/email-templates/confirm-signup.html").read_text(),
              "mailer_templates_magic_link_content":Path("frontend/email-templates/magic-link-login.html").read_text(),
              "mailer_subjects_confirmation":"Amaris | Verify your student email",
              "mailer_subjects_magic_link":"Amaris | Your six-digit sign-in code",
          }
          if any("{{ .Token }}" not in expected[k] for k in ("mailer_templates_confirmation_content","mailer_templates_magic_link_content")):
              raise SystemExit("BLOCK: missing Supabase token placeholder")
          api("GET")
          api("PATCH",expected)
          now=api("GET")
          for field,wanted in expected.items():
              if now.get(field)!=wanted: raise SystemExit("BLOCK: post-update template readback mismatch: "+field)
          print("PASS: both staging Auth email templates applied and checked (no SMTP settings touched)")
          otp_settings={"mailer_autoconfirm":False,"mailer_otp_length":6,"mailer_otp_exp":600,"external_email_enabled":True}
          api("PATCH",otp_settings)
          after=api("GET")
          for field,wanted in otp_settings.items():
              if after.get(field)!=wanted: raise SystemExit("BLOCK: OTP config readback mismatch: "+field)
          print("PASS: staging six-digit email confirmation and 10-minute OTP expiry configured")
          print("EMAIL_INBOX_RECEIPT=NOT_TESTED; SMTP_UNCHANGED=YES; PRODUCTION_UNCHANGED=YES")
          PY
