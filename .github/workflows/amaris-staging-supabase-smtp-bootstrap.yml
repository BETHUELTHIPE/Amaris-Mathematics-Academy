name: Amaris Staging Supabase Auth SMTP Bootstrap
on:
  push:
    branches: ["ops/otp-staging-apply-20261025"]
    paths: ["ops/staging-auth-smtp-bootstrap-request.txt"]
permissions:
  contents: read
jobs:
  setup-staging-auth-email:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 8
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTH_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated staging Gmail transport; install custom Auth SMTP and six-digit email templates
        shell: bash
        run: |
          python3 - <<'PY'
          import email.utils, json, os, re, smtplib, ssl, sys, urllib.error, urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit

          SERVICE = "srv-dam2iivcgkoc7383tq50"
          OWNER = "tea-csppi8l6l47c73dk9c90"
          STAGING = "atyhhjwwxgzeurnwayay"
          BRANCH = "ops/staging-known-good-af8709c-20261019"
          assert os.environ.get("GITHUB_REF") == "refs/heads/ops/otp-staging-apply-20261025"
          assert os.environ.get("GITHUB_REPOSITORY") == "BETHUELTHIPE/Amaris-Mathematics-Academy"
          render_token = os.getenv("RENDER_API_KEY", "")
          auth_token = os.getenv("SUPABASE_ACCESS_TOKEN", "")
          if not render_token or not auth_token:
              raise SystemExit("BLOCK: protected Render or Supabase GitHub secret unavailable")

          def json_request(url, key, method="GET", payload=None):
              headers={"Authorization":"Bearer "+key, "Accept":"application/json"}
              data=None
              if payload is not None:
                  headers["Content-Type"]="application/json"
                  data=json.dumps(payload).encode("utf-8")
              request=urllib.request.Request(url, method=method, headers=headers, data=data)
              try:
                  with urllib.request.urlopen(request,timeout=22) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as ex:
                  raise SystemExit(f"BLOCK: provider API {method} returned HTTP {ex.code} (no secrets logged)")
              except (urllib.error.URLError,TimeoutError):
                  raise SystemExit("BLOCK: provider API unavailable")

          base="https://api.render.com/v1/services/"+SERVICE
          svc=json_request(base,render_token)
          if svc.get("id")!=SERVICE or svc.get("ownerId")!=OWNER or svc.get("branch")!=BRANCH:
              raise SystemExit("BLOCK: unexpected staging Render service / owner / branch")
          records=json_request(base+"/env-vars?limit=100",render_token)
          if isinstance(records,dict):
              records=records.get("envVars",records.get("data",[]))
          if not isinstance(records,list):
              raise SystemExit("BLOCK: malformed staging environment result")
          env={}
          for entry in records:
              item=entry.get("envVar",entry) if isinstance(entry,dict) else {}
              if isinstance(item,dict) and isinstance(item.get("key"),str):
                  env[item["key"]]=item.get("value") or ""
          db=urlsplit(env.get("DATABASE_URL",""))
          valid_db=db.hostname==f"db.{STAGING}.supabase.co" or (
              (db.hostname or "").endswith(".pooler.supabase.com")
              and STAGING in (db.username or ""))
          if not valid_db or env.get("SUPABASE_PROJECT_REF") != STAGING:
              raise SystemExit("BLOCK: staging Django database identity mismatch")
          if (env.get("PAYFAST_MODE") or env.get("PAYFAST_ENV") or "sandbox").lower()!="sandbox":
              raise SystemExit("BLOCK: staging environment is not in sandbox mode")
          sender=email.utils.parseaddr(env.get("DEFAULT_FROM_EMAIL",""))[1]
          username=env.get("EMAIL_HOST_USER","")
          password=(env.get("EMAIL_HOST_PASSWORD","")).replace(" ","")
          if (env.get("EMAIL_HOST","").lower()!="smtp.gmail.com"
              or str(env.get("EMAIL_PORT",""))!="587"
              or env.get("EMAIL_USE_TLS","").lower()!="true"
              or env.get("EMAIL_USE_SSL","").lower()!="false"
              or not sender.lower().endswith("@gmail.com")
              or sender.lower()!=username.lower()
              or not sender.isascii()
              or not re.fullmatch(r"[A-Za-z0-9]{16}",password)):
              raise SystemExit("BLOCK: staging Gmail sender, TLS or app password not verified")
          print("PASS: isolated staging Render service, project and Gmail configuration validated")
          try:
              with smtplib.SMTP("smtp.gmail.com",587,timeout=18) as smtp:
                  smtp.ehlo()
                  smtp.starttls(context=ssl.create_default_context())
                  smtp.ehlo()
                  smtp.login(username,password)
          except (smtplib.SMTPException,OSError,ssl.SSLError):
              raise SystemExit("BLOCK: staging Gmail SMTP authentication failed; no Supabase changes")
          print("PASS: Gmail SMTP login authenticated; no email sent by this test")

          url=f"https://api.supabase.com/v1/projects/{STAGING}/config/auth"
          current=json_request(url,auth_token)
          if current.get("smtp_host") or current.get("smtp_admin_email"):
              raise SystemExit("BLOCK: custom Supabase Auth SMTP is already present; do not overwrite")
          templates={
              "mailer_templates_confirmation_content":Path("frontend/email-templates/confirm-signup.html").read_text(),
              "mailer_templates_magic_link_content":Path("frontend/email-templates/magic-link-login.html").read_text(),
          }
          if any("{{ .Token }}" not in html for html in templates.values()):
              raise SystemExit("BLOCK: missing Supabase OTP placeholder")
          payload={
              "external_email_enabled":True,
              "mailer_autoconfirm":False,
              "mailer_otp_length":6,
              "mailer_otp_exp":600,
              "mailer_subjects_confirmation":"Amaris | Verify your student email",
              "mailer_subjects_magic_link":"Amaris | Your six-digit sign-in code",
              **templates,
              "smtp_admin_email":sender,
              "smtp_host":"smtp.gmail.com",
              "smtp_port":587,
              "smtp_user":username,
              "smtp_pass":password,
              "smtp_sender_name":"Amaris Mathematics Academy",
          }
          json_request(url,auth_token,"PATCH",payload)
          actual=json_request(url,auth_token)
          for key,value in payload.items():
              if key=="smtp_pass":
                  continue
              if actual.get(key)!=value:
                  raise SystemExit("BLOCK: Supabase Auth readback differs: "+key)
          print("PASS: staging Supabase Auth SMTP configured and both six-digit OTP templates match readback")
          print("STAGING_ONLY=YES; EMAIL_INBOX_RECEIPT=NOT_TESTED; PRODUCTION_UNCHANGED=YES")
          PY
