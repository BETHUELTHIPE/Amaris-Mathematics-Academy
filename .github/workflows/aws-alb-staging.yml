name: Deploy the public Amaris staging ALB

on:
  push:
    branches: [ops/aws-alb-staging-20261125]
    paths:
      - deploy/aws/alb/**
      - .github/workflows/aws-alb-staging.yml

permissions: {}
concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    name: Deploy the public ALB and route to private ECS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ""
      AMARIS_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      HOST_STACK: amaris-aws-staging
      NET_STACK: amaris-staging-vpc
      ECS_CLUSTER: amaris-ecs-staging
      PRIVATE_SERVICE: amaris-web-staging-private
      ALB_SERVICE: amaris-web-staging-alb
      ALB_STACK: amaris-staging-alb
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Authenticate to AWS using the staging role
        if: env.AMARIS_AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AMARIS_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Authenticate to AWS using the configured staging keys
        if: env.AMARIS_AWS_ROLE == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Resolve the existing VPC and two Availability Zones
        shell: bash
        run: bash deploy/aws/vpc/resolve-network.sh
      - name: Resolve the existing public and private subnets
        shell: bash
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "$NET_STACK" --query 'Stacks[0].Outputs' --output json)"
          output() { jq -er --arg key "$1" '.[] | select(.OutputKey==$key).OutputValue' <<< "$outputs"; }
          host() { aws cloudformation describe-stack-resource --stack-name "$HOST_STACK" --logical-resource-id "$1" \
            --query StackResourceDetail.PhysicalResourceId --output text; }
          {
            printf 'STAGING_PUBLIC_SECONDARY=%s\n' "$(output SecondPublicSubnet)"
            printf 'STAGING_PRIVATE_PRIMARY=%s\n' "$(output PrimaryPrivateSubnet)"
            printf 'STAGING_PRIVATE_SECONDARY=%s\n' "$(output SecondaryPrivateSubnet)"
            printf 'STAGING_PRIVATE_SG=%s\n' "$(output PrivateTaskSecurityGroup)"
            printf 'STAGING_IGW=%s\n' "$(host InternetGateway)"
            printf 'STAGING_EDGE_ROLE=%s\n' "$(host StagingInstanceRole)"
          } >> "$GITHUB_ENV"
      - name: Enable IPv6 on the two public subnets
        run: bash deploy/aws/alb/ipv6.sh
      - name: Create the public ALB and private IP target group
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://deploy/aws/alb/load-balancer.yml --query Description --output text
          if ! aws cloudformation deploy --stack-name "$ALB_STACK" --template-file deploy/aws/alb/load-balancer.yml \
            --no-fail-on-empty-changeset --capabilities CAPABILITY_IAM --parameter-overrides \
            "VpcId=$STAGING_VPC" "PublicSubnetA=$STAGING_PUBLIC_SUBNET" "PublicSubnetB=$STAGING_PUBLIC_SECONDARY" \
            "PublicRouteTableId=$STAGING_PUBLIC_ROUTES" "InternetGatewayId=$STAGING_IGW" \
            "GatewaySecurityGroup=$STAGING_EDGE_SG" "TaskSecurityGroup=$STAGING_PRIVATE_SG" "GatewayRoleName=$STAGING_EDGE_ROLE" \
            --tags Project=Amaris Environment=staging; then
            aws cloudformation describe-stack-events --stack-name "$ALB_STACK" \
              --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].[LogicalResourceId,ResourceStatusReason]' --output text
            exit 1
          fi
          outputs="$(aws cloudformation describe-stacks --stack-name "$ALB_STACK" --query 'Stacks[0].Outputs' --output json)"
          output() { jq -er --arg key "$1" '.[] | select(.OutputKey==$key).OutputValue' <<< "$outputs"; }
          arn="$(output LoadBalancerArn)"
          aws elbv2 describe-load-balancers --load-balancer-arns "$arn" --query 'LoadBalancers[0]' --output json \
            | jq -e --arg a "$STAGING_PUBLIC_SUBNET" --arg b "$STAGING_PUBLIC_SECONDARY" \
              '.Scheme=="internet-facing" and .IpAddressType=="dualstack-without-public-ipv4" and ([.AvailabilityZones[].SubnetId]|sort)==([$a,$b]|sort)'
          {
            printf 'STAGING_ALB_ARN=%s\n' "$arn"
            printf 'STAGING_ALB_ID=%s\n' "$(output LoadBalancerFullName)"
            printf 'STAGING_TARGET_ARN=%s\n' "$(output TargetGroupArn)"
          } >> "$GITHUB_ENV"
      - name: Prepare the ECS proxy and deploy the load-balanced service
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/aws/ecs/run-on-host.sh "$STAGING_INSTANCE" deploy/aws/alb/prepare-task.sh "$STAGING_ADDRESS"
          bash deploy/aws/alb/deploy-task.sh
      - name: Verify ECS target registration and private placement
        shell: bash
        run: |
          set -euo pipefail
          address=''
          ready=false
          for attempt in {1..48}; do
            targets="$(aws elbv2 describe-target-health --target-group-arn "$STAGING_TARGET_ARN" --query TargetHealthDescriptions --output json)"
            address="$(jq -r '.[] | select(.TargetHealth.State=="healthy" and .Target.Port==8080).Target.Id' <<< "$targets")"
            if [[ "$address" =~ ^10\.86\.0\.[0-9]+$ ]]; then
              tasks="$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ALB_SERVICE" --desired-status RUNNING --query taskArns --output text)"
              if [[ "$tasks" == arn:aws:ecs:* ]]; then
                detail="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$tasks" --query 'tasks[0]' --output json)"
                if jq -e '.lastStatus=="RUNNING" and .healthStatus=="HEALTHY"' <<< "$detail" >/dev/null; then
                  ready=true
                  break
                fi
              fi
            fi
            sleep 8
          done
          if [[ "$ready" != true ]]; then
            echo '::error::The ECS task and the ALB target did not both report healthy.'
            exit 1
          fi
          service="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ALB_SERVICE" --query 'services[0]' --output json)"
          jq -e --arg group "$STAGING_TARGET_ARN" '.runningCount==1 and any(.loadBalancers[];.targetGroupArn==$group and .containerName=="cms" and .containerPort==8080)' <<< "$service"
          interface="$(jq -er '.attachments[] | select(.type=="ElasticNetworkInterface" and .status=="ATTACHED") | .details[] | select(.name=="networkInterfaceId").value' <<< "$detail")"
          aws ec2 describe-network-interfaces --network-interface-ids "$interface" --query 'NetworkInterfaces[0]' --output json \
            | jq -e --arg a "$STAGING_PRIVATE_PRIMARY" --arg b "$STAGING_PRIVATE_SECONDARY" --arg ip "$address" \
              '(.SubnetId==$a or .SubnetId==$b) and .PrivateIpAddress==$ip and (.Association.PublicIp|not)'
          echo "The ALB target at $address:8080 is healthy inside a private subnet."
      - name: Route the staging HTTPS endpoint through the public ALB
        id: switch
        shell: bash
        run: bash deploy/aws/ecs/run-on-host.sh "$STAGING_INSTANCE" deploy/aws/alb/gateway.sh "$STAGING_ADDRESS" switch "$STAGING_ALB_ID"
      - name: Verify website traffic through the ALB
        shell: bash
        run: |
          set -euo pipefail
          base="https://$STAGING_ADDRESS"
          curl -fSs --retry 3 --max-time 12 -D "$RUNNER_TEMP/amaris-headers" "$base/" -o "$RUNNER_TEMP/amaris-home.html"
          grep -Eiq '^X-Amaris-Network: public-alb' "$RUNNER_TEMP/amaris-headers"
          grep -Fqi 'Amaris Mathematics Academy' "$RUNNER_TEMP/amaris-home.html"
          curl -fSs --max-time 12 "$base/health/ready" | jq -e '.status=="ok"'
          curl -fSs --max-time 12 "$base/health/dependencies/" | jq -e '.dependencies|.postgresql and .redis'
          curl -fSs --max-time 12 "$base/api/v1/bootstrap/" | jq -e 'has("settings")'
          curl -fSs --max-time 12 "$base/admin/login/" -o /dev/null
          unauthorized="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "$base/api/v1/student/courses/")"
          [[ "$unauthorized" == 401 || "$unauthorized" == 403 ]]
      - name: Scale down the previous private ECS service
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$PRIVATE_SERVICE" --desired-count 0 \
            --query service.desiredCount --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ALB_SERVICE" "$PRIVATE_SERVICE"
          curl -fSs --retry 3 --max-time 12 -D "$RUNNER_TEMP/amaris-final-headers" \
            "https://$STAGING_ADDRESS/health/dependencies/" | jq -e '.dependencies | .postgresql and .redis'
          grep -Eiq '^X-Amaris-Network: public-alb' "$RUNNER_TEMP/amaris-final-headers"
          printf 'Amaris staging is live through its public ALB at https://%s\n' "$STAGING_ADDRESS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore the previous staging route if verification fails
        if: failure() && steps.switch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$PRIVATE_SERVICE" --desired-count 1 \
            --query service.desiredCount --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$PRIVATE_SERVICE"
          bash deploy/aws/ecs/run-on-host.sh "$STAGING_INSTANCE" deploy/aws/alb/gateway.sh "$STAGING_ADDRESS" rollback
      - name: Report ECS and target group diagnostics
        if: failure()
        shell: bash
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ALB_SERVICE" \
            --query 'services[0].events[:8].message' --output text || true
          if [[ -n "${STAGING_TARGET_ARN:-}" ]]; then
            aws elbv2 describe-target-health --target-group-arn "$STAGING_TARGET_ARN" --output json || true
          fi
