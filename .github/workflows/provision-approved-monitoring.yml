name: Provision approved private monitoring

on:
  pull_request:
    branches: [main]
    paths:
      - monitoring/render/provision_approved.py
      - monitoring/render/test_provision_approved.py
      - .github/workflows/provision-approved-monitoring.yml
  push:
    branches: [main]
    paths:
      - monitoring/render/provision_approved.py
      - .github/workflows/provision-approved-monitoring.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-private-monitoring-provision
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s monitoring/render -p test_provision_approved.py
      - run: python monitoring/render/provision_approved.py

  provision:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install PyYAML==6.0.3
      - name: Create only approved missing resources
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python monitoring/render/provision_approved.py --apply
