name: Tutor finance temporary format
on:
  push:
    branches:
      - feature/production-tutor-finance-0013-20261015
permissions:
  contents: write
jobs:
  fix-format:
    if: github.event.head_commit.message != 'Apply automated formatter to tutor finance integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
      - name: Install repository formatters
        run: python -m pip install black==25.12.0 ruff==0.14.10
      - name: Fix Ruff and Black formatting in backend
        run: |
          ruff check --fix backend/content backend/amaris_cms
          black backend/content backend/amaris_cms
      - name: Commit formatting only
        run: |
          git config user.name "amaris-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- backend/content backend/amaris_cms)" ]; then
            git add backend/content backend/amaris_cms
            git commit -m "Apply automated formatter to tutor finance integration"
            git push origin HEAD:feature/production-tutor-finance-0013-20261015
          fi
