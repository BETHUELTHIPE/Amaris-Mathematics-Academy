name: Tutor Finance Ruff Formatter (temporary)
on:
  push:
    branches: [feature/tutor-revenue-ledger-20261015]
    paths:
      - "backend/content/**"
      - "backend/amaris_cms/**"
      - ".github/workflows/tutor-branch-ruff.yml"
permissions:
  contents: write
concurrency:
  group: tutor-finance-ruff
  cancel-in-progress: true
jobs:
  ruff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1 ruff==0.16.6
      - name: Fix import order and formatting in finance files
        run: |
          cd backend
          ruff check --fix content/tutor_finance_models.py content/tutor_finance_admin.py content/tutor_finance_tasks.py content/tutor_dashboard.py content/topical_video_views.py content/services/tutor_finance.py content/services/topical_videos.py content/test_tutor_finance.py content/payfast_views.py content/services/payments.py content/services/live_classes.py content/apps.py content/admin.py content/tasks.py content/urls.py amaris_cms/urls.py amaris_cms/settings.py || true
          black content/tutor_finance_models.py content/tutor_finance_admin.py content/tutor_finance_tasks.py content/tutor_dashboard.py content/topical_video_views.py content/services/tutor_finance.py content/services/topical_videos.py content/test_tutor_finance.py content/payfast_views.py content/services/payments.py content/services/live_classes.py content/apps.py content/admin.py content/tasks.py content/urls.py amaris_cms/urls.py amaris_cms/settings.py
      - name: Commit formatting only to finance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/content backend/amaris_cms
          if ! git diff --cached --quiet; then
            git commit -m "Apply Ruff and Black to tutor finance code"
            git push
          fi
