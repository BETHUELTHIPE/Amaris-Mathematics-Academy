name: Production Data Plane Gate

on:
  push:
    branches: [production-release-20260923]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-data-plane-gate
  cancel-in-progress: false

jobs:
  backend-release:
    name: Django production release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: synthetic-production-gate-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://example.test
      CORS_ALLOWED_ORIGINS: https://example.test
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      PAYFAST_MODE: sandbox
      PAYFAST_MERCHANT_ID: synthetic
      PAYFAST_MERCHANT_KEY: synthetic
      PAYFAST_PASSPHRASE: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked backend dependencies
        run: pip install -r requirements.txt
      - name: Django deployment checks
        run: python manage.py check --deploy
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Payment and invoice archive regression
        run: python manage.py test content.test_payments content.test_payfast_security content.test_invoice_archive
      - name: Student authorization regression
        run: python manage.py test content.test_student_api

  blueprint-release:
    name: Render production Blueprint checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate production resource wiring
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          data = yaml.safe_load(pathlib.Path("render.yaml").read_text())
          services = {item["name"]: item for item in data["services"]}
          databases = {item["name"]: item for item in data["databases"]}

          required_services = {
              "amaris-production-web",
              "amaris-production-critical-worker",
              "amaris-production-notification-worker",
              "amaris-production-beat",
              "amaris-production-broker",
              "amaris-production-cache",
          }
          missing = required_services - services.keys()
          assert not missing, f"Missing services: {sorted(missing)}"
          assert "amaris-production-postgres" in databases

          web = services["amaris-production-web"]
          assert web["runtime"] == "python"
          assert web["branch"] == "production-release-20260923"
          assert web["rootDir"] == "backend"
          assert web["autoDeployTrigger"] == "off"
          assert web["healthCheckPath"] == "/health/ready/"
          assert "migrate --noinput" in web["preDeployCommand"]

          env = {item["key"]: item for item in web["envVars"]}
          assert env["DATABASE_URL"]["fromDatabase"]["name"] == "amaris-production-postgres"
          assert env["CELERY_BROKER_URL"]["fromService"]["name"] == "amaris-production-broker"
          assert env["DJANGO_CACHE_URL"]["fromService"]["name"] == "amaris-production-cache"
          assert env["SUPABASE_STORAGE_ENABLED"]["value"] == "true"
          assert env["PAYFAST_MODE"]["value"] == "live"

          for name in (
              "SUPABASE_STORAGE_S3_ACCESS_KEY_ID",
              "SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY",
              "PAYFAST_MERCHANT_ID",
              "PAYFAST_MERCHANT_KEY",
              "PAYFAST_PASSPHRASE",
          ):
              assert env[name].get("sync") is False, f"{name} must remain a Render secret"

          print("Production Blueprint wiring validated.")
          PY
