name: Verify pending build quota and cost-aware ECS capacity options
on:
  push:
    branches: [ops/aws-selective-bluegreen-20261127]
    paths: [.github/workflows/aws-bluegreen-capacity-options.yml]
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-selective-bluegreen-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE != ''
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
      - name: Inspect applied quota, candidate instance capacity and published prices
        run: |
          python -m pip install --quiet boto3
          python - <<'PY'
          import boto3,json
          from decimal import Decimal
          assert boto3.client("sts").get_caller_identity()["Account"]=="110156539003"
          q=boto3.client("service-quotas")
          rows=[x for p in q.get_paginator("list_service_quotas").paginate(ServiceCode="codebuild") for x in p.get("Quotas",[])]
          quota=next(x for x in rows if x["QuotaName"].lower()=="concurrently running builds for arm/small environment")
          print("Current CodeBuild ARM/Small quota:",quota["Value"])
          requests=[x for p in q.get_paginator("list_requested_service_quota_change_history_by_quota").paginate(ServiceCode="codebuild",QuotaCode=quota["QuotaCode"]) for x in p.get("RequestedQuotas",[])]
          print("Existing quota request states:",[x["Status"] for x in requests if x["DesiredValue"]>=1][:5])
          ec2=boto3.client("ec2")
          types=["t4g.small","c7g.medium","c7g.large","m7g.medium","m7g.large"]
          pricing=boto3.client("pricing",region_name="us-east-1")
          offered=[o for p in ec2.get_paginator("describe_instance_type_offerings").paginate(LocationType="availability-zone",Filters=[{"Name":"instance-type","Values":types},{"Name":"location","Values":["eu-north-1a","eu-north-1c"]}]) for o in p.get("InstanceTypeOfferings",[])]
          for t in ec2.describe_instance_types(InstanceTypes=types)["InstanceTypes"]:
              name=t["InstanceType"]
              azs=sorted(x["Location"] for x in offered if x["InstanceType"]==name)
              filters={"regionCode":"eu-north-1","instanceType":name,"operatingSystem":"Linux","tenancy":"Shared","preInstalledSw":"NA","capacitystatus":"Used","operation":"RunInstances"}
              result={"instance":name,"memoryMiB":t["MemoryInfo"]["SizeInMiB"],"vcpu":t["VCpuInfo"]["DefaultVCpus"],"standardENIs":t["NetworkInfo"]["MaximumNetworkInterfaces"],"offeredAZs":azs}
              try:
                  prices=pricing.get_products(ServiceCode="AmazonEC2",Filters=[{"Type":"TERM_MATCH","Field":k,"Value":v} for k,v in filters.items()])
                  values={Decimal(d["pricePerUnit"]["USD"]) for p in prices["PriceList"] for term in json.loads(p)["terms"]["OnDemand"].values() for d in term["priceDimensions"].values() if d["unit"]=="Hrs" and Decimal(d["pricePerUnit"]["USD"])>0}
                  if len(values)==1:
                      value=values.pop()
                      result.update({"hourlyUSD":str(value),"monthlyComputeUSD":str((value*730).quantize(Decimal("0.01")))})
                  else:
                      result["pricing"]="not uniquely determined"
              except Exception as e:
                  result["pricing"]="unavailable: "+type(e).__name__
              print(json.dumps(result))
          print("Compute estimates exclude disks, taxes, NAT, ALB, storage and transfer. No resources launched or quotas modified.")
          PY
