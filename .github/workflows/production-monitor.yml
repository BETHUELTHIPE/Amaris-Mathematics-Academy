name: Production Error Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-error-monitor
  cancel-in-progress: true

jobs:
  health-monitor:
    name: Probe production and dispatch sanitized incidents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Probe production health twice
        id: probe
        shell: bash
        env:
          TARGET_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          : "${TARGET_URL:?PRODUCTION_HEALTHCHECK_URL is required}"
          case "$TARGET_URL" in
            https://*) ;;
            *) echo "Production health target must use HTTPS." >&2; exit 2 ;;
          esac

          last_status=000
          for attempt in 1 2; do
            last_status="$(curl               --silent               --show-error               --output /dev/null               --write-out '%{http_code}'               --connect-timeout 10               --max-time 20               "$TARGET_URL" || true)"
            if [ "$last_status" = "200" ]; then
              echo "unhealthy=false" >> "$GITHUB_OUTPUT"
              echo "status_code=$last_status" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" -eq 2 ] || sleep 20
          done

          echo "unhealthy=true" >> "$GITHUB_OUTPUT"
          echo "status_code=$last_status" >> "$GITHUB_OUTPUT"

      - name: Build and validate sanitized health incident
        if: steps.probe.outputs.unhealthy == 'true'
        shell: bash
        env:
          TARGET_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
          STATUS_CODE: ${{ steps.probe.outputs.status_code }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from urllib.parse import urlsplit

          target = urlsplit(os.environ["TARGET_URL"])
          path = target.path or "/health/ready/"
          status = os.environ.get("STATUS_CODE", "000")
          try:
              status_code = int(status)
          except ValueError:
              status_code = 503
          if status_code < 100 or status_code > 599:
              status_code = 503

          basis = f"scheduled-health|production|GET|{target.hostname or ''}|{path}"
          incident = {
              "schema_version": 1,
              "source": "scheduled-health",
              "environment": "production",
              "severity": "critical",
              "fingerprint": hashlib.sha256(basis.encode()).hexdigest()[:24],
              "release_sha": "unknown",
              "occurred_at": datetime.now(UTC).isoformat(),
              "event": {
                  "status_code": status_code,
                  "method": "GET",
                  "path": path,
                  "correlation_reference": "",
                  "exception_type": "HealthCheckFailure",
                  "frames": [],
              },
          }
          with open("/tmp/incident-raw.json", "w", encoding="utf-8") as handle:
              json.dump(incident, handle)
          PY

          python scripts/incident/validate_incident.py             --input /tmp/incident-raw.json             --output /tmp/incident.json

      - name: Dispatch production incident to GitHub response workflow
        if: steps.probe.outputs.unhealthy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -c '{event_type:"production_incident",client_payload:.}' /tmp/incident.json)"
          curl             --fail             --silent             --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2026-03-10"             --header "Content-Type: application/json"             --data "$payload"             "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches"
