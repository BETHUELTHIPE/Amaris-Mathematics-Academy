name: Provision independent staging CodeBuild projects
on:
  push:
    branches: [ops/aws-selective-bluegreen-20261127]
    paths: [.github/workflows/aws-staging-codebuild.yml, deploy/aws/blue-green/codebuild-projects.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: amaris-staging-codebuild
  cancel-in-progress: false
jobs:
  provision:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-selective-bluegreen-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE != ''
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Provision projects only and verify private artifact storage
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 110156539003 ]]
          template=deploy/aws/blue-green/codebuild-projects.yml
          aws cloudformation validate-template --template-body "file://$template" >/dev/null
          aws cloudformation deploy --stack-name amaris-staging-codebuild --template-file "$template" --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset
          aws codebuild batch-get-projects --names amaris-staging-frontend amaris-staging-backend --output json | jq -e '
            (.projects | length)==2 and
            (.projectsNotFound | length)==0 and
            all(.projects[]; .environment.type=="ARM_CONTAINER" and .source.type=="S3" and .concurrentBuildLimit==1 and .artifacts.type=="S3" and (.webhook==null))' >/dev/null
          bucket=amaris-staging-build-artifacts-110156539003-eu-north-1
          aws s3api get-public-access-block --bucket "$bucket" --query PublicAccessBlockConfiguration --output json | jq -e 'all(.[]; .==true)' >/dev/null
          aws s3api get-bucket-encryption --bucket "$bucket" --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' --output text | grep -qx AES256
          echo 'PASS: two ARM64 CodeBuild projects and private encrypted artifact storage verified.'
          echo 'No build started, no ECR publication, no ECS deployment or traffic shift.'
