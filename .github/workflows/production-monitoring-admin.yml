name: Production monitoring admin checks

on:
  push:
    branches: [production-release-20260923]
    paths:
      - backend/amaris_cms/monitoring_admin.py
      - backend/amaris_cms/monitoring_status.py
      - backend/amaris_cms/admin_config.py
      - backend/templates/admin/amaris_*
      - backend/tests/test_monitoring_admin.py
      - .github/workflows/production-monitoring-admin.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring:
    if: github.ref == 'refs/heads/production-release-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: "true"
      SUPABASE_DATABASE_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Check monitoring formatting and lint
        run: |
          black --check backend/amaris_cms/monitoring_admin.py backend/tests/test_monitoring_admin.py
          ruff check backend/amaris_cms/monitoring_admin.py backend/tests/test_monitoring_admin.py
      - name: Verify superuser navigation and read-only query gateway
        working-directory: backend
        run: python manage.py test tests.test_monitoring_admin --verbosity 2
