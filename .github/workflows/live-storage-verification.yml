name: Live Storage Verification

on:
  push:
    branches: [render-live-current-20260918]
    paths:
      - "frontend/app/documents/**"
      - "frontend/lib/student-storage.ts"
      - "frontend/tests/student-storage.test.mjs"
      - "frontend/supabase/storage/**"
      - "backend/amaris_cms/settings.py"
      - "backend/content/payment_models.py"
      - "backend/content/services/invoices.py"
      - "backend/content/services/payments.py"
      - "backend/content/tasks.py"
      - "backend/content/test_invoice_archive.py"
      - "backend/content/migrations/**"
      - "backend/requirements.txt"
      - "backend/.env.example"
      - "render.yaml"
      - ".github/workflows/live-storage-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-storage:
    name: Frontend storage type and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Render build-only dependencies
        run: npm install --no-save nitro @tailwindcss/vite@4.3.3
      - name: TypeScript checks
        run: npm run typecheck
      - name: Student storage unit checks
        run: node --test tests/student-storage.test.mjs

  backend-storage:
    name: Django Supabase storage configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Django system check with local storage fallback
        env:
          DJANGO_DEBUG: "true"
        run: python manage.py check
      - name: Verify Supabase S3 storage settings
        env:
          DJANGO_DEBUG: "true"
          SUPABASE_URL: https://epkcuseloinygkakxxdu.supabase.co
          SUPABASE_STORAGE_ENABLED: "true"
          SUPABASE_STORAGE_BUCKET_NAME: amaris-cms-files
          SUPABASE_STUDENT_DOCUMENTS_BUCKET_NAME: Amaris Mathematics Academy
          SUPABASE_STORAGE_S3_ENDPOINT: https://epkcuseloinygkakxxdu.storage.supabase.co/storage/v1/s3
          SUPABASE_STORAGE_S3_REGION: us-east-1
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: synthetic-ci-access-key
          SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: synthetic-ci-secret-key
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "amaris_cms.settings")
          import django
          django.setup()
          from django.conf import settings

          storage = settings.STORAGES["default"]
          assert storage["BACKEND"] == "storages.backends.s3.S3Storage"
          options = storage["OPTIONS"]
          assert options["bucket_name"] == "amaris-cms-files"
          assert options["endpoint_url"] == "https://epkcuseloinygkakxxdu.storage.supabase.co/storage/v1/s3"
          assert options["region_name"] == "us-east-1"
          assert options["addressing_style"] == "path"
          assert options["location"] == "cms"
          assert options["querystring_auth"] is True

          student_storage = settings.STORAGES["student_documents"]
          assert student_storage["BACKEND"] == "storages.backends.s3.S3Storage"
          student_options = student_storage["OPTIONS"]
          assert student_options["bucket_name"] == "Amaris Mathematics Academy"
          assert student_options["file_overwrite"] is True
          assert student_options["endpoint_url"] == "https://epkcuseloinygkakxxdu.storage.supabase.co/storage/v1/s3"
          print("Supabase S3 storage configuration validated.")
          PY
      - name: Invoice archive migration and tests
        env:
          DJANGO_DEBUG: "true"
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test content.test_invoice_archive
