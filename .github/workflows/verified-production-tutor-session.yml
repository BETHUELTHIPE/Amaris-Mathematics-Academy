name: Verified Production Tutor Session

on:
  # One-time, no-write protected acceptance attempt. Remove the push trigger after the run.
  push:
    branches: [main]
    paths: ['.github/workflows/verified-production-tutor-session.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-test-tutor-session:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: tutor-production-verification
    env:
      AMARIS_LIVE_TEST_TUTOR_EMAIL: ${{ secrets.AMARIS_LIVE_TEST_TUTOR_EMAIL }}
      AMARIS_LIVE_TEST_TUTOR_PASSWORD: ${{ secrets.AMARIS_LIVE_TEST_TUTOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: frontend/e2e/requirements.txt
      - name: Require credentials for a dedicated approved test tutor
        shell: bash
        run: |
          test -n "$AMARIS_LIVE_TEST_TUTOR_EMAIL" || { echo "::error::Missing test-only tutor email in protected tutor-production-verification environment"; exit 1; }
          test -n "$AMARIS_LIVE_TEST_TUTOR_PASSWORD" || { echo "::error::Missing test-only tutor password in protected tutor-production-verification environment"; exit 1; }
      - name: Install isolated Playwright Chromium
        run: |
          python -m pip install -r frontend/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Confirm live tutor login and persisted authorized dashboard
        run: python -u frontend/e2e/live_tutor_dashboard_acceptance.py
