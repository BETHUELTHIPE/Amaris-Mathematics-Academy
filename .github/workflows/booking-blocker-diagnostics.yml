name: Diagnose and fix booking release blockers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/booking-blocker-diagnostics.yml
      - scripts/release/booking_acceptance_settings.py
      - scripts/release/booking_callback_diagnostics.py
      - scripts/release/current_booking_gateway_verify.py
concurrency:
  group: current-all-booking-acceptance
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  authentic-sandbox-itn:
    if: >-
      github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/main' && github.event.before == 'db791747f3e1a8650ee48a09a0a14edff49d7a55' && contains(github.event.head_commit.message, '[VERIFY_ITN_WIRE:ffbcc7de]')
    environment: staging
    name: Eight real sandbox wallets and provider callbacks; isolated database
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amaris_itn
          POSTGRES_DB: amaris_itn
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U amaris_itn -d amaris_itn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: booking_acceptance_settings
      CELERY_BROKER_URL: "redis://127.0.0.1:6379/0"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/1"
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "synthetic-payfast-itn-acceptance-only"
      DJANGO_ALLOWED_HOSTS: ".trycloudflare.com,localhost,127.0.0.1"
      DATABASE_URL: "postgresql://amaris_itn@127.0.0.1:5432/amaris_itn"
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      SUPABASE_S3_REQUIRED: "false"
      PAYFAST_MODE: "sandbox"
      PAYFAST_ENV: "sandbox"
      PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_ID }}
      PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_KEY }}
      PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_SANDBOX_PASSPHRASE }}
      EMAIL_BACKEND: "django.core.mail.backends.filebased.EmailBackend"
      EMAIL_FILE_PATH: "/tmp/amaris-staging-mail"
      DEFAULT_FROM_EMAIL: "Amaris Sandbox <test@example.invalid>"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ffbcc7de4313b74f0845af6de9ebfac5ed72dc3d
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verification-harness
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fail closed unless this is isolated sandbox-only
        shell: bash
        run: |
          set -euo pipefail
          test "$PAYFAST_MODE" = sandbox
          test "$PAYFAST_ENV" = sandbox
          test "$SUPABASE_DATABASE_REQUIRED" = false
          test "$DATABASE_URL" = "postgresql://amaris_itn@127.0.0.1:5432/amaris_itn"
          test -n "$PAYFAST_MERCHANT_ID"
          test -n "$PAYFAST_MERCHANT_KEY"
          echo "ISOLATION_GATE=PASS"
      - name: Install isolated Django and browser
        run: |
          python -m pip install -r backend/requirements.txt >/dev/null
          mkdir -p /tmp/amaris-staging-mail /tmp/itn-playwright
          cd /tmp/itn-playwright
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start isolated Django and public HTTPS callback
        shell: bash
        run: |
          set -euo pipefail
          cp verification-harness/scripts/release/booking_acceptance_settings.py backend/
          cp verification-harness/scripts/release/booking_callback_diagnostics.py backend/
          cd backend
          python manage.py migrate --noinput >/dev/null
          python manage.py check
          python manage.py test --noinput --verbosity=1 content.test_payfast_itn_wire content.test_payments content.test_payfast_security content.test_payfast_configuration content.test_live_classes content.test_video_requests content.test_tutor_finance content.test_tutor_dashboard content.test_student_api content.test_invoice_archive content.test_booking_migration
          celery -A amaris_cms worker --loglevel=WARNING --queues=critical,default,notifications --concurrency=2 --hostname=acceptance@%h > /tmp/amaris-ci-worker.log 2>&1 &
          echo $! > /tmp/amaris-ci-worker.pid
          celery -A amaris_cms beat --loglevel=WARNING --pidfile=/tmp/amaris-ci-beat.pid --schedule=/tmp/amaris-ci-beat-schedule > /tmp/amaris-ci-beat.log 2>&1 &
          echo $! > /tmp/amaris-ci-beat-process.pid
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/amaris-itn-server.log 2>&1 &
          echo $! > /tmp/amaris-itn-server.pid
          for i in $(seq 1 45); do
            if curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/ready/ >/dev/null;then break;fi
            sleep 1
          done
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/ready/ >/dev/null
          curl -fLsS --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > /tmp/amaris-cloudflared.log 2>&1 &
          echo $! > /tmp/amaris-cloudflared.pid
          python - <<'PY'
          import pathlib, re, time
          log=pathlib.Path('/tmp/amaris-cloudflared.log')
          for attempt in range(45):
              value=log.read_text(errors='replace') if log.exists() else ''
              result=re.search(r'https://[a-z0-9-]+\.trycloudflare\.com',value)
              if result:
                  pathlib.Path('/tmp/amaris-itn-host').write_text(result.group(0))
                  print('HTTPS_CALLBACK_TUNNEL=READY')
                  break
              time.sleep(1)
          else:raise SystemExit('HTTPS_CALLBACK_TUNNEL=UNAVAILABLE')
          PY
          origin="$(cat /tmp/amaris-itn-host)"
          # Quick Tunnel names take time to publish through public DNS.
          # Never post PayFast payments to a hostname that cannot be resolved.
          python - <<'PY'
          import pathlib, socket, time, urllib.parse
          value=pathlib.Path('/tmp/amaris-itn-host').read_text()
          host=urllib.parse.urlparse(value).hostname
          for i in range(55):
              try:
                  socket.getaddrinfo(host,443)
                  print('HTTPS_CALLBACK_PUBLIC_DNS=PASS')
                  break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit('HTTPS_CALLBACK_PUBLIC_DNS=UNAVAILABLE')
          PY
          for attempt in $(seq 1 12); do
            if curl -fLsS --max-time 12 "$origin/health/ready/" >/dev/null;then
              echo "EXTERNAL_ISOLATED_DJANGO_HEALTH=PASS"
              break
            fi
            if [ "$attempt" -eq 12 ];then echo "EXTERNAL_ISOLATED_DJANGO_HEALTH=FAILED";exit 1;fi
            sleep 4
          done
      - name: Generate eight real signed service checkouts
        shell: bash
        run: |
          set -euo pipefail
          origin="$(cat /tmp/amaris-itn-host)"
          export PAYFAST_NOTIFY_URL="$origin/api/v1/payfast/itn/"
          export PUBLIC_SITE_URL="$origin"
          export PUBLIC_API_URL="$origin"
          cd backend
          python manage.py shell -c 'exec(open("../verification-harness/scripts/release/current_booking_gateway_matrix.py").read())'
      - name: Complete eight genuine sandbox wallet payments
        shell: bash
        run: |
          export ACCEPTANCE_REPO="$GITHUB_WORKSPACE"
          cd /tmp/itn-playwright
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          import {spawn} from 'node:child_process';
          import path from 'node:path';
          const checkouts=JSON.parse(fs.readFileSync('/tmp/amaris-all-payfast-bookings.json','utf8'));
          assert.equal(checkouts.length,8);
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try {
            for(const item of checkouts) {
              assert.equal(item.url,'https://sandbox.payfast.co.za/eng/process');
              const page=await browser.newPage();
              {
                const esc=x=>String(x).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;');
                const hidden=Object.entries(item.fields).map(([k,v])=>'<input type="hidden" name="'+esc(k)+'" value="'+esc(v)+'">').join('');
                await page.setContent('<form method="post" action="'+item.url+'">'+hidden+'<button id="pay">Pay test wallet</button></form>');
                await page.locator('#pay').click();
                await page.waitForURL(u=>u.hostname==='sandbox.payfast.co.za',{timeout:45000});
                await page.getByText('Complete Payment',{exact:true}).waitFor({timeout:40000});
                await page.getByText('Complete Payment',{exact:true}).click();
                await page.getByText('Your payment was successful!',{exact:false}).waitFor({timeout:70000});
                console.log('PASS genuine sandbox wallet: '+item.kind);
              }
              // Keep provider pages alive while genuine asynchronous callbacks complete.
            }
            const status=await new Promise((resolve,reject)=>{
              const child=spawn('python',['manage.py','shell','-c','exec(open("../verification-harness/scripts/release/current_booking_gateway_verify.py").read())'],{cwd:path.join(process.env.ACCEPTANCE_REPO,'backend'),stdio:'inherit',timeout:420000});
              child.once('error',reject);
              child.once('close',resolve);
            });
            assert.equal(status,0,'Actual provider settlement or autonomous PDF receipt delivery failed');
          } finally {await browser.close();}
          NODE
      - name: Safe callback diagnostics, including failed payments
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("/tmp/amaris-safe-callbacks.jsonl")
          lines=path.read_text().splitlines() if path.exists() else []
          print("OBSERVED_PROVIDER_CALLBACKS="+str(len(lines)))
          for line in lines[:100]:print("SAFE_CALLBACK="+line)
          PY
      - name: Stop isolated services
        if: always()
        shell: bash
        run: |
          for file in /tmp/amaris-itn-server.pid /tmp/amaris-cloudflared.pid /tmp/amaris-ci-worker.pid /tmp/amaris-ci-beat-process.pid; do
            if [ -f "$file" ];then kill "$(cat "$file")" 2>/dev/null || true;fi
          done

  deployed-staging-prerequisites:
    if: >-
      github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/main' && github.event.before == 'db791747f3e1a8650ee48a09a0a14edff49d7a55' && contains(github.event.head_commit.message, '[VERIFY_ITN_WIRE:ffbcc7de]')
    name: Real staging configuration, SMTP and asynchronous delivery prerequisites
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read only staging configuration and test SMTP TLS authentication without sending email
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, smtplib, ssl, urllib.error, urllib.request
          from urllib.parse import urlparse
          
          KEY=os.environ.get("RENDER_API_KEY","")
          if not KEY:
              raise SystemExit("BLOCK: protected Render read-only preflight credential unavailable")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          def render(path):
              req=urllib.request.Request("https://api.render.com/v1"+path,headers={"Authorization":"Bearer "+KEY,"Accept":"application/json"})
              try:
                  with opener.open(req,timeout=20) as res:return json.load(res)
              except urllib.error.HTTPError as exc:raise SystemExit(f"BLOCK: staging configuration read HTTP {exc.code}; body suppressed") from None
              except Exception as exc:raise SystemExit("BLOCK: staging configuration read "+type(exc).__name__) from None
          service=render("/services/srv-dam2iivcgkoc7383tq50")
          assert service.get("ownerId")=="tea-csppi8l6l47c73dk9c90"
          assert service.get("branch")=="ops/staging-known-good-af8709c-20261019"
          values={}
          cursor=""
          for _ in range(5):
              rows=render("/services/srv-dam2iivcgkoc7383tq50/env-vars?limit=100"+("&cursor="+cursor if cursor else ""))
              for row in rows:
                  var=row.get("envVar",row)
                  values[var["key"]]=var.get("value","")
              if len(rows)<100:break
              cursor=rows[-1].get("cursor","")
              if not cursor:raise SystemExit("BLOCK: staging configuration pagination unavailable")
          else:raise SystemExit("BLOCK: staging configuration exceeds bounded read")
          failures=[]
          def check(label,ok):
              print(("PASS " if ok else "BLOCK ")+label,flush=True)
              if not ok:failures.append(label)
          db=values.get("DATABASE_URL","")
          parsed=urlparse(db)
          check("staging database isolated from production", "atyhhjwwxgzeurnwayay" in ((parsed.username or "")+" "+(parsed.hostname or "")) and "epkcuseloinygkakxxdu" not in db)
          check("staging Supabase Auth binding",values.get("SUPABASE_URL","").rstrip("/")=="https://atyhhjwwxgzeurnwayay.supabase.co")
          mode=(values.get("PAYFAST_MODE") or values.get("PAYFAST_ENV") or "").lower()
          check("deployed staging PayFast sandbox mode",mode=="sandbox")
          check("deployed staging PayFast merchant credentials present",bool(values.get("PAYFAST_MERCHANT_ID") and values.get("PAYFAST_MERCHANT_KEY")))
          production_rows=render("/services/srv-dapn6b3tqb8s73d3r7n0/env-vars?limit=100")
          production_values={r.get("envVar",r).get("key"):r.get("envVar",r).get("value","") for r in production_rows}
          stage_broker=values.get("CELERY_BROKER_URL","")
          production_broker=production_values.get("CELERY_BROKER_URL","")
          def broker_identity(value):
              p=urlparse(value)
              return (p.scheme,p.hostname,p.port or 6379,p.path or "/0")
          check("explicit staging Celery broker configured",bool(stage_broker))
          check("staging broker separate from production",bool(stage_broker and production_broker) and broker_identity(stage_broker)!=broker_identity(production_broker))
          host=values.get("EMAIL_HOST","")
          user=values.get("EMAIL_HOST_USER") or values.get("GMAIL_USER") or values.get("GMAIL_EMAIL","")
          password=values.get("EMAIL_HOST_PASSWORD") or values.get("GMAIL_APP_PASSWORD","")
          smtp_ready=bool(host and user and password)
          check("deployed staging SMTP host, user and password present",smtp_ready)
          if smtp_ready:
              try:
                  port=int(values.get("EMAIL_PORT","587"))
                  if host not in ("smtp.gmail.com","smtp.googlemail.com") or port not in (465,587):
                      check("configured SMTP provider can be safely tested",False)
                  else:
                      if port==465:
                          smtp=smtplib.SMTP_SSL(host,port,timeout=15,context=ssl.create_default_context())
                      else:
                          smtp=smtplib.SMTP(host,port,timeout=15)
                          smtp.ehlo();smtp.starttls(context=ssl.create_default_context());smtp.ehlo()
                      with smtp:smtp.login(user,password)
                      check("real staging SMTP TLS authentication (no email sent)",True)
              except Exception as exc:
                  print("SMTP diagnostic class: "+type(exc).__name__,flush=True)
                  check("real staging SMTP TLS authentication (no email sent)",False)
          rows=render("/services?ownerId=tea-csppi8l6l47c73dk9c90&limit=100")
          services=[r.get("service",r) for r in rows]
          workers=[s for s in services if s.get("type")=="background_worker" and s.get("suspended")=="not_suspended" and "staging" in s.get("name","").lower() and "Amaris-Mathematics-Academy" in s.get("repo","")]
          commands=[s.get("serviceDetails",{}).get("envSpecificDetails",{}).get("startCommand","") or s.get("serviceDetails",{}).get("envSpecificDetails",{}).get("dockerCommand","") for s in workers]
          check("staging notifications worker configured",any("notifications" in c for c in commands))
          check("staging critical worker configured",any("critical" in c for c in commands))
          check("staging scheduler configured",any("celery" in c and "beat" in c for c in commands))
          for path,expected in (("/health/ready/",200),("/api/v1/payfast/itn/",405)):
              try:
                  with opener.open("https://amaris-mathematics-academy-staging.onrender.com"+path,timeout=30) as res:status=res.status
              except urllib.error.HTTPError as exc:status=exc.code
              except Exception:status=0
              check("deployed staging "+path+" HTTP "+str(expected),status==expected)
          print("NOT VERIFIED confirmed staging student checkout, real staging provider ITN, private invoice archive, Gmail attachment or automatic reminder")
          if failures:raise SystemExit("BLOCK: live staging release prerequisites failed: "+", ".join(failures))
          PY

  approved-staging-student:
    if: >-
      github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/main' && github.event.before == 'db791747f3e1a8650ee48a09a0a14edff49d7a55' && contains(github.event.head_commit.message, '[VERIFY_ITN_WIRE:ffbcc7de]')
    name: Real approved staging student authentication
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Confirm real student login without creating a booking or payment
        env:
          STAGING_TEST_STUDENT_EMAIL: ${{ secrets.STAGING_TEST_STUDENT_EMAIL }}
          STAGING_TEST_STUDENT_PASSWORD: ${{ secrets.STAGING_TEST_STUDENT_PASSWORD }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.error,urllib.request
          keys=("STAGING_TEST_STUDENT_EMAIL","STAGING_TEST_STUDENT_PASSWORD","STAGING_SUPABASE_PUBLISHABLE_KEY")
          missing=[k for k in keys if not os.environ.get(k)]
          if missing:raise SystemExit("BLOCK: missing protected staging keys: "+", ".join(missing))
          email=os.environ[keys[0]].strip().lower()
          print("STUDENT_SECRET_EMAIL_SYNTAX_VALID="+str(bool(re.fullmatch(r"[^\s@]+@[^\s@]+\.[^\s@]+",email))))
          print("STUDENT_SECRET_MATCHES_APPROVED_TUTOR="+str(email=="bethuelmoukangwe30@gmail.com"))
          if hashlib.sha256(email.encode()).hexdigest()!="dff017c2f812483ad01fbb1988d70e420ffd574b53b88c51a1c97d6a4f314d8d":
              raise SystemExit("BLOCK: dedicated approved staging test-student identity mismatch")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect)
          key=os.environ[keys[2]]
          try:
              request=urllib.request.Request("https://atyhhjwwxgzeurnwayay.supabase.co/auth/v1/token?grant_type=password",data=json.dumps({"email":email,"password":os.environ[keys[1]]}).encode(),headers={"apikey":key,"Content-Type":"application/json"})
              with opener.open(request,timeout=25) as response:payload=json.load(response)
              user=payload.get("user") or {}
              if str(user.get("email","")).lower()!=email or not user.get("email_confirmed_at") or not payload.get("access_token"):
                  raise SystemExit("BLOCK: staging test student is not confirmed or identity does not match")
              request=urllib.request.Request("https://amaris-mathematics-academy-staging.onrender.com/api/v1/student/dashboard/",headers={"Authorization":"Bearer "+payload["access_token"],"Accept":"application/json"})
              with opener.open(request,timeout=30) as response:
                  if response.status!=200 or "public" in response.headers.get("Cache-Control","").lower():
                      raise SystemExit("BLOCK: private staging student dashboard response rejected")
                  if not isinstance(json.load(response),dict):raise SystemExit("BLOCK: unexpected private student dashboard response")
              print("PASS approved staging student real Supabase login and private Django dashboard; no orders created")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"BLOCK: approved staging student auth/API HTTP {exc.code}; response body suppressed") from None
          except (urllib.error.URLError,TimeoutError):
              raise SystemExit("BLOCK: staging student Auth/API unavailable") from None
          PY
