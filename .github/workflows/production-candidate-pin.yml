name: Production Candidate Pin

on:
  workflow_run:
    workflows: ["Quality Gates and Release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: production-candidate-pin
  cancel-in-progress: false

jobs:
  pin:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'production-20260922'
    runs-on: ubuntu-latest
    steps:
      - name: Capture verified release SHA
        id: release
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: production-20260922
          fetch-depth: 0
      - name: Refuse to pin a stale candidate
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          if [ "$current" != "$VERIFIED_SHA" ]; then
            echo "Branch advanced from verified SHA $VERIFIED_SHA to $current; skipping stale pin."
            exit 78
          fi
      - name: Verify immutable Docker image exists
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.release.outputs.sha }}
          IMAGE: docker.io/bethuelm/amaris-mathematics-academy
        run: |
          set -euo pipefail
          docker manifest inspect "$IMAGE:$VERIFIED_SHA" >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pin all production services to verified image
        env:
          VERIFIED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("render.yaml")
          text = path.read_text(encoding="utf-8")
          sha = os.environ["VERIFIED_SHA"]
          pattern = r"(docker\.io/bethuelm/amaris-mathematics-academy:)[0-9a-f]{40}"
          updated, count = re.subn(pattern, rf"\g<1>{sha}", text)
          if count != 4:
              raise SystemExit(f"expected to pin 4 production image refs, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY
      - name: Validate pinned blueprint before committing
        run: |
          python -m pip install --disable-pip-version-check check-jsonschema==0.33.3
          check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml
          python - <<'PY'
          import os, pathlib, re
          text = pathlib.Path("render.yaml").read_text(encoding="utf-8")
          sha = os.environ.get("VERIFIED_SHA", "")
          refs = re.findall(r"docker\.io/bethuelm/amaris-mathematics-academy:([0-9a-f]{40})", text)
          assert len(refs) == 4 and len(set(refs)) == 1
          assert "latest" not in text
          assert "https://amaris-mathematics-academy-live-students.onrender.com" in text
          print("Pinned production blueprint validated.")
          PY
        env:
          VERIFIED_SHA: ${{ steps.release.outputs.sha }}
      - name: Commit immutable production pin
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- render.yaml; then
            echo "render.yaml already pins $VERIFIED_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render.yaml
          git commit -m "chore: pin production image $VERIFIED_SHA [skip ci]"
          git push origin HEAD:production-20260922
