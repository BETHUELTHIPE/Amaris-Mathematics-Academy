name: Staging Verified Invoice Delivery Acceptance

on:
  pull_request:
    branches: [feature/student-receipt-delivery-clean-20261017]
    paths:
      - backend/scripts/staging_invoice_acceptance.py
      - .github/workflows/staging-invoice-delivery-acceptance.yml
  push:
    branches: [staging]
    paths:
      - backend/scripts/staging_invoice_acceptance.py
      - .github/workflows/staging-invoice-delivery-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-invoice-acceptance
  cancel-in-progress: false

jobs:
  no-secrets-preflight:
    name: Syntax and scope guard check (no secrets/email)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate acceptance syntax and gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/staging_invoice_acceptance.py
          python backend/scripts/staging_invoice_acceptance.py --syntax-only
          python - <<'PY'
          from pathlib import Path
          source = Path("backend/scripts/staging_invoice_acceptance.py").read_text()
          for expected in (
              'PRODUCTION_PROJECT_REF = "epkcuseloinygkakxxdu"',
              "STAGING_VERIFIED_PAYMENT_REFERENCE",
              "STAGING_GMAIL_IMAP_APP_PASSWORD",
              'payment__gateway_verified_at__isnull=False',
              'payment__verification_source="payfast_server_verification"',
              "ensure_anonymous_denied",
              "fetch_invoice_as_student",
              "sha(downloaded) != sha(archived)",
              "sha(attachment) != expected_digest",
          ):
              assert expected in source, expected
          print("STAGING_RECEIPT_SCOPE_GUARDS=PASS")
          PY

  staging-real-receipt:
    name: Real staging SMTP / Gmail / Supabase / student invoice
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 16
    defaults:
      run:
        working-directory: backend
    env:
      STAGING_RECEIPT_ACCEPTANCE_ENABLED: ${{ secrets.STAGING_RECEIPT_ACCEPTANCE_ENABLED }}
      STAGING_VERIFIED_PAYMENT_REFERENCE: ${{ secrets.STAGING_VERIFIED_PAYMENT_REFERENCE }}
      STAGING_API_BASE_URL: https://amaris-mathematics-academy-staging.onrender.com
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_TEST_STUDENT_EMAIL: bethuelmoukangwe8@gmail.com
      STAGING_TEST_STUDENT_PASSWORD: ${{ secrets.STAGING_TEST_STUDENT_PASSWORD }}
      STAGING_GMAIL_IMAP_USER: bethuelmoukangwe8@gmail.com
      STAGING_GMAIL_IMAP_APP_PASSWORD: ${{ secrets.STAGING_GMAIL_IMAP_APP_PASSWORD }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DATABASE_SSL_REQUIRED: "true"
      SUPABASE_DATABASE_REQUIRED: "false"
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_S3_REQUIRED: "true"
      SUPABASE_S3_ENDPOINT_URL: ${{ secrets.STAGING_SUPABASE_S3_ENDPOINT_URL }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.STAGING_SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_SUPABASE_S3_SECRET_ACCESS_KEY }}
      SUPABASE_S3_ADMIN_BUCKET: ${{ secrets.STAGING_SUPABASE_S3_ADMIN_BUCKET }}
      SUPABASE_S3_STUDENT_BUCKET: ${{ secrets.STAGING_SUPABASE_S3_STUDENT_BUCKET }}
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${{ secrets.STAGING_SMTP_HOST }}
      EMAIL_PORT: ${{ secrets.STAGING_SMTP_PORT }}
      EMAIL_HOST_USER: ${{ secrets.STAGING_SMTP_USERNAME }}
      EMAIL_HOST_PASSWORD: ${{ secrets.STAGING_SMTP_PASSWORD }}
      EMAIL_USE_TLS: "true"
      DEFAULT_FROM_EMAIL: ${{ secrets.STAGING_SMTP_FROM_EMAIL }}
      PAYFAST_ENV: sandbox
      PAYFAST_MODE: sandbox
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${{ secrets.STAGING_DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Preflight: isolated staging resources and genuine sandbox payment
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_RECEIPT_ACCEPTANCE_ENABLED" = "true" || { echo "::error::Staging email acceptance not enabled"; exit 1; }
          test -n "$STAGING_SUPABASE_PROJECT_REF" && test "$STAGING_SUPABASE_PROJECT_REF" != "epkcuseloinygkakxxdu" || { echo "::error::Separate Supabase staging project required"; exit 1; }
          test -n "$STAGING_VERIFIED_PAYMENT_REFERENCE" || { echo "::error::Verified PayFast sandbox payment reference missing"; exit 1; }
          test -n "$STAGING_GMAIL_IMAP_APP_PASSWORD" || { echo "::error::Protected Gmail acceptance inbox credentials missing"; exit 1; }
          test -n "$STAGING_SMTP_PASSWORD" && test -n "$STAGING_SUPABASE_S3_SECRET_ACCESS_KEY" || { echo "::error::Staging SMTP or S3 secrets missing"; exit 1; }
          test -n "$STAGING_TEST_STUDENT_PASSWORD" || { echo "::error::Dedicated staging test-student password missing"; exit 1; }
          echo "STAGING_PRELIGHT_GUARDS=PASS"
      - name: Install locked Django requirements
        run: python -m pip install -r requirements.txt
      - name: Verify SMTP -> Gmail inbox and Supabase -> authenticated student download
        run: python scripts/staging_invoice_acceptance.py
      - name: Publish digest-only acceptance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-staging-invoice-acceptance
          path: /tmp/amaris-staging-invoice-acceptance.json
          if-no-files-found: error
          retention-days: 7
