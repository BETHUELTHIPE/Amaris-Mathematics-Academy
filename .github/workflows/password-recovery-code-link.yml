name: Amaris Password Recovery Code & Link Acceptance
on:
  push:
    branches:
      - fix/password-recovery-code-and-link-20261026
    paths:
      - "frontend/app/auth/**"
      - "frontend/app/forgot-password/**"
      - "frontend/app/reset-password/**"
      - "frontend/email-templates/recovery.html"
      - "frontend/proxy.ts"
      - "frontend/tests/password-recovery.test.mjs"
      - "frontend/tests/registration-actions.test.mjs"
      - "scripts/configure_supabase_auth_otp.py"
      - "tests/test_configure_supabase_auth_otp.py"
      - ".github/workflows/password-recovery-code-link.yml"
permissions:
  contents: read
jobs:
  recovery-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Offline Supabase Auth configuration and template checks
        run: python -m unittest discover -s tests -p test_configure_supabase_auth_otp.py -v
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Check types and recovery safety
        working-directory: frontend
        run: npm run typecheck
      - name: Recovery and authentication regression tests
        working-directory: frontend
        run: node --test tests/password-recovery.test.mjs tests/registration-actions.test.mjs tests/universal-email-verification.test.mjs tests/google-registration.test.mjs tests/tutor-applications.test.mjs
