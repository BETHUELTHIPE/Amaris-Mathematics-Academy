name: Ruff Fix Verification

on:
  push:
    branches:
      - test/real-integration-boundaries-20260914

permissions:
  contents: write

jobs:
  ruff-fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact linter
        run: python -m pip install ruff==0.16.6
      - name: Apply exact Ruff fix
        run: ruff check --fix load_tests/capacity_report.py
      - name: Commit linter-only change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- load_tests/capacity_report.py; then
            echo "File already matches Ruff 0.16.6."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add load_tests/capacity_report.py
          git commit -m "Apply Ruff fix to capacity report"
          git push origin HEAD:test/real-integration-boundaries-20260914
