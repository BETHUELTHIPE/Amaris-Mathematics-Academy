name: Stage verified Paystack test key in encrypted AWS parameter
on:
  push:
    branches: [ops/aws-paystack-staging-acceptance-20261127]
    paths: [.github/workflows/aws-paystack-staging-secret.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: amaris-paystack-test-secret
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-paystack-staging-acceptance-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE != ''
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Stage test key only after verified NAT acceptance
        env:
          PAYSTACK_TEST_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY || secrets.PAYSTACK_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46059136346" | jq -e '.head_sha == "6387afe63e6804ba4331fd9ce6a003756d13a8fa" and .conclusion == "success"' >/dev/null
          python -m pip install --quiet boto3
          python - <<'PY'
          import boto3, hmac, os
          from botocore.exceptions import ClientError
          account = "110156539003"
          assert boto3.client("sts").get_caller_identity()["Account"] == account
          key = os.environ.get("PAYSTACK_TEST_KEY", "").strip()
          if not key.startswith("sk_test_") or len(key) < 20:
              raise SystemExit("BLOCKED: valid-format test key required; refusing live keys.")
          ssm = boto3.client("ssm")
          name = "/amaris/aws-staging/paystack/test-secret-key"
          try:
              parameter = ssm.get_parameter(Name=name, WithDecryption=True)["Parameter"]
          except ssm.exceptions.ParameterNotFound:
              ssm.put_parameter(Name=name, Value=key, Type="SecureString", Tier="Standard", Overwrite=False,
                                Description="Amaris staging only: Paystack sandbox API key")
              parameter = ssm.get_parameter(Name=name, WithDecryption=True)["Parameter"]
          except ClientError:
              raise SystemExit("BLOCKED: cannot read staging parameter.")
          if parameter["Type"] != "SecureString" or parameter["ARN"].split(":")[4] != account or not hmac.compare_digest(parameter["Value"], key):
              raise SystemExit("BLOCKED: existing parameter differs; no overwrite performed.")
          print("PASS: staging test key encrypted in SSM and verified; no ECS deployment or live key change.")
          PY
