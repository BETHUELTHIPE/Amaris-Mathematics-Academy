name: Video Request Capacity 100k

on:
  push:
    branches: [feature/video-requests-100k-20261105]
    paths:
      - "backend/content/models.py"
      - "backend/content/services/video_requests.py"
      - "backend/content/video_request_views.py"
      - "backend/content/tasks.py"
      - "backend/content/test_video_request_capacity.py"
      - "backend/content/migrations/0017_video_request_capacity_indexes.py"
      - ".github/workflows/video-request-capacity-100k.yml"
  pull_request:
    paths:
      - "backend/content/models.py"
      - "backend/content/services/video_requests.py"
      - "backend/content/video_request_views.py"
      - "backend/content/tasks.py"
      - "backend/content/test_video_request_capacity.py"
      - "backend/content/migrations/0017_video_request_capacity_indexes.py"
      - ".github/workflows/video-request-capacity-100k.yml"

permissions:
  contents: read

concurrency:
  group: video-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-student-video-requests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_video_capacity_ci
          POSTGRES_USER: amaris_video_capacity_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_video_capacity_ci -d amaris_video_capacity_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_video_capacity_ci@127.0.0.1:5432/amaris_video_capacity_ci
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      SUPABASE_S3_REQUIRED: "false"
      PAYFAST_MODE: sandbox
      PAYFAST_ENV: sandbox
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: "Amaris QA <qa@example.invalid>"
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Validate formatting and lint
        working-directory: backend
        run: |
          python -m black --check --diff content/models.py content/services/video_requests.py content/video_request_views.py content/tasks.py content/test_video_request_capacity.py content/migrations/0017_video_request_capacity_indexes.py
          python -m ruff check content/models.py content/services/video_requests.py content/video_request_views.py content/tasks.py content/test_video_request_capacity.py content/migrations/0017_video_request_capacity_indexes.py
      - name: Verify schema and migration consistency
        working-directory: backend
        run: |
          export DJANGO_SECRET_KEY="$(openssl rand -hex 48)"
          python manage.py check
          python manage.py spectacular --file /tmp/amaris-video-api.yaml --validate --fail-on-warn
          python manage.py makemigrations --check --dry-run
      - name: Run video payment, authorization, idempotency, and 100k fixture
        working-directory: backend
        run: |
          export DJANGO_SECRET_KEY="$(openssl rand -hex 48)"
          python manage.py test content.test_video_requests content.test_video_request_capacity --verbosity 1 --noinput
