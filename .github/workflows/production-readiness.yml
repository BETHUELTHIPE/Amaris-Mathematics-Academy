name: Production Readiness Evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character Git SHA deployed to staging
        required: true
        type: string
      candidate_image:
        description: Exact immutable candidate image reference
        required: true
        type: string
      previous_image:
        description: Exact immutable previous staging image reference for rollback proof
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: amaris-production-readiness-evidence
  cancel-in-progress: false

jobs:
  staging-evidence:
    name: Staging production-readiness evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
      SMOKE_API_BASE_URL: ${{ vars.STAGING_API_URL }}
      HEALTHCHECK_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
      DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
      RESTORE_TEST_WEBHOOK_URL: ${{ secrets.STAGING_RESTORE_TEST_WEBHOOK_URL }}
      RESTORE_TEST_TOKEN: ${{ secrets.STAGING_RESTORE_TEST_TOKEN }}
      PROVIDER_TEST_WEBHOOK_URL: ${{ secrets.STAGING_PROVIDER_TEST_WEBHOOK_URL }}
      PROVIDER_TEST_TOKEN: ${{ secrets.STAGING_PROVIDER_TEST_TOKEN }}
      LOADTEST_ENVIRONMENT: staging
      LOADTEST_TARGET_URL: ${{ vars.STAGING_LOADTEST_URL }}
      LOADTEST_ALLOWED_HOSTS: ${{ vars.STAGING_LOADTEST_ALLOWED_HOSTS }}
      LOADTEST_ALLOW_PRODUCTION: "false"
      LOADTEST_ALLOW_LIVE_PAYFAST: "false"
      LOADTEST_PROFILE: smoke
      LOADTEST_AUTH_BEARER: ${{ secrets.STAGING_LOADTEST_AUTH_BEARER }}
      LOADTEST_COOKIE_HEADER: ${{ secrets.STAGING_LOADTEST_COOKIE_HEADER }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ inputs.candidate_sha }}'
          candidate='${{ inputs.candidate_image }}'
          previous='${{ inputs.previous_image }}'
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'candidate_sha must be a full 40-character Git SHA.' >&2; exit 1; }
          for image in "$candidate" "$previous"; do
            [[ -n "$image" ]] || { echo 'Image reference is required.' >&2; exit 1; }
            [[ "$image" != *':latest' ]] || { echo 'Mutable :latest images are not accepted as release evidence.' >&2; exit 1; }
          done
          [[ "$candidate" != "$previous" ]] || { echo 'Candidate and previous images must be different.' >&2; exit 1; }

      - name: Deploy exact candidate to staging
        run: scripts/release/promote.sh staging '${{ inputs.candidate_image }}'

      - name: Safe post-deployment smoke checks
        run: scripts/release/post-deploy-smoke.sh "$STAGING_URL"

      - name: TLS, security-header, and cache checks
        run: scripts/release/verify-edge-security.sh "$STAGING_URL" /dashboard

      - name: Provider sandbox and authentication delivery evidence
        run: scripts/release/provider-readiness.sh staging

      - name: Backup and isolated restore drill
        run: scripts/release/backup-restore-drill.sh staging

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-load.txt

      - name: Install controlled load-test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-load.txt

      - name: Performance smoke on staging only
        working-directory: backend
        run: ./load_tests/run.sh

      - name: Rollback to previous image and restore candidate
        run: scripts/release/rollback-drill.sh staging '${{ inputs.previous_image }}' '${{ inputs.candidate_image }}'

      - name: Re-run smoke checks after rollback recovery
        run: scripts/release/post-deploy-smoke.sh "$STAGING_URL"

      - name: Record release evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/production-readiness
          cat > artifacts/production-readiness/release-identity.txt <<EOF
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          evidence_git_sha=${GITHUB_SHA}
          candidate_git_sha=${{ inputs.candidate_sha }}
          candidate_image=${{ inputs.candidate_image }}
          previous_image=${{ inputs.previous_image }}
          staging_url=${STAGING_URL}
          EOF
          if [ -d backend/load_tests/results ]; then
            cp -R backend/load_tests/results artifacts/production-readiness/load-tests
          fi

      - name: Upload production-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-evidence-${{ github.run_id }}
          path: artifacts/production-readiness/
          if-no-files-found: error
          retention-days: 90
