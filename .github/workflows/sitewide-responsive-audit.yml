name: Amaris Sitewide Responsive Audit

on:
  pull_request:
    branches: [render-live-current-20260918]
    paths:
      - 'frontend/e2e/sitewide_responsive_audit.py'
      - '.github/workflows/sitewide-responsive-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-device-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned app dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Frontend type and lint checks
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
      - name: Install browser automation tools
        run: python -m pip install -r frontend/e2e/requirements.txt
      - name: Build production-like Nitro Node bundle
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false nitro@3.0.260903-beta @tailwindcss/vite@4.3.3
          NODE_ENV=production NITRO_PRESET=node npx vite build --config vite.node.config.ts
      - name: Audit every route on seven device viewports
        env:
          AMARIS_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python -u frontend/e2e/sitewide_responsive_audit.py
      - name: Publish route-level summary
        if: always()
        shell: bash
        run: |
          if [ -f frontend/artifacts/sitewide-responsive/summary.md ]; then
            cat frontend/artifacts/sitewide-responsive/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive viewport metrics and limited screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amaris-sitewide-responsive-audit
          path: frontend/artifacts/sitewide-responsive/
          retention-days: 7
          if-no-files-found: warn
