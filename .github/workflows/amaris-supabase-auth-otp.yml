name: Amaris Supabase Auth OTP Config

on:
  push:
    branches: [ops/staging-password-recovery-apply-20261025]
    paths: [ops/staging-password-recovery-apply-request.txt]
  pull_request:
    paths:
      - "scripts/configure_supabase_auth_otp.py"
      - "tests/test_configure_supabase_auth_otp.py"
      - "frontend/email-templates/**"
      - ".github/workflows/amaris-supabase-auth-otp.yml"
  workflow_dispatch:
    inputs:
      project:
        type: choice
        description: "Select Supabase project"
        options:
          - staging
          - production
        required: true
      operation:
        type: choice
        description: "Check configuration or explicitly apply approved templates"
        options:
          - check
          - apply
        required: true
      production_confirmation:
        description: "For production apply, enter APPLY_PRODUCTION_AUTH_OTP"
        required: false
        type: string

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Auth Management API configuration script (offline)
        run: python -m unittest discover -s tests -p test_configure_supabase_auth_otp.py -v
      - name: Verify repository template placeholders and syntax
        run: |
          python -m py_compile scripts/configure_supabase_auth_otp.py
          python - <<'PY'
          from pathlib import Path

          for p in Path("frontend/email-templates").glob("*.html"):
              html = p.read_text(encoding="utf-8")
              expected = "{{ .TokenHash }}" if p.name == "recover-password.html" else "{{ .Token }}"
              assert expected in html, f"{p.name} is missing its Supabase token placeholder"
          print("Templates contain Supabase-issued token placeholders.")
          PY

  configure:
    needs: contract-tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/ops/staging-password-recovery-apply-20261025')
    runs-on: ubuntu-24.04
    # Configure required production reviewers on GitHub Environments for final approval.
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.project }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ github.event_name == 'push' && secrets.SUPABASE_AUTH_MANAGEMENT_TOKEN || ((inputs.project == 'production' && secrets.SUPABASE_PRODUCTION_AUTH_MANAGEMENT_TOKEN) || (inputs.project == 'staging' && secrets.SUPABASE_AUTH_MANAGEMENT_TOKEN)) }}
      TARGET_PROJECT_REF: ${{ github.event_name == 'push' && 'atyhhjwwxgzeurnwayay' || (inputs.project == 'production' && 'epkcuseloinygkakxxdu' || 'atyhhjwwxgzeurnwayay') }}
      ACTION_MODE: ${{ github.event_name == 'push' && 'apply' || inputs.operation }}
      PROJECT_CHOICE: ${{ github.event_name == 'push' && 'staging' || inputs.project }}
      PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse implicit production changes and missing credentials
        run: |
          set -eu
          if [ "$PROJECT_CHOICE" = "production" ] && [ "$ACTION_MODE" = "apply" ]; then
            if [ "$PRODUCTION_CONFIRMATION" != "APPLY_PRODUCTION_AUTH_OTP" ]; then
              echo "Production apply requires the exact confirmation and environment approval." >&2
              exit 1
            fi
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing project-appropriate Auth Management API secret: SUPABASE_AUTH_MANAGEMENT_TOKEN (staging) or SUPABASE_PRODUCTION_AUTH_MANAGEMENT_TOKEN (production)." >&2
            exit 1
          fi
      - name: Audit or apply exact two email templates and 6-digit OTP
        run: |
          python scripts/configure_supabase_auth_otp.py --project-ref "$TARGET_PROJECT_REF" --mode "$ACTION_MODE"
