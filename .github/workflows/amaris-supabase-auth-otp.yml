name: Amaris Supabase Auth OTP Config

on:
  # Read-only production audit only, scoped to dedicated ops branch
  push:
    branches: ['ops/production-supabase-otp-audit-20261025']
    paths: ['ops/production-supabase-otp-audit-request.txt']
  pull_request:
    paths:
      - "scripts/configure_supabase_auth_otp.py"
      - "tests/test_configure_supabase_auth_otp.py"
      - "frontend/email-templates/**"
      - ".github/workflows/amaris-supabase-auth-otp.yml"
  workflow_dispatch:
    inputs:
      project:
        type: choice
        description: "Select Supabase project"
        options:
          - staging
          - production
        required: true
      operation:
        type: choice
        description: "Check configuration or explicitly apply approved templates"
        options:
          - check
          - apply
        required: true
      production_confirmation:
        description: "For production apply, enter APPLY_PRODUCTION_AUTH_OTP"
        required: false
        type: string

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Auth Management API configuration script (offline)
        run: python -m unittest discover -s tests -p test_configure_supabase_auth_otp.py -v
      - name: Verify repository template placeholders and syntax
        run: |
          python -m py_compile scripts/configure_supabase_auth_otp.py
          python - <<'PY'
          from pathlib import Path

          for p in Path("frontend/email-templates").glob("*.html"):
              html = p.read_text(encoding="utf-8")
              assert "{{ .Token }}" in html, f"{p.name} is missing its OTP variable"
          print("Templates contain Supabase-issued token placeholders.")
          PY

  configure:
    needs: contract-tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Configure required production reviewers on GitHub Environments for final approval.
    environment: ${{ github.event_name == 'push' && 'production' || inputs.project }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTH_MANAGEMENT_TOKEN }}
      TARGET_PROJECT_REF: ${{ github.event_name == 'push' && 'epkcuseloinygkakxxdu' || (inputs.project == 'production' && 'epkcuseloinygkakxxdu' || 'atyhhjwwxgzeurnwayay') }}
      ACTION_MODE: ${{ github.event_name == 'push' && 'check' || inputs.operation }}
      PROJECT_CHOICE: ${{ github.event_name == 'push' && 'production' || inputs.project }}
      PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse implicit production changes and missing credentials
        run: |
          set -eu
          if [ "$PROJECT_CHOICE" = "production" ] && [ "$ACTION_MODE" = "apply" ]; then
            if [ "$PRODUCTION_CONFIRMATION" != "APPLY_PRODUCTION_AUTH_OTP" ]; then
              echo "Production apply requires the exact confirmation and environment approval." >&2
              exit 1
            fi
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret SUPABASE_AUTH_MANAGEMENT_TOKEN." >&2
            exit 1
          fi
      - name: Audit or apply exact two email templates and 6-digit OTP
        run: |
          python scripts/configure_supabase_auth_otp.py --project-ref "$TARGET_PROJECT_REF" --mode "$ACTION_MODE"

  # Read-only production audit using its protected, production-specific environment secret.
  # This job can only GET config, never PATCH, and cannot deploy.
  production-readonly-audit:
    needs: contract-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/production-supabase-otp-audit-20261025'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_AUTH_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and compare production Auth SMTP and OTP settings (NO WRITE)
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "BLOCK: production Auth management token unavailable"; exit 1; }
          python scripts/configure_supabase_auth_otp.py --project-ref epkcuseloinygkakxxdu --mode check
