name: Security Test Suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Collect static assets for admin regression tests
        run: python manage.py collectstatic --noinput
      - name: Run Django security regression tests
        run: python manage.py test security_tests content

  django-deploy-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "example.com"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://example.com"
      DATABASE_URL: "sqlite:///db.sqlite3"
      DATABASE_SSL_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Generate an ephemeral Django secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django deployment security check
        run: python manage.py check --deploy

  python-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

  javascript-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

  javascript-full-dependency-audit:
    name: Audit complete npm dependency tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install exact committed dependency tree
        run: npm ci
      - name: Audit runtime and development dependencies
        run: npm audit --audit-level=high
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t amaris-backend-security-scan ./backend
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0
      - name: Save Trivy vulnerability evidence
        run: |
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --format json \
            --output trivy-backend-vulnerabilities.json amaris-backend-security-scan
      - name: Trivy image scan (mandatory HIGH/CRITICAL gate)
        run: trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL amaris-backend-security-scan
      - name: Preserve container scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-${{ github.sha }}
          path: trivy-backend-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 14
