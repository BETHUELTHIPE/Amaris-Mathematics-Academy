name: Production Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amaris-production-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  application-security:
    name: Application and dependency security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_security
          POSTGRES_USER: amaris_security
          POSTGRES_PASSWORD: amaris-security-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_security -d amaris_security"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_security:amaris-security-ci-only@127.0.0.1:5432/amaris_security
      DATABASE_SSL_REQUIRED: "false"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4

      - name: Generate masked ephemeral Django secret
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-load.txt

      - name: Install Python security/test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install 'pip-audit>=2.7,<3'

      - name: Django deployment checks
        working-directory: backend
        run: python manage.py check --deploy --fail-level ERROR

      - name: Apply migrations for security regression tests
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Security-sensitive Django regression tests
        working-directory: backend
        run: |
          python manage.py test \
            content.tests.HealthAndMetricsTests \
            content.tests.ErrorRecoveryTests \
            content.tests.PublicContentApiTests \
            content.tests.AdminRegistrationTests \
            content.tests.PermissionTests \
            content.tests.PaymentReconciliationTests \
            content.test_integrations
          python manage.py test

      - name: Python dependency audit
        run: |
          pip-audit --requirement backend/requirements.txt
          pip-audit --requirement backend/requirements-load.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Node dependency audit at HIGH severity
        run: npm audit --audit-level=high

  repository-secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: HIGH/CRITICAL container vulnerability gate
    runs-on: ubuntu-latest
    needs: [application-security, repository-secrets]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build production backend image
        run: docker build --tag amaris-backend-security:${{ github.sha }} backend

      - name: Scan backend image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: amaris-backend-security:${{ github.sha }}
          format: sarif
          output: trivy-production-security.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Upload Trivy findings
        if: always() && hashFiles('trivy-production-security.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-production-security.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: amaris-backend-security:${{ github.sha }}
          format: cyclonedx-json
          output-file: amaris-backend-security-sbom.cdx.json

      - name: Preserve SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-security-sbom
          path: amaris-backend-security-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
