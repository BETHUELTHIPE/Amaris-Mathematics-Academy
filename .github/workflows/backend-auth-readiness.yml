name: Production Backend Auth Readiness

on:
  push:
    branches: [security/backend-auth-readiness-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-readiness:
    name: Authentication and authorization
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_auth_ci
          POSTGRES_USER: amaris_auth_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amaris_auth_ci -d amaris_auth_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_auth_ci@127.0.0.1:5432/amaris_auth_ci
      DATABASE_SSL_REQUIRED: "false"
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      # This job intentionally uses an isolated local PostgreSQL service.
      # Production/staging continue to enforce the configured Supabase project.
      SUPABASE_DATABASE_REQUIRED: "false"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: synthetic-ci-key
      SUPABASE_AUTH_CACHE_SECONDS: "0"
      PAYFAST_MODE: sandbox
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ACCEPTANCE_GITHUB_OIDC_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral Django secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Format contract
        run: black --check --diff content/test_auth_production_readiness.py
      - name: Lint contract
        run: ruff check content/test_auth_production_readiness.py
      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Authentication and authorization tests
        run: |
          python manage.py test \
            content.test_auth_production_readiness \
            content.test_student_api \
            content.test_live_classes \
            content.test_video_requests \
            content.tests.PermissionTests
