name: Authenticated Tutor Superuser and Payment Acceptance

on:
  pull_request:
    branches: [production-release-20260923]
    paths:
      - '.github/workflows/authenticated-roles-and-payments.yml'
      - 'backend/content/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-authenticated-journeys:
    name: Authenticated sessions, permissions, payments and PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_roles_ci
          POSTGRES_USER: amaris_roles_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amaris_roles_ci -d amaris_roles_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://amaris_roles_ci@127.0.0.1:5432/amaris_roles_ci
      DATABASE_SSL_REQUIRED: 'false'
      SUPABASE_DATABASE_REQUIRED: 'false'
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PAYFAST_ENV: sandbox
      PAYFAST_MODE: sandbox
      # All checkout/provider tests use synthetic students and test adapters.
      # No production database, live PayFast credentials or student mailbox.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create a one-time test-only Django signing secret
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 64)"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify test environment cannot target production database
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          u = urlsplit(os.environ["DATABASE_URL"])
          assert u.hostname == "127.0.0.1" and u.path == "/amaris_roles_ci"
          assert os.environ["PAYFAST_ENV"] == "sandbox"
          assert not any(os.environ.get(k) for k in (
              "PAYFAST_MERCHANT_ID", "PAYFAST_MERCHANT_KEY", "PAYFAST_PASSPHRASE",
              "SUPABASE_SERVICE_ROLE_KEY", "STAGING_DATABASE_URL",
          ))
          print("PASS isolated database and sandbox-only payment settings")
          PY
      - name: Confirm migration graph and initialize isolated database
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Authenticate tutor ownership and finance sessions
        run: >-
          python manage.py test
          content.test_tutor_dashboard
          content.test_tutor_finance
          content.test_tutor_applications
          --verbosity 2
      - name: Confirm superuser-only marketing and monitoring access
        run: >-
          python manage.py test
          content.test_announcement_media
          tests.test_monitoring_admin
          --verbosity 2
      - name: Confirm course/class/video payment protections and PDF receipts
        run: >-
          python manage.py test
          content.test_payfast_security
          content.test_payfast_configuration
          content.test_payments
          content.test_live_classes
          content.test_video_requests
          content.test_invoice_archive
          --verbosity 2
      - name: Final evidence qualification
        run: |
          echo "PASS: test-client authenticated Django sessions, access controls, sandbox/provider-adapter and PDF generation"
          echo "NOT TESTED: production user login, real-money charges, real PayFast ITN to production, SMTP receipt delivery or live bank transfers"
          echo "No persistent production users, payments, bank credentials or database records were created"
