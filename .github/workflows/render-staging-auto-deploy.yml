name: Render Staging Auto Deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-staging-auto-deploy
  cancel-in-progress: true

env:
  RENDER_SERVICE_ID: srv-dam2iivcgkoc7383tq50
  STAGING_BASE_URL: https://amaris-mathematics-academy-staging.onrender.com

jobs:
  deploy:
    name: Deploy staging to Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://amaris-mathematics-academy-staging.onrender.com

    steps:
      - name: Validate deployment credential
        shell: bash
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_URL}" ] && [ -z "${RENDER_API_KEY}" ]; then
            echo "::error::Configure either STAGING_RENDER_DEPLOY_HOOK_URL or RENDER_API_KEY in the GitHub staging environment."
            exit 1
          fi

      - name: Trigger Render deployment
        id: trigger
        shell: bash
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${DEPLOY_HOOK_URL}" ]; then
            echo "::add-mask::${DEPLOY_HOOK_URL}"
            curl --fail --silent --show-error               --request POST               --max-time 30               "${DEPLOY_HOOK_URL}" >/tmp/render-trigger.json
            echo "Render deploy hook accepted the request."
          else
            curl --fail --silent --show-error               --request POST               --max-time 30               --header "Authorization: Bearer ${RENDER_API_KEY}"               --header "Content-Type: application/json"               "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"               --data '{}' >/tmp/render-trigger.json
            echo "Render API accepted the deployment request."
          fi

      - name: Wait for exact staging commit
        shell: bash
        run: |
          set -euo pipefail

          expected_sha="${GITHUB_SHA}"
          ready_url="${STAGING_BASE_URL}/health/ready/"
          version_url="${STAGING_BASE_URL}/health/version/"

          for attempt in $(seq 1 72); do
            ready_code=$(curl --silent --show-error --output /tmp/ready.json               --write-out '%{http_code}' --max-time 15 "${ready_url}" || true)
            version_code=$(curl --silent --show-error --output /tmp/version.json               --write-out '%{http_code}' --max-time 15 "${version_url}" || true)
            deployed_sha=$(python - <<'PY'
import json
try:
    with open("/tmp/version.json", encoding="utf-8") as handle:
        print(json.load(handle).get("git_sha", ""))
except Exception:
    print("")
PY
)

            echo "attempt=${attempt} ready=${ready_code} version=${version_code} deployed_sha=${deployed_sha} expected=${expected_sha}"

            if [ "${ready_code}" = "200" ] && [ "${version_code}" = "200" ] && [ "${deployed_sha}" = "${expected_sha}" ]; then
              echo "Exact staging commit is live and ready."
              cat /tmp/ready.json
              cat /tmp/version.json
              exit 0
            fi

            sleep 10
          done

          echo "::error::Render staging did not reach the exact expected Git SHA."
          cat /tmp/ready.json 2>/dev/null || true
          cat /tmp/version.json 2>/dev/null || true
          exit 1
