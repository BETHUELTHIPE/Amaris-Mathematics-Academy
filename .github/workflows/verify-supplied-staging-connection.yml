name: Verify supplied staging connection (read only)
on:
  push:
    branches: [ops/backend-release-verification-20261018]
    paths:
      - .github/workflows/verify-supplied-staging-connection.yml
      - scripts/release/verify_supplied_staging_connection.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: pip install -r backend/requirements.txt
      - name: Verify saved staging password over TLS without database writes
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python scripts/release/verify_supplied_staging_connection.py
  existing-staging-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: pip install -r backend/requirements.txt
      - name: Test existing protected keys against the dedicated staging S3 endpoint (list only)
        env:
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
        run: python scripts/release/verify_supplied_staging_connection.py storage-environment
