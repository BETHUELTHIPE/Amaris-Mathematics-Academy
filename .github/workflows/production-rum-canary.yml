name: One-time Production RUM Canary

on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-rum-canary.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-positive-forwarding:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Submit disposable synthetic sample, record successful forwarding
        run: python -u scripts/release/rum_production_disposable_canary.py
