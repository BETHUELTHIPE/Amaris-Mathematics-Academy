name: Verify exact contact release candidates
on:
  push:
    branches: [ops/contact-release-verification-20261022]
    paths: ['.github/workflows/contact-release-verification.yml', 'deploy/contact-release/**']
permissions:
  contents: read
concurrency:
  group: amaris-contact-release-verification
  cancel-in-progress: false
jobs:
  backend:
    if: "!contains(github.event.head_commit.message, '[CONTACT_SMOKE:')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            ref: a47f9228b582d75a4ff0eeffb329b6b74827f222
          - target: production
            ref: 141d078ab24242bbb5839569829f077e9cdbb53c
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_contact_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U amaris_ci -d amaris_contact_ci" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: disposable-contact-release-ci-key-with-no-real-data
      SUPABASE_DATABASE_REQUIRED: 'false'
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_contact_ci
      DATABASE_SSL_REQUIRED: 'false'
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: '0'
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Django checks, schema drift and complete release regression suite
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
          python manage.py test
  frontend:
    if: "!contains(github.event.head_commit.message, '[CONTACT_SMOKE:')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ matrix.target }}
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --init --ipc=host --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            ref: 43fca4af502d2ed5fbaa97375c3170bc4f43caeb
          - target: production
            ref: 284dc9a9bf0491df0e924abcebeffbf1f8758730
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Build and test exact frontend candidate
        working-directory: release/frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npm run test:unit
      - name: Build the same Nitro target used by Render
        working-directory: release/frontend
        run: |
          npm install --no-save nitro @tailwindcss/vite@4.3.3
          NODE_ENV=production NITRO_PRESET=node npx vite build --config vite.node.config.ts
      - run: python -m pip install playwright==1.62.0
      - name: Check every required prompt on the actual Node build
        working-directory: release/frontend
        shell: bash
        run: |
          NODE_ENV=production HOST=0.0.0.0 PORT=4180 node .output/server/index.mjs > /tmp/contact-node.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4180/contact >/dev/null; then break; fi
            if [ "$attempt" -eq 45 ]; then cat /tmp/contact-node.log; exit 1; fi
            sleep 2
          done
          python ../../harness/deploy/contact-release/verify_contact.py --frontend http://127.0.0.1:4180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-${{ matrix.target }}-browser-evidence
          path: |
            release/frontend/artifacts/e2e/
            /tmp/contact-node.log
          if-no-files-found: ignore
  live:
    if: "contains(github.event.head_commit.message, '[CONTACT_SMOKE:')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ contains(github.event.head_commit.message, '[CONTACT_SMOKE:production]') && 'production' || 'staging' }}
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --init --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install playwright==1.62.0
      - name: Validate live form and reject incomplete API requests
        env:
          TARGET: ${{ contains(github.event.head_commit.message, '[CONTACT_SMOKE:production]') && 'production' || 'staging' }}
        run: |
          if [ "$TARGET" = production ]; then
            python deploy/contact-release/verify_contact.py --frontend https://amaris-mathematics-academy-live-students.onrender.com --backend https://amaris-production-web.onrender.com
          else
            python deploy/contact-release/verify_contact.py --frontend https://amaris-mathematics-academy-staging-x4ax.onrender.com --backend https://amaris-mathematics-academy-staging.onrender.com
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-live-browser-evidence
          path: artifacts/e2e/
          if-no-files-found: ignore
