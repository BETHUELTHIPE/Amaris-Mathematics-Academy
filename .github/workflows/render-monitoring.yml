name: Render Monitoring Validation

on:
  pull_request:
    paths:
      - "monitoring/render/**"
      - "monitoring/self-hosted/**"
      - "backend/amaris_cms/admin_config.py"
      - "backend/amaris_cms/monitoring_admin.py"
      - "backend/templates/admin/amaris_*"
      - "backend/tests/test_monitoring_admin.py"
      - "backend/amaris_cms/settings.py"
      - ".github/workflows/render-monitoring.yml"
  push:
    branches:
      - "feature/render-native-monitoring-20261014"
    paths:
      - "monitoring/render/**"
      - "monitoring/self-hosted/**"
      - "backend/amaris_cms/admin_config.py"
      - "backend/amaris_cms/monitoring_admin.py"
      - "backend/templates/admin/amaris_*"
      - "backend/tests/test_monitoring_admin.py"
      - "backend/amaris_cms/settings.py"
      - ".github/workflows/render-monitoring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-hosted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring/self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate private Compose and Prometheus configuration
        run: |
          umask 077
          mkdir -p .secrets
          openssl rand -hex 32 > .secrets/grafana_admin_password
          chmod 444 .secrets/grafana_admin_password
          docker compose config --quiet
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - name: Verify collector and authenticated Grafana datasource
        run: |
          docker compose up -d --wait --wait-timeout 120
          python - <<'PY'
          import base64
          import json
          import time
          import urllib.request
          from pathlib import Path

          for attempt in range(20):
              with urllib.request.urlopen("http://127.0.0.1:9090/api/v1/query?query=up", timeout=5) as response:
                  result = json.load(response)["data"]["result"]
              if any(row["metric"].get("job") == "prometheus" and row["value"][1] == "1" for row in result):
                  break
              time.sleep(2)
          else:
              raise SystemExit("Prometheus self scrape did not become healthy")

          password = Path(".secrets/grafana_admin_password").read_text().strip()
          token = base64.b64encode(f"amaris-admin:{password}".encode()).decode()
          request = urllib.request.Request(
              "http://127.0.0.1:3000/api/datasources/uid/amaris-prometheus/health",
              headers={"Authorization": f"Basic {token}"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              health = json.load(response)
          if health.get("status") != "OK":
              raise SystemExit("Grafana could not query its Prometheus datasource")
          print("Self scrape and authenticated Grafana datasource passed")
          PY
      - name: Remove temporary CI containers and data
        if: always()
        run: docker compose down --volumes

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Blueprint YAML
        run: ruby -e 'require "yaml"; YAML.load_file("monitoring/render/render.yaml")'

      - name: Validate exporter Python
        run: python -m py_compile monitoring/render/render-metrics-exporter/exporter.py

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool monitoring/render/grafana/dashboards/amaris-render.json >/dev/null

      - name: Validate Prometheus configuration
        run: |
          sed \
            -e 's|__DJANGO_TARGET__|django:10000|g' \
            -e 's|__FLOWER_TARGET__|flower:10000|g' \
            -e 's|__RENDER_METRICS_TARGET__|render-metrics:10000|g' \
            monitoring/render/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml
          docker run --rm \
            --entrypoint /bin/promtool \
            -v /tmp/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
            -v "$PWD/monitoring/render/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.15.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/render/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.15.0 \
            check rules /etc/prometheus/alerts.yml

      - name: Build monitoring images
        run: |
          docker build -f monitoring/render/render-metrics-exporter/Dockerfile -t amaris/render-metrics:test .
          docker build -f monitoring/render/prometheus/Dockerfile -t amaris/prometheus:test .
          docker build -f monitoring/render/grafana/Dockerfile -t amaris/grafana:test .
          docker build -f monitoring/render/flower/Dockerfile -t amaris/flower:test .

      - name: Run monitoring admin tests
        run: |
          python -m pip install -r backend/requirements.txt
          cd backend
          python manage.py test tests.test_monitoring_admin
