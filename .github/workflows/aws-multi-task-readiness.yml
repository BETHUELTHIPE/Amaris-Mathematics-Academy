name: Amaris multi-task staging readiness
on:
  push:
    branches: [ops/aws-multi-task-readiness-20261126]
    paths:
      - 'deploy/aws/blue-green/**'
      - '.github/workflows/aws-multi-task-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amaris-multi-task-staging-readiness
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Unit-test split web and singleton Celery definitions
        run: python3 -m unittest discover -s deploy/aws/blue-green -p 'test_render*.py' -v
      - name: Check shared Valkey provisioning script syntax
        run: bash -n deploy/aws/blue-green/provision-shared-valkey.sh
  live-readiness:
    needs: offline
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-multi-task-readiness-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_PAGER: ''
      AWS_REGION: eu-north-1
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Inspect live capacity, shared state and ALB readiness without mutation
        run: python3 deploy/aws/blue-green/audit-multitask.py
      - name: Bounded staging-only k6 read smoke (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: docker run --rm -v "$PWD/deploy/aws/blue-green:/tests:ro" grafana/k6:0.54.0 run /tests/staging-smoke.js
