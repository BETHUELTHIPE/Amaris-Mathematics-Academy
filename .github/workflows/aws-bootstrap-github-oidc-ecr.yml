name: Bootstrap scoped GitHub OIDC ECR publisher
on:
  push:
    branches: [ops/aws-cloudwatch-sns-20261126]
    paths:
      - deploy/aws/iam/github-oidc-ecr-publisher.yml
      - .github/workflows/aws-bootstrap-github-oidc-ecr.yml
permissions:
  contents: read
concurrency:
  group: amaris-staging-iam-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-cloudwatch-sns-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate least-privilege IAM template
        run: |
          python3 -m pip install cfn-lint==1.61.0
          cfn-lint -r eu-north-1 -t deploy/aws/iam/github-oidc-ecr-publisher.yml
      - name: Authenticate with existing staging bootstrap credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Deploy scoped GitHub OIDC provider and ECR-only role
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "110156539003" ]]
          aws cloudformation deploy \
            --stack-name amaris-staging-github-oidc-publisher \
            --template-file deploy/aws/iam/github-oidc-ecr-publisher.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          role_arn="$(aws cloudformation describe-stacks --stack-name amaris-staging-github-oidc-publisher --query 'Stacks[0].Outputs[?OutputKey==`EcrPublisherRoleArn`].OutputValue | [0]' --output text)"
          [[ "$role_arn" == "arn:aws:iam::110156539003:role/AmarisGitHubECRPublisher" ]]
          aws iam get-role --role-name AmarisGitHubECRPublisher --query 'Role.AssumeRolePolicyDocument.Statement[].Condition.StringEquals' --output json
          echo "Least-privilege ECR publisher role provisioned. It cannot update ECS services or ALB listeners."
