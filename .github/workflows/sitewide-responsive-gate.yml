name: Sitewide 47-Page Responsive and Accessibility Gate

on:
  pull_request:
    branches: [render-live-current-20260918]
    paths:
      - 'frontend/app/**'
      - 'frontend/components/**'
      - 'frontend/e2e/sitewide_responsive.py'
      - '.github/workflows/sitewide-responsive-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-wide-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Frontend TypeScript, ESLint and all existing unit contracts
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Install browser harness
        run: pip install -r frontend/e2e/requirements.txt
      - name: Build production-style Nitro/Render frontend
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false nitro@3.0.260903-beta @tailwindcss/vite@4.3.3
          NODE_ENV=production NITRO_PRESET=node npx vite build --config vite.node.config.ts
      - name: Audit every route at 320px, 390px, 768px and 1440px
        env:
          AMARIS_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python -u frontend/e2e/sitewide_responsive.py
      - name: Retain route-wide findings and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amaris-sitewide-responsive-audit
          path: frontend/artifacts/sitewide-responsive/
          retention-days: 14
          if-no-files-found: warn
