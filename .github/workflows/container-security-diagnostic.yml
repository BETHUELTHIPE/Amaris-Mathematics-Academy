name: Container Security Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/container-security-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Trivy HIGH/CRITICAL diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image
        run: docker build --tag amaris-backend:diagnostic backend
      - name: Show fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: amaris-backend:diagnostic
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          scanners: vuln
