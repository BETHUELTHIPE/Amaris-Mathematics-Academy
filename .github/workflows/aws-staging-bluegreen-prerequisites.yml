name: Prepare blue-green ALB prerequisites without changing traffic
on:
  push:
    branches: [ops/aws-selective-bluegreen-20261127]
    paths: [.github/workflows/aws-staging-bluegreen-prerequisites.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: amaris-staging-bluegreen-prerequisites
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-selective-bluegreen-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE != ''
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
      - name: Inspect and prepare a detached alternate target group
        run: |
          python -m pip install --quiet boto3
          python - <<'PY'
          import boto3, json
          from botocore.exceptions import ClientError
          assert boto3.client("sts").get_caller_identity()["Account"] == "110156539003"
          ecs = boto3.client("ecs")
          elb = boto3.client("elbv2")
          ec2 = boto3.client("ec2")
          cluster = "amaris-ecs-staging"
          service = ecs.describe_services(cluster=cluster, services=["amaris-web-staging-stateless"])["services"][0]
          assert service["runningCount"] == service["desiredCount"] and service["runningCount"] >= 2
          assert len(service["loadBalancers"]) == 1
          primary = service["loadBalancers"][0]["targetGroupArn"]
          blue = elb.describe_target_groups(TargetGroupArns=[primary])["TargetGroups"][0]
          assert blue["VpcId"] == "vpc-0252538d2febd4641" and blue["TargetType"] == "ip"
          assert blue["Port"] == 8080
          assert len(blue["LoadBalancerArns"]) == 1
          alb = blue["LoadBalancerArns"][0]
          healthy = [x for x in elb.describe_target_health(TargetGroupArn=primary)["TargetHealthDescriptions"] if x["TargetHealth"]["State"] == "healthy"]
          assert len(healthy) >= service["desiredCount"], "Current targets not healthy"
          listeners = elb.describe_listeners(LoadBalancerArn=alb)["Listeners"]
          before = {l["ListenerArn"]: list(elb.get_paginator("describe_rules").paginate(ListenerArn=l["ListenerArn"])) for l in listeners}
          try:
              green = elb.describe_target_groups(Names=["amaris-staging-web-green"])["TargetGroups"][0]
          except elb.exceptions.TargetGroupNotFoundException:
              args = {k:blue[k] for k in ("Protocol","Port","VpcId","TargetType","IpAddressType","HealthCheckProtocol","HealthCheckPort","HealthCheckPath","HealthCheckIntervalSeconds","HealthCheckTimeoutSeconds","HealthyThresholdCount","UnhealthyThresholdCount","Matcher") if k in blue}
              green = elb.create_target_group(Name="amaris-staging-web-green", **args,
                         Tags=[{"Key":"Project","Value":"Amaris"},{"Key":"Environment","Value":"staging"}])["TargetGroups"][0]
          assert green["TargetGroupArn"] != primary and green["VpcId"] == blue["VpcId"] and green["Port"] == blue["Port"]
          assert green["TargetType"] == "ip" and green["HealthCheckPath"] == blue["HealthCheckPath"]
          assert not green.get("LoadBalancerArns", []), "Existing green group already attached; inspect manually"
          assert not elb.describe_target_health(TargetGroupArn=green["TargetGroupArn"]).get("TargetHealthDescriptions", []), "Green group is not empty"
          after = {l["ListenerArn"]: list(elb.get_paginator("describe_rules").paginate(ListenerArn=l["ListenerArn"])) for l in listeners}
          assert before == after, "Listener routing changed concurrently"
          print("PASS: current healthy blue target group preserved; detached empty green target group available.")
          print("Green target group:", green["TargetGroupName"])
          print("No listener rules, ECS strategy or service count changed.")
          # Report remaining physical ENI capacity conservatively, including attached task ENIs.
          ids = ecs.list_container_instances(cluster=cluster,status="ACTIVE")["containerInstanceArns"]
          for host in ecs.describe_container_instances(cluster=cluster,containerInstances=ids)["containerInstances"]:
              row = ec2.describe_instances(InstanceIds=[host["ec2InstanceId"]])["Reservations"][0]["Instances"][0]
              info = ec2.describe_instance_types(InstanceTypes=[row["InstanceType"]])["InstanceTypes"][0]["NetworkInfo"]
              print(json.dumps({"instanceType":row["InstanceType"],"attachedENIs":len(row["NetworkInterfaces"]),
                  "maxENIs":info["MaximumNetworkInterfaces"],"remainingMemoryMiB":next(x["integerValue"] for x in host["remainingResources"] if x["name"]=="MEMORY")}))
          print("Blue-green activation blocked until overlap capacity, protected test routing and rollback drill are verified.")
          PY
