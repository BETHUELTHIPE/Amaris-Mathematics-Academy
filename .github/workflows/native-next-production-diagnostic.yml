name: Native Next Production Diagnostic

on:
  push:
    branches:
      - fix/booking-production-readiness-20261004
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-next-production-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-next:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      CMS_API_URL: https://amaris-mathematics-academy-staging.onrender.com/api/v1
      SITE_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: diagnostic-public-placeholder

    steps:
      - name: Check out candidate
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Build with native Next.js
        working-directory: frontend
        run: npx next build

      - name: Start native Next.js production server
        working-directory: frontend
        run: |
          set -euo pipefail
          npx next start -H 127.0.0.1 -p 4100 >/tmp/native-next.log 2>&1 &
          echo $! >/tmp/native-next.pid

          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /tmp/home.html --write-out '%{http_code}' --max-time 10 http://127.0.0.1:4100/ || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/native-next.log >&2 || true
              exit 1
            fi
            sleep 2
          done

      - name: Verify public routes on native production runtime
        working-directory: frontend
        run: |
          set -euo pipefail

          for path in / /about /courses /contact /login /register /book-online-live-class; do
            body=$(mktemp)
            code=$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' --max-time 20 "http://127.0.0.1:4100$path")
            echo "$path -> HTTP $code"
            test "$code" = "200"
            if grep -qi "We could not find that page" "$body"; then
              echo "$path rendered the branded 404 page" >&2
              exit 1
            fi
          done

          booking=$(mktemp)
          curl --silent --show-error --location --fail --max-time 20             http://127.0.0.1:4100/book-online-live-class >"$booking"
          grep -Eqi 'Book online live class|Choose your programme|Available Zoom slots' "$booking"
          grep -qi 'R250' "$booking"

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/native-next.pid ]; then
            kill "$(cat /tmp/native-next.pid)" 2>/dev/null || true
          fi
          tail -n 200 /tmp/native-next.log 2>/dev/null || true
