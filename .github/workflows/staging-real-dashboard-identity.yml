name: Real Staging Student and Tutor Dashboard Identity Acceptance
on:
  push:
    branches: ["stage/dashboard-account-identity-acceptance-20261026"]
    paths: ["ops/real-dashboard-identity-acceptance-request.txt"]
permissions:
  contents: read
concurrency:
  group: staging-real-account-dashboard-identity
  cancel-in-progress: false
jobs:
  verify-real-identity:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [student, tutor]
    environment: staging
    timeout-minutes: 18
    env:
      AMARIS_STAGING_QA_ROLE: ${{ matrix.role }}
      STAGING_TEST_STUDENT_EMAIL: ${{ secrets.STAGING_TEST_STUDENT_EMAIL }}
      STAGING_TEST_STUDENT_PASSWORD: ${{ secrets.STAGING_TEST_STUDENT_PASSWORD }}
      STAGING_TEST_TUTOR_EMAIL: ${{ secrets.STAGING_TEST_TUTOR_EMAIL }}
      STAGING_TEST_TUTOR_PASSWORD: ${{ secrets.STAGING_TEST_TUTOR_PASSWORD }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preflight dedicated staging-only non-privileged QA identities
        shell: bash
        run: |
          set -eu
          for key in STAGING_TEST_STUDENT_EMAIL STAGING_TEST_STUDENT_PASSWORD STAGING_TEST_TUTOR_EMAIL STAGING_TEST_TUTOR_PASSWORD STAGING_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::BLOCK: required staging QA secret $key is not configured"
              exit 1
            fi
          done
          echo "PASS: QA prerequisites supplied without revealing values"
      - name: Install pinned Playwright only
        run: |
          python -m pip install -r frontend/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Compare browser identity to real Supabase and approved Django tutor
        shell: bash
        run: python -u frontend/e2e/staging_real_dashboard_identity_acceptance.py
