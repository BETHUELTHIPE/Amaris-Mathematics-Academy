name: Docker Monitoring Validation

on:
  pull_request:
    paths:
      - "monitoring/docker/**"
      - ".github/workflows/monitoring-docker.yml"
  push:
    branches:
      - "feature/docker-monitoring-stack-20261014"
    paths:
      - "monitoring/docker/**"
      - ".github/workflows/monitoring-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f monitoring/docker/docker-compose.yml config

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/docker/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/docker/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.0 \
            check rules /etc/prometheus/alerts.yml

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool monitoring/docker/grafana/dashboards/amaris-docker-monitoring.json >/dev/null

      - name: Build Flower image
        run: docker compose -f monitoring/docker/docker-compose.yml build flower
