name: Live Staging Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify staging readiness
        shell: bash
        run: |
          set -euo pipefail
          base="https://amaris-mathematics-academy-staging.onrender.com"
          for attempt in $(seq 1 30); do
            live=$(curl --silent --show-error --output /tmp/live.json --write-out '%{http_code}' --max-time 15 "$base/health/live/" || true)
            ready=$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' --max-time 15 "$base/health/ready/" || true)
            if [ "$live" = "200" ] && [ "$ready" = "200" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "staging readiness failed live=$live ready=$ready" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify safe branded error responses
        shell: bash
        run: |
          set -euo pipefail
          base="https://amaris-mathematics-academy-staging.onrender.com"
          for status in 400 403 404 429 500; do
            body=$(mktemp)
            headers=$(mktemp)
            code=$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' --max-time 15 "$base/errors/$status/")
            test "$code" = "$status"
            grep -qi "Amaris Mathematics Academy" "$body"
            grep -qi "Support reference" "$body"
            ! grep -Eqi "traceback|DJANGO_SECRET_KEY|database_url|postgresql://" "$body"
            grep -qi '^x-correlation-id: AMR-' "$headers"
          done

      - name: Verify dependency reporting remains truthful and student-safe
        shell: bash
        run: |
          set -euo pipefail
          base="https://amaris-mathematics-academy-staging.onrender.com"
          body=$(mktemp)
          code=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 15 "$base/health/dependencies/")
          test "$code" = "200"
          python - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              payload = json.load(fh)
          dependencies = payload["dependencies"]
          assert dependencies["postgresql"] is True
          assert isinstance(dependencies["redis"], bool)
          expected = "ok" if all(dependencies.values()) else "degraded"
          assert payload["status"] == expected
          PY

      - name: Verify live-class availability API on deployed staging
        shell: bash
        run: |
          set -euo pipefail
          base="https://amaris-mathematics-academy-staging.onrender.com"
          body=$(mktemp)
          code=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 20 \
            "$base/api/v1/live-classes/slots/?programme=caps&subject=mathematics")
          cat "$body"
          test "$code" = "200"
          python - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              payload = json.load(fh)
          assert isinstance(payload, list), payload
          for slot in payload:
              assert slot.get("price") == "250.00"
              assert "zoom_join_url" not in slot
          PY

      - name: Verify booking page on deployed staging frontend
        shell: bash
        run: |
          set -euo pipefail
          base="https://amaris-mathematics-academy-staging-x4ax.onrender.com"
          body=$(mktemp)
          code=$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' --max-time 30 \
            "$base/book-online-live-class")
          if [ "$code" != "200" ]; then
            echo "booking page returned HTTP $code" >&2
            exit 1
          fi
          if grep -qi "We could not find that page" "$body"; then
            echo "booking page rendered the branded 404 response" >&2
            exit 1
          fi
          if ! grep -Eqi 'Book online live class|Choose your programme|Available Zoom slots|R250' "$body"; then
            echo "booking route is HTTP 200 but expected booking content was not found" >&2
            head -c 1200 "$body" | tr '\n' ' ' >&2
            exit 1
          fi
