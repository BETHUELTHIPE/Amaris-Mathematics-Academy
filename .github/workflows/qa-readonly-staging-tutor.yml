name: Read-only Staging Tutor Access and Routing Audit
on:
  push:
    branches: [qa/staging-tutor-authorization-20261028]
    paths: ["ops/staging-tutor-readonly-audit.txt"]
permissions:
  contents: read
jobs:
  staging-tutor-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check real staging Django private endpoints and tutor web routes
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError,URLError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          agent=build_opener(NoRedirect())
          django="https://amaris-mathematics-academy-staging.onrender.com"
          student="https://amaris-mathematics-academy-staging-x4ax.onrender.com"
          def check(url):
              import time
              req=Request(url,headers={"User-Agent":"AmarisTutorSecurityAudit/20261028"})
              for attempt in range(3):
                  try:
                      with agent.open(req,timeout=55) as res: return res.status,res.read(100000)
                  except HTTPError as e:
                      if e.code in (502,503,504) and attempt<2:
                          time.sleep(7)
                          continue
                      return e.code,b""
                  except (URLError,TimeoutError,OSError):
                      if attempt<2:
                          time.sleep(7)
                          continue
                      raise SystemExit("BLOCK: staging endpoint unavailable after retries")
              raise SystemExit("BLOCK: staging route timeout")
          for route in ("/api/v1/tutor/dashboard/","/api/v1/tutor/earnings/","/api/v1/tutor/slots/","/api/v1/tutor-applications/"):
              code,_=check(django+route)
              if code not in (401,403):
                  raise SystemExit(f"FAIL: anonymous access boundary {route} returned HTTP {code}")
              print(f"PASS private Django {route} anonymous rejected HTTP {code}")
          for route,needle in (("/tutor/register",b"Create your applicant account"),("/tutor/apply",b"Become an Amaris tutor"),("/tutor/login",b"Tutor")):
              status,html=check(student+route)
              matched=needle.lower() in html.lower()
              import re
              headings=re.findall(rb"<h1[^>]*>(.*?)</h1>",html,re.I|re.S)
              heading_text=" | ".join(re.sub(rb"<[^>]+>",b"",x).decode("utf-8","ignore")[:80] for x in headings[:2])
              safe_heading="".join(ch for ch in heading_text if ch.isascii() and (ch.isalnum() or ch in " .,-"))[:120]
              print(f"DIAGNOSTIC: staging tutor page {route} HTTP {status}, heading-present={matched}, page-h1={safe_heading!r}")
              if status!=200 or not matched:
                  raise SystemExit(f"BLOCK: staging tutor public page {route} not at expected version")
              print(f"PASS staging public tutor page {route} HTTP {status}")
          code,html=check(student+"/tutor/dashboard")
          if code==200 and (b"Your teaching slots" in html or b"private tutor earnings" in html):
              raise SystemExit("FAIL: unverified visitor received private tutor dashboard")
          if code not in (200,302,303,307,308,401,403):
              raise SystemExit(f"FAIL: Unexpected tutor dashboard HTTP {code}")
          print("PASS anonymous frontend tutor dashboard has no private timetable or earnings")
          PY

  authenticated-staging-approved-tutor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: staging
    env:
      STAGING_TEST_TUTOR_EMAIL: ${{ secrets.STAGING_TEST_TUTOR_EMAIL }}
      STAGING_TEST_TUTOR_PASSWORD: ${{ secrets.STAGING_TEST_TUTOR_PASSWORD }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Read-only login and approved tutor dashboard, timetable and earnings
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          if os.getenv("GITHUB_REPOSITORY") != "BETHUELTHIPE/Amaris-Mathematics-Academy" or os.getenv("GITHUB_REF") != "refs/heads/qa/staging-tutor-authorization-20261028":
              raise SystemExit("BLOCK: Unexpected QA workflow repository or branch")
          email=os.getenv("STAGING_TEST_TUTOR_EMAIL","").strip().lower()
          password=os.getenv("STAGING_TEST_TUTOR_PASSWORD","")
          key=os.getenv("STAGING_SUPABASE_PUBLISHABLE_KEY","")
          if not email or not password or not key or "@" not in email:
              raise SystemExit("BLOCK: Approved staging tutor test credentials missing")
          auth_url="https://atyhhjwwxgzeurnwayay.supabase.co/auth/v1/token?grant_type=password"
          stage_backend="https://amaris-mathematics-academy-staging.onrender.com/api/v1"
          def request(url,method="GET",payload=None,access=None):
              headers={"Accept":"application/json","User-Agent":"AmarisStagingTutorReadOnlyAcceptance/20261028"}
              if url==auth_url:
                  headers.update({"apikey":key,"Content-Type":"application/json"})
              if access: headers["Authorization"]="Bearer "+access
              data=json.dumps(payload).encode() if payload is not None else None
              try:
                  with urlopen(Request(url,data=data,method=method,headers=headers),timeout=50) as response:
                      status=response.status
                      body=response.read(400000)
              except HTTPError as err:
                  status=err.code
                  body=b""
              except (URLError,TimeoutError):
                  raise SystemExit("BLOCK: staging Auth or Django API unreachable")
              try: result=json.loads(body) if body else {}
              except ValueError: raise SystemExit("BLOCK: invalid API response")
              return status,result
          code,login=request(auth_url,"POST",{"email":email,"password":password})
          if code!=200 or not isinstance(login,dict):
              raise SystemExit(f"BLOCK: genuine staging tutor sign-in rejected HTTP {code}")
          user=login.get("user") or {}
          token=login.get("access_token")
          if not token or str(user.get("email","")).lower()!=email or not user.get("email_confirmed_at"):
              raise SystemExit("BLOCK: test tutor identity is not email-verified or session token is absent")
          print("PASS: genuine staging Supabase approved QA tutor signed in, confirmed email")
          code,dash=request(stage_backend+"/tutor/dashboard/",access=token)
          if code!=200 or not isinstance(dash,dict) or not isinstance(dash.get("slots"),list) or not isinstance(dash.get("bookings"),list):
              raise SystemExit(f"BLOCK: approved staging tutor dashboard HTTP {code} or missing owned rows")
          print("PASS: authenticated staging Django tutor dashboard read, slot and booking collections exist")
          code,earn=request(stage_backend+"/tutor/earnings/",access=token)
          if code!=200 or not isinstance(earn,dict) or "categories" not in earn:
              raise SystemExit(f"BLOCK: authenticated tutor earnings HTTP {code} or contract invalid")
          print("PASS: private staging tutor earnings API returned expected structure")
          # Slots are read through the approved tutor dashboard. /tutor/slots/
          # is a POST-only mutation endpoint and must not be exercised via GET.
          print("PASS: approved tutor can read owned timetable through authenticated dashboard")
          print("NOT TESTED: slot create/update mutation (read-only staging safety)")
          PY
