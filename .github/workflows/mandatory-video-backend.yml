name: Mandatory Video Checkout Django Validation
on:
  push:
    branches: [fix/required-video-request-backend-20261026]
    paths:
      - "backend/content/video_request_views.py"
      - "backend/content/test_video_requests.py"
      - ".github/workflows/mandatory-video-backend.yml"
permissions:
  contents: read
jobs:
  serializer-and-video-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_forms_ci
          POSTGRES_USER: amaris_forms_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U amaris_forms_ci -d amaris_forms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_forms_ci@127.0.0.1:5432/amaris_forms_ci
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      SUPABASE_S3_REQUIRED: "false"
      PAYFAST_MODE: sandbox
      PAYFAST_ENV: sandbox
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_TASK_EAGER_PROPAGATES: "true"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: Amaris Test <qa@example.invalid>
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Check Django with isolated test PostgreSQL
        working-directory: backend
        run: |
          export DJANGO_SECRET_KEY="$(openssl rand -hex 48)"
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test content.test_video_requests -v 1
