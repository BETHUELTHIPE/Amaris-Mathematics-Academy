name: CI

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  backend-quality:
    name: Python quality and Django checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: "false"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Generate an ephemeral Django secret
        shell: bash
        run: printf 'DJANGO_SECRET_KEY=%s\n' "$(openssl rand -hex 64)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Python formatting
        run: black --check .
      - name: Python linting
        run: ruff check .
      - name: Static type checks
        run: mypy
      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Django migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations in CI
        run: python manage.py migrate --noinput
      - name: Build production static-file manifest
        run: python manage.py collectstatic --noinput
      - name: Unit tests
        run: python manage.py test content.tests.HealthAndMetricsTests content.tests.ErrorRecoveryTests
      - name: Integration tests
        run: python manage.py test content.tests.PublicContentApiTests
      - name: Permission tests
        run: python manage.py test content.tests.AdminRegistrationTests content.tests.PermissionTests
      - name: Payment tests
        run: python manage.py test content.tests.PaymentReconciliationTests
      - name: Full Django regression suite
        run: python manage.py test
      - name: Load-test safety contract
        run: python -m unittest load_tests.test_contract
      - name: Production-acceptance and rollback contracts
        working-directory: .
        run: python -m unittest discover -s scripts/release -p 'test_*.py'

  frontend-quality:
    name: Frontend lint, types, build, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend linting
        run: npm run lint
      - name: TypeScript checks
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Frontend unit tests
        run: npm run test:unit
