name: Staging SMTP credential-format check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-smtp-credential-format.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Inspect non-sensitive SMTP credential shape and sender alignment
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, email.utils
          key = os.environ.get("RENDER_API_KEY","")
          if not key:
              raise SystemExit("BLOCK: protected Render API credential missing")
          base = "https://api.render.com/v1/services/srv-dam2iivcgkoc7383tq50"
          def get(url):
              req = urllib.request.Request(url,headers={"Authorization":"Bearer "+key,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.load(response)
          service = get(base)
          if service.get("id")!="srv-dam2iivcgkoc7383tq50" or service.get("ownerId")!="tea-csppi8l6l47c73dk9c90":
              raise SystemExit("BLOCK: wrong Render service")
          records=get(base+"/env-vars?limit=100")
          if isinstance(records,dict):
              records=records.get("envVars",records.get("data",[]))
          e={}
          for row in records:
              v=row.get("envVar",row)
              if isinstance(v,dict) and isinstance(v.get("key"),str):
                  e[v["key"]]=v.get("value") or ""
          username=e.get("EMAIL_HOST_USER") or e.get("GMAIL_USER") or e.get("GMAIL_EMAIL") or ""
          password=e.get("EMAIL_HOST_PASSWORD") or e.get("GMAIL_APP_PASSWORD") or ""
          sender=email.utils.parseaddr(e.get("DEFAULT_FROM_EMAIL",""))[1]
          print("STAGING_SERVICE=VERIFIED")
          print("SMTP_HOST_GMAIL="+str(e.get("EMAIL_HOST","").lower()=="smtp.gmail.com"))
          print("SMTP_TLS_MODE_VALID="+str(e.get("EMAIL_PORT")=="587" and e.get("EMAIL_USE_TLS","").lower()=="true" and e.get("EMAIL_USE_SSL","").lower()=="false"))
          parsed_login=email.utils.parseaddr(username)[1]
          print("USERNAME_IS_EMAIL="+str("@" in username and not any(ch.isspace() for ch in username)))
          print("LOGIN_HAS_AT_SIGN="+str("@" in username))
          print("LOGIN_CONTAINS_WHITESPACE="+str(any(ch.isspace() for ch in username)))
          print("LOGIN_PARSES_TO_EMAIL="+str(bool(parsed_login and "@" in parsed_login and not any(ch.isspace() for ch in parsed_login))))
          print("LOGIN_BECOMES_EMAIL_AFTER_STRIP="+str("@" in username.strip() and not any(ch.isspace() for ch in username.strip())))
          print("FROM_MATCHES_PARSED_LOGIN="+str(sender.lower()==parsed_login.lower()))
          print("FROM_ADDRESS_IS_VALID="+str(bool(sender and "@" in sender and not any(ch.isspace() for ch in sender))))
          print("FROM_ADDRESS_IS_GMAIL="+str(sender.lower().endswith("@gmail.com")))
          print("FROM_ADDRESS_MATCHES_KNOWN_AMARIS_SENDER="+str(sender.lower() in {"bethuelthipe@gmail.com", "bethuelmoukangwe8@gmail.com"}))
          print("LOGIN_IS_COMMON_PLACEHOLDER="+str(username.lower() in {"your_email", "your-email", "username", "gmail", "smtp", "yourname", "your-email@gmail.com", "your_email@gmail.com"}))
          print("FROM_ADDRESS_MATCHES_LOGIN="+str(sender.lower()==username.lower()))
          print("PASSWORD_PRESENT="+str(bool(password)))
          print("PASSWORD_HAS_WRAPPING_QUOTES="+str(password.startswith(("'",'"')) or password.endswith(("'",'"'))))
          print("PASSWORD_CONTAINS_WHITESPACE="+str(any(ch.isspace() for ch in password)))
          print("PASSWORD_HAS_16_CHARS_AFTER_REMOVING_SPACES="+str(len(password.replace(" ",""))==16))
          print("PASSWORD_MATCHES_EXPECTED_GMAIL_APP_FORMAT="+str(len(password.replace(" ",""))==16 and password.replace(" ","").isalnum()))
          print("SMTP_REAL_LOGIN=NOT_ATTEMPTED")
          print("MAIL_SENT=NO")
          print("No credential values, hashes, or partial passwords were logged.")
          PY
