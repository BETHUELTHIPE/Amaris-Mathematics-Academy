name: Staging Genuine PayFast ITN Fix Regression
on:
  push:
    branches: [fix/staging-payfast-itn-20261020]
    paths:
      - "backend/content/services/payments.py"
      - "backend/content/test_payfast_itn_signature.py"
      - ".github/workflows/staging-real-itn-fix-validation.yml"
permissions:
  contents: read
jobs:
  payment-itn-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: synthetic-stage-payfast-regression
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      PAYFAST_MODE: sandbox
      PAYFAST_MERCHANT_ID: synthetic
      PAYFAST_MERCHANT_KEY: synthetic
      PAYFAST_PASSPHRASE: synthetic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Check migration graph, security and PayFast ITN regression
        working-directory: backend
        run: |
          python -m black --check content/services/payments.py content/test_payfast_itn_signature.py
          python -m ruff check content/services/payments.py content/test_payfast_itn_signature.py
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run
          python manage.py test content.test_payfast_itn_signature content.test_payfast_security content.test_live_classes content.test_invoice_archive
