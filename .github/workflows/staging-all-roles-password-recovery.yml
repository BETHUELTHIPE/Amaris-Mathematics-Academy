name: Staging Shared Password Recovery Gate
on:
  push:
    branches: ["test/shared-password-recovery-all-roles-staging-20261026"]
    paths:
      - "frontend/app/forgot-password/**"
      - "frontend/app/reset-password/**"
      - "frontend/tests/password-recovery.test.mjs"
      - ".github/workflows/staging-all-roles-password-recovery.yml"
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Type check staging password recovery
        working-directory: frontend
        run: npm run typecheck
      - name: Test signed reset authorization and every website role
        working-directory: frontend
        run: node --test tests/password-recovery-proof.test.mjs tests/password-recovery.test.mjs tests/recovery-safety.test.mjs tests/registration-actions.test.mjs tests/tutor-applications.test.mjs
