name: Staging SMTP GitHub Secret Presence (No Send)
on:
  push:
    branches: ["qa/staging-django-letterhead-inbox-20261028"]
    paths: ["ops/staging-smtp-github-secret-assertion-20261028.txt"]
permissions:
  contents: read
jobs:
  staging-secret-check:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 3
    env:
      SMTP_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
    steps:
      - name: Confirm exact staging secret without exposing it
        shell: bash
        run: |
          if [ -n "$SMTP_PASSWORD" ]; then
            echo "PASS: EMAIL_HOST_PASSWORD is available to staging GitHub Actions"
          else
            echo "BLOCK: EMAIL_HOST_PASSWORD is unavailable in this GitHub Actions environment"
            exit 1
          fi
