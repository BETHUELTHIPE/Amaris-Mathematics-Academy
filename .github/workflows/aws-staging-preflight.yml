name: AWS staging deployment preflight

on:
  push:
    branches: [ops/aws-staging-preflight-20261125]
    paths:
      - .github/workflows/aws-staging-preflight.yml
      - deploy/aws/frontend.Dockerfile

permissions: {}

jobs:
  verify:
    name: Verify the Stockholm staging account and existing infrastructure
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ""
      AWS_MAX_ATTEMPTS: "2"
      AWS_PREFLIGHT_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

    steps:
      - name: Assume the staging role
        if: env.AWS_PREFLIGHT_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_PREFLIGHT_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: "110156539003"
          mask-aws-account-id: true
          retry-max-attempts: 2

      - name: Read AWS identity and regional inventory
        shell: bash
        env:
          STAGING_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          STAGING_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          STAGING_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_PREFLIGHT_ROLE" ]]; then
            if [[ -z "$STAGING_AWS_ACCESS_KEY_ID" || -z "$STAGING_AWS_SECRET_ACCESS_KEY" ]]; then
              echo "::error::No staging AWS authentication is configured. Set AWS_ROLE_TO_ASSUME or add both staging AWS key secrets."
              exit 1
            fi
            export AWS_ACCESS_KEY_ID="$STAGING_AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$STAGING_AWS_SECRET_ACCESS_KEY"
            if [[ -n "$STAGING_AWS_SESSION_TOKEN" ]]; then
              export AWS_SESSION_TOKEN="$STAGING_AWS_SESSION_TOKEN"
            fi
          fi
          unset STAGING_AWS_ACCESS_KEY_ID STAGING_AWS_SECRET_ACCESS_KEY STAGING_AWS_SESSION_TOKEN

          if ! identity="$(aws sts get-caller-identity --query '[Account,Arn]' --output text 2>/dev/null)"; then
            echo "::error::AWS STS could not authenticate the configured staging identity."
            exit 1
          fi
          read -r account principal <<< "$identity"
          if [[ "$account" != '110156539003' ]]; then
            echo "::error::The configured staging identity belongs to a different AWS account."
            exit 1
          fi
          if [[ "$principal" == *:root ]]; then
            echo "::error::Use a dedicated staging identity before deploying."
            exit 1
          fi
          echo "AWS account verified for Stockholm (eu-north-1)."

          inventory() {
            local label="$1"
            local count
            shift
            if count="$(aws "$@" --output text 2>/dev/null)" && [[ "$count" =~ ^[0-9]+$ ]]; then
              printf '%s count in Stockholm is %s.\n' "$label" "$count"
            else
              printf '%s inventory is unavailable to this identity.\n' "$label"
            fi
          }

          inventory "Running EC2 instance" ec2 describe-instances \
            --filters Name=instance-state-name,Values=running --query 'length(Reservations[].Instances[])'
          inventory "ECS cluster" ecs list-clusters --query 'length(clusterArns)'
          inventory "ECR repository" ecr describe-repositories --query 'length(repositories)'
          inventory "Application or Network Load Balancer" elbv2 describe-load-balancers --query 'length(LoadBalancers)'

          echo 'Account-specific Free Tier EC2 instance types in Stockholm:'
          aws ec2 describe-instance-types --filters Name=free-tier-eligible,Values=true \
            --query 'sort_by(InstanceTypes,&InstanceType)[].[InstanceType,MemoryInfo.SizeInMiB,ProcessorInfo.SupportedArchitectures[0]]' \
            --output text

          echo 'Stockholm staging stack status and failures:'
          aws cloudformation describe-stacks --stack-name amaris-aws-staging \
            --query 'Stacks[0].[StackStatus,StackStatusReason]' --output text || true
          aws cloudformation describe-stack-events --stack-name amaris-aws-staging \
            --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].[LogicalResourceId,ResourceStatusReason]' \
            --output text || true
          instance="$(aws cloudformation describe-stacks --stack-name amaris-aws-staging \
            --query 'Stacks[0].Outputs[?OutputKey==`InstanceId`].OutputValue | [0]' --output text 2>/dev/null || true)"
          if [[ "$instance" =~ ^i-[a-f0-9]+$ ]]; then
            echo 'Latest Amaris host startup command status:'
            aws ssm list-command-invocations --instance-id "$instance" \
              --query 'CommandInvocations[?Comment==`Start Amaris Stockholm staging`].[Status,StatusDetails,RequestedDateTime]' \
              --max-items 10 --output text || true
            command="$(cat <<'SSM'
          set -eu
          printf 'Docker daemon: '; systemctl is-active docker || true
          printf 'Cloud init: '; cloud-init status || true
          if command -v docker >/dev/null; then
            docker ps -a --format '{{.Names}} {{.Status}}' || true
          fi
          staging=/opt/amaris-staging
          for probe in backend.env frontend.env database-check.log certbot.log letsencrypt/live/amaris-staging/fullchain.pem; do
            if test -s "$staging/$probe"; then
              printf '%s exists\n' "$probe"
            fi
          done
          if test -s "$staging/database-check.log"; then
            grep -Eoi 'connection refused|connection timed out|password authentication failed|migration conflict|permission denied|unapplied migrations|InvalidSchemaName' \
              "$staging/database-check.log" | sort -u || true
          fi
          if test -s "$staging/certbot.log"; then
            grep -Eoi 'Successfully received certificate|too many certificates|connection refused|no valid IP addresses|Timeout during connect|Some challenges have failed|unrecognized arguments' \
              "$staging/certbot.log" | sort -u || true
          fi
          SSM
            )"
            parameters="$(jq -cn --arg command "$command" '{commands:[$command],executionTimeout:["30"]}')"
            check="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
              --parameters "$parameters" --timeout-seconds 30 --comment 'Read Amaris staging host health' \
              --query Command.CommandId --output text)"
            if aws ssm wait command-executed --command-id "$check" --instance-id "$instance"; then
              aws ssm get-command-invocation --command-id "$check" --instance-id "$instance" \
                --query StandardOutputContent --output text
            fi
          fi

      - name: Check staging application configuration
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_SCHEMA: ${{ vars.STAGING_DATABASE_SCHEMA || secrets.STAGING_DATABASE_SCHEMA }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.STAGING_SUPABASE_S3_ACCESS_KEY_ID }}
          STAGING_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_SUPABASE_S3_SECRET_ACCESS_KEY }}
          STAGING_SMTP_USER: ${{ secrets.AMARIS_NOTIFY_SMTP_USER }}
          STAGING_SMTP_PASSWORD: ${{ secrets.AMARIS_NOTIFY_SMTP_APP_PASSWORD }}
          PAYFAST_SANDBOX_MERCHANT_ID: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_ID }}
          PAYFAST_SANDBOX_MERCHANT_KEY: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_KEY }}
          PAYFAST_SANDBOX_PASSPHRASE: ${{ secrets.PAYFAST_SANDBOX_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in \
            STAGING_DATABASE_URL STAGING_DATABASE_SCHEMA STAGING_SUPABASE_PUBLISHABLE_KEY \
            STAGING_SUPABASE_S3_ACCESS_KEY_ID STAGING_SUPABASE_S3_SECRET_ACCESS_KEY \
            STAGING_SMTP_USER STAGING_SMTP_PASSWORD \
            PAYFAST_SANDBOX_MERCHANT_ID PAYFAST_SANDBOX_MERCHANT_KEY PAYFAST_SANDBOX_PASSPHRASE; do
            if [[ -n "${!name}" ]]; then
              printf 'Staging setting %s is available.\n' "$name"
            else
              printf 'Staging setting %s is missing.\n' "$name"
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the PostgreSQL check client
        run: python -m pip install 'psycopg[binary]==3.2.10'

      - name: Check if the existing Render staging settings can be reused
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.environ.get("RENDER_API_KEY")
          if not key:
              print("Render staging credential transfer is unavailable because this job has no Render API authentication.")
              raise SystemExit(0)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          url = "https://api.render.com/v1/services/srv-dam2iivcgkoc7383tq50/env-vars?limit=100"
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {key}"})
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=10) as response:
                  records = json.loads(response.read(1024 * 1024))
          except urllib.error.HTTPError as error:
              print(f"Render staging configuration could not be read (HTTP {error.code}).")
              raise SystemExit(0)
          except (urllib.error.URLError, TimeoutError, ValueError):
              print("Render staging configuration could not be read.")
              raise SystemExit(0)

          if not isinstance(records, list):
              print("Render staging configuration could not be verified.")
              raise SystemExit(0)

          values = {record["envVar"]["key"]: record["envVar"]["value"] for record in records
                    if isinstance(record, dict) and isinstance(record.get("envVar"), dict)
                    and isinstance(record["envVar"].get("key"), str) and isinstance(record["envVar"].get("value"), str)}
          available = {key for key, value in values.items() if value}
          for name in ("DATABASE_URL", "DATABASE_SCHEMA", "SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY",
                       "SUPABASE_S3_ACCESS_KEY_ID", "SUPABASE_S3_SECRET_ACCESS_KEY", "EMAIL_HOST_USER",
                       "EMAIL_HOST_PASSWORD"):
              print(f"Render staging setting {name} is {'available' if name in available else 'missing'}.")

          project = "atyhhjwwxgzeurnwayay"
          if values.get("SUPABASE_URL", "").rstrip("/") != f"https://{project}.supabase.co":
              print("Staging Supabase Auth project does not match the isolated staging project.")
              raise SystemExit(0)

          schema = values.get("DATABASE_SCHEMA") or "public"
          if not re.fullmatch(r"[a-z_][a-z0-9_]{0,62}", schema):
              print("Staging database schema setting is invalid.")
              raise SystemExit(0)
          try:
              dsn = urllib.parse.urlsplit(values.get("DATABASE_URL", ""))
              port = dsn.port
          except ValueError:
              print("Render staging database connection settings are invalid.")
              raise SystemExit(0)

          host = dsn.hostname or ""
          user = urllib.parse.unquote(dsn.username or "")
          database = urllib.parse.unquote(dsn.path.lstrip("/"))
          supabase = (
              (host == f"db.{project}.supabase.co" and user == "postgres")
              or (host.endswith(".pooler.supabase.com") and user.endswith("." + project))
          )
          render = (
              host in ("dpg-dam2gj6k1f9s73e81tmg-a", "dpg-dam2gj6k1f9s73e81tmg-a.frankfurt-postgres.render.com")
              and user == "amaris_staging_postgres_user"
              and database == "amaris_staging_postgres"
          )
          if dsn.scheme not in ("postgres", "postgresql") or not (supabase or render):
              print("The existing staging database target could not be verified as isolated.")
              raise SystemExit(0)
          if render:
              print("Render staging currently uses a Render-hosted PostgreSQL database.")
              host = "dpg-dam2gj6k1f9s73e81tmg-a.frankfurt-postgres.render.com"
          else:
              print("Render staging points to the isolated staging Supabase PostgreSQL project.")

          import psycopg
          try:
              with psycopg.connect(
                  host=host, port=port or 5432, user=user, dbname=database,
                  password=urllib.parse.unquote(dsn.password or ""), sslmode="require",
                  connect_timeout=8,
              ) as connection:
                  connection.execute("SET TRANSACTION READ ONLY")
                  site_table = connection.execute(
                      "SELECT to_regclass(%s) IS NOT NULL", (f"{schema}.content_sitesettings",)
                  ).fetchone()[0]
          except (psycopg.Error, OSError):
              print("The staging database connection is unavailable outside Render.")
          else:
              if site_table:
                  print("An external read-only connection confirmed the staging CMS table.")
              else:
                  print("The staging database is reachable but its CMS table was not found.")
          PY

  build-frontend:
    name: Build and smoke-test the Stockholm frontend container
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FRONTEND_SHA: fa28c343dba6c4e23510ba69faf2a6c5a8c42877
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.FRONTEND_SHA }}
          path: frontend-release
          persist-credentials: false
      - name: Build the ARM64 frontend image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frontend-release rev-parse HEAD)" = "$FRONTEND_SHA"
          printf '%s\n' '.env' '.env.*' 'node_modules' '.output' 'dist' > frontend-release/frontend/.dockerignore
          docker build --file deploy/aws/frontend.Dockerfile \
            --label "org.opencontainers.image.revision=$FRONTEND_SHA" \
            --tag amaris-staging-frontend:test frontend-release/frontend
      - name: Serve and verify the frontend release
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' amaris-staging-frontend:test)" = arm64
          docker run --detach --rm --name amaris-frontend-smoke -p 127.0.0.1:3000:3000 \
            -e SITE_URL=http://127.0.0.1:3000 amaris-staging-frontend:test
          for attempt in {1..20}; do
            if curl -fSs --max-time 5 http://127.0.0.1:3000/health/ready > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          python3 -c 'import json; assert json.load(open("/tmp/health.json"))["status"] == "ok"'
          curl -fSs --max-time 15 http://127.0.0.1:3000/ > /tmp/amaris-home.html
          grep -Fqi 'Amaris Mathematics Academy' /tmp/amaris-home.html
      - name: Show bounded frontend diagnostics on failure
        if: failure()
        run: docker logs --tail 50 amaris-frontend-smoke 2>/dev/null || true
