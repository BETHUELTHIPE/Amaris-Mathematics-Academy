name: Amaris Controlled Production Recovery Email Apply
on:
  push:
    branches: [ops/production-recovery-template-apply-20261026]
    paths: [ops/production-recovery-template-apply-request.txt]
permissions:
  contents: read
concurrency:
  group: amaris-prod-supabase-recovery-config
  cancel-in-progress: false
jobs:
  apply-recovery-prod:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_AUTH_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify offline recovery template and session-security rules
        run: python -m unittest discover -s tests -p test_configure_supabase_auth_otp.py -v
      - name: Ensure live frontend revision is serving a safe recovery page
        run: |
          python3 - <<'PY'
          import urllib.request
          req=urllib.request.Request("https://amaris-mathematics-academy-live-students.onrender.com/reset-password/verify",headers={"User-Agent":"AmarisRecoveryReleasePreflight"})
          with urllib.request.urlopen(req,timeout=28) as response:
              if response.status != 200 or b"Six-digit recovery code" not in response.read(350000):
                  raise SystemExit("BLOCK: live recovery code page not deployed")
          print("PASS: live reset verification UI available before changing email template")
          PY
      - name: Confirm production SMTP and authenticated Site URL
        run: |
          python3 - <<'PY'
          import os,json
          from urllib.request import Request,urlopen
          token=os.environ.get("SUPABASE_ACCESS_TOKEN","")
          if not token: raise SystemExit("BLOCK: production token unavailable")
          req=Request("https://api.supabase.com/v1/projects/epkcuseloinygkakxxdu/config/auth",headers={"Authorization":"Bearer "+token})
          with urlopen(req,timeout=20) as res:
              config=json.load(res)
          expected="https://amaris-mathematics-academy-live-students.onrender.com"
          if config.get("site_url","").rstrip("/")!=expected:
              raise SystemExit("BLOCK: Auth Site URL does not match production students app")
          if not config.get("smtp_host") or not config.get("smtp_admin_email") or config.get("external_email_enabled") is not True:
              raise SystemExit("BLOCK: production Auth SMTP/email missing")
          print("PASS: production Auth URL and SMTP verified; secrets not exposed")
          PY
      - name: Apply vetted Amaris recovery template to production and read back
        run: python scripts/configure_supabase_auth_otp.py --project-ref epkcuseloinygkakxxdu --mode apply
