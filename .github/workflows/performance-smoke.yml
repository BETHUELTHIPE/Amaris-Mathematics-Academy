name: Staging Performance Smoke

on:
  workflow_call:
    inputs:
      target_url:
        description: Optional staging base URL override
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  staging-performance-smoke:
    name: Staging Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CONFIGURED_TARGET_URL: ${{ inputs.target_url != '' && inputs.target_url || vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: browser-actions/setup-chrome@v1
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Validate staging target
        shell: bash
        run: |
          case "$CONFIGURED_TARGET_URL" in
            https://*) ;;
            *) echo "STAGING_URL must be a non-empty HTTPS URL." >&2; exit 2 ;;
          esac
          echo "TARGET_URL=${CONFIGURED_TARGET_URL%/}" >> "$GITHUB_ENV"
      - name: Create staging Lighthouse configuration
        shell: bash
        run: |
          jq --arg base "$TARGET_URL" '
            .ci.collect |= (
              del(.startServerCommand, .startServerReadyPattern, .startServerReadyTimeout)
              | .url = [$base + "/", $base + "/courses", $base + "/contact"]
            )
          ' lighthouserc.json > /tmp/staging-lighthouserc.json
      - name: Run Lighthouse budgets against staging
        run: npx lhci autorun --config=/tmp/staging-lighthouserc.json
      - name: Preserve Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
