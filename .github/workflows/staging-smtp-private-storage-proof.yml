name: Real Staging SMTP and Private Supabase PDF Proof

on:
  pull_request:
    paths:
      - .github/workflows/staging-smtp-private-storage-proof.yml
      - backend/scripts/staging_smtp_supabase_acceptance.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-external-providers:
    name: Actual staging S3 PDF and SMTP attachment
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "synthetic-staging-transport-test-only"
      DATABASE_URL: "sqlite:////tmp/staging-transport.sqlite3"
      SUPABASE_DATABASE_REQUIRED: "false"
      DATABASE_SSL_REQUIRED: "false"
      AMARIS_STAGING_SUPABASE_PROJECT_REF: ${{ secrets.AMARIS_STAGING_SUPABASE_PROJECT_REF }}
      AMARIS_STAGING_S3_ENDPOINT: ${{ secrets.AMARIS_STAGING_S3_ENDPOINT }}
      AMARIS_STAGING_STUDENT_BUCKET: ${{ secrets.AMARIS_STAGING_STUDENT_BUCKET }}
      AMARIS_STAGING_S3_ACCESS_KEY_ID: ${{ secrets.AMARIS_STAGING_S3_ACCESS_KEY_ID }}
      AMARIS_STAGING_S3_SECRET_ACCESS_KEY: ${{ secrets.AMARIS_STAGING_S3_SECRET_ACCESS_KEY }}
      AMARIS_STAGING_SMTP_HOST: ${{ secrets.AMARIS_STAGING_SMTP_HOST }}
      AMARIS_STAGING_SMTP_PORT: ${{ secrets.AMARIS_STAGING_SMTP_PORT }}
      AMARIS_STAGING_SMTP_USERNAME: ${{ secrets.AMARIS_STAGING_SMTP_USERNAME }}
      AMARIS_STAGING_SMTP_PASSWORD: ${{ secrets.AMARIS_STAGING_SMTP_PASSWORD }}
      AMARIS_STAGING_SMTP_FROM: ${{ secrets.AMARIS_STAGING_SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify isolated staging credentials exist (never print values)
        shell: bash
        run: |
          set -euo pipefail
          for name in AMARIS_STAGING_SUPABASE_PROJECT_REF AMARIS_STAGING_S3_ENDPOINT AMARIS_STAGING_STUDENT_BUCKET AMARIS_STAGING_S3_ACCESS_KEY_ID AMARIS_STAGING_S3_SECRET_ACCESS_KEY AMARIS_STAGING_SMTP_HOST AMARIS_STAGING_SMTP_USERNAME AMARIS_STAGING_SMTP_PASSWORD AMARIS_STAGING_SMTP_FROM; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing secure staging secret: $name";exit 1;fi
          done
          if [ "$AMARIS_STAGING_SUPABASE_PROJECT_REF" = "epkcuseloinygkakxxdu" ]; then
            echo "::error::This is the production Supabase project; staging requires a different project"
            exit 1
          fi
          echo "STAGING_EXTERNAL_PROVIDER_CREDENTIALS_PRESENT=YES"
      - name: Install pinned Django dependencies
        run: python -m pip install -r backend/requirements.txt >/dev/null
      - name: Upload/download/delete staging PDF and send real SMTP attachment
        working-directory: backend
        run: python manage.py shell -c 'exec(open("scripts/staging_smtp_supabase_acceptance.py").read())'
