name: Payment Security

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/content/**"
      - "backend/requirements*.txt"
      - ".github/workflows/payment-security.yml"
  push:
    branches: [main]
    paths:
      - "backend/content/**"
      - "backend/requirements*.txt"
      - ".github/workflows/payment-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payfast-sandbox:
    name: PayFast sandbox and idempotency tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_payment_ci
          POSTGRES_USER: amaris_payment_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amaris_payment_ci -d amaris_payment_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgresql://amaris_payment_ci@127.0.0.1:5432/amaris_payment_ci"
      DATABASE_SSL_REQUIRED: "false"
      # Payment tests are deterministic and mock/sandbox only. Never add live
      # PayFast credentials or production payment endpoints to this job.
    steps:
      - uses: actions/checkout@v7
      - name: Generate ephemeral Django secret
        shell: bash
        run: printf 'DJANGO_SECRET_KEY=%s\n' "$(openssl rand -hex 64)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Reject live payment configuration
        shell: bash
        run: |
          set -euo pipefail
          if env | grep -E '^PAYFAST_(LIVE|PRODUCTION|MERCHANT|PASSPHRASE|URL)='; then
            echo "Live or credential-bearing PayFast environment variables are forbidden in payment tests." >&2
            exit 1
          fi
          if grep -R -n -E 'https://(www\.)?payfast\.co\.za/eng/process' content/test_payments.py content/test_payfast_security.py; then
            echo "Live PayFast process URL found in payment tests." >&2
            exit 1
          fi
      - name: Django migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run authoritative payment suite
        run: >-
          python manage.py test
          content.tests.PaymentReconciliationTests
          content.test_payments
          content.test_payfast_security
