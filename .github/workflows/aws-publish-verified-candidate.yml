name: Publish verified Amaris staging candidate images
on:
  pull_request:
    branches: [release/aws-full-platform-20261125]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/aws-verified-release-20261126' && github.base_ref == 'release/aws-full-platform-20261125'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify successful run and both candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '45713482726'
          EXPECTED_SHA: 3953c1d804153245da2d503d195178399aa031da
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          jq -e --arg sha "$EXPECTED_SHA" '.workflow_id==430879129 and .head_branch=="release/aws-full-platform-20261125" and .head_sha==$sha and .status=="completed" and .conclusion=="success"' <<< "$run"
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100")"
          jq -e '.total_count==2 and all(.jobs[]; .conclusion=="success" and any(.steps[]; .name=="Scan candidate container for fixable high and critical vulnerabilities" and .conclusion=="success") and any(.steps[]; .name=="Archive tested and scanned immutable candidate image" and .conclusion=="success"))' <<< "$jobs"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          jq -e '[.artifacts[]|select(.name=="aws-integration-backend-45713482726" and .expired==false and .id==15068198618 and .digest=="sha256:9bc41a2ef63c8b139f59dd8ce7999b3e14cc7d62958c896028bcf0c303c824b5")]|length==1' <<< "$artifacts"
          jq -e '[.artifacts[]|select(.name=="aws-integration-frontend-45713482726" and .expired==false and .id==15068173129 and .digest=="sha256:8f7721ead1db5ff5b81f6b32450df21c2d336adf9e559136967b3702253d82bb")]|length==1' <<< "$artifacts"
  publish:
    needs: verify
    runs-on: ubuntu-24.04-arm
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ""
      ECR_REPO: 110156539003.dkr.ecr.eu-north-1.amazonaws.com/amaris-staging-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aws-integration-backend-45713482726
          path: evidence/backend
          run-id: '45713482726'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: aws-integration-frontend-45713482726
          path: evidence/frontend
          run-id: 45713482726
          github-token: ${{ github.token }}
      - name: Verify image checksums, architecture and image IDs
        run: |
          set -euo pipefail
          for component in backend frontend; do
            (
              cd "evidence/$component"
              sha256sum -c "$component-image.sha256"
              docker load -i "$component-image.tar.gz"
              test "$(docker image inspect --format '{{.Architecture}}' "amaris-$component:candidate")" = arm64
              test "$(docker image inspect --format '{{.Id}}' "amaris-$component:candidate")" = "$(cat "$component-image-id.txt")"
            )
          done
      - name: Authenticate using existing staging OIDC with ECR-only session policy
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ECR_PUBLISH_ROLE || vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*","Condition":{"StringEquals":{"aws:RequestedRegion":"eu-north-1"}}},{"Effect":"Allow","Action":["ecr:BatchCheckLayerAvailability","ecr:InitiateLayerUpload","ecr:UploadLayerPart","ecr:CompleteLayerUpload","ecr:PutImage","ecr:DescribeImages"],"Resource":"arn:aws:ecr:eu-north-1:110156539003:repository/amaris-staging-frontend"}]}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Publish verified images and record registry digests
        env:
          INTEGRATION_RUN: '45713482726'
          INTEGRATION_SHA: 3953c1d804153245da2d503d195178399aa031da
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"
          mkdir -p release-manifest
          for component in backend frontend; do
            tag="candidate-$INTEGRATION_RUN-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$component"
            docker tag "amaris-$component:candidate" "$ECR_REPO:$tag"
            docker push "$ECR_REPO:$tag"
            digest="$(aws ecr describe-images --repository-name amaris-staging-frontend --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s\n' "$ECR_REPO" "$digest" > "release-manifest/$component-image.txt"
          done
          jq -n --arg run "$INTEGRATION_RUN" --arg sha "$INTEGRATION_SHA" --arg backend "$(cat release-manifest/backend-image.txt)" --arg frontend "$(cat release-manifest/frontend-image.txt)" '{integration_run:$run,source_sha:$sha,backend:$backend,frontend:$frontend}' > release-manifest/images.json
          docker logout "${ECR_REPO%%/*}"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-ecr-candidate-${{ github.run_id }}
          path: release-manifest/
          if-no-files-found: error
