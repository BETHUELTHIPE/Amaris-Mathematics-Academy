name: Publish tested Amaris candidate to Docker Hub
on:
  push:
    branches: ["ops/publish-dockerhub-tested-82b1a50-20261028"]
    paths: [".github/workflows/publish-tested-dockerhub-82b1a50.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: dockerhub-candidate-82b1a50b678c43b425f3a8756b47f48f62914fce
  cancel-in-progress: false
env:
  IMAGE: docker.io/bethuelm/amaris-mathematics-academy
  SOURCE_SHA: 82b1a50b678c43b425f3a8756b47f48f62914fce
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify successful source acceptance runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = "BETHUELTHIPE/Amaris-Mathematics-Academy"
          expected_head = "f06be62003a63b2f691fb5e488a3902014809636"
          runs = {
              40769109641: "Quality Gates and Release",
              40769109567: "Backup Restore Verification",
              40769109553: "Payment Security",
              40769109761: "Invoice Letterhead Release Gate",
          }
          for run_id, name in runs.items():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              if (
                  run.get("head_sha") != expected_head
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "success"
                  or run.get("name") != name
              ):
                  raise SystemExit(f"BLOCK: acceptance run {run_id} did not match approved source")
              print(f"PASS: {name}, run {run_id}")
          PY
      - uses: actions/checkout@v4
        with:
          ref: 82b1a50b678c43b425f3a8756b47f48f62914fce
          persist-credentials: false
      - name: Verify exact tested backend tree
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:backend)" = "97475e4a4244792f6d11e2678b7abb3526677de0"
      - name: Check managed registry credential is available
        env:
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("REGISTRY_TOKEN"):
              raise SystemExit("BLOCK: managed DOCKERHUB_TOKEN is unavailable")
          print("PASS: managed registry credential is configured")
          PY
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: bethuelm
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push exact tested candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=amaris-backend
          cache-to: type=gha,mode=max,scope=amaris-backend
      - name: Verify published digest and both platforms
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools inspect --raw "$IMAGE:$SOURCE_SHA" > /tmp/tag-manifest.json
          docker buildx imagetools inspect --raw "$IMAGE@$IMAGE_DIGEST" > /tmp/digest-manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = json.loads(Path("/tmp/tag-manifest.json").read_text())
          digest = json.loads(Path("/tmp/digest-manifest.json").read_text())
          if tag != digest:
              raise SystemExit("BLOCK: image tag does not resolve to the pushed digest")
          platforms = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture"))
              for item in digest.get("manifests", [])
          }
          if not {("linux", "amd64"), ("linux", "arm64")} <= platforms:
              raise SystemExit("BLOCK: published image is missing a required platform")
          reference = os.environ["IMAGE"] + ":" + os.environ["SOURCE_SHA"]
          immutable = os.environ["IMAGE"] + "@" + os.environ["IMAGE_DIGEST"]
          print("PASS: registry tag, digest, linux/amd64 and linux/arm64 verified")
          print("IMAGE=" + reference)
          print("IMMUTABLE_IMAGE=" + immutable)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write(f"Published candidate: `{reference}`\n\n")
              report.write(f"Immutable image: `{immutable}`\n\n")
              report.write("Platforms: linux/amd64, linux/arm64.\n")
          PY
