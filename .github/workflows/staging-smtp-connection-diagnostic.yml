name: Staging SMTP Connection Diagnostic (No Email)
on:
  push:
    branches: ["qa/staging-django-letterhead-inbox-20261028"]
    paths: ["ops/staging-smtp-connection-diagnostic-request.txt"]
permissions:
  contents: read
jobs:
  smtp-connection-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Check SMTP handshake and authentication phases without sending an email
        run: |
          python3 - <<'PY'
          import json,os,smtplib,ssl,urllib.request
          from urllib.parse import urlsplit
          ref="atyhhjwwxgzeurnwayay"
          sid="srv-dam2iivcgkoc7383tq50"
          token=os.environ.get("RENDER_API_KEY","")
          if not token: raise SystemExit("BLOCK: protected staging Render API credential missing")
          base="https://api.render.com/v1/services/"+sid
          def get(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response: return json.load(response)
              except Exception:
                  raise SystemExit("BLOCK: staging Render environment read failed") from None
          svc=get(base)
          if svc.get("id")!=sid or svc.get("ownerId")!="tea-csppi8l6l47c73dk9c90" or svc.get("branch")!="ops/staging-known-good-af8709c-20261019":
              raise SystemExit("BLOCK: incorrect staging Render service")
          rows=get(base+"/env-vars?limit=100")
          if isinstance(rows,dict): rows=rows.get("envVars",rows.get("data",[]))
          env={r.get("envVar",r).get("key"):r.get("envVar",r).get("value") or "" for r in rows if isinstance(r.get("envVar",r),dict)}
          db=urlsplit(env.get("DATABASE_URL",""))
          if env.get("SUPABASE_PROJECT_REF")!=ref or ref not in ((db.username or "")+" "+(db.hostname or "")):
              raise SystemExit("BLOCK: staging database identity mismatch")
          host=env.get("EMAIL_HOST","")
          user=env.get("EMAIL_HOST_USER","")
          password=env.get("EMAIL_HOST_PASSWORD","")
          sender=env.get("DEFAULT_FROM_EMAIL","")
          if host!="smtp.gmail.com" or str(env.get("EMAIL_PORT"))!="587" or env.get("EMAIL_USE_TLS","").lower()!="true" or not user or not password or "@" not in sender:
              raise SystemExit("BLOCK: incomplete staging SMTP configuration")
          print("PASS: Staging SMTP environment and database identity")
          print("INFO: Staging sender same as SMTP user:", "YES" if sender.strip().lower()==user.strip().lower() else "NO_ALIAS_MAY_REQUIRE_AUTHORIZATION")
          phase="connect"
          try:
              with smtplib.SMTP(host=host, port=587, timeout=14) as server:
                  print("PASS: SMTP connect")
                  phase="ehlo"
                  server.ehlo_or_helo_if_needed()
                  print("PASS: SMTP EHLO")
                  phase="starttls"
                  server.starttls(context=ssl.create_default_context())
                  print("PASS: SMTP STARTTLS")
                  phase="ehlo_after_tls"
                  server.ehlo()
                  print("PASS: SMTP EHLO after TLS")
                  phase="authentication"
                  server.login(user,password)
                  print("PASS: SMTP login")
          except Exception as error:
              print("BLOCK: SMTP phase="+phase+" exception_class="+type(error).__name__)
              raise SystemExit(1) from None
          print("PASS: End-to-end SMTP connection and authentication; no email was sent")
          PY
