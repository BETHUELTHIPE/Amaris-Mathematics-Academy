name: Staging Booking Notification Gate

on:
  pull_request:
    branches:
      - ops/staging-known-good-af8709c-20261019
    paths:
      - "backend/content/**"
      - "backend/amaris_cms/**"
      - ".github/workflows/staging-booking-notification-gate.yml"
  push:
    branches:
      - ops/staging-known-good-af8709c-20261019
    paths:
      - "backend/content/**"
      - "backend/amaris_cms/**"
      - "backend/requirements*.txt"
      - ".github/workflows/staging-booking-notification-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-booking-notification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-booking-acceptance:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_staging_gate
          POSTGRES_USER: amaris_staging_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amaris_staging_gate -d amaris_staging_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgresql://amaris_staging_gate@127.0.0.1:5432/amaris_staging_gate"
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_TASK_EAGER_PROPAGATES: "true"
      PAYFAST_MODE: "sandbox"
      PAYFAST_ENV: "sandbox"
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Generate isolated test secret and reject live merchant configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 64)" >> "$GITHUB_ENV"
          test "$PAYFAST_MODE" = sandbox
          test "$PAYFAST_ENV" = sandbox
          test "$SUPABASE_DATABASE_REQUIRED" = false
          test -z "${PAYFAST_MERCHANT_ID:-}"
          test -z "${PAYFAST_MERCHANT_KEY:-}"
          test -z "${PAYFAST_PASSPHRASE:-}"
      - name: Install locked Django quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Django and migration graph before staging Render deploy
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Validate booking role receipts, PDF archive and PayFast security
        run: |
          python manage.py test --noinput content.test_live_classes content.test_invoice_archive content.test_invoice_letterhead content.test_payfast_security content.test_payfast_configuration content.test_payfast_itn_diagnostics
