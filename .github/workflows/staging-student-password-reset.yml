name: Staging Student Password Reset Acceptance
on:
  push:
    branches: ["test/staging-password-reset-20261025"]
    paths:
      - "frontend/app/auth/**"
      - "frontend/app/reset-password/**"
      - "frontend/tests/password-recovery.test.mjs"
      - "frontend/tests/registration-actions.test.mjs"
      - ".github/workflows/staging-student-password-reset.yml"
permissions:
  contents: read
jobs:
  staging-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Verify types
        working-directory: frontend
        run: npm run typecheck
      - name: Verify forgot password reset and registered student flows
        working-directory: frontend
        run: node --test tests/password-recovery.test.mjs tests/registration-actions.test.mjs tests/universal-email-verification.test.mjs
