name: Prepare staging storage credential aliases
on:
  push:
    branches: [ops/backend-release-verification-20261018]
    paths:
      - .github/workflows/prepare-staging-storage-aliases.yml
      - scripts/release/prepare_staging_storage_aliases.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-storage-aliases
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: pip install -r backend/requirements.txt
      - name: Verify staging buckets and save legacy aliases without deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python scripts/release/prepare_staging_storage_aliases.py
