name: Inspect the Amaris staging frontend rollout

on:
  push:
    branches: [ops/aws-desktop-frontend-release-20261126]
    paths: [.github/workflows/aws-desktop-rollout-status.yml]

permissions: {}

jobs:
  observe:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Read task revisions, target health and rollback alarms
        run: |
          set -euo pipefail
          cluster=amaris-ecs-staging
          service=amaris-web-staging-stateless
          state="$(aws ecs describe-services --cluster "$cluster" --services "$service" --query 'services[0]' --output json)"
          jq '{taskDefinition, desiredCount, runningCount, pendingCount,
            deployments: [.deployments[] | {taskDefinition, status, rolloutState, rolloutStateReason, runningCount}],
            recentEvents: [.events[:5][] | .message]}' <<< "$state"
          target="$(jq -er '.loadBalancers[0].targetGroupArn' <<< "$state")"
          aws elbv2 describe-target-health --target-group-arn "$target" --output json |
            jq '[.TargetHealthDescriptions[] | .TargetHealth | {State,Reason}]'
          names="$(jq -r '.deploymentConfiguration.alarms.alarmNames | join(" ")' <<< "$state")"
          if [[ -n "$names" ]]; then
            read -r -a alarms <<< "$names"
            aws cloudwatch describe-alarms --alarm-names "${alarms[@]}" --output json |
              jq '[.MetricAlarms[] | {AlarmName,StateValue}]'
          fi
