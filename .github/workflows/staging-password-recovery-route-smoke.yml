name: Staging Password Recovery Live Routes
on:
  push:
    branches: [ops/password-recovery-staging-http-acceptance-20261026]
    paths: [ops/staging-password-recovery-smoke-request.txt]
permissions:
  contents: read
jobs:
  anonymous-recovery-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check public recovery pages and block unauthenticated password changes
        run: |
          python3 - <<'PY'
          import urllib.request
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          base="https://amaris-mathematics-academy-staging-x4ax.onrender.com"
          required=[
             ("/forgot-password",["Reset your password.","tutor", "Send reset link"]),
             ("/reset-password/verify",["Verify your password reset.", "Six-digit recovery code"]),
          ]
          for path,phrases in required:
             try:
               with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"AmarisRecoveryAcceptance/1.0"}),timeout=30) as res:
                 code=res.status; html=res.read(450000).decode("utf8","replace")
             except (HTTPError,URLError):
               raise SystemExit("FAIL: Anonymous recovery page was unavailable") from None
             if code!=200 or any(phrase not in html for phrase in phrases):
               raise SystemExit("FAIL: Staging recovery page missing required shared-role content")
             print("PASS: Shared recovery page served HTTP 200 with expected UI")
          try:
             with urllib.request.urlopen(base+"/reset-password",timeout=30) as res:
               final=res.url
          except (HTTPError,URLError):
             raise SystemExit("FAIL: Unauthenticated password change was not handled safely") from None
          if urlparse(final).path!="/forgot-password":
             raise SystemExit("FAIL: Anonymous user reached protected password form")
          print("PASS: Unauthenticated reset form redirected to forgot-password")
          PY
