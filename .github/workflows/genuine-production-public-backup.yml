name: Genuine Production Application DB Backup and Isolated Restore

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BACKUP_PUBLIC_SCHEMA_ONLY to perform a read-only production dump and isolated restore"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: genuine-production-backup
  cancel-in-progress: false

jobs:
  backup-restore:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'BACKUP_PUBLIC_SCHEMA_ONLY'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    env:
      SOURCE_DATABASE_URL: ${{ secrets.AMARIS_PRODUCTION_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.AMARIS_BACKUP_PASSPHRASE }}
      PGSSLMODE: require
    steps:
      - name: Require explicit source and encryption secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_DATABASE_URL:-}" || { echo "::error::AMARIS_PRODUCTION_DATABASE_URL missing in production environment"; exit 1; }
          test -n "${BACKUP_PASSPHRASE:-}" || { echo "::error::AMARIS_BACKUP_PASSPHRASE missing in production environment"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ["SOURCE_DATABASE_URL"])
          host = (url.hostname or "").lower()
          user = url.username or ""
          project = "epkcuseloinygkakxxdu"
          direct = host == f"db.{project}.supabase.co"
          pooled = host.endswith(".pooler.supabase.com") and project in user
          if url.scheme not in ("postgresql", "postgres") or not (direct or pooled):
              raise SystemExit("BLOCK: source does not identify the expected Supabase production project")
          if url.path != "/postgres":
              raise SystemExit("BLOCK: expected production database 'postgres'")
          print("PASS: target Supabase production project verified (no credentials logged)")
          PY

      - name: Create genuine read-only PostgreSQL 17 application-schema backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amaris-backup"
          chmod 700 "$RUNNER_TEMP/amaris-backup"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SOURCE_DATABASE_URL -e PGSSLMODE -e PGOPTIONS='-c default_transaction_read_only=on' \
            -v "$RUNNER_TEMP/amaris-backup:/backup" postgres:17-alpine \
            sh -ec 'pg_dump --format=custom --no-owner --no-acl --schema=public --file=/backup/production-public.dump "$SOURCE_DATABASE_URL"'
          test -s "$RUNNER_TEMP/amaris-backup/production-public.dump"
          echo "PASS: actual production public application schema dumped (no records printed)"

      - name: Encrypt backup before storing it as an artifact
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf %s "$BACKUP_PASSPHRASE" > "$RUNNER_TEMP/amaris-backup/key"
          unset BACKUP_PASSPHRASE
          gpg --batch --yes --pinentry-mode loopback --cipher-algo AES256 \
            --passphrase-file "$RUNNER_TEMP/amaris-backup/key" --symmetric \
            --output "$RUNNER_TEMP/amaris-backup/production-public.dump.gpg" \
            "$RUNNER_TEMP/amaris-backup/production-public.dump"
          test -s "$RUNNER_TEMP/amaris-backup/production-public.dump.gpg"
          shred -u "$RUNNER_TEMP/amaris-backup/production-public.dump"
          echo "PASS: backup encrypted; plaintext dump shredded before artifact upload"

      - name: Decrypt and restore to an isolated PostgreSQL 17 container
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/amaris-backup/key" --decrypt \
            --output "$RUNNER_TEMP/amaris-backup/restore.dump" \
            "$RUNNER_TEMP/amaris-backup/production-public.dump.gpg"
          docker run -d --name amaris-restore-only --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for attempt in $(seq 1 40); do
            docker exec amaris-restore-only pg_isready -U postgres && break
            test "$attempt" -lt 40
            sleep 2
          done
          docker cp "$RUNNER_TEMP/amaris-backup/restore.dump" amaris-restore-only:/tmp/restore.dump
          docker exec amaris-restore-only pg_restore --exit-on-error --no-owner --no-acl \
            -U postgres -d postgres /tmp/restore.dump
          echo "PASS: actual production public schema restored into isolated, network-disabled PostgreSQL 17"

      - name: Compare source and restored migration/table counts without printing private data
        shell: bash
        run: |
          set -euo pipefail
          src_migrations=$(docker run --rm -e SOURCE_DATABASE_URL -e PGSSLMODE \
            -e PGOPTIONS='-c default_transaction_read_only=on' postgres:17-alpine \
            psql "$SOURCE_DATABASE_URL" -AtXqc 'SELECT count(*) FROM public.django_migrations;')
          dest_migrations=$(docker exec amaris-restore-only psql -U postgres -d postgres \
            -AtXqc 'SELECT count(*) FROM public.django_migrations;')
          test "$src_migrations" = "$dest_migrations" || { echo "::error::Migration count mismatch"; exit 1; }
          src_announcements=$(docker run --rm -e SOURCE_DATABASE_URL -e PGSSLMODE \
            -e PGOPTIONS='-c default_transaction_read_only=on' postgres:17-alpine \
            psql "$SOURCE_DATABASE_URL" -AtXqc 'SELECT count(*) FROM public.content_announcement;')
          dest_announcements=$(docker exec amaris-restore-only psql -U postgres -d postgres \
            -AtXqc 'SELECT count(*) FROM public.content_announcement;')
          test "$src_announcements" = "$dest_announcements" || { echo "::error::Announcement count mismatch"; exit 1; }
          echo "PASS: real source and isolated restore match on Django migration and announcement row counts"

      - name: Keep encrypted backup for operator-approved download
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-amaris-public-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/amaris-backup/production-public.dump.gpg
          retention-days: 7
          if-no-files-found: error

      - name: Remove temporary plaintext, key and isolated restore container
        if: always()
        shell: bash
        run: |
          docker rm -f amaris-restore-only 2>/dev/null || true
          if [ -d "$RUNNER_TEMP/amaris-backup" ]; then
            find "$RUNNER_TEMP/amaris-backup" -type f ! -name 'production-public.dump.gpg' \
              -exec shred -u {} + 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/amaris-backup"
          fi
