name: Live Amaris Assistant Route Diagnostic

on:
  push:
    branches:
      - verify-live-assistant-20261013

permissions:
  contents: read

jobs:
  diagnose:
    name: Verify both public assistant API route variants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current response paths without any secrets
        run: |
          python3 - <<'PY'
          import json
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          msg = "Hi, How do we register on your website and how long are your lessons?"
          targets = [
              "https://amaris-mathematics-academy-live-students.onrender.com/api/assistant",
              "https://amaris-mathematics-academy-live-students.onrender.com/api/assistant/",
              "https://amaris-production-web.onrender.com/api/v1/assistant/",
          ]
          for url in targets:
              req = Request(url, json.dumps({"message": msg}).encode(),
                  headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"Amaris-Public-QA/1.0"},
                  method="POST")
              try:
                  with urlopen(req, timeout=30) as rsp:
                      status, headers, body, final_url = rsp.status, rsp.headers, rsp.read(2000).decode("utf8","replace"), rsp.url
              except HTTPError as err:
                  status, headers, body, final_url = err.code, err.headers, err.read(2000).decode("utf8","replace"), err.url
              except URLError as err:
                  status, headers, body, final_url = 0, {}, repr(err)[:400], url
              print("TARGET", url, "HTTP", status, "FINAL", final_url, flush=True)
              print("HEADERS", {k:headers.get(k) for k in ("content-type","cache-control","location","server","x-powered-by")},flush=True)
              print("BODY", body[:1100],flush=True)
          PY
