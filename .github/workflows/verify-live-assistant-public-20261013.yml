name: Amaris AI Production Verification

on:
  push:
    branches:
      - verify-live-assistant-20261013

permissions:
  contents: read

jobs:
  live-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate production assistant responses safely
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          backend = 'https://amaris-production-web.onrender.com'
          frontend = 'https://amaris-mathematics-academy-live-students.onrender.com'
          registration = 'Hi, How do we register on your website and how long are your lessons?'
          ai_question = 'Which school and higher-education study pathways does Amaris Mathematics Academy publish on its website?'
          targets = [
              ('backend_health', backend + '/health/ready/', None),
              ('frontend_health', frontend + '/health/ready/', None),
              ('backend_registration', backend + '/api/v1/assistant/', registration),
              ('backend_ai_provider', backend + '/api/v1/assistant/', ai_question),
              ('frontend_registration', frontend + '/api/assistant/', registration),
              ('frontend_ai_provider', frontend + '/api/assistant/', ai_question),
          ]
          results = []
          for label, url, message in targets:
              body_bytes = None if message is None else json.dumps({'message':message}).encode()
              req = Request(url, body_bytes, headers={'Accept':'application/json', 'User-Agent':'Amaris-Public-QA/1.0', **({'Content-Type':'application/json'} if body_bytes else {})}, method='POST' if body_bytes else 'GET')
              try:
                  with urlopen(req, timeout=35) as response:
                      status = response.status
                      data = response.read(2200).decode('utf-8','replace')
              except HTTPError as exc:
                  status = exc.code
                  data = exc.read(2200).decode('utf-8','replace')
              except (URLError, TimeoutError) as exc:
                  status = 0
                  data = type(exc).__name__
              try:
                  payload = json.loads(data)
              except (ValueError, TypeError):
                  payload = {}
              answer = payload.get('answer','') if isinstance(payload,dict) else ''
              detail = payload.get('detail','') if isinstance(payload,dict) else ''
              ok = status==200 and (bool(answer.strip()) if message else True)
              results.append({'check':label,'status':status,'success':ok})
              print('LIVE_CHECK',label,'HTTP',status,'OK',ok,flush=True)
              if message:
                  print('ANSWER',str(answer)[:850].replace('\n',' | '),flush=True)
                  print('DETAIL',str(detail)[:250],flush=True)
          print('RESULTS_JSON',json.dumps(results),flush=True)
          if not all(r['success'] for r in results):
              raise SystemExit('Production assistant verification failed at least one endpoint')
          PY
