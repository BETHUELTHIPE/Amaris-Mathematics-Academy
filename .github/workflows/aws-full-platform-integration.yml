name: AWS full-platform integration candidate
on:
  push:
    branches: [release/aws-full-platform-20261125]
    paths:
      - .github/workflows/aws-full-platform-integration.yml
  pull_request:
    branches: [ops/aws-alb-staging-20261125]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aws-full-platform-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: >-
      github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' &&
      (github.ref == 'refs/heads/release/aws-full-platform-20261125' ||
       (github.event_name == 'pull_request' && github.head_ref == 'release/aws-full-platform-20261125' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U amaris_ci -d amaris_ci'
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            base: production-release-20260923
            refs: feature/paystack-payfast-choice-20261110 feat/student-two-week-motivation-20261111 feat/sponsor-dashboard-20261111 feat/curriculum-subscriptions-backend-20261112 feat/tutor-video-admin-alerts-20261113 feat/admin-fortnightly-performance-20261113 fix/tutor-admin-private-storage-20261113 feat/tutor-employment-contract-backend-20261115 feat/course-search-api-20261118 feat/private-chat-backend-20261124 feat/trusted-advisor-20261125
          - component: frontend
            base: render-live-current-20260918
            refs: feat/curriculum-subscriptions-frontend-20261112 feat/course-subscription-pages-20261112 feat/tutor-video-submission-ui-20261113 feat/tutor-employment-contract-ui-20261115 feat/course-search-ui-20261118 feat/private-chat-ui-20261124
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve feature revisions and attempt integration without changing original branches
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          BASE: ${{ matrix.base }}
          REFS: ${{ matrix.refs }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-evidence"
          manifest="$RUNNER_TEMP/release-evidence/$COMPONENT-refs.txt"
          git config user.name 'Amaris release integration'
          git config user.email 'release-integration@users.noreply.github.com'
          git worktree add --detach "$RUNNER_TEMP/candidate" "refs/remotes/origin/$BASE"
          cd "$RUNNER_TEMP/candidate"
          printf 'base %s %s\n' "$BASE" "$(git rev-parse HEAD)" > "$manifest"
          for ref in $REFS; do
            sha="$(git rev-parse --verify "refs/remotes/origin/$ref^{commit}")"
            printf '%s %s\n' "$ref" "$sha" >> "$manifest"
          done
          while read -r ref sha; do
            if [[ "$ref" == base ]]; then continue; fi
            if ! git merge --no-ff --no-edit "$sha"; then
              git diff --name-only --diff-filter=U > "$RUNNER_TEMP/release-evidence/$COMPONENT-conflicts.txt"
              git merge --abort
              echo "::error::Integration conflict in $COMPONENT at $ref; no deployment performed."
              exit 1
            fi
          done < "$manifest"
          git rev-parse HEAD > "$RUNNER_TEMP/release-evidence/$COMPONENT-candidate.txt"
          git diff --check "refs/remotes/origin/$BASE" HEAD
      - uses: actions/setup-python@v5
        if: matrix.component == 'backend'
        with:
          python-version: '3.13.15'
      - name: Full backend quality, migrations and regression tests
        if: matrix.component == 'backend'
        shell: bash
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
          DATABASE_SSL_REQUIRED: 'false'
          SUPABASE_DATABASE_REQUIRED: 'false'
          DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: '0'
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
          DJANGO_CACHE_URL: redis://127.0.0.1:6379/2
          DJANGO_PUBLIC_CACHE_URL: redis://127.0.0.1:6379/3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate/backend"
          export DJANGO_SECRET_KEY="$(openssl rand -hex 64)"
          echo "::add-mask::$DJANGO_SECRET_KEY"
          python -m pip install -r requirements-dev.txt
          black --check .
          ruff check .
          mypy
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test 2>&1 | tee "$RUNNER_TEMP/release-evidence/backend-tests.log"
      - uses: actions/setup-node@v4
        if: matrix.component == 'frontend'
        with:
          node-version: '24'
      - name: Full frontend lint, type checks and regression tests
        if: matrix.component == 'frontend'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate/frontend"
          npm ci
          npm run lint
          npm run typecheck
          npm run test:unit 2>&1 | tee "$RUNNER_TEMP/release-evidence/frontend-tests.log"
      - name: Build candidate container without AWS credentials
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          docker build --file "deploy/aws/$COMPONENT.Dockerfile" --tag "amaris-$COMPONENT:candidate" "$RUNNER_TEMP/candidate/$COMPONENT"
          test "$(docker image inspect --format '{{.Architecture}}' "amaris-$COMPONENT:candidate")" = arm64
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-integration-${{ matrix.component }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: warn
