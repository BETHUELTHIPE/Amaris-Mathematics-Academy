name: One-off Staging Stress Test

on:
  push:
    branches:
      - security/owasp-test-suite
    paths:
      - .github/workflows/staging-stress-once.yml

permissions:
  contents: read

concurrency:
  group: amaris-staging-stress-once
  cancel-in-progress: false

jobs:
  stress:
    name: Staging spike stress test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      LOADTEST_ENVIRONMENT: staging
      LOADTEST_TARGET_URL: ${{ vars.LOADTEST_TARGET_URL }}
      LOADTEST_ALLOWED_HOSTS: ${{ vars.LOADTEST_ALLOWED_HOSTS }}
      LOADTEST_PROFILE: spike
      LOADTEST_REQUIRE_FULL_JOURNEY: "false"
      LOADTEST_ALLOW_WRITES: "false"
      LOADTEST_ALLOW_PRODUCTION: "false"
      LOADTEST_ALLOW_LIVE_PAYFAST: "false"
      LOADTEST_AUTH_BEARER: ${{ secrets.LOADTEST_AUTH_BEARER }}
      LOADTEST_COOKIE_HEADER: ${{ secrets.LOADTEST_COOKIE_HEADER }}
      LOADTEST_SESSION_COOKIE_NAME: ${{ secrets.LOADTEST_SESSION_COOKIE_NAME }}
      LOADTEST_SESSION_COOKIE_VALUE: ${{ secrets.LOADTEST_SESSION_COOKIE_VALUE }}
      LOADTEST_COURSE_DETAIL_PATH: ${{ vars.LOADTEST_COURSE_DETAIL_PATH || '/courses/university-calculus-foundations' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-load.txt

      - name: Install load-test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-load.txt

      - name: Confirm non-production staging target
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LOADTEST_TARGET_URL:-}" ]]; then
            echo "LOADTEST_TARGET_URL is required in the staging environment." >&2
            exit 1
          fi
          if [[ -z "${LOADTEST_ALLOWED_HOSTS:-}" ]]; then
            echo "LOADTEST_ALLOWED_HOSTS is required in the staging environment." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from load_tests.config import env_csv, validate_target

          validate_target(
              os.environ["LOADTEST_TARGET_URL"],
              environment_name="staging",
              allowed_hosts=env_csv("LOADTEST_ALLOWED_HOSTS"),
              allow_production=False,
              allow_live_payfast=False,
          )
          print("Validated staging-only stress-test target.")
          PY

      - name: Record generator evidence
        shell: bash
        run: |
          mkdir -p backend/load_tests/results
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "git_sha=${GITHUB_SHA}"
            echo "profile=spike"
            echo "runner=${RUNNER_NAME}"
            echo "os=${RUNNER_OS}"
            echo "arch=${RUNNER_ARCH}"
            echo "cpu_count=$(nproc)"
            echo "memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            echo "open_file_limit=$(ulimit -n)"
          } > backend/load_tests/results/load-generator.txt

      - name: Run Locust spike profile
        working-directory: backend
        run: |
          chmod +x load_tests/run.sh
          load_tests/run.sh

      - name: Publish Locust summary
        if: always()
        shell: bash
        run: |
          echo "## Staging stress test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Profile: spike" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production target allowed: no" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live PayFast allowed: no" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f backend/load_tests/results/spike_stats.csv ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~csv' >> "$GITHUB_STEP_SUMMARY"
            tail -n 12 backend/load_tests/results/spike_stats.csv >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload stress-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-stress-${{ github.run_id }}
          path: backend/load_tests/results/
          if-no-files-found: error
          retention-days: 30
