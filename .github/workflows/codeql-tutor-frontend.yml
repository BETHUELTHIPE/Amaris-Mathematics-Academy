name: CodeQL Security Analysis - Tutor Form

on:
  pull_request:
    branches: [render-live-current-20260918]
  push:
    branches: [render-live-current-20260918]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: tutor-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL security scan (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Check out exact PR candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Run CodeQL analysis and publish code scanning results
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
