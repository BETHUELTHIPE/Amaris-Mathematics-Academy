name: Production Frontend Release Gate

# Unconditional checks: do NOT add path filters; required checks must exist
# on every pull request into the live Render frontend branch.
on:
  pull_request:
    branches: [render-live-current-20260918]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [render-live-current-20260918]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-frontend-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate-security:
    name: Candidate TypeScript, lint, auth, booking, and dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exactly the locked frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Type-check every frontend route and authentication action
        working-directory: frontend
        run: npm run typecheck
      - name: Lint the candidate
        working-directory: frontend
        run: npm run lint
      - name: Run full frontend unit contracts including email verification, recovery, booking and tutor access
        working-directory: frontend
        run: npm run test:unit
      - name: Fail on high or critical production dependency vulnerabilities
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  branch-enforcement:
    name: Production branch ruleset enforcement active
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify production branch is protected before approving any release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          if repository != "BETHUELTHIPE/Amaris-Mathematics-Academy":
              raise SystemExit("BLOCK: Release gate running in unexpected repository")
          branch = "render-live-current-20260918"
          url = f"https://api.github.com/repos/{repository}/branches/{branch}"
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urlopen(request, timeout=15) as response:
                  state = json.load(response)
          except (HTTPError, URLError, ValueError):
              raise SystemExit("BLOCK: Cannot confirm GitHub production branch protection") from None
          if not state.get("protected"):
              raise SystemExit("BLOCK: Production branch is unprotected; apply active ruleset before release")
          print("PASS: GitHub reports protected=True for exact live frontend branch")
          print("NOTICE: Administrator must also confirm required approvals and status checks in the live ruleset")
          PY
