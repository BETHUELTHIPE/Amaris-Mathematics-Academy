name: Production Frontend Release Gate

# Unconditional checks: do NOT add path filters; required checks must exist
# on every pull request into the live Render frontend branch.
on:
  pull_request:
    branches: [render-live-current-20260918]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [render-live-current-20260918]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-frontend-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate-security:
    name: Candidate TypeScript, lint, auth, booking, and dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exactly the locked frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Type-check every frontend route and authentication action
        working-directory: frontend
        run: npm run typecheck
      - name: Lint the candidate
        working-directory: frontend
        run: npm run lint
      - name: Run full frontend unit contracts including email verification, recovery, booking and tutor access
        working-directory: frontend
        run: npm test
      - name: Fail on high or critical production dependency vulnerabilities
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  branch-enforcement:
    name: Production branch ruleset enforcement active
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run negative policy checks, including missing reviewers
        run: python3 -m unittest discover -s scripts/release -p 'test_verify_frontend_branch_ruleset.py' -v
      - name: Require genuine active frontend approval and strict CI branch rulesets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/verify_frontend_branch_ruleset.py
