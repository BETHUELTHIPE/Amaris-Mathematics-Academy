name: One-time Mobile Hero WebP Generation

on:
  push:
    branches: [perf/browser-release-current-20261018]
    paths: ['.github/workflows/generate-mobile-hero.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-hero-asset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/perf/browser-release-current-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate mobile crop from existing original WebP (no credentials)
        run: |
          python -m pip install Pillow==11.3.0
          python frontend/scripts/performance/build-mobile-hero.py
          test -s frontend/public/amaris-math-hero-mobile.webp
      - name: Commit only generated public asset to draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/amaris-math-hero-mobile.webp
          if git diff --cached --quiet; then
            echo "Asset already up to date"
            exit 0
          fi
          git commit -m 'perf(hero): generate smaller portrait WebP for mobile LCP'
          git push origin HEAD:perf/browser-release-current-20261018
