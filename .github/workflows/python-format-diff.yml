name: Python Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install exact formatter
        run: python -m pip install black==26.5.1
      - name: Show canonical Black diff
        run: >-
          black --check --diff
          load_tests/capacity.py
          load_tests/capacity_locustfile.py
          load_tests/test_contract.py
