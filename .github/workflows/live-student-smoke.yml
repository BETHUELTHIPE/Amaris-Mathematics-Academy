name: Live Student Smoke
# verified-state regression

on:
  push:
    branches: [live-smoke-20260918]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public student pages
        shell: bash
        run: |
          set -euo pipefail
          site="https://amaris-mathematics-academy-live-students.onrender.com"
          for path in / /courses /register /login /forgot-password /contact; do
            code=$(curl --silent --show-error --output /tmp/page.html --write-out '%{http_code}' --max-time 30 "$site$path")
            echo "$path => $code"
            test "$code" = "200"
            test -s /tmp/page.html
          done

      - name: Verify homepage hero image
        shell: bash
        run: |
          set -euo pipefail
          site="https://amaris-mathematics-academy-live-students.onrender.com"
          home=$(mktemp)
          headers=$(mktemp)
          image=$(mktemp)
          code=$(curl --silent --show-error --output "$home" --write-out '%{http_code}' --max-time 30 "$site/")
          test "$code" = "200"
          grep -q '/amaris-math-hero.webp' "$home"
          image_code=$(curl --silent --show-error --output "$image" --dump-header "$headers" --write-out '%{http_code}' --max-time 30 "$site/amaris-math-hero.webp")
          test "$image_code" = "200"
          grep -Eqi '^content-type: image/(webp|octet-stream)' "$headers"
          test "$(wc -c < "$image")" -gt 30000

      - name: Verify password recovery wording
        shell: bash
        run: |
          set -euo pipefail
          site="https://amaris-mathematics-academy-live-students.onrender.com"
          body=$(mktemp)
          code=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 30 "$site/forgot-password")
          test "$code" = "200"
          grep -q 'Send reset link now' "$body"
          ! grep -q 'It may take a few minutes to arrive' "$body"

      - name: Verify signup verification wording
        shell: bash
        run: |
          set -euo pipefail
          site="https://amaris-mathematics-academy-live-students.onrender.com"
          body=$(mktemp)
          code=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 30 "$site/verify-email?email=test%40example.com&registered=1")
          test "$code" = "200"
          grep -q 'Enter the six-digit verification code sent to' "$body"
          grep -q 'Verify six-digit code' "$body"
          grep -q 'Send a new code and verification link' "$body"
          grep -q 'Confirm your email' "$body"

      - name: Verify backend health and dependencies
        shell: bash
        run: |
          set -euo pipefail
          api="https://amaris-mathematics-academy-staging.onrender.com"
          for path in /health/live/ /health/ready/ /health/dependencies/; do
            body=$(mktemp)
            code=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 30 "$api$path")
            echo "$path => $code"
            cat "$body"
            test "$code" = "200"
          done

      - name: Verify Supabase auth endpoint is reachable
        shell: bash
        env:
          SUPABASE_URL: https://epkcuseloinygkakxxdu.supabase.co
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$SUPABASE_URL/auth/v1/health")
          echo "Supabase auth health => $code"
          case "$code" in
            200|401) ;;
            *) echo "Unexpected Supabase auth health status: $code" >&2; exit 1 ;;
          esac

      - name: Verify protected dashboard requires authentication
        shell: bash
        run: |
          set -euo pipefail
          site="https://amaris-mathematics-academy-live-students.onrender.com"
          headers=$(mktemp)
          body=$(mktemp)
          code=$(curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}' --max-time 30 "$site/dashboard")
          cat "$headers"
          echo "----- dashboard body preview -----"
          head -c 6000 "$body" || true
          echo
          echo "----- end preview -----"
          if [[ "$code" =~ ^30[12378]$ ]]; then
            grep -qi '^location: .*login' "$headers"
          elif [ "$code" = "200" ]; then
            ! grep -q 'Student dashboard' "$body"
            ! grep -q 'Welcome,' "$body"
            grep -Eqi 'login|NEXT_REDIRECT|redirect' "$body"
          else
            echo "Expected login redirect or rendered login page, got $code" >&2
            exit 1
          fi
