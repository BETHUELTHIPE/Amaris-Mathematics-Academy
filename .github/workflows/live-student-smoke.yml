name: Live Student Smoke

on:
  push:
    branches: [live-smoke-20260918]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public student pages
        shell: bash
        run: |
          set -euo pipefail
          site="https://amaris-mathematics-academy-live-students.onrender.com"
          for path in / /courses /register /login /contact; do
            code=$(curl --silent --show-error --output /tmp/page.html --write-out '%{http_code}' --max-time 30 "$site$path")
            echo "$path => $code"
            test "$code" = "200"
            test -s /tmp/page.html
          done

      - name: Verify protected dashboard redirects
        shell: bash
        run: |
          set -euo pipefail
          site="https://amaris-mathematics-academy-live-students.onrender.com"
          headers=$(mktemp)
          code=$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 30 "$site/dashboard")
          cat "$headers"
          case "$code" in
            301|302|303|307|308) ;;
            *) echo "Expected auth redirect, got $code" >&2; exit 1 ;;
          esac
          grep -qi '^location: .*login' "$headers"

      - name: Verify backend health and dependencies
        shell: bash
        run: |
          set -euo pipefail
          api="https://amaris-mathematics-academy-staging.onrender.com"
          for path in /health/live/ /health/ready/ /health/dependencies/; do
            body=$(mktemp)
            code=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 30 "$api$path")
            echo "$path => $code"
            cat "$body"
            test "$code" = "200"
          done

      - name: Verify Supabase auth endpoint is reachable
        shell: bash
        env:
          SUPABASE_URL: https://epkcuseloinygkakxxdu.supabase.co
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$SUPABASE_URL/auth/v1/health")
          echo "Supabase auth health => $code"
          test "$code" = "200"
