name: Verify Paystack test key injection in AWS staging
on:
  push:
    branches: [ops/aws-paystack-staging-acceptance-20261127]
    paths: [.github/workflows/aws-paystack-task-secret-probe.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-paystack-staging-acceptance-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE != ''
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Verify ECS secret injection without changing staging services
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          python - <<'PY'
          import os
          import time
          from urllib.error import HTTPError
          from urllib.request import urlopen

          import boto3

          account = "110156539003"
          region = "eu-north-1"
          cluster = "amaris-ecs-staging"
          service_name = "amaris-web-staging-stateless"
          session = boto3.Session(region_name=region)
          assert session.client("sts").get_caller_identity()["Account"] == account
          ecs = session.client("ecs")
          elb = session.client("elbv2")
          ec2 = session.client("ec2")

          def healthy_web():
              service, = ecs.describe_services(cluster=cluster, services=[service_name])["services"]
              assert service["status"] == "ACTIVE" and len(service["deployments"]) == 1
              assert service["desiredCount"] == service["runningCount"] == 2 and service["pendingCount"] == 0
              assert service["taskDefinition"].endswith("/amaris-ecs-staging-alb-web:14")
              load_balancer, = service["loadBalancers"]
              targets = elb.describe_target_health(
                  TargetGroupArn=load_balancer["targetGroupArn"]
              )["TargetHealthDescriptions"]
              assert sum(target["TargetHealth"]["State"] == "healthy" for target in targets) == 2
              return service

          service = healthy_web()
          network = service["networkConfiguration"]
          awsvpc = network["awsvpcConfiguration"]
          assert awsvpc.get("assignPublicIp", "DISABLED") == "DISABLED"
          subnets = ec2.describe_subnets(SubnetIds=awsvpc["subnets"])["Subnets"]
          assert all(subnet["VpcId"] == "vpc-0252538d2febd4641" for subnet in subnets)

          candidate = ecs.describe_task_definition(
              taskDefinition="amaris-ecs-staging-alb-web:17"
          )["taskDefinition"]
          backend, = (c for c in candidate["containerDefinitions"] if c["name"] == "backend")
          expected_image = (
              f"{account}.dkr.ecr.{region}.amazonaws.com/amaris-staging-frontend"
              "@sha256:bc67977a14b7f91bc5e095715d413367e84595666c96ba41e237e1820df88d30"
          )
          expected_parameter = f"arn:aws:ssm:{region}:{account}:parameter/amaris/aws-staging/paystack/test-secret-key"
          key, = (s for s in backend["secrets"] if s["name"] == "PAYSTACK_SECRET_KEY")
          assert key["valueFrom"] == expected_parameter and backend["image"] == expected_image
          assert {"name": "PAYSTACK_ENABLED", "value": "false"} in backend["environment"]
          assert candidate["runtimePlatform"]["cpuArchitecture"] == "ARM64"
          execution_role = candidate["executionRoleArn"]
          assert execution_role.startswith(f"arn:aws:iam::{account}:role/amaris-ecs-staging-")

          # Limit the probe to the exact candidate image, execution role and API key.
          # No application runtime secret, task role, server, webhook or worker is started.
          probe = """import http.client
          import json
          import os

          key = os.environ.get("PAYSTACK_SECRET_KEY", "")
          if not key.startswith("sk_test_"):
              raise SystemExit(21)
          connection = http.client.HTTPSConnection("api.paystack.co", timeout=12)
          try:
              connection.request("GET", "/transaction?perPage=1", headers={"Authorization": "Bearer " + key})
              response = connection.getresponse()
              if response.status != 200:
                  raise SystemExit(22)
              if json.loads(response.read(1048576)).get("status") is not True:
                  raise SystemExit(23)
          except (OSError, ValueError, http.client.HTTPException):
              raise SystemExit(24)
          finally:
              connection.close()
          """
          definition = ecs.register_task_definition(
              family="amaris-ecs-staging-paystack-secret-probe",
              executionRoleArn=execution_role,
              networkMode="awsvpc",
              requiresCompatibilities=["EC2"],
              runtimePlatform=candidate["runtimePlatform"],
              containerDefinitions=[{
                  "name": "paystack-probe",
                  "image": backend["image"],
                  "secrets": [key],
                  "cpu": 64,
                  "memory": 128,
                  "essential": True,
                  "entryPoint": ["python", "-c"],
                  "command": [probe],
              }],
              tags=[{"key": "Environment", "value": "staging"}],
          )["taskDefinition"]["taskDefinitionArn"]
          task_arn = None
          try:
              result = ecs.run_task(
                  cluster=cluster,
                  launchType="EC2",
                  taskDefinition=definition,
                  count=1,
                  startedBy="paystack-probe-" + os.environ["GITHUB_RUN_ID"],
                  networkConfiguration=network,
              )
              if result["tasks"]:
                  task_arn = result["tasks"][0]["taskArn"]
              if result["failures"] or not task_arn:
                  reasons = [failure.get("reason", "unknown") for failure in result["failures"]]
                  raise SystemExit(f"Staging probe placement failed: {reasons}")
              deadline = time.monotonic() + 240
              while time.monotonic() < deadline:
                  tasks = ecs.describe_tasks(cluster=cluster, tasks=[task_arn])["tasks"]
                  if tasks and tasks[0]["lastStatus"] == "STOPPED":
                      state = tasks[0]
                      break
                  time.sleep(6)
              else:
                  raise SystemExit("Staging probe did not finish within four minutes")
              container, = state["containers"]
              result = container.get("exitCode")
              failures = {
                  21: "injected key is absent or uses the wrong mode",
                  22: "Paystack returned a non-200 response",
                  23: "Paystack response did not confirm acceptance",
                  24: "Paystack network or response error",
              }
              if result is None:
                  reason = state.get("stoppedReason", "").split(":", 1)[0]
                  raise SystemExit(f"Probe never reached Python: {state.get('stopCode')} / {reason}")
              if result != 0:
                  raise SystemExit(failures.get(result, f"Probe exited with code {result}"))
              print("PASS: ECS injected the SSM test key and Paystack accepted it from the staging task subnet")
          finally:
              if task_arn:
                  running_tasks = ecs.describe_tasks(cluster=cluster, tasks=[task_arn])["tasks"]
                  if not running_tasks or running_tasks[0]["lastStatus"] != "STOPPED":
                      ecs.stop_task(cluster=cluster, task=task_arn, reason="Staging Paystack probe cleanup")
                      ecs.get_waiter("tasks_stopped").wait(
                          cluster=cluster, tasks=[task_arn], WaiterConfig={"Delay": 6, "MaxAttempts": 20}
                      )
              ecs.deregister_task_definition(taskDefinition=definition)
              healthy_web()
              print("PASS: both original staging targets remain healthy")

          try:
              with urlopen("https://16.171.164.5/api/v1/paystack/webhook/", timeout=12) as response:
                  status = response.status
          except HTTPError as exc:
              status = exc.code
          print(f"Public staging webhook GET returned HTTP {status} (405 expected with the route deployed)")
          PY
      - name: Verify account-plan eligibility for the requested host
        run: |
          set -euo pipefail
          aws freetier get-account-plan-state --region us-east-1 --query '{Type:accountPlanType,Status:accountPlanStatus}'
          aws ec2 describe-instance-types --instance-types m7g.large t4g.small \
            --query 'InstanceTypes[].{Type:InstanceType,FreeTierEligible:FreeTierEligible,StandardENIs:NetworkInfo.MaximumNetworkInterfaces}'
