name: PayFast Sandbox Donation Gateway Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/donation-sandbox-gateway-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    name: Signed Django checkout to real PayFast sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "temporary-test-environment-only"
      DATABASE_URL: "sqlite:////tmp/amaris-donation-test.sqlite3"
      SUPABASE_DATABASE_REQUIRED: "false"
      DATABASE_SSL_REQUIRED: "false"
      PAYFAST_MODE: "sandbox"
      PAYFAST_ENV: "sandbox"
      # Configure these as GitHub repository secrets; never use live merchant credentials.
      PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_ID }}
      PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_KEY }}
      PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_SANDBOX_PASSPHRASE }}
      DONATIONS_ENABLED: "true"
      DONATIONS_LIVE_ENABLED: "false"
      PUBLIC_SITE_URL: "https://example.invalid"
      PUBLIC_API_URL: "https://example.invalid"
      PAYFAST_NOTIFY_URL: "https://example.invalid/itn"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify PayFast sandbox-only credentials are present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAYFAST_MERCHANT_ID:-}" ] || [ -z "${PAYFAST_MERCHANT_KEY:-}" ]; then
            echo "::error::Missing PAYFAST_SANDBOX_MERCHANT_ID or PAYFAST_SANDBOX_MERCHANT_KEY repository secrets"
            exit 1
          fi
          echo "PAYFAST_SANDBOX_CREDENTIALS_PRESENT=YES"
      - name: Install Django and Chromium
        run: |
          python -m pip install -r backend/requirements.txt >/dev/null
          mkdir -p /tmp/amaris-sandbox
          cd /tmp/amaris-sandbox
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Create real signed checkout using application code
        run: |
          cd backend
          python manage.py migrate --noinput >/dev/null
          python manage.py shell -c '
          import json, os
          from decimal import Decimal
          from content.services.donations import create_donation_checkout
          key="test-"+os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"]
          checkout=create_donation_checkout(name="Sandbox Donor",email="sandbox@example.invalid",amount=Decimal("20.00"),purpose="general",idempotency_key=key)
          from content.services.payments import generate_payfast_signature
          selected=["merchant_id","merchant_key","m_payment_id","amount","item_name"]
          minimal={k:checkout.fields[k] for k in selected}
          minimal["signature"]=generate_payfast_signature(minimal,os.environ.get("PAYFAST_PASSPHRASE",""))
          with open("/tmp/amaris-sandbox/checkout.json","w") as f:
              json.dump({"url":checkout.gateway_url,"reference":checkout.reference,"fields":checkout.fields,"minimal_fields":minimal},f)
          print("DJANGO_SIGNED_DONATION_CHECKOUT_CREATED")
          '
      - name: Verify genuine PayFast sandbox accepts hosted checkout
        shell: bash
        run: |
          cd /tmp/amaris-sandbox
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const checkout=JSON.parse(fs.readFileSync('checkout.json','utf8'));
          assert.equal(checkout.url,'https://sandbox.payfast.co.za/eng/process');
          assert.equal(checkout.fields.amount,'20.00');
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage();
          try {
            const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('"','&quot;');
            const fields=Object.entries(checkout.fields).map(([key,value])=>'<input type="hidden" name="'+esc(key)+'" value="'+esc(value)+'">').join('');
            await page.setContent('<form action="'+checkout.url+'" method="post">'+fields+'<button id="pay">Test sandbox gateway</button></form>');
            await page.locator('#pay').click();
            await page.waitForURL(url=>url.hostname==='sandbox.payfast.co.za',{timeout:45000});
            await page.waitForLoadState('domcontentloaded',{timeout:45000}).catch(()=>{});
            await page.waitForTimeout(2000);
            const visible=(await page.locator('body').innerText()).slice(0,1100);
            console.log('SANDBOX_HOST_REACHED=YES');
            console.log('SANDBOX_PAGE_TITLE='+JSON.stringify(await page.title()));
            console.log('SANDBOX_PAGE_TEXT='+JSON.stringify(visible));
            const invalid=/Error: 400|could not process your transaction|signature:|signature.+does not match|merchant details are invalid/i;
            console.log('FULL_DONATION_FORM_ACCEPTED='+(!invalid.test(visible)));
            if(invalid.test(visible)){
              const m=checkout.minimal_fields;
              const minimalHtml=Object.entries(m).map(([key,value])=>'<input type="hidden" name="'+esc(key)+'" value="'+esc(value)+'">').join('');
              await page.goto('about:blank');
              await page.setContent('<form method="post" action="'+checkout.url+'">'+minimalHtml+'<button id="pay-minimal">Try minimal PayFast form</button></form>');
              await page.locator('#pay-minimal').click();
              await page.waitForURL(url=>url.hostname==='sandbox.payfast.co.za',{timeout:45000});
              await page.waitForTimeout(2200);
              const minimalText=(await page.locator('body').innerText()).slice(0,1100);
              console.log('MINIMAL_SANDBOX_PAGE='+JSON.stringify(minimalText));
              assert(!invalid.test(minimalText),'PayFast also rejects the minimal form; merchant profile/signature must be fixed');
              console.log('RESULT=MINIMAL_FORM_ACCEPTED_FULL_FORM_REJECTED');
            }else{
              assert(/wallet|login|log in|password|payfast account|pay now/i.test(visible),'No valid PayFast buyer checkout was displayed');
              console.log('RESULT=PAYFAST_SANDBOX_CHECKOUT_ACCEPTED');
            }
          }finally{await browser.close();}
          NODE
      - name: Confirm no simulated payment was marked paid
        run: |
          cd backend
          python manage.py shell -c '
          from content.donation_models import DonationContribution
          d=DonationContribution.objects.get()
          assert d.status=="pending", "No provider notification arrived; donor record must stay pending"
          print("SAFE_PENDING_UNTIL_GENUINE_ITN=PASS")
          '
