name: Establish private shared staging Valkey on existing host
on:
  push:
    branches: [ops/aws-multi-task-readiness-20261126]
    paths: ['.github/workflows/aws-shared-host-valkey.yml', 'deploy/aws/blue-green/*shared-host-valkey*']
permissions:
  contents: read
concurrency:
  group: amaris-shared-host-valkey
  cancel-in-progress: false
jobs:
  establish:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-multi-task-readiness-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: for script in deploy/aws/blue-green/*shared-host-valkey.sh; do bash -n "$script"; done
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Establish TLS broker and inspect existing queues
        run: bash deploy/aws/blue-green/provision-shared-host-valkey.sh
