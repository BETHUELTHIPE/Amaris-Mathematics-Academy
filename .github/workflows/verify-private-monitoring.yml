name: Verify live private monitoring

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-private-monitoring.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-private-monitoring
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Run one bounded read-only probe inside the existing backend network
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import shlex
          import time
          import urllib.error
          import urllib.request

          token = os.environ.get("RENDER_API_KEY", "")
          if not token:
              raise SystemExit("Protected RENDER_API_KEY unavailable")
          backend = "srv-dapn6b3tqb8s73d3r7n0"
          def api(method, path, data=None):
              # The only mutation is one ephemeral diagnostic job on this backend.
              if method != "GET" and not (method == "POST" and path == f"/services/{backend}/jobs"):
                  raise SystemExit("Unexpected mutation")
              request = urllib.request.Request(
                  "https://api.render.com/v1" + path,
                  method=method,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Render diagnostic API: HTTP {error.code}") from None

          service = api("GET", f"/services/{backend}")
          if (service.get("ownerId"), service.get("name"), service.get("type"), service.get("branch")) != (
              "tea-csppi8l6l47c73dk9c90", "amaris-production-web", "web_service", "production-release-20260923"
          ):
              raise SystemExit("Unexpected production backend identity")

          remote = r'''
          import base64
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          def get(url, auth=False, extra_headers=None):
              headers = {"Accept-Encoding": "identity", "User-Agent": "Amaris-private-verification/1.0"}
              headers.update(extra_headers or {})
              if auth:
                  credentials = os.environ.get("MONITORING_FLOWER_BASIC_AUTH", "")
                  headers["Authorization"] = "Basic " + base64.b64encode(credentials.encode()).decode()
              try:
                  response = opener.open(urllib.request.Request(url, headers=headers), timeout=8)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.status, response.read(1024 * 1024)

          result = {}
          result["django_private_http_trials"] = {}
          for variant, headers in {
              "private_host": {},
              "forwarded_https": {"X-Forwarded-Proto": "https"},
              "public_host": {"Host": "amaris-production-web.onrender.com"},
              "public_host_forwarded_https": {"Host": "amaris-production-web.onrender.com", "X-Forwarded-Proto": "https"},
          }.items():
              try:
                  status, body = get("http://amaris-production-web:10000/metrics", extra_headers=headers)
                  result["django_private_http_trials"][variant] = {"status": status, "invalid_http_parser": b"Invalid HTTP request received" in body[:256]}
              except (OSError, ValueError):
                  result["django_private_http_trials"][variant] = {"status": "connection_error"}
          checks = {
              "prometheus_ready": "http://amaris-monitoring-prometheus:10000/admin/monitoring/prometheus/-/ready",
              "grafana_health": "http://amaris-monitoring-grafana:10000/admin/monitoring/grafana/api/health",
              "django_metrics": "http://amaris-production-web:10000/metrics",
              "anonymous_admin_denied": "http://amaris-production-web:10000/admin/monitoring/",
          }
          for name, url in checks.items():
              try:
                  status, _ = get(url)
                  result[name] = status in (302, 403) if name == "anonymous_admin_denied" else status == 200
                  result[name + "_http"] = status
              except (OSError, ValueError):
                  result[name] = False

          try:
              status, body = get("http://amaris-monitoring-prometheus:10000/admin/monitoring/prometheus/api/v1/targets")
              targets = json.loads(body)["data"]["activeTargets"] if status == 200 else []
              samples = {}
              for target in targets:
                  job = target.get("labels", {}).get("job")
                  if job not in {"django", "flower", "render-native", "prometheus"}:
                      continue
                  last = datetime.datetime.fromisoformat(target["lastScrape"].replace("Z", "+00:00")).timestamp()
                  samples[job] = {"up": target.get("health") == "up", "fresh": 0 <= time.time() - last < 120}
              result["scrape_targets"] = samples
              result["all_scrapes_up_and_fresh"] = len(samples) == 4 and all(v["up"] and v["fresh"] for v in samples.values())
          except (KeyError, OSError, ValueError):
              result["all_scrapes_up_and_fresh"] = False

          try:
              status, body = get("http://amaris-monitoring-grafana:10000/admin/monitoring/grafana/api/datasources/proxy/uid/amaris-prometheus/api/v1/query?query=up")
              data = json.loads(body)
              result["grafana_real_datasource_query"] = status == 200 and data.get("status") == "success" and bool(data.get("data", {}).get("result"))
          except (OSError, ValueError):
              result["grafana_real_datasource_query"] = False

          try:
              status, body = get("http://amaris-monitoring-flower:10000/admin/monitoring/flower/api/workers?status=true", auth=True)
              workers = json.loads(body) if status == 200 else {}
              result["monitor_worker_current_heartbeat"] = isinstance(workers, dict) and any(name.startswith("monitor@") and alive is True for name, alive in workers.items())
          except (OSError, ValueError):
              result["monitor_worker_current_heartbeat"] = False

          # This hostname allowlist is non-secret configuration, printed only to
          # preserve existing entries if the private scrape host needs adding.
          result["django_allowed_hosts"] = os.environ.get("DJANGO_ALLOWED_HOSTS", "").split(",")
          print("AMARIS_PRIVATE_MONITORING_PROBE=" + json.dumps(result, sort_keys=True), flush=True)
          required = ["prometheus_ready", "grafana_health", "django_metrics", "anonymous_admin_denied", "all_scrapes_up_and_fresh", "grafana_real_datasource_query", "monitor_worker_current_heartbeat"]
          raise SystemExit(0 if all(result.get(key) is True for key in required) else 1)
          '''
          import textwrap
          remote = textwrap.dedent(remote)
          compile(remote, "private-monitoring-probe", "exec")
          created = api("POST", f"/services/{backend}/jobs", {"startCommand": "cd backend && python -c " + shlex.quote(remote)})
          job_id = created["id"]
          print("Private monitoring diagnostic job:", job_id, flush=True)
          for _ in range(90):
              job = api("GET", f"/services/{backend}/jobs/{job_id}")
              status = job.get("status")
              if status in {"succeeded", "failed", "canceled"}:
                  print("Diagnostic job status:", status, flush=True)
                  raise SystemExit(0 if status == "succeeded" else 1)
              time.sleep(5)
          raise SystemExit("Diagnostic job timed out; inspect it before retrying")
          PY
