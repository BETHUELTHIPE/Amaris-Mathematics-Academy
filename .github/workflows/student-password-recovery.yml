name: Student Password Recovery Security Gate
on:
  push:
    branches: [fix/student-password-reset-recovery-20261025]
    paths:
      - "frontend/app/auth/**"
      - "frontend/app/forgot-password/**"
      - "frontend/app/reset-password/**"
      - "frontend/lib/password-recovery.ts"
      - "frontend/tests/password-recovery.test.mjs"
      - "frontend/tests/registration-actions.test.mjs"
      - ".github/workflows/student-password-recovery.yml"
permissions:
  contents: read
jobs:
  password-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Type-check recovery callbacks and session guards
        working-directory: frontend
        run: npm run typecheck
      - name: Test password recovery plus student and Google registration
        working-directory: frontend
        run: node --test tests/password-recovery.test.mjs tests/registration-actions.test.mjs tests/google-registration.test.mjs tests/universal-email-verification.test.mjs
