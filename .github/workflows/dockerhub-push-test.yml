name: Docker Hub Push Verification

on:
  push:
    branches:
      - security/owasp-test-suite
    paths:
      - "backend/**"
      - ".github/workflows/dockerhub-push-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-push-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: bethuelm/amaris-mathematics-academy

jobs:
  build-push-verify:
    name: Build, push, and verify Docker Hub image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: bethuelm
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare immutable verification tag
        id: vars
        shell: bash
        run: echo "tag=${REGISTRY}/${IMAGE_NAME}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform verification image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=dockerhub-push-verification
          cache-to: type=gha,mode=max,scope=dockerhub-push-verification

      - name: Verify remote multi-platform manifest
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ steps.vars.outputs.tag }}" | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt

      - name: Pull pushed image back from Docker Hub
        shell: bash
        run: |
          docker pull --platform linux/amd64 "${{ steps.vars.outputs.tag }}"
          docker image inspect "${{ steps.vars.outputs.tag }}" >/dev/null

      - name: Record verification result
        shell: bash
        run: |
          echo "Docker Hub verification tag: ${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build, push, manifest inspection, and pull-back completed successfully." >> "$GITHUB_STEP_SUMMARY"
