name: Amaris Production-Revision Isolated Migration Audit
on:
  push:
    branches: ["ops/prod-migration-graph-check-20261028"]
    paths: ["ops/run-isolated-migration-audit.txt"]
permissions:
  contents: read
jobs:
  django-migration-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_migration_audit
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_migration_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_migration_audit
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      SUPABASE_S3_REQUIRED: "false"
      PAYFAST_MODE: sandbox
      PAYFAST_ENV: sandbox
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_TASK_EAGER_PROPAGATES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned Django tests and database client
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Django settings and no accidental unapplied model edits
        working-directory: backend
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(64))')"
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Apply migrations ONLY to disposable GitHub Actions PostgreSQL
        working-directory: backend
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(64))')"
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py showmigrations content
          python - <<'PY'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","amaris_cms.settings")
          django.setup()
          from django.db.migrations.recorder import MigrationRecorder
          names={name for app,name in MigrationRecorder.Migration.objects.filter(app="content").values_list("app","name")}
          assert "0016_separate_location_fields" in names, "Missing existing production migration 0016"
          assert not any(x.startswith("0018_") for x in names), "Unapproved migration 0018 unexpectedly in release branch"
          print("PASS: deployed production backend migration graph reaches 0016 without pending model changes or unapproved 0018.")
          PY
