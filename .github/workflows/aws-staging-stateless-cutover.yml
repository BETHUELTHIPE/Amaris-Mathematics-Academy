name: Migrate Amaris staging queues and activate stateless ECS
on:
  push:
    branches: [ops/aws-multi-task-readiness-20261126]
    paths: ['.github/workflows/aws-staging-stateless-cutover.yml']
permissions:
  contents: read
concurrency:
  group: amaris-shared-host-valkey
  cancel-in-progress: false
jobs:
  cutover:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-multi-task-readiness-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate cutover scripts and task definitions
        run: |
          for f in cutover-gateway freeze-copy-valkey unpause-old-broker verify-shared-celery-jobs activate-stateless-staging; do bash -n "deploy/aws/blue-green/$f.sh"; done
          python3 -m py_compile deploy/aws/blue-green/migrate-valkey-data.py
          python3 -m unittest discover -s deploy/aws/blue-green -p 'test_render*.py' -v
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Controlled staging-only queue cutover and two-replica activation
        run: bash deploy/aws/blue-green/activate-stateless-staging.sh
