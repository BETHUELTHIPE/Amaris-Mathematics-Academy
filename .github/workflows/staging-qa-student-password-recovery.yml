name: Protected Staging QA Student Password Recovery
on:
  push:
    branches: ["ops/qa-student-auth-recovery-20261026"]
    paths: ["ops/staging-qa-student-recovery-request.txt"]
permissions:
  contents: read
concurrency:
  group: staging-qa-student-password-recovery
  cancel-in-progress: false
jobs:
  recover-staging-student-qa:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/qa-student-auth-recovery-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: staging
    env:
      STAGING_TEST_STUDENT_EMAIL: ${{ secrets.STAGING_TEST_STUDENT_EMAIL }}
      STAGING_TEST_STUDENT_PASSWORD: ${{ secrets.STAGING_TEST_STUDENT_PASSWORD }}
      STAGING_TEST_TUTOR_EMAIL: ${{ secrets.STAGING_TEST_TUTOR_EMAIL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_AUTH_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_AUTH_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover only verified existing staging QA student credential if necessary
        run: python3 ops/staging_qa_student_password_alignment.py
