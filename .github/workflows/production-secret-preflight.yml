name: Production Secret Preflight

on:
  push:
    branches: [production-release-20260923]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Production secret presence
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      PRODUCTION_DEPLOY_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
      PRODUCTION_DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
      SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
      SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
      PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
      PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_MERCHANT_KEY }}
      PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
    steps:
      - name: Check production credential presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          required=(
            RENDER_API_KEY
            SUPABASE_STORAGE_S3_ACCESS_KEY_ID
            SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY
            PAYFAST_MERCHANT_ID
            PAYFAST_MERCHANT_KEY
            PAYFAST_PASSPHRASE
          )
          optional=(
            PRODUCTION_DEPLOY_WEBHOOK_URL
            PRODUCTION_DEPLOY_TOKEN
            EMAIL_HOST
            EMAIL_HOST_USER
            EMAIL_HOST_PASSWORD
            DEFAULT_FROM_EMAIL
          )
          missing=0
          for name in "${required[@]}"; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=CONFIGURED"
            else
              echo "::error::${name}=MISSING"
              missing=1
            fi
          done
          for name in "${optional[@]}"; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=CONFIGURED"
            else
              echo "::warning::${name}=MISSING"
            fi
          done
          exit "$missing"
