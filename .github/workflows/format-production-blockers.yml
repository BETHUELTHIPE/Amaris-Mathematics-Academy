name: Format Production Blocker Branch

on:
  push:
    branches: [production-readiness-blockers-1-7-20260918]

permissions:
  contents: write

jobs:
  black:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-blockers-1-7-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format changed Python files
        run: |
          python -m pip install black==26.5.1
          black             backend/content/authentication.py             backend/content/payfast_views.py             backend/content/student_views.py             backend/content/test_student_api.py
      - name: Commit formatter output when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             backend/content/authentication.py             backend/content/payfast_views.py             backend/content/student_views.py             backend/content/test_student_api.py
          git commit -m "Apply Black to production blocker changes"
          git push origin HEAD:production-readiness-blockers-1-7-20260918
