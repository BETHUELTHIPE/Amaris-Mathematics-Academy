name: Frontend Dependency Fix Trial

on:
  push:
    branches:
      - feature/render-native-monitoring-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate candidate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Install candidate tree
        run: npm ci
      - name: Verify patched braces version
        run: npm ls braces --all
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Render-style Node build
        run: |
          npm install --no-save nitro @tailwindcss/vite@4.3.3
          NODE_ENV=production NITRO_PRESET=node npx vite build --config vite.node.config.ts
      - name: Show candidate lockfile digest
        if: always()
        run: |
          sha256sum package-lock.json
          npm audit --json || true
