name: Staging Six Tutor Documents Backend Reconciliation Gate
on:
  push:
    branches: ["ops/staging-six-docs-backend-reconcile-20261027"]
    paths:
      - "backend/**"
      - ".github/workflows/staging-six-docs-backend-gate.yml"
permissions:
  contents: read
jobs:
  validate-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgresql://amaris_ci@127.0.0.1:5432/amaris_ci"
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      CELERY_BROKER_URL: "redis://127.0.0.1:6379/0"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/1"
      TUTOR_REQUIRE_SIX_DOCUMENTS: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Ephemeral secret
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          echo "DJANGO_SECRET_KEY=$secret" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Django configuration and migration graph
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Validate tutor privacy and six-category contracts with compatibility and strict mode
        run: |
          python manage.py test content.test_tutor_applications
          TUTOR_REQUIRE_SIX_DOCUMENTS=true python manage.py test content.test_tutor_applications.TutorApplicationJourneyTests.test_six_categorized_documents_are_required_and_private content.test_tutor_applications.TutorApplicationJourneyTests.test_legacy_or_oversized_six_document_form_is_rejected
