name: Stage the Paystack test webhook signing secret
on:
  push:
    branches: [ops/aws-paystack-staging-acceptance-20261127]
    paths: [.github/workflows/aws-paystack-test-webhook-secret.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-paystack-staging-acceptance-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - name: Require the dedicated staging signing secret
        env:
          SIGNING_SECRET: ${{ secrets.PAYSTACK_TEST_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [[ ! "$SIGNING_SECRET" =~ ^whsec_[^[:space:]]+$ ]]; then
            echo 'BLOCKED: set PAYSTACK_TEST_WEBHOOK_SECRET in the GitHub staging environment.' >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE != ''
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Encrypt and restrict the Paystack test signing secret
        env:
          SIGNING_SECRET: ${{ secrets.PAYSTACK_TEST_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          python - <<'PY'
          import hmac
          import json
          import os
          import re

          import boto3

          account = "110156539003"
          region = "eu-north-1"
          cluster = "amaris-ecs-staging"
          name = "/amaris/aws-staging/paystack/test-webhook-signing-secret"
          parameter_arn = f"arn:aws:ssm:{region}:{account}:parameter{name}"
          session = boto3.Session(region_name=region)
          assert session.client("sts").get_caller_identity()["Account"] == account
          ecs = session.client("ecs")
          ssm = session.client("ssm")
          iam = session.client("iam")
          web, = ecs.describe_services(cluster=cluster, services=["amaris-web-staging-stateless"])["services"]
          assert web["status"] == "ACTIVE" and web["runningCount"] == web["desiredCount"] == 2
          candidate = ecs.describe_task_definition(taskDefinition="amaris-ecs-staging-alb-web:17")["taskDefinition"]
          role_arn = candidate["executionRoleArn"]
          assert re.fullmatch(rf"arn:aws:iam::{account}:role/amaris-ecs-staging-TaskExecutionRole-[A-Za-z0-9]+", role_arn)
          value = os.environ.pop("SIGNING_SECRET")
          assert re.fullmatch(r"whsec_\S+", value)
          try:
              parameter = ssm.get_parameter(Name=name, WithDecryption=True)["Parameter"]
          except ssm.exceptions.ParameterNotFound:
              ssm.put_parameter(
                  Name=name,
                  Value=value,
                  Type="SecureString",
                  Tier="Standard",
                  Overwrite=False,
                  Description="Paystack test-mode webhook signing secret for AWS staging",
                  Tags=[{"Key": "Environment", "Value": "staging"}],
              )
              parameter = ssm.get_parameter(Name=name, WithDecryption=True)["Parameter"]
          if parameter["Type"] != "SecureString" or parameter["ARN"] != parameter_arn or not hmac.compare_digest(
              parameter["Value"], value
          ):
              raise SystemExit("Existing staging signing secret differs. Preserved the current parameter.")
          role = role_arn.rsplit("/", 1)[-1]
          policy = "AmarisStagingPaystackTestWebhookSigningRead"
          document = {
              "Version": "2012-10-17",
              "Statement": [{"Effect": "Allow", "Action": "ssm:GetParameters", "Resource": parameter_arn}],
          }
          try:
              observed = iam.get_role_policy(RoleName=role, PolicyName=policy)["PolicyDocument"]
          except iam.exceptions.NoSuchEntityException:
              iam.put_role_policy(RoleName=role, PolicyName=policy, PolicyDocument=json.dumps(document))
              observed = iam.get_role_policy(RoleName=role, PolicyName=policy)["PolicyDocument"]
          assert observed == document
          print("PASS: encrypted staging signing secret and parameter-specific ECS execution-role access.")
          PY
