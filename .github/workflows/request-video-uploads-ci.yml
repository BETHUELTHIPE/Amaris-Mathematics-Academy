name: Request Video Large Uploads CI

on:
  push:
    branches:
      - feat/request-video-1gb-supabase-20261009
  pull_request:
    branches:
      - production-release-20260923
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: request-video-upload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-upload-security:
    name: Django upload ownership and storage checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      PAYFAST_MODE: sandbox
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Generate masked synthetic Django secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Validate formatting and lint
        run: |
          black --check --diff content/services/video_requests.py content/video_request_views.py content/test_video_requests.py
          ruff check content/services/video_requests.py content/video_request_views.py content/test_video_requests.py
      - name: Check database migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Test private upload registration and paid video workflow
        run: python manage.py test content.test_video_requests

  frontend-upload-security:
    name: Frontend upload build and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install committed dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Private TUS upload contract checks (no real uploads)
        run: node --test tests/video-request-contract.test.mjs
