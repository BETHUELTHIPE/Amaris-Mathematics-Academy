name: Format monitoring Django integration
on:
  push:
    branches: ['feature/superuser-monitoring-status-20261020']
    paths: ['.github/workflows/format-monitoring-integration.yml']
permissions:
  contents: write
jobs:
  black:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/superuser-monitoring-status-20261020
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Black-format only the three monitoring Python files
        run: |
          pip install black==25.1.0
          black backend/amaris_cms/monitoring_admin.py backend/amaris_cms/monitoring_status.py backend/tests/test_monitoring_admin.py
      - name: Push only formatted source
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/amaris_cms/monitoring_admin.py backend/amaris_cms/monitoring_status.py backend/tests/test_monitoring_admin.py
          if git diff --cached --quiet; then echo "Nothing to format"; exit 0; fi
          git commit -m "style(admin): apply Black to monitoring integration"
          git push origin HEAD:feature/superuser-monitoring-status-20261020
