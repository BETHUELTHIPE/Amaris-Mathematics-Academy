name: Live Render Browser Smoke

on:
  push:
    branches: [render-live-current-20260918]
  pull_request:
    branches: [render-live-current-20260918]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://amaris-mathematics-academy-live-students.onrender.com
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install browser smoke dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify live public pages
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from playwright.sync_api import sync_playwright

          base = os.environ["BASE_URL"].rstrip("/")
          failures = []

          with sync_playwright() as p:
              browser = p.chromium.launch()

              # Render can serve a temporary 503 while a new release is building.
              # Wait for two consecutive healthy probes, but NEVER accept a 503
              # or application-loading screen as a passing browser smoke.
              consecutive_healthy = 0
              for attempt in range(1, 37):
                  probe = browser.new_page()
                  try:
                      response = probe.goto(
                          f"{base}/", wait_until="domcontentloaded", timeout=20_000
                      )
                      status = response.status if response else 0
                      title = probe.title()
                  except Exception:
                      status, title = 0, ""
                  finally:
                      probe.close()
                  print(f"Render readiness attempt={attempt} HTTP={status}", flush=True)
                  if status == 200 and "Application loading" not in title:
                      consecutive_healthy += 1
                      if consecutive_healthy == 2:
                          break
                  else:
                      consecutive_healthy = 0
                  time.sleep(15)
              else:
                  print("LIVE SMOKE FAILED: Render did not become ready.", flush=True)
                  browser.close()
                  sys.exit(1)

              for path in ["/", "/contact"]:
                  page = browser.new_page()
                  page_errors = []
                  console_errors = []

                  page.on("pageerror", lambda exc, store=page_errors: store.append(str(exc)))
                  page.on(
                      "console",
                      lambda msg, store=console_errors: store.append(msg.text)
                      if msg.type == "error"
                      else None,
                  )

                  response = page.goto(
                      f"{base}{path}",
                      wait_until="networkidle",
                      timeout=120_000,
                  )
                  status = response.status if response else 0
                  body = page.locator("body").inner_text(timeout=30_000)
                  print(f"PATH {path} STATUS {status}")
                  print(f"TITLE {page.title()}")
                  if page_errors:
                      print("PAGE_ERRORS:")
                      for item in page_errors:
                          print(f"  - {item}")
                  if console_errors:
                      print("CONSOLE_ERRORS:")
                      for item in console_errors[:20]:
                          print(f"  - {item}")

                  if not response or status >= 500:
                      failures.append(f"{path}: HTTP {status}")
                  if "We could not load this page." in body:
                      failures.append(f"{path}: recovery screen rendered")
                  if page_errors:
                      failures.append(f"{path}: browser page error: {page_errors[0]}")
                  if console_errors:
                      failures.append(f"{path}: browser console error: {console_errors[0]}")

                  page.close()

              api = browser.new_page()
              auth_response = api.goto(
                  f"{base}/api/auth-state",
                  wait_until="networkidle",
                  timeout=120_000,
              )
              auth_status = auth_response.status if auth_response else 0
              print(f"PATH /api/auth-state STATUS {auth_status}")
              if not auth_response or auth_status != 200:
                  failures.append(f"/api/auth-state: HTTP {auth_status}")
              api.close()
              browser.close()

          if failures:
              print("LIVE SMOKE FAILED")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          print("LIVE SMOKE PASSED")
          PY
