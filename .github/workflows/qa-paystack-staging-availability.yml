name: Verify AWS staging Paystack and test account availability
on:
  push:
    branches: [qa/aws-staging-payfast-tutor-applications-20261127]
    paths: [.github/workflows/qa-paystack-staging-availability.yml]
permissions: {}
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment:
      name: staging
      deployment: false
    steps:
      - name: Check the deployed route and authenticate to the provider test account
        env:
          PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
          PAYSTACK_SANDBOX_SECRET_KEY: ${{ secrets.PAYSTACK_SANDBOX_SECRET_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_TEST_SECRET: ${{ secrets.PAYSTACK_TEST_SECRET }}
          PAYSTACK_WEBHOOK_SECRET: ${{ secrets.PAYSTACK_WEBHOOK_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import uuid
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())
          try:
              with opener.open("https://16.171.164.5/api/v1/paystack/webhook/", timeout=15) as response:
                  print("AWS webhook GET status:", response.status)
          except HTTPError as error:
              print("AWS webhook GET status:", error.code)

          names = ("PAYSTACK_TEST_SECRET_KEY", "PAYSTACK_SANDBOX_SECRET_KEY",
                   "PAYSTACK_SECRET_KEY", "PAYSTACK_TEST_SECRET")
          configured = {name: bool(os.environ.get(name, "").strip()) for name in names}
          candidates = {os.environ[name].strip() for name in names
                        if configured[name] and os.environ[name].strip().startswith("sk_test_")}
          print("Paystack staging secret names present:", json.dumps(configured))
          print("Timestamped webhook secret format present:", os.environ.get("PAYSTACK_WEBHOOK_SECRET", "").startswith("whsec_"))
          if len(candidates) != 1:
              print("Provider API unavailable: expected one configured Paystack test key.")
          else:
              key = candidates.pop()
              reference = "LCB-PS-" + uuid.uuid4().hex + uuid.uuid4().hex
              payload = {
                  "email": "amaris-paystack-qa@example.invalid", "amount": 25000,
                  "currency": "ZAR", "reference": reference,
                  "callback_url": "https://16.171.164.5/book-online-live-class/confirmation",
              }
              request = Request("https://api.paystack.co/transaction/initialize",
                                data=json.dumps(payload).encode(),
                                headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
              try:
                  with opener.open(request, timeout=15) as response:
                      result = json.load(response)
                      data = result.get("data") or {}
                      valid = (result.get("status") is True and data.get("reference") == reference
                               and str(data.get("authorization_url", "")).startswith("https://checkout.paystack.com/"))
                      print("Paystack provider test checkout initialized:", valid)
              except HTTPError as error:
                  detail = error.read(8192)
                  try:
                      reply = json.loads(detail)
                      message = " ".join(str(reply.get(name, "")) for name in ("message", "code")).lower()
                  except (ValueError, AttributeError):
                      message = ""
                  reason = (
                      "IP restriction reported" if any(token in message for token in ("ip address", "whitelist", "allowlist", "ip_allowed"))
                      else "credential rejection reported" if any(token in message for token in ("api key", "secret key", "authorization", "unauthorized", "access token"))
                      else "merchant authorization or currency issue reported" if any(token in message for token in ("currency", "business", "merchant"))
                      else "no specific provider reason available"
                  )
                  print("Paystack test checkout initialization returned HTTP", error.code, reason)
          PY
