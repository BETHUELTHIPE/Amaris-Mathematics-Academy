name: Verified booking receipts (isolated test DB)
on:
  push:
    branches: [fix/staging-booking-receipt-before-email-20261019]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amaris-booking-receipts-feature-ci
  cancel-in-progress: true
jobs:
  django-booking-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: synthetic-staging-ci-gate-not-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: 'false'
      SUPABASE_DATABASE_REQUIRED: 'false'
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: '0'
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      SUPABASE_STORAGE_ENABLED: 'false'
      PAYFAST_MODE: sandbox
      PAYFAST_MERCHANT_ID: synthetic
      PAYFAST_MERCHANT_KEY: synthetic
      PAYFAST_PASSPHRASE: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify migration graph before any deployment
        run: |
          test -f backend/content/migrations/0014_announcement_media.py
          test -f backend/content/migrations/0009_merge_invoice_booking.py
          test ! -f backend/content/migrations/0008_announcement_media.py
      - name: Install Python requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Rehearse schema and verify booking, payment and email-regression logic
        working-directory: backend
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test content.test_live_classes content.test_booking_migration content.test_invoice_archive content.test_student_api content.test_payfast_security
      - name: Report test scope accurately
        run: echo "Synthetic Django tests are not evidence of real Supabase sign-in or inbox delivery."
  staging-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check staging live dependencies
        shell: bash
        run: |
          set -euo pipefail
          base=https://amaris-mathematics-academy-staging.onrender.com
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 5 "$base/health/ready/" -o /tmp/staging-ready.json
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 5 "$base/api/v1/live-classes/slots/?programme=caps&subject=mathematics" -o /tmp/staging-slots.json
          python - <<'PY'
          import json
          with open('/tmp/staging-slots.json', encoding='utf-8') as fh:
              slots=json.load(fh)
          assert isinstance(slots,list)
          assert all('zoom_join_url' not in item for item in slots)
          print('Staging readiness and public booking privacy verified')
          PY
      - name: Anonymous checkout must not create a booking
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 -o /tmp/anonymous-checkout-body -w '%{http_code}'             -H 'Content-Type: application/json' -X POST             -d '{"slot_id":1,"topic":"CI anonymous probe","idempotency_key":"stagingci_20261019"}'             https://amaris-mathematics-academy-staging.onrender.com/api/v1/student/live-classes/checkout/)
          case "$code" in 401|403) echo "Anonymous checkout blocked";; *) echo "Unexpected response $code"; exit 1;; esac
