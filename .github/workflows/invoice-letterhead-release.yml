name: Invoice Letterhead Release Gate
on:
  pull_request:
    branches: [production-release-20260923]
    paths:
      - "backend/content/services/invoices.py"
      - "backend/content/services/invoice_document.py"
      - "backend/content/services/course_invoice_archive.py"
      - "backend/content/static/invoice-brand/**"
      - "backend/content/test_invoice_letterhead.py"
      - "backend/requirements-dev.txt"
      - ".github/workflows/invoice-letterhead-release.yml"
  push:
    branches: [feat/approved-invoice-letterhead-prod-20261024]
    paths:
      - "backend/content/services/**"
      - "backend/content/static/invoice-brand/**"
      - "backend/content/test_invoice_letterhead.py"
      - "backend/requirements-dev.txt"
      - ".github/workflows/invoice-letterhead-release.yml"
permissions:
  contents: read
jobs:
  letterhead-and-payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_invoice_ci
          POSTGRES_USER: amaris_invoice_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U amaris_invoice_ci -d amaris_invoice_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_invoice_ci@127.0.0.1:5432/amaris_invoice_ci
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      SUPABASE_S3_REQUIRED: "false"
      PAYFAST_MODE: sandbox
      PAYFAST_ENV: sandbox
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_TASK_EAGER_PROPAGATES: "true"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: Amaris Test <qa@example.invalid>
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Block production credentials, external email and live payments
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = "postgresql://amaris_invoice_ci@127.0.0.1:5432/amaris_invoice_ci"
          test "$PAYFAST_MODE" = sandbox
          test "$EMAIL_BACKEND" = django.core.mail.backends.locmem.EmailBackend
          if env | grep -E '^PAYFAST_(LIVE|PRODUCTION|MERCHANT|PASSPHRASE)='; then
            echo 'Live or credential-bearing PayFast environment variables are forbidden' >&2
            exit 1
          fi
          printf 'DJANGO_SECRET_KEY=%s\n' "$(openssl rand -hex 64)" >> "$GITHUB_ENV"
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Validate schema and checks without production database
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Exercise all 3 invoice services, archive idempotency, email receipts and payment protections
        working-directory: backend
        run: |
          python manage.py test -v 2 \
            content.test_invoice_letterhead \
            content.test_invoice_archive \
            content.test_live_classes \
            content.test_video_requests \
            content.test_payments \
            content.test_payfast_security \
            content.test_tutor_finance \
            content.test_booking_migration
