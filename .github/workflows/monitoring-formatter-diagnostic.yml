name: Monitoring Formatter Diagnostic

on:
  pull_request:
    branches: [production-release-20260923]
    paths:
      - '.github/workflows/monitoring-formatter-diagnostic.yml'
      - 'backend/amaris_cms/monitoring_status.py'

permissions:
  contents: read

jobs:
  black-exact-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install black==25.1.0
      - name: Show exact Black diff
        run: python -m black --diff backend/amaris_cms/monitoring_status.py
