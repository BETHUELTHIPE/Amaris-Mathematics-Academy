name: Staging protected credential preflight (read only)
on:
  push:
    branches: [ops/backend-release-verification-20261018]
    paths: [.github/workflows/backend-staging-secret-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af8709ce7549bff6760512aaa24bdbb718d17e34
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: pip install 'psycopg[binary]==3.2.10'
      - name: Verify whether protected staging credentials are already available
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_S3_ENDPOINT_URL: ${{ secrets.SUPABASE_S3_ENDPOINT_URL }}
          SUPABASE_STORAGE_S3_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts/release")
          from verify_staging_database_isolation import is_dedicated_supabase_staging_dsn, main, validate_dedicated_staging_bindings
          dsn = os.environ.get("STAGING_DATABASE_URL", "")
          report = {
              "staging_database_secret_present": bool(dsn),
              "staging_database_secret_matches_requested_project": is_dedicated_supabase_staging_dsn(dsn),
              "staging_auth_and_storage_endpoints_match_requested_project": validate_dedicated_staging_bindings(os.environ),
              "s3_access_key_present": bool(os.getenv("SUPABASE_S3_ACCESS_KEY_ID") or os.getenv("SUPABASE_STORAGE_S3_ACCESS_KEY_ID")),
              "s3_secret_present": bool(os.getenv("SUPABASE_S3_SECRET_ACCESS_KEY") or os.getenv("SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY")),
          }
          print(json.dumps(report, indent=2))
          if report["staging_database_secret_matches_requested_project"]:
              raise SystemExit(main())
          print("BLOCKED: no protected database credential for the requested dedicated staging project.")
          raise SystemExit(1)
          PY
