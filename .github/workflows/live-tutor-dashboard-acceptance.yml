name: Genuine Live Tutor Dashboard Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-tutor-authenticated:
    if: github.ref_name == 'render-live-current-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: tutor-production-verification
    defaults:
      run:
        working-directory: frontend
    env:
      AMARIS_LIVE_TEST_TUTOR_EMAIL: ${{ secrets.AMARIS_LIVE_TEST_TUTOR_EMAIL }}
      AMARIS_LIVE_TEST_TUTOR_PASSWORD: ${{ secrets.AMARIS_LIVE_TEST_TUTOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: frontend/e2e/requirements.txt
      - name: Require dedicated protected tutor test account
        shell: bash
        run: |
          test -n "$AMARIS_LIVE_TEST_TUTOR_EMAIL" || { echo "::error::Set AMARIS_LIVE_TEST_TUTOR_EMAIL in GitHub tutor-production-verification"; exit 1; }
          test -n "$AMARIS_LIVE_TEST_TUTOR_PASSWORD" || { echo "::error::Set AMARIS_LIVE_TEST_TUTOR_PASSWORD in GitHub tutor-production-verification"; exit 1; }
      - name: Install isolated Chromium
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify real approved tutor login, private dashboard and persistence
        run: python -u e2e/live_tutor_dashboard_acceptance.py
