name: Staging Student Identity Welcome Acceptance
on:
  push:
    branches: [feat/staging-student-welcome-identity-20261026]
    paths:
      - "frontend/app/dashboard/page.tsx"
      - "frontend/lib/auth.ts"
      - "frontend/tests/student-dashboard-welcome-identity.test.mjs"
      - ".github/workflows/staging-student-welcome-identity.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Validate TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Test private dashboard welcome, verified identity, and safe streaming
        working-directory: frontend
        run: node --test tests/student-dashboard-welcome-identity.test.mjs tests/dashboard-streaming-performance.test.mjs tests/private-dashboard-pagination.test.mjs tests/registration-actions.test.mjs
