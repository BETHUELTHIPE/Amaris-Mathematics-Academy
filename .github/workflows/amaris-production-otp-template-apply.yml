name: Completed Production Six-Digit Auth Template Audit
on:
  push:
    branches: ["ops/prod-otp-template-apply-20261025"]
    paths: ["ops/production-otp-template-apply-approval.txt"]
permissions:
  contents: read
concurrency:
  group: amaris-prod-supabase-otp-configuration
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/prod-otp-template-apply-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_AUTH_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved branded six-digit templates and automation tests
        run: |
          set -eu
          python -m unittest discover -s tests -p test_configure_supabase_auth_otp.py -v
          python - <<'PY'
          from pathlib import Path
          for path in ["frontend/email-templates/magic-link-login.html", "frontend/email-templates/confirm-signup.html"]:
              html=Path(path).read_text()
              if "{{ .Token }}" not in html or "{{ .ConfirmationURL }}" not in html or "localhost" in html or "{{ .SiteURL }}" in html:
                  raise SystemExit("BLOCK: Branded OTP email template is not production safe")
          print("PASS: Production templates include six-digit code and canonical verification link")
          PY
      - name: Confirm production Auth project and SMTP before modification
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.error import HTTPError,URLError
          from urllib.request import Request,urlopen
          token=os.environ.get("SUPABASE_ACCESS_TOKEN","")
          if not token:
              raise SystemExit("BLOCK: Production Auth Management token unavailable")
          req=Request("https://api.supabase.com/v1/projects/epkcuseloinygkakxxdu/config/auth",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
          try:
              with urlopen(req,timeout=20) as response:
                  config=json.load(response)
          except (HTTPError,URLError):
              raise SystemExit("BLOCK: Production Auth config GET failed") from None
          if not isinstance(config,dict) or str(config.get("site_url","")).rstrip("/")!="https://amaris-mathematics-academy-live-students.onrender.com":
              raise SystemExit("BLOCK: Production Auth Site URL does not match live students")
          if config.get("mailer_autoconfirm") is not False or config.get("external_email_enabled") is not True:
              raise SystemExit("BLOCK: Production email confirmation or provider disabled")
          if not config.get("smtp_host") or not config.get("smtp_admin_email"):
              raise SystemExit("BLOCK: Production Auth custom SMTP missing")
          print("PASS: Production Auth preflight verified; no sensitive settings disclosed")
          PY
      - name: Verify previously applied OTP templates and expiry settings (read only)
        run: |
          python scripts/configure_supabase_auth_otp.py --project-ref epkcuseloinygkakxxdu --mode check
