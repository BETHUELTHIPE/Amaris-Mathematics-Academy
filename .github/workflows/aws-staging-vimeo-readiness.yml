name: Diagnose Vimeo folder authorization for staging

on:
  push:
    branches: [ops/aws-tutor-media-staging-20261127]
    paths: [.github/workflows/aws-staging-vimeo-readiness.yml]

permissions: {}

concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false

jobs:
  vimeo-access:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Check protected Vimeo credentials individually
        env:
          ACADEMY_VIMEO_TOKEN: ${{ secrets.ACADEMY_VIMEO_TOKEN }}
          VIMEO_API_TOKEN: ${{ secrets.VIMEO_API_TOKEN }}
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
          VIMEO_UPLOAD_TOKEN: ${{ secrets.VIMEO_UPLOAD_TOKEN }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          names = ("ACADEMY_VIMEO_TOKEN", "VIMEO_API_TOKEN", "VIMEO_ACCESS_TOKEN", "VIMEO_UPLOAD_TOKEN", "VIMEO_TOKEN")
          folder = "/users/261260024/projects/31427264"

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())
          for name in names:
              token = os.environ.get(name, "").strip()
              if not token:
                  print(f"{name}: absent")
                  continue
              if token.lower().startswith("bearer ") or token.startswith(("'", '"')):
                  print(f"{name}: value is not in the expected raw-token format")
                  continue
              request = Request(
                  f"https://api.vimeo.com{folder}?fields=uri",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.vimeo.*+json;version=3.4"},
              )
              try:
                  with opener.open(request, timeout=10) as response:
                      data = json.load(response)
                  print(f"{name}: folder matches expected reference = {data.get('uri') == folder}")
              except HTTPError as error:
                  print(f"{name}: Vimeo HTTP {error.code}")
              except (URLError, OSError, ValueError):
                  print(f"{name}: couldn't reach Vimeo's folder API or parse its response")
          PY
      - name: Look for named Vimeo credential entries in the AWS staging region
        run: |
          set -euo pipefail
          if result="$(aws ssm describe-parameters --parameter-filters 'Key=Name,Option=Contains,Values=vimeo' --output json 2>/dev/null)"; then
            jq '{vimeo_amaris_parameter_entries: [.Parameters[] | select(.Name | test("amaris";"i"))] | length}' <<< "$result"
          else
            echo 'SSM parameter inventory unavailable.'
          fi
          if result="$(aws secretsmanager list-secrets --filters Key=name,Values=amaris,/amaris,vimeo --output json 2>/dev/null)"; then
            jq '{vimeo_amaris_secret_entries: [.SecretList[] | select(.Name | test("vimeo";"i"))] | length}' <<< "$result"
          else
            echo 'Secrets Manager inventory unavailable.'
          fi
