name: Validate CloudWatch SNS monitoring
on:
  pull_request:
    branches: [ops/aws-verified-release-20261126]
    paths: ['deploy/aws/monitoring/**', '.github/workflows/aws-monitoring-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: bash -n deploy/aws/monitoring/deploy.sh
      - run: |
          python3 -m pip install cfn-lint==1.61.0
          cfn-lint -r eu-north-1 -t deploy/aws/monitoring/cloudwatch-sns.yml
