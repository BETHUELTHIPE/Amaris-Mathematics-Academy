name: Amaris Live Verified Email Booking and Password Smoke
on:
  push:
    branches: ["ops/live-auth-booking-password-smoke-20261027"]
    paths: ["ops/live-auth-booking-password-request.txt"]
permissions:
  contents: read
jobs:
  anonymous-protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Live public/restricted route checks with no account, secrets or writes
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          import time
          from urllib.parse import urlparse
          base = "https://amaris-mathematics-academy-live-students.onrender.com"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          def get(path):
              request=urllib.request.Request(base+path,headers={"User-Agent":"AmarisLiveAuthBookingReadOnlyAudit/1.0"})
              for attempt in (1,2,3):
                  try:
                      with opener.open(request,timeout=80) as response:
                          return response.status,dict(response.headers),response.read(300000).decode("utf-8","replace")
                  except urllib.error.HTTPError as e:
                      return e.code,dict(e.headers),e.read(300000).decode("utf-8","replace")
                  except (TimeoutError,urllib.error.URLError):
                      if attempt == 3:
                          raise SystemExit(f"FAIL: {path} unresponsive after three cold-start-aware tries") from None
                      print(f"NOTICE: {path} needed another connection attempt while Render warms")
                      time.sleep(4)
          def check_public(path,expected):
              code,headers,html=get(path)
              if code!=200 or expected not in html:
                  raise SystemExit(f"FAIL: public route {path} HTTP {code} or missing expected content")
              print(f"PASS: {path} reachable HTTP 200")
          def check_protected(path,expected_path="/login"):
              code,headers,html=get(path)
              destination=next((value for name,value in headers.items() if name.lower()=="location"),"")
              destination_path=urlparse(destination).path
              if code not in (301,302,303,307,308) or destination_path!=expected_path:
                  raise SystemExit(f"FAIL: anonymous protected route {path} HTTP {code}, redirected to {destination_path or "(missing location)"} (expected {expected_path})")
              print(f"PASS: anonymous {path} redirects to {expected_path}")
          check_public("/login","Sign in with a six-digit email code")
          check_public("/register","Create")
          check_public("/forgot-password","Reset your password")
          check_protected("/book-online-live-class")
          check_protected("/dashboard")
          check_protected("/reset-password",expected_path="/forgot-password")
          print("PASS: account registration/login/recovery publicly available; live class and private dashboard deny anonymous access")
          print("Read-only: no OTP emails, credentials, bookings or payment changes")
          PY
