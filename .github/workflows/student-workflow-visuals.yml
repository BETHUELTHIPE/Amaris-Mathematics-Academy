name: Student workflow visuals verification

on:
  pull_request:
    branches:
      - render-live-current-20260918
    paths:
      - "frontend/app/dashboard/page.tsx"
      - "frontend/components/site/student-workflow-visuals.tsx"
      - "frontend/components/site/student-workflow-refresh.tsx"
      - "frontend/components/site/dashboard-navigation.tsx"
      - "frontend/lib/student-workflow-states.ts"
      - "frontend/tests/student-workflow-visuals.test.mjs"
      - "frontend/lib/student-workflow-e2e-fixtures.ts"
      - "frontend/e2e/student_workflow_visual.py"
      - "frontend/vite.config.ts"
      - "frontend/vite.node.config.ts"
      - "frontend/lib/student-api.ts"
      - ".github/workflows/student-workflow-visuals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-workflow-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --include=dev
      - name: Verify student workflow state model and privacy contract
        run: node --test tests/student-workflow-visuals.test.mjs tests/student-responsive-contract.test.mjs
      - name: Static typing
        run: npm run typecheck
      - name: Check edited frontend files with ESLint
        run: npx eslint app/dashboard/page.tsx components/site/student-workflow-visuals.tsx components/site/student-workflow-refresh.tsx components/site/dashboard-navigation.tsx lib/student-workflow-states.ts

  authenticated-visual-browser:
    name: Student dashboard visual E2E (synthetic-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: frontend/e2e/requirements.txt
      - name: Install reproducible dependencies
        run: |
          npm ci --include=dev
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify responsive authenticated synthetic dashboard
        env:
          NODE_ENV: development
          E2E_SYNTHETIC_STUDENT: "true"
          E2E_WORKFLOW_FIXTURES: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_VISUAL_ARTIFACT_DIR: artifacts/student-workflows
          CMS_API_URL: http://127.0.0.1:3001/api/v1
          CSP_REPORT_ONLY: "true"
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:ci >/tmp/amaris-student-workflow-visual.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/ >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/amaris-student-workflow-visual.log; exit 1; fi
            sleep 2
          done
          python -u e2e/student_workflow_visual.py
      - name: Preserve synthetic screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-workflow-visual-evidence
          path: frontend/artifacts/student-workflows/
          if-no-files-found: warn
          retention-days: 7
