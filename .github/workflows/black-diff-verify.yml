name: Black Diff Verification

on:
  push:
    branches:
      - test/real-integration-boundaries-20260914

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact formatter
        run: python -m pip install black==26.5.1
      - name: Print exact Black diff
        run: black --diff load_tests/capacity_report.py load_tests/test_contract.py || true
