name: Black Formatting Verification

on:
  push:
    branches:
      - test/real-integration-boundaries-20260914

permissions:
  contents: write

jobs:
  black-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact formatter
        run: python -m pip install black==26.5.1
      - name: Apply exact Black formatting
        run: black load_tests/capacity_report.py load_tests/test_contract.py
      - name: Commit formatter-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- load_tests/capacity_report.py load_tests/test_contract.py; then
            echo "Files already match Black 26.5.1."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add load_tests/capacity_report.py load_tests/test_contract.py
          git commit -m "Apply Black formatting to capacity harness"
          git push origin HEAD:test/real-integration-boundaries-20260914
