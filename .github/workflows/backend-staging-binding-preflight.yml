name: Backend staging binding preflight (read only)

on:
  push:
    branches: [ops/backend-release-verification-20261018]
    paths:
      - .github/workflows/backend-staging-binding-preflight.yml
      - scripts/release/backend_staging_binding_preflight.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: pip install 'psycopg[binary]==3.2.10' 'cryptography>=45,<47'
      - name: Inspect actual staging bindings without mutations or secret output
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python scripts/release/backend_staging_binding_preflight.py
