name: School booking curriculum
on:
  pull_request:
    branches: [render-live-current-20260918]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-booking-curriculum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Check frontend and build the actual release
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm audit --omit=dev --audit-level=high
          npm run build
          npm run test:unit
          npm run check:performance
      - name: Build isolated real booking components
        run: |
          python -m pip install -r e2e/requirements.txt
          mkdir -p app/curriculum-test-fixture
          cp e2e/fixtures/curriculum-booking-page.tsx app/curriculum-test-fixture/page.tsx
          npm install --no-save --package-lock=false nitro@3.0.260903-beta @tailwindcss/vite@4.3.3
          NODE_ENV=production NITRO_PRESET=node npx vite build --config vite.node.config.ts
      - name: Verify school grades and chapters across real forms and browsers
        run: |
          NODE_ENV=production HOST=0.0.0.0 PORT=3000 node .output/server/index.mjs > /tmp/school-booking-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/curriculum-test-fixture >/dev/null; then break; fi
            if [ "$attempt" -eq 45 ]; then cat /tmp/school-booking-server.log; exit 1; fi
            sleep 2
          done
          python e2e/school_booking_curriculum.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-booking-browser-evidence
          path: |
            frontend/artifacts/school-curriculum/
            /tmp/school-booking-server.log
          if-no-files-found: warn
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U amaris_ci -d amaris_ci" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: synthetic-school-booking-ci-no-real-students
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SUPABASE_DATABASE_REQUIRED: 'false'
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: 'false'
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: '0'
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      PAYFAST_MODE: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          # Current production backend; this release changes no backend schema.
          ref: 1401bb0e20467aa345bc909e30b35d227cd374da
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-validation
          sparse-checkout: frontend/e2e/fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Verify all twelve school grade/programme combinations save correctly
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cp candidate-validation/frontend/e2e/fixtures/test_school_booking_grades.py backend/content/test_school_booking_grades.py
          cd backend
          python manage.py makemigrations --check --dry-run
          python manage.py test content.test_school_booking_grades
