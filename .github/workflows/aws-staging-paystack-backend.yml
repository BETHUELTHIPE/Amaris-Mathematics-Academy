name: Release Paystack backend to AWS staging
on:
  push:
    branches: [fix/aws-staging-paystack-20261127]
    paths: [.github/workflows/aws-staging-paystack-backend.yml, deploy/aws/paystack/**]
permissions:
  contents: read
concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false
env:
  BACKEND_SHA: fd19cba3bb205b924d8f86fca1a2a765422c7017
  AWS_REGION: eu-north-1
  AWS_PAGER: ''
  ECR_REPO: 110156539003.dkr.ecr.eu-north-1.amazonaws.com/amaris-staging-frontend
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BACKEND_SHA }}
          persist-credentials: false
      - name: Build and inspect the pinned staging backend image
        run: |
          test "$(git rev-parse HEAD)" = "$BACKEND_SHA"
          docker build --file backend/Dockerfile --tag amaris-media:verified \
            --label "org.opencontainers.image.revision=$BACKEND_SHA" backend
          test "$(docker image inspect --format '{{.Architecture}}' amaris-media:verified)" = arm64
      - name: Scan for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: amaris-media:verified
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Publish the verified staging image by digest
        id: publish
        run: |
          set -euo pipefail
          tag="paystack-staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          registry="$(cut -d/ -f1 <<< "$ECR_REPO")"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry" >/dev/null' EXIT
          docker tag amaris-media:verified "$ECR_REPO:$tag"
          docker push "$ECR_REPO:$tag"
          digest="$(aws ecr describe-images --repository-name amaris-staging-frontend \
            --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      BACKEND_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.STAGING_AWS_ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Apply the staging migration and verify the webhook rollout
        run: bash deploy/aws/paystack/release.sh
