name: Frontend Security Backport Validation

on:
  push:
    branches:
      - release/frontend-security-20261014
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/frontend-security-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit high severity
        run: npm audit --audit-level=high
      - name: Clean install
        run: npm ci
      - name: Security backport tests
        run: node --test tests/braces-security-backport.test.mjs
      - name: Unit tests
        run: npm run test:unit
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Render-style production build
        run: |
          npm install --no-save nitro @tailwindcss/vite@4.3.3
          NODE_ENV=production NITRO_PRESET=node npx vite build --config vite.node.config.ts
      - name: Persist lockfile
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Persist frontend security backport lockfile"
          git push origin HEAD:release/frontend-security-20261014
