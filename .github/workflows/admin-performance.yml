name: Admin performance report acceptance
on:
  pull_request:
    branches: [feat/tutor-video-admin-alerts-20261113, production-release-20260923]
    paths:
      - backend/content/performance*
      - backend/content/services/performance*
      - backend/content/test_performance_reports.py
      - backend/content/templates/admin/content/performancedigest/**
      - backend/scripts/check_performance_dashboard.mjs
      - .github/workflows/admin-performance.yml
permissions:
  contents: read
jobs:
  dashboard-and-email:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PERFORMANCE_DASHBOARD_EVIDENCE_DIR: /tmp/performance-evidence
      PERFORMANCE_UI_FIXTURE: /tmp/performance-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Collect actual Admin assets and export synthetic rendered views
        working-directory: backend
        run: |
          python manage.py collectstatic --noinput
          python manage.py test content.test_performance_reports --noinput
      - name: Install isolated browser dependency
        run: npm install --prefix "$PERFORMANCE_UI_FIXTURE" --no-audit --no-fund playwright@1.55.0
      - name: Check actual dashboard and email layouts
        run: node backend/scripts/check_performance_dashboard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-performance-visual-evidence
          path: |
            artifacts/performance/*.png
            /tmp/performance-evidence/performance.pdf
          if-no-files-found: warn
          retention-days: 14
