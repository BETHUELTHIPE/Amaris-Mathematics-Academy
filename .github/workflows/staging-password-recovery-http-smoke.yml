name: Staging Password Recovery HTTP Smoke
on:
  push:
    branches: ["ops/staging-password-recovery-smoke-20261025"]
    paths: ["ops/password-recovery-smoke.txt"]
permissions:
  contents: read
jobs:
  verify-staging-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Confirm forgot-password entry and reject unauthenticated reset screen
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen,Request
          from urllib.parse import urlsplit
          from urllib.error import HTTPError,URLError
          base="https://amaris-mathematics-academy-staging-x4ax.onrender.com"
          for route,phrase in [("/login",b"Forgot password?"),("/forgot-password",b"Send reset link")]:
              try:
                  with urlopen(Request(base+route,headers={"User-Agent":"AmarisRecoveryQA/1.0"}),timeout=25) as res:
                      body=res.read(250000)
                      status=res.status
              except (HTTPError,URLError):
                  raise SystemExit("FAIL: public password recovery route unavailable") from None
              if status!=200 or phrase not in body:
                  raise SystemExit("FAIL: expected recovery form missing")
              print("PASS: staging login and recovery request UI accessible")
          try:
              with urlopen(Request(base+"/reset-password",headers={"User-Agent":"AmarisRecoveryQA/1.0"}),timeout=25) as res:
                  final=res.url
          except (HTTPError,URLError):
              raise SystemExit("FAIL: reset without recovery proof did not redirect safely") from None
          if urlsplit(final).path!="/forgot-password":
              raise SystemExit("FAIL: reset form open without a validated recovery link")
          print("PASS: unauthenticated password reset is rejected")
          PY
