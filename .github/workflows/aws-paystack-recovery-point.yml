name: Create encrypted staging PostgreSQL recovery point
on:
  push:
    branches: [ops/aws-paystack-staging-acceptance-20261127]
    paths: [.github/workflows/aws-paystack-recovery-point.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-paystack-staging-acceptance-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE != ''
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: env.ROLE == ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Create private staging recovery bucket and verify live application backup
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/recovery-venv"
          "$RUNNER_TEMP/recovery-venv/bin/pip" install --quiet 'boto3>=1.36,<2'
          "$RUNNER_TEMP/recovery-venv/bin/python" deploy/aws/paystack/recovery-point.py
      - name: Verify restore in disposable isolated PostgreSQL
        run: |
          set -euo pipefail
          bash deploy/aws/paystack/restore-proof.sh
      - name: Remove local recovery data
        if: always()
        run: |
          docker rm -f amaris-paystack-recovery-test >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/amaris-paystack-recovery"
