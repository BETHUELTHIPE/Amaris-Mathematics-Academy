name: Diagnose Django staging mail pipeline
on:
  push:
    branches: [ops/staging-known-good-af8709c-20261019]
    paths: [.github/workflows/staging-django-mail-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-mail-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Verify staging-only SMTP and storage settings without revealing values
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          key=os.getenv("RENDER_API_KEY","")
          if not key:
              print("RENDER_ACCESS=NOT_CONFIGURED")
              raise SystemExit(0)
          base="https://api.render.com/v1/services/srv-dam2iivcgkoc7383tq50"
          h={"Authorization":"Bearer "+key,"Accept":"application/json"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=20) as r:
                  return json.load(r)
          svc=get(base)
          if svc.get("ownerId")!="tea-csppi8l6l47c73dk9c90" or svc.get("id")!="srv-dam2iivcgkoc7383tq50" or svc.get("repo")!="https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy":
              raise SystemExit("Unexpected Render service, refusing to inspect")
          records=get(base+"/env-vars?limit=100")
          if isinstance(records,dict):
              records=records.get("envVars",records.get("data",[]))
          env={}
          for item in records:
              entry=item.get("envVar",item)
              if isinstance(entry,dict) and isinstance(entry.get("key"),str):
                  env[entry["key"]]=entry.get("value")
          required=["DATABASE_URL","EMAIL_HOST","EMAIL_HOST_USER","EMAIL_HOST_PASSWORD","DEFAULT_FROM_EMAIL","SUPABASE_S3_ENDPOINT_URL","SUPABASE_S3_ACCESS_KEY_ID","SUPABASE_S3_SECRET_ACCESS_KEY","SUPABASE_S3_STUDENT_BUCKET","CELERY_BROKER_URL"]
          for label in required:
              print(label+"="+("PRESENT" if env.get(label) else "MISSING"))
          for label in ["GMAIL_USER","GMAIL_EMAIL","GMAIL_APP_PASSWORD","EMAIL_PORT","EMAIL_USE_TLS","EMAIL_USE_SSL"]:
              print(label+"="+("PRESENT" if env.get(label) else "MISSING"))
          backend=str(env.get("EMAIL_BACKEND") or "django.core.mail.backends.smtp.EmailBackend")
          print("SMTP_BACKEND="+str(backend=="django.core.mail.backends.smtp.EmailBackend"))
          smtp_user=env.get("EMAIL_HOST_USER") or env.get("GMAIL_USER") or env.get("GMAIL_EMAIL")
          smtp_password=env.get("EMAIL_HOST_PASSWORD") or env.get("GMAIL_APP_PASSWORD")
          print("SMTP_AUTH_CONFIGURED="+str(bool(smtp_user and smtp_password)))
          print("SMTP_HOST_CONFIGURED="+str(bool(env.get("EMAIL_HOST"))))
          print("SMTP_PORT="+str(env.get("EMAIL_PORT","unset")) if str(env.get("EMAIL_PORT","")).isdigit() else "SMTP_PORT=INVALID")
          print("SMTP_USE_TLS="+str(env.get("EMAIL_USE_TLS","unset")).lower())
          print("SMTP_USE_SSL="+str(env.get("EMAIL_USE_SSL","unset")).lower())
          print("SMTP_HOST_IS_GMAIL="+str(str(env.get("EMAIL_HOST","")).lower()=="smtp.gmail.com"))
          from urllib.parse import urlparse
          db=urlparse(env.get("DATABASE_URL",""))
          staging_ref="atyhhjwwxgzeurnwayay"
          db_is_staging=staging_ref in (db.username or "") or db.hostname=="db."+staging_ref+".supabase.co"
          print("ACTIVE_DATABASE_IS_STAGING_SUPABASE="+str(db_is_staging))
          endpoint=urlparse(env.get("SUPABASE_S3_ENDPOINT_URL",""))
          print("S3_ENDPOINT_IS_STAGING_SUPABASE="+str(endpoint.hostname==staging_ref+".storage.supabase.co"))
          print("PAYFAST_NOTIFY_TARGET_IS_STAGING="+str("amaris-mathematics-academy-staging.onrender.com" in (env.get("PAYFAST_NOTIFY_URL") or "")))
          print("VALID_FROM_EMAIL_CONFIGURED="+str(bool(env.get("DEFAULT_FROM_EMAIL") and "example.invalid" not in env.get("DEFAULT_FROM_EMAIL",""))))
          print("PAYFAST_SANDBOX="+str((env.get("PAYFAST_MODE") or env.get("PAYFAST_ENV") or "sandbox").lower()=="sandbox"))
          print("Only key presence is reported; credentials are not printed or stored.")
          PY
