name: Format RUM backend files

on:
  push:
    branches: [feature/rum-p75-backend-20261018]
    paths:
      - '.github/workflows/format-rum-code.yml'

permissions:
  contents: write

jobs:
  format-rum:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rum-p75-backend-20261018
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run pinned Black on only three RUM-modified files
        run: |
          python -m pip install black==25.9.0
          black --target-version py313 backend/content/models.py backend/content/web_vitals_views.py backend/content/test_web_vitals.py
          git diff --check
      - name: Commit formatting to this feature branch only
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/content/models.py backend/content/web_vitals_views.py backend/content/test_web_vitals.py
          git commit -m "style(rum): autoformat Django telemetry files"
          git push origin HEAD:refs/heads/feature/rum-p75-backend-20261018
