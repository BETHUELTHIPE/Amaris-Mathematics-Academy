name: Staging OTP Live HTTP Smoke
on:
  push:
    branches: ["test/staging-six-digit-email-otp-20261025"]
    paths: [".github/workflows/staging-otp-live-http-smoke.yml"]
permissions:
  contents: read
jobs:
  otp-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify deployed staging OTP screens without sending mail
        env:
          EXPECTED_LOGIN_URL: https://amaris-mathematics-academy-staging-x4ax.onrender.com/login
          EXPECTED_CODE_URL: https://amaris-mathematics-academy-staging-x4ax.onrender.com/login/code?email=synthetic%40example.test
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          for key, expected in (
              ("EXPECTED_LOGIN_URL", b"Email me a six-digit code"),
              ("EXPECTED_CODE_URL", b"Enter your sign-in code"),
          ):
              request = urllib.request.Request(os.environ[key], headers={"User-Agent":"AmarisStagingOTPAcceptance/1.0"})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      code=response.status
                      html=response.read(350000)
              except (urllib.error.HTTPError,urllib.error.URLError) as error:
                  raise SystemExit(f"FAIL: {key} staging route unreachable") from None
              if code != 200 or expected not in html:
                  raise SystemExit(f"FAIL: {key} does not serve the expected six-digit form")
              print(f"PASS: {key} is HTTP 200 and renders the expected six-digit sign-in UI")
          PY
