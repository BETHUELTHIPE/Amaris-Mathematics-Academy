name: Verify the Amaris stateless ECS staging candidate

on:
  push:
    branches: [ops/aws-staging-stateless-20261126]
    paths:
      - .github/workflows/aws-staging-stateless.yml
      - deploy/aws/blue-green/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-staging-stateless-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      AMARIS_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test the stateless task renderer
        run: |
          bash -n deploy/aws/blue-green/verify-stateless-scaling-candidate.sh
          python3 -m unittest discover -s deploy/aws/blue-green -p 'test_render_stateless_task.py'
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Authenticate to AWS using the staging role
        if: env.AMARIS_AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.AMARIS_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Authenticate to AWS using the configured staging keys
        if: env.AMARIS_AWS_ROLE == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Verify the running release as a stateless task
        run: bash deploy/aws/blue-green/verify-stateless-scaling-candidate.sh
