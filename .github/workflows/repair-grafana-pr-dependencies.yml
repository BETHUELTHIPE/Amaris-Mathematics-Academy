name: One-time Amaris runtime compatibility lock refresh

on:
  push:
    branches:
      - feat/grafana-supabase-reporting-20261024
    paths:
      - .github/workflows/repair-grafana-pr-dependencies.yml
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/feat/grafana-supabase-reporting-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate exact lockfile, audit, and verify Amaris braces regression
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          node --test tests/braces-security-backport.test.mjs
      - name: Commit verified manifest and lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: preserve Amaris braces and Vinext runtime with audited lock'
          git push origin HEAD:feat/grafana-supabase-reporting-20261024
