name: One-time patched Grafana PR frontend dependency lock

on:
  push:
    branches:
      - feat/grafana-supabase-reporting-20261024
    paths:
      - .github/workflows/repair-grafana-pr-dependencies.yml

permissions:
  contents: write

jobs:
  bounded-security-repair:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/feat/grafana-supabase-reporting-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply security patch versions without npm audit force
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'devDependencies.vite=8.3.5'
          npm pkg set 'overrides.vite=$vite'
          npm pkg set 'overrides.undici=7.30.1'
          npm pkg set 'overrides.fast-uri=3.1.9'
          npm pkg set 'overrides.zod=$zod'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
      - name: Commit matching package manifest and lockfile only after passing audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: resolve remaining high-severity frontend package advisories'
          git push origin HEAD:feat/grafana-supabase-reporting-20261024
