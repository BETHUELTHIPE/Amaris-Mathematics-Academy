name: Docker and Nginx Validation

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/docker-nginx.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/docker-nginx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-nginx-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1"
      DATABASE_URL: "sqlite:////tmp/amaris-docker-test.sqlite3"
      DATABASE_SSL_REQUIRED: "false"
      DJANGO_CACHE_URL: "locmem://"
      DJANGO_PUBLIC_CACHE_URL: "locmem://"
      CELERY_BROKER_URL: "memory://"
      CELERY_RESULT_BACKEND: "cache+memory://"
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral Django secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Validate Compose file
        working-directory: backend
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker-compose.yml config --quiet

      - name: Build production backend image
        run: docker build -t amaris-backend-docker-test ./backend

      - name: Build patched production Nginx image
        run: docker build -t amaris-nginx-docker-test ./backend/nginx

      - name: Verify backend runs as non-root
        run: |
          test "$(docker run --rm --entrypoint id amaris-backend-docker-test -u)" != "0"
          docker run --rm --entrypoint id amaris-backend-docker-test

      - name: Validate backend environment and Gunicorn config
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_DEBUG=false \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver \
            -e DATABASE_URL=sqlite:////tmp/amaris-docker-test.sqlite3 \
            -e DATABASE_SSL_REQUIRED=false \
            -e DJANGO_CACHE_URL=locmem:// \
            -e DJANGO_PUBLIC_CACHE_URL=locmem:// \
            -e CELERY_BROKER_URL=memory:// \
            -e CELERY_RESULT_BACKEND=cache+memory:// \
            amaris-backend-docker-test python manage.py check
          docker run --rm --entrypoint gunicorn amaris-backend-docker-test --check-config amaris_cms.asgi:application --config /app/gunicorn.conf.py

      - name: Start backend container and check health endpoint
        run: |
          docker run -d --name amaris-web-test \
            -p 8000:8000 \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_DEBUG=false \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver \
            -e DATABASE_URL=sqlite:////tmp/amaris-docker-test.sqlite3 \
            -e DATABASE_SSL_REQUIRED=false \
            -e DJANGO_CACHE_URL=locmem:// \
            -e DJANGO_PUBLIC_CACHE_URL=locmem:// \
            -e CELERY_BROKER_URL=memory:// \
            -e CELERY_RESULT_BACKEND=cache+memory:// \
            amaris-backend-docker-test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs amaris-web-test
          exit 1

      - name: Test SIGTERM handling
        run: |
          docker kill --signal=TERM amaris-web-test
          for attempt in {1..20}; do
            state="$(docker inspect -f '{{.State.Running}}' amaris-web-test)"
            if [ "$state" = "false" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs amaris-web-test
          exit 1

      - name: Test restart behaviour
        run: |
          docker rm amaris-web-test
          docker run -d --name amaris-web-test \
            --restart unless-stopped \
            -p 8000:8000 \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_DEBUG=false \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver \
            -e DATABASE_URL=sqlite:////tmp/amaris-docker-test.sqlite3 \
            -e DATABASE_SSL_REQUIRED=false \
            -e DJANGO_CACHE_URL=locmem:// \
            -e DJANGO_PUBLIC_CACHE_URL=locmem:// \
            -e CELERY_BROKER_URL=memory:// \
            -e CELERY_RESULT_BACKEND=cache+memory:// \
            amaris-backend-docker-test
          docker restart amaris-web-test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs amaris-web-test
          exit 1

      - name: Validate Nginx configuration syntax
        run: |
          docker run --rm \
            --add-host web:127.0.0.1 \
            -v "$PWD/backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            amaris-nginx-docker-test nginx -t

      - name: Start Nginx and validate reverse proxy, headers, static, compression, limits and timeouts
        run: |
          network=amaris-nginx-test-net
          docker network create "$network"
          docker network connect --alias web "$network" amaris-web-test
          mkdir -p /tmp/amaris-static /tmp/amaris-media
          printf 'static-ok\n' >/tmp/amaris-static/test.txt
          docker run -d --name amaris-nginx-test \
            --network "$network" \
            -p 8080:80 \
            -v "$PWD/backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/backend/nginx/errors:/usr/share/nginx/html/errors:ro" \
            -v /tmp/amaris-static:/var/www/static:ro \
            -v /tmp/amaris-media:/var/www/media:ro \
            amaris-nginx-docker-test
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health/ready/ >/dev/null
          curl --fail --silent http://127.0.0.1:8080/static/test.txt | grep -q 'static-ok'
          curl -sSI http://127.0.0.1:8080/static/test.txt | grep -qi '^Cache-Control: public, max-age=31536000, immutable'
          curl -sSI http://127.0.0.1:8080/health/ready/ | grep -qi '^X-Correlation-ID:'
          curl -sS -H 'Accept-Encoding: gzip' -D /tmp/nginx-headers http://127.0.0.1:8080/health/ready/ -o /dev/null
          grep -qi '^Content-Encoding: gzip' /tmp/nginx-headers || true
          grep -q 'client_max_body_size 2g' backend/nginx/default.conf
          grep -q 'proxy_connect_timeout 30s' backend/nginx/default.conf
          grep -q 'proxy_read_timeout 60s' backend/nginx/default.conf
          grep -q 'X-Forwarded-Proto' backend/nginx/default.conf
          grep -q 'location ^~ /media/videos/ { return 404; }' backend/nginx/default.conf
          grep -q 'location ^~ /media/resources/ { return 404; }' backend/nginx/default.conf

      - name: Validate HTTPS deployment assumptions
        run: |
          grep -q 'SECURE_SSL_REDIRECT' backend/amaris_cms/settings.py
          grep -q 'SECURE_PROXY_SSL_HEADER' backend/amaris_cms/settings.py
          grep -q 'proxy_set_header X-Forwarded-Proto' backend/nginx/default.conf
          echo "TLS termination is expected upstream of this port-80 Nginx service; Django must enforce HTTPS using forwarded proto in production."

      - name: Validate rate-limiting configuration or document absence
        run: |
          if grep -Eq 'limit_req_zone|limit_req ' backend/nginx/default.conf; then
            echo 'Nginx rate limiting configured.'
          else
            echo 'No Nginx limit_req policy is currently configured; application-level throttling remains the active protection.'
          fi

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0

      - name: Scan backend production image
        run: trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL amaris-backend-docker-test

      - name: Scan Nginx production image
        run: trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL amaris-nginx-docker-test

      - name: Cleanup
        if: always()
        run: |
          rm -f backend/.env
          docker rm -f amaris-nginx-test amaris-web-test 2>/dev/null || true
          docker network rm amaris-nginx-test-net 2>/dev/null || true
