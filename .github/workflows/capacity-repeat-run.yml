name: Capacity Repeat 100-500-1000

on:
  push:
    branches:
      - capacity/repeat-1000-20260930
    paths:
      - ".github/workflows/capacity-repeat-run.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: amaris-capacity-repeat-1000
  cancel-in-progress: false

jobs:
  repeat-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: capacity
    env:
      LOADTEST_ENVIRONMENT: capacity
      LOADTEST_TARGET_URL: ${{ vars.CAPACITY_TARGET_URL }}
      LOADTEST_ALLOWED_HOSTS: ${{ vars.CAPACITY_ALLOWED_HOSTS }}
      LOADTEST_ALLOW_PRODUCTION: "false"
      LOADTEST_ALLOW_LIVE_PAYFAST: "false"
      LOADTEST_ACCEPTANCE_HEADER: "true"
      CAPACITY_TARGET_GIT_SHA: ${{ vars.CAPACITY_TARGET_GIT_SHA }}
      CAPACITY_TARGET_IMAGE: ${{ vars.CAPACITY_TARGET_IMAGE }}
      CAPACITY_PROMETHEUS_URL: ${{ vars.CAPACITY_PROMETHEUS_URL }}
      CAPACITY_PROMETHEUS_BEARER: ${{ secrets.CAPACITY_PROMETHEUS_BEARER }}
      CAPACITY_RAMP_SECONDS: "120"
      CAPACITY_HOLD_SECONDS: "600"
      CAPACITY_LOCUST_PROCESSES: "4"
      CAPACITY_REQUIRE_AUTH: "true"
      CAPACITY_MAX_FAILURE_PCT: "1.0"
      CAPACITY_MAX_5XX_PCT: "0.1"
      CAPACITY_MAX_P95_MS: "1000"
      CAPACITY_MAX_P99_MS: "2000"
      CAPACITY_MAX_CPU_PCT: "90"
      CAPACITY_MAX_RAM_PCT: "90"
      LOADTEST_AUTH_BEARER: ${{ secrets.CAPACITY_AUTH_BEARER }}
      LOADTEST_COOKIE_HEADER: ${{ secrets.CAPACITY_COOKIE_HEADER }}
      LOADTEST_SESSION_COOKIE_NAME: ${{ secrets.CAPACITY_SESSION_COOKIE_NAME }}
      LOADTEST_SESSION_COOKIE_VALUE: ${{ secrets.CAPACITY_SESSION_COOKIE_VALUE }}
      LOADTEST_HOMEPAGE_PATH: ${{ vars.CAPACITY_HOMEPAGE_PATH }}
      LOADTEST_CATALOGUE_PATH: ${{ vars.CAPACITY_CATALOGUE_PATH }}
      LOADTEST_SEARCH_PATH: ${{ vars.CAPACITY_SEARCH_PATH }}
      LOADTEST_COURSE_DETAIL_PATH: ${{ vars.CAPACITY_COURSE_DETAIL_PATH }}
      LOADTEST_LOGIN_PAGE_PATH: ${{ vars.CAPACITY_LOGIN_PAGE_PATH }}
      LOADTEST_DASHBOARD_PATH: ${{ vars.CAPACITY_DASHBOARD_PATH }}
      LOADTEST_LESSON_PATH: ${{ vars.CAPACITY_LESSON_PATH }}
      LOADTEST_PAYMENT_STATUS_PATH: ${{ vars.CAPACITY_PAYMENT_STATUS_PATH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-load.txt

      - name: Install load-test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-load.txt

      - name: Validate staging target and evidence configuration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          : "${LOADTEST_TARGET_URL:?CAPACITY_TARGET_URL is required}"
          : "${LOADTEST_ALLOWED_HOSTS:?CAPACITY_ALLOWED_HOSTS is required}"
          : "${CAPACITY_PROMETHEUS_URL:?CAPACITY_PROMETHEUS_URL is required}"
          : "${CAPACITY_TARGET_GIT_SHA:?CAPACITY_TARGET_GIT_SHA is required}"
          : "${CAPACITY_TARGET_IMAGE:?CAPACITY_TARGET_IMAGE is required}"
          : "${LOADTEST_LESSON_PATH:?CAPACITY_LESSON_PATH is required}"
          : "${LOADTEST_PAYMENT_STATUS_PATH:?CAPACITY_PAYMENT_STATUS_PATH is required}"

          target_host="$(python - <<'PY'
          import os
          from urllib.parse import urlparse
          print((urlparse(os.environ["LOADTEST_TARGET_URL"]).hostname or "").lower())
          PY
          )"

          case "$target_host" in
            amaris-mathematics-academy-staging.onrender.com|amaris-mathematics-academy-staging-x4ax.onrender.com)
              ;;
            *)
              echo "Refusing non-staging target: $target_host" >&2
              exit 1
              ;;
          esac

          if [[ "$CAPACITY_TARGET_GIT_SHA" != "29dcddbf579965ddf403769da87bb88aba6d6097" ]]; then
            echo "Capacity target SHA does not match the currently deployed staging SHA." >&2
            exit 1
          fi

          if [[ "$CAPACITY_TARGET_IMAGE" == *":latest" ]]; then
            echo "Immutable capacity image is required; :latest is forbidden." >&2
            exit 1
          fi

          {
            echo "LOADTEST_HOMEPAGE_PATH=${LOADTEST_HOMEPAGE_PATH:-/}"
            echo "LOADTEST_CATALOGUE_PATH=${LOADTEST_CATALOGUE_PATH:-/courses}"
            echo "LOADTEST_SEARCH_PATH=${LOADTEST_SEARCH_PATH:-/courses?search=algebra}"
            echo "LOADTEST_COURSE_DETAIL_PATH=${LOADTEST_COURSE_DETAIL_PATH:-/courses/university-calculus-foundations}"
            echo "LOADTEST_LOGIN_PAGE_PATH=${LOADTEST_LOGIN_PAGE_PATH:-/login}"
            echo "LOADTEST_DASHBOARD_PATH=${LOADTEST_DASHBOARD_PATH:-/dashboard}"
          } >> "$GITHUB_ENV"

          python - <<'PY'
          import os
          from load_tests.capacity import CapacityThresholds
          from load_tests.config import env_csv, validate_target

          validate_target(
              os.environ["LOADTEST_TARGET_URL"],
              environment_name="capacity",
              allowed_hosts=env_csv("LOADTEST_ALLOWED_HOSTS"),
              allow_production=False,
              allow_live_payfast=False,
          )
          CapacityThresholds.from_environment()
          print("Staging-only capacity configuration validated.")
          PY

      - name: Run 100 then 500 then 1000 concurrent users
        working-directory: backend
        shell: bash
        run: |
          set -uo pipefail
          chmod +x load_tests/run-capacity-stage.sh
          mkdir -p load_tests/results

          result=0
          for stage in 100 500 1000; do
            echo "::group::Capacity stage ${stage}"
            if load_tests/run-capacity-stage.sh "$stage"; then
              echo "Capacity stage ${stage}: PASS"
            else
              echo "Capacity stage ${stage}: FAIL / NOT VERIFIED"
              result=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done

          python -m load_tests.capacity_summary --requested 1000
          exit "$result"

      - name: Publish capacity summary
        if: always()
        working-directory: backend
        run: |
          if [ -f load_tests/results/capacity-summary.md ]; then
            cat load_tests/results/capacity-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-repeat-evidence-${{ github.run_id }}
          path: backend/load_tests/results/
          if-no-files-found: warn
          retention-days: 90
