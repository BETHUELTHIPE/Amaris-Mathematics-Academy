name: Verify the monthly cost inputs for two Amaris t4g.large hosts

on:
  push:
    branches: [ops/aws-staging-ec2-size-check-20261126]
    paths: [.github/workflows/aws-staging-ec2-size-audit.yml]

permissions: {}

jobs:
  verify:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: staging
      deployment: false
    permissions:
      id-token: write
    env:
      AWS_PAGER: ''
      AWS_REGION: eu-north-1
      STAGING_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - name: Authenticate with the staging deployment role
        if: env.STAGING_AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Authenticate with existing staging credentials
        if: env.STAGING_AWS_ROLE == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Read the EC2 inventory, ECS registration and requested type
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AWS_REGION" == eu-north-1 ]]
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 110156539003 ]]
          echo 'All nonterminated Stockholm EC2 instances:'
          aws ec2 describe-instances --filters Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].{id:InstanceId,type:InstanceType,state:State.Name,zone:Placement.AvailabilityZone,architecture:Architecture,group:Tags[?Key==`aws:autoscaling:groupName`].Value | [0]}' --output table
          echo 'Amaris ECS host registration:'
          instances="$(aws ecs list-container-instances --cluster amaris-ecs-staging --status ACTIVE --query containerInstanceArns --output text)"
          if [[ -n "$instances" && "$instances" != None ]]; then
            aws ecs describe-container-instances --cluster amaris-ecs-staging --container-instances $instances \
              --query 'containerInstances[].{id:ec2InstanceId,connected:agentConnected,running:runningTasksCount}' --output table
          fi
          echo 'Current T4g sizes, specifications and Free plan eligibility:'
          aws ec2 describe-instance-types --instance-types t4g.small t4g.medium t4g.large \
            --query 'sort_by(InstanceTypes,&MemoryInfo.SizeInMiB)[].{type:InstanceType,cpus:VCpuInfo.DefaultVCpus,memoryMiB:MemoryInfo.SizeInMiB,freeTier:FreeTierEligible}' --output table
          aws ec2 describe-instance-type-offerings --location-type availability-zone --filters Name=instance-type,Values=t4g.medium,t4g.large \
            --query 'sort_by(InstanceTypeOfferings,&Location)[].[InstanceType,Location]' --output table
          echo 'AWS account plan:'
          if ! aws freetier get-account-plan-state --region us-east-1 --query '[accountPlanType,accountPlanStatus]' --output text; then
            echo 'Account plan API did not return a status.'
          fi
      - name: Read staging disks, public IPs and load balancers
        shell: bash
        run: |
          set -euo pipefail
          volume_ids="$(aws ec2 describe-instances --filters Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].BlockDeviceMappings[].Ebs.VolumeId' --output text)"
          aws ec2 describe-volumes --volume-ids $volume_ids \
            --query 'Volumes[].{sizeGiB:Size,type:VolumeType,iops:Iops,throughput:Throughput}' --output table
          echo 'Allocated public IPv4 addresses:'
          aws ec2 describe-addresses --query 'length(Addresses)' --output text
          echo 'Deployed load balancers:'
          aws elbv2 describe-load-balancers \
            --query 'LoadBalancers[].{name:LoadBalancerName,type:Type,ipType:IpAddressType}' --output table
          echo 'Recent staging spend if Cost Explorer is available:'
          start="$(date -u +%Y-%m-01)"
          end="$(date -u +%F)"
          aws ce get-cost-and-usage --region us-east-1 --time-period "Start=$start,End=$end" \
            --granularity MONTHLY --metrics UnblendedCost --filter '{"Not":{"Dimensions":{"Key":"RECORD_TYPE","Values":["Credit","Refund","Tax"]}}}' \
            --query 'ResultsByTime[].Total.UnblendedCost' --output table || true
