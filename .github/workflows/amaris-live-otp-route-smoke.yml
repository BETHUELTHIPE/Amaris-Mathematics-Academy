name: Amaris Live Six-Digit Login Routes
on:
  push:
    branches: ["ops/live-otp-route-smoke-20261025"]
    paths: ["ops/live-otp-http-smoke-request.txt"]
permissions:
  contents: read
jobs:
  live-code-route-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm live code-request and redemption routes render
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          base="https://amaris-mathematics-academy-live-students.onrender.com"
          cases=[
            ("/login",b"Email me a six-digit code"),
            ("/login/code?email=synthetic%40example.test",b"Enter your sign-in code"),
          ]
          for route,phrase in cases:
              req=urllib.request.Request(base+route,headers={"User-Agent":"AmarisOTPProductionRouteAcceptance/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=28) as res:
                      code=res.status
                      html=res.read(450000)
              except (urllib.error.HTTPError,urllib.error.URLError):
                  raise SystemExit("FAIL: Live OTP route unavailable") from None
              if code != 200 or phrase not in html:
                  raise SystemExit("FAIL: Live route missing expected six-digit form") 
              print("PASS: Live production OTP route displays expected form")
          print("PASS: No code was sent and no student data was accessed")
          PY
