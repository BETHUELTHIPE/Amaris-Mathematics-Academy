name: Support Page Public Browser Verification

on:
  pull_request:
    paths:
      - ".github/workflows/support-page-public-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser:
    name: Public donor page and footer — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/support-browser
          cd /tmp/support-browser
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify real public Support Our Project experience
        shell: bash
        run: |
          cd /tmp/support-browser
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base = 'https://amaris-mathematics-academy-live-students.onrender.com';
          const browser = await chromium.launch({headless:true, args:['--no-sandbox']});
          const page = await browser.newPage({viewport:{width:390,height:844}});
          const errors = [];
          page.on('pageerror', e => errors.push(e.message));

          async function open(path) {
            let response;
            for (let attempt=1; attempt<=3; attempt++) {
              response = await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:45000});
              console.log('HTTP '+path+' attempt='+attempt+' status='+response?.status());
              if (response?.status()===200) return response;
              await page.waitForTimeout(3000);
            }
            assert.equal(response?.status(),200,path+' must return HTTP 200');
            return response;
          }
          try {
            await open('/support-our-project');
            await page.getByRole('heading',{level:1,name:/Help more learners keep moving forward/i}).waitFor({timeout:18000});
            for (const title of ['Support a learner','Contribute learning resources','Become a technology partner','Share your expertise']) {
              assert.equal(await page.getByRole('heading',{name:title,exact:true}).count(),1,title+' card not visible');
            }
            console.log('PASS public donor page heading and four support options');

            const links = page.locator('footer a[href="/support-our-project"]');
            assert.equal(await links.count(),1,'support page footer link missing');
            const contact = page.getByRole('link',{name:/Discuss how to help/i});
            assert.equal(await contact.getAttribute('href'),'/contact','contribution CTA should go to contact');
            assert.equal(await page.getByRole('link',{name:/Learn about Amaris/i}).getAttribute('href'),'/about');
            assert((await page.getByRole('link',{name:/Email us/i}).count()) >= 1,'supporter email link missing');
            console.log('PASS supporter contact/email and about links');

            await open('/');
            const footerLink = page.locator('footer a[href="/support-our-project"]');
            assert.equal(await footerLink.count(),1,'homepage footer missing Support Our Project');
            await page.waitForLoadState('load',{timeout:30000});
            await footerLink.click();
            await page.waitForURL('**/support-our-project',{timeout:20000});
            await page.getByRole('heading',{level:1,name:/Help more learners keep moving forward/i}).waitFor({timeout:15000});
            console.log('PASS visitor navigates from homepage footer to public support page');
            console.log('BROWSER_PAGE_ERRORS='+JSON.stringify(errors));
            assert.equal(errors.length,0,'page JavaScript errors detected');
            console.log('RESULT: SUPPORT_PAGE_PUBLIC_BROWSER_PASSED');
          } catch(e) {
            console.error('RESULT: SUPPORT_PAGE_PUBLIC_BROWSER_FAILED');
            console.error(e);
            process.exitCode=1;
          } finally {
            await browser.close();
          }
          NODE
