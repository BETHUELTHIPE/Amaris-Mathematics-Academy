name: Capacity Verification

on:
  workflow_dispatch:
    inputs:
      max_users:
        description: Highest progressive concurrency stage to attempt
        required: true
        type: choice
        options: ["100", "500", "1000", "2500", "5000", "10000", "25000", "50000"]
        default: "100"
      ramp_seconds:
        description: Ramp duration for each stage
        required: true
        type: choice
        options: ["60", "120", "300"]
        default: "120"
      hold_seconds:
        description: Hold duration at each target concurrency
        required: true
        type: choice
        options: ["300", "600", "900", "1200"]
        default: "600"
      locust_processes:
        description: Local Locust worker processes on the load generator
        required: true
        type: choice
        options: ["1", "2", "4", "8", "16"]
        default: "4"
      load_generator:
        description: Dedicated self-hosted capacity generator is required above 1,000 users
        required: true
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted

permissions:
  contents: read

concurrency:
  group: amaris-capacity-verification
  cancel-in-progress: false

jobs:
  progressive-capacity:
    name: Progressive capacity verification
    runs-on: ${{ inputs.load_generator == 'self-hosted' && 'capacity-load-generator' || 'ubuntu-latest' }}
    timeout-minutes: 240
    environment: capacity
    env:
      LOADTEST_ENVIRONMENT: capacity
      LOADTEST_TARGET_URL: ${{ vars.CAPACITY_TARGET_URL }}
      LOADTEST_ALLOWED_HOSTS: ${{ vars.CAPACITY_ALLOWED_HOSTS }}
      LOADTEST_ALLOW_PRODUCTION: "false"
      LOADTEST_ALLOW_LIVE_PAYFAST: "false"
      CAPACITY_TARGET_GIT_SHA: ${{ vars.CAPACITY_TARGET_GIT_SHA }}
      CAPACITY_TARGET_IMAGE: ${{ vars.CAPACITY_TARGET_IMAGE }}
      CAPACITY_PROMETHEUS_URL: ${{ vars.CAPACITY_PROMETHEUS_URL }}
      CAPACITY_PROMETHEUS_BEARER: ${{ secrets.CAPACITY_PROMETHEUS_BEARER }}
      CAPACITY_RAMP_SECONDS: ${{ inputs.ramp_seconds }}
      CAPACITY_HOLD_SECONDS: ${{ inputs.hold_seconds }}
      CAPACITY_LOCUST_PROCESSES: ${{ inputs.locust_processes }}
      CAPACITY_REQUIRE_AUTH: "true"
      CAPACITY_MAX_FAILURE_PCT: "1.0"
      CAPACITY_MAX_5XX_PCT: "0.1"
      CAPACITY_MAX_P95_MS: "1000"
      CAPACITY_MAX_P99_MS: "2000"
      CAPACITY_MAX_CPU_PCT: "90"
      CAPACITY_MAX_RAM_PCT: "90"
      LOADTEST_AUTH_BEARER: ${{ secrets.CAPACITY_AUTH_BEARER }}
      LOADTEST_COOKIE_HEADER: ${{ secrets.CAPACITY_COOKIE_HEADER }}
      LOADTEST_SESSION_COOKIE_NAME: ${{ secrets.CAPACITY_SESSION_COOKIE_NAME }}
      LOADTEST_SESSION_COOKIE_VALUE: ${{ secrets.CAPACITY_SESSION_COOKIE_VALUE }}
      LOADTEST_HOMEPAGE_PATH: ${{ vars.CAPACITY_HOMEPAGE_PATH || '/' }}
      LOADTEST_CATALOGUE_PATH: ${{ vars.CAPACITY_CATALOGUE_PATH || '/courses' }}
      LOADTEST_SEARCH_PATH: ${{ vars.CAPACITY_SEARCH_PATH || '/courses?search=algebra' }}
      LOADTEST_COURSE_DETAIL_PATH: ${{ vars.CAPACITY_COURSE_DETAIL_PATH || '/courses/university-calculus-foundations' }}
      LOADTEST_LOGIN_PAGE_PATH: ${{ vars.CAPACITY_LOGIN_PAGE_PATH || '/login' }}
      LOADTEST_DASHBOARD_PATH: ${{ vars.CAPACITY_DASHBOARD_PATH || '/dashboard' }}
      LOADTEST_LESSON_PATH: ${{ vars.CAPACITY_LESSON_PATH }}
      LOADTEST_PAYMENT_STATUS_PATH: ${{ vars.CAPACITY_PAYMENT_STATUS_PATH }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-load.txt

      - name: Install capacity-test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-load.txt

      - name: Record load-generator evidence
        shell: bash
        run: |
          mkdir -p backend/load_tests/results
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "capacity_harness_git_sha=${GITHUB_SHA}"
            echo "target_git_sha=${CAPACITY_TARGET_GIT_SHA}"
            echo "target_image=${CAPACITY_TARGET_IMAGE}"
            echo "runner=${RUNNER_NAME}"
            echo "os=${RUNNER_OS}"
            echo "arch=${RUNNER_ARCH}"
            echo "requested_generator=${{ inputs.load_generator }}"
            echo "locust_processes=${{ inputs.locust_processes }}"
            echo "cpu_count=$(nproc)"
            echo "memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            echo "open_file_limit=$(ulimit -n)"
            python --version
            python -m locust --version
          } > backend/load_tests/results/load-generator.txt

      - name: Validate target and capacity configuration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LOADTEST_TARGET_URL:-}" ]]; then
            echo "CAPACITY_TARGET_URL is required." >&2
            exit 1
          fi
          if [[ -z "${LOADTEST_ALLOWED_HOSTS:-}" ]]; then
            echo "CAPACITY_ALLOWED_HOSTS must explicitly allow the isolated capacity target." >&2
            exit 1
          fi
          if (( ${{ inputs.max_users }} > 1000 )) && [[ "${{ inputs.load_generator }}" != "self-hosted" ]]; then
            echo "Capacity stages above 1,000 users require a dedicated self-hosted load generator." >&2
            exit 1
          fi
          if [[ -z "${CAPACITY_TARGET_GIT_SHA:-}" || ! "${CAPACITY_TARGET_GIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "CAPACITY_TARGET_GIT_SHA must identify the exact deployed 40-character Git SHA." >&2
            exit 1
          fi
          if [[ -z "${CAPACITY_TARGET_IMAGE:-}" ]]; then
            echo "CAPACITY_TARGET_IMAGE must identify the exact immutable deployed image." >&2
            exit 1
          fi
          if [[ "${CAPACITY_TARGET_IMAGE}" == *":latest" ]]; then
            echo "CAPACITY_TARGET_IMAGE must be immutable; :latest is not accepted as capacity evidence." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from load_tests.capacity import CapacityThresholds, progressive_levels, validate_capacity_level
          from load_tests.config import env_csv, validate_target

          requested = validate_capacity_level(int("${{ inputs.max_users }}"))
          print("Progressive stages:", ", ".join(f"{value:,}" for value in progressive_levels(requested)))
          validate_target(
              os.environ["LOADTEST_TARGET_URL"],
              environment_name=os.environ["LOADTEST_ENVIRONMENT"],
              allowed_hosts=env_csv("LOADTEST_ALLOWED_HOSTS"),
              allow_production=False,
              allow_live_payfast=False,
          )
          CapacityThresholds.from_environment()
          if not os.environ.get("CAPACITY_PROMETHEUS_URL", "").strip():
              raise SystemExit("CAPACITY_PROMETHEUS_URL is required; infrastructure metrics cannot be inferred.")
          if not os.environ.get("LOADTEST_LESSON_PATH", "").strip():
              raise SystemExit("CAPACITY_LESSON_PATH is required for representative authenticated capacity testing.")
          if not os.environ.get("LOADTEST_PAYMENT_STATUS_PATH", "").strip():
              raise SystemExit("CAPACITY_PAYMENT_STATUS_PATH is required for representative authenticated capacity testing.")
          PY

      - name: Run progressive capacity stages
        id: capacity
        working-directory: backend
        shell: bash
        run: |
          set -uo pipefail
          requested="${{ inputs.max_users }}"
          stages=(100 500 1000 2500 5000 10000 25000 50000)
          result=0

          chmod +x load_tests/run-capacity-stage.sh
          mkdir -p load_tests/results

          for stage in "${stages[@]}"; do
            if (( stage > requested )); then
              break
            fi
            echo "::group::Capacity stage ${stage}"
            if load_tests/run-capacity-stage.sh "$stage"; then
              echo "Capacity stage ${stage}: PASS"
            else
              echo "Capacity stage ${stage}: FAIL / NOT VERIFIED"
              result=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done

          python -m load_tests.capacity_summary --requested "$requested"
          exit "$result"

      - name: Publish capacity summary to workflow run
        if: always()
        working-directory: backend
        shell: bash
        run: |
          if [ -f load_tests/results/capacity-summary.md ]; then
            cat load_tests/results/capacity-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Capacity test summary"
              echo
              echo "**PRODUCTION READINESS:** NOT EVALUATED BY CAPACITY TESTING"
              echo
              echo "**MAXIMUM VERIFIED CONCURRENT USERS:** 0"
              echo
              echo "**50,000 CONCURRENT USERS VERIFIED:** NO"
              echo
              echo "No complete capacity summary was produced."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-evidence-${{ github.run_id }}
          path: backend/load_tests/results/
          if-no-files-found: error
          retention-days: 90
