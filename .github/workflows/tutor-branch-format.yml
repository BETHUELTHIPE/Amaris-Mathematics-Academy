name: Tutor Finance Branch Formatter (temporary)
on:
  push:
    branches: [feature/tutor-revenue-ledger-20261015]
    paths:
      - "backend/content/**"
      - "backend/amaris_cms/**"
      - ".github/workflows/tutor-branch-format.yml"
permissions:
  contents: write
concurrency:
  group: tutor-finance-formatter
  cancel-in-progress: true
jobs:
  black:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - name: Format newly added finance code only
        run: |
          black backend/content/tutor_finance_models.py backend/content/tutor_finance_admin.py backend/content/tutor_finance_tasks.py backend/content/tutor_dashboard.py backend/content/topical_video_views.py backend/content/services/tutor_finance.py backend/content/services/topical_videos.py backend/content/migrations/0008_tutor_finance.py backend/content/test_tutor_finance.py backend/content/payfast_views.py backend/content/services/payments.py backend/content/services/live_classes.py backend/content/apps.py backend/content/admin.py backend/content/tasks.py backend/content/urls.py backend/amaris_cms/urls.py backend/amaris_cms/settings.py
      - name: Commit formatting only to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/content backend/amaris_cms
          if ! git diff --cached --quiet; then
            git commit -m "Apply Black formatting to tutor finance branch"
            git push
          fi
