name: Airflow operations integration

on:
  pull_request:
    paths:
      - "airflow/**"
      - "backend/amaris_cms/airflow_client.py"
      - "backend/amaris_cms/monitoring_admin.py"
      - "backend/amaris_cms/celery_monitor.py"
      - "backend/amaris_cms/settings.py"
      - "backend/templates/admin/**"
      - "backend/tests/test_airflow_admin.py"
      - "backend/tests/test_task_operations_admin.py"
      - "backend/tests/test_shared_airflow.py"
      - "backend/ops/shared_airflow/**"
      - "backend/Dockerfile"
      - ".github/workflows/airflow-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-admin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate DAG and Django Python syntax
        run: python -m compileall -q airflow/dags backend/amaris_cms/airflow_client.py backend/amaris_cms/monitoring_admin.py backend/amaris_cms/celery_monitor.py backend/tests/test_airflow_admin.py backend/tests/test_task_operations_admin.py
      - name: Validate isolated Docker Compose profile
        working-directory: airflow
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.yml config --quiet
      - name: Install Django runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate Render Blueprint and private TLS startup
        run: |
          python -m pip install PyYAML jsonschema cryptography
          curl --fail --silent --show-error --max-time 30 https://render.com/schema/render.yaml.json -o /tmp/render-schema.json
          python -c 'import json, yaml, jsonschema; jsonschema.Draft202012Validator(json.load(open("/tmp/render-schema.json"))).validate(yaml.safe_load(open("airflow/render/render.yaml")))'
          python -m unittest discover -s airflow/tests -v
      - name: Verify access control and read-only Airflow behavior
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"
        run: python manage.py test tests.test_airflow_admin tests.test_monitoring_admin tests.test_shared_airflow tests.test_task_operations_admin --verbosity 2

  shared-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install disposable test tooling
        run: python -m pip install cryptography
      - name: Build the shared image without provisioning a cloud service
        run: docker build --build-arg AMARIS_IMAGE_VARIANT=shared-airflow -t amaris-shared-airflow:test backend
      - name: Verify website and Airflow in one 2 GB container
        run: python airflow/tests/smoke_shared_image.py
      - name: Preserve measured synthetic memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-airflow-memory
          path: artifacts/shared-airflow/
          if-no-files-found: warn

  render-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disposable test certificate tooling
        run: python -m pip install cryptography PyYAML
      - name: Build constrained Render Docker image
        run: docker build -f airflow/render/Dockerfile -t amaris-airflow-render:test airflow
      - name: Fresh PostgreSQL migration and private TLS API smoke
        run: python airflow/tests/smoke_image.py
