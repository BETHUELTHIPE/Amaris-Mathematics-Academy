name: Airflow operations integration

on:
  pull_request:
    paths:
      - "airflow/**"
      - "backend/amaris_cms/airflow_client.py"
      - "backend/amaris_cms/monitoring_admin.py"
      - "backend/amaris_cms/settings.py"
      - "backend/templates/admin/**"
      - "backend/tests/test_airflow_admin.py"
      - ".github/workflows/airflow-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-admin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate DAG and Django Python syntax
        run: python -m compileall -q airflow/dags backend/amaris_cms/airflow_client.py backend/amaris_cms/monitoring_admin.py backend/tests/test_airflow_admin.py
      - name: Validate isolated Docker Compose profile
        working-directory: airflow
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.yml config --quiet
      - name: Install Django runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify access control and read-only Airflow behavior
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"
        run: python manage.py test tests.test_airflow_admin tests.test_monitoring_admin --verbosity 2
