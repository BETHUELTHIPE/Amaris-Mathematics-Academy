name: Amaris Staging Recovery Landing Smoke
on:
  push:
    branches: [ops/staging-recovery-template-apply-20261026]
    paths: ["ops/staging-recovery-http-smoke.txt"]
permissions:
  contents: read
jobs:
  landing-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm reset link GET does not redeem token
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          base="https://amaris-mathematics-academy-staging-x4ax.onrender.com"
          for route,phrase in [
            ("/forgot-password",b"Send reset link"),
            ("/reset-password/verify",b"Six-digit recovery code"),
            ("/reset-password/verify?token_hash=pkce_synthetic_only_no_real_token_1234",b"Continue to choose a new password"),
          ]:
              try:
                  req=Request(base+route,headers={"User-Agent":"AmarisStagingRecoveryAcceptance/1.0"})
                  with urlopen(req,timeout=35) as response:
                      ok=response.status==200 and phrase in response.read(500000)
              except (HTTPError,URLError):
                  ok=False
              if not ok:
                  raise SystemExit("FAIL: staging recovery route did not render the expected form")
              print("PASS: staging recovery GET route returns the expected page")
          print("PASS: GET-only tests did not submit or verify any recovery token")
          PY
