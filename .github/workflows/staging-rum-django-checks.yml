name: Staging RUM Django Checks
on:
  pull_request:
    branches: [ops/staging-known-good-af8709c-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  django-rum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:////tmp/amaris-stage-rum.sqlite3
      DJANGO_SECRET_KEY: disposable-ci-key-never-used-in-deployment
      DJANGO_DEBUG: 'true'
      SUPABASE_DATABASE_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Django dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify forward-only migration and model definitions
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py collectstatic --noinput
          python backend/manage.py migrate --noinput
          python backend/manage.py test content.test_rum --noinput
