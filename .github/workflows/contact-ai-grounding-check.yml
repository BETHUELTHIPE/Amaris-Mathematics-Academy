name: Contact AI Grounding Check

on:
  push:
    branches:
      - fix-contact-ai-grounding-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Check formatting
        run: black --check content/services/enquiry_autoreply.py content/test_enquiry_autoreply.py
      - name: Lint grounding changes
        run: ruff check content/services/enquiry_autoreply.py content/test_enquiry_autoreply.py
      - name: Run contact AI grounding tests
        env:
          DJANGO_DEBUG: "true"
        run: python manage.py test content.test_enquiry_autoreply --verbosity 2
