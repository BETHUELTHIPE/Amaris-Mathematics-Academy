name: Live Amaris Password Recovery and Booking Access
on:
  push:
    branches: [ops/live-password-recovery-smoke-20261026]
    paths: [ops/live-password-recovery-smoke-request.txt]
permissions:
  contents: read
jobs:
  live-security-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check public recovery routes and private booking gate
        run: |
          python3 - <<'PY'
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError,URLError
          from urllib.parse import urlsplit
          base="https://amaris-mathematics-academy-live-students.onrender.com"
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=build_opener(NoRedirect)
          def probe(path):
              req=Request(base+path,headers={"User-Agent":"AmarisProductionRecoverySmoke/1.0"})
              try:
                  response=opener.open(req,timeout=38)
              except HTTPError as ex:
                  response=ex
              except URLError:
                  raise SystemExit(f"FAIL: production route unavailable: {path}") from None
              status=response.status
              location=response.headers.get("location","")
              body=response.read(280000) if status==200 else b""
              return status, location, body
          pages=[("/forgot-password",b"Reset your password"),("/reset-password/verify",b"Verify your password reset"),("/login",b"Sign in with a six-digit email code")]
          for path,marker in pages:
              status,location,body=probe(path)
              if status!=200 or marker not in body: raise SystemExit(f"FAIL: {path} missing required recovery UI")
              print(f"PASS: {path} HTTP 200 with expected form")
          protected=[("/book-online-live-class","/login"),("/reset-password","/forgot-password"),("/dashboard","/login")]
          for path,expected in protected:
              status,location,_=probe(path)
              loc=urlsplit(location).path
              if status not in (302,303,307,308) or loc!=expected:
                  raise SystemExit(f"FAIL: anonymous access not blocked: {path} (HTTP {status})")
              print(f"PASS: {path} requires authorization and redirects to {expected}")
          print("PASS: anonymous production smoke complete; no real accounts, password resets, bookings, or payment writes")
          PY
