name: Dashboard Signed-In Account Header Acceptance
on:
  push:
    branches: ["stage/dashboard-account-identity-acceptance-20261026"]
    paths:
      - "frontend/lib/auth.ts"
      - "frontend/components/site/dashboard-account-identity.tsx"
      - "frontend/components/site/student-dashboard-shell.tsx"
      - "frontend/app/dashboard/**"
      - "frontend/app/tutor/dashboard/**"
      - "frontend/tests/dashboard-signed-in-identity.test.mjs"
      - ".github/workflows/dashboard-signed-in-identity-acceptance.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Verify TypeScript and responsive dashboard account header
        working-directory: frontend
        run: npm run typecheck
      - name: Test student, tutor and dashboard regression contracts
        working-directory: frontend
        run: node --test tests/dashboard-signed-in-identity.test.mjs tests/dashboard-streaming-performance.test.mjs tests/private-dashboard-pagination.test.mjs tests/tutor-portal-contract.test.mjs
