name: Amaris Production Recovery Email Read-Only Audit
on:
  push:
    branches: ["ops/production-recovery-config-audit-20261026"]
    paths: ["ops/recovery-audit-20261026.txt"]
permissions:
  contents: read
jobs:
  recovery-email-audit:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 6
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_AUTH_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check expected recovery email placeholders offline
        run: |
          python -m unittest discover -s tests -p test_configure_supabase_auth_otp.py -v
      - name: Verify hosted Supabase Auth recovery and six-digit email templates without modifying
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "BLOCK: missing production Auth Management secret"
            exit 1
          fi
          python scripts/configure_supabase_auth_otp.py --project-ref epkcuseloinygkakxxdu --mode check
