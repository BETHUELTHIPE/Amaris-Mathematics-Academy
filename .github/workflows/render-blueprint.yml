name: Production Blueprint Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "render.yaml"
      - ".github/workflows/render-blueprint.yml"
  push:
    branches: [production-20260922]
    paths:
      - "render.yaml"
      - ".github/workflows/render-blueprint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.33.3
      - name: Validate Render Blueprint
        run: check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml
      - name: Enforce immutable production release and live URLs
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path("render.yaml").read_text(encoding="utf-8")
          images = re.findall(r"docker\.io/bethuelm/amaris-mathematics-academy:([0-9a-f]{40})", text)
          assert len(images) == 4, f"expected 4 immutable production image refs, found {len(images)}"
          assert len(set(images)) == 1, "all production services must use the same exact image SHA"
          assert "latest" not in text, "production must never use an ambiguous latest image"
          live = "https://amaris-mathematics-academy-live-students.onrender.com"
          assert live in text, "live student origin must be present in production configuration"
          assert "bethuelthipe.chatgpt.site" not in text, "obsolete public origin remains in render.yaml"
          assert "amaris-production-postgres" in text
          assert "amaris-production-broker" in text
          assert "amaris-production-cache" in text
          assert "SUPABASE_STUDENT_DOCUMENTS_BUCKET_NAME" in text
          print("Production blueprint contract validated.")
          PY
