name: Render Blueprint Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'render.yaml'
      - '.github/workflows/render-blueprint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.33.3
      - name: Validate render.yaml against Render's official schema
        run: check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml
