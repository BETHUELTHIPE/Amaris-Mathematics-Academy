name: PR382 Verified Student Profile Recovery
on:
  push:
    branches: ["fix/pr382-verified-student-profile-recovery-20261026"]
    paths:
      - "frontend/app/account/complete-profile/**"
      - "frontend/app/book-online-live-class/**"
      - "frontend/tests/pr382-verified-profile-recovery.test.mjs"
      - ".github/workflows/pr382-verified-profile-recovery.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Type-check secure student profile recovery
        run: npm run typecheck
      - name: Build staging student frontend
        run: npm run build
      - name: Test verified self-service registered name and private booking gates
        run: node --test tests/pr382-verified-profile-recovery.test.mjs tests/live-class-booking-contract.test.mjs
