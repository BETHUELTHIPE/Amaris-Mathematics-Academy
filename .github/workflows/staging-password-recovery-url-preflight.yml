name: Staging Recovery URL and SMTP Preflight
on:
  push:
    branches: ["ops/staging-password-recovery-url-preflight-20261025"]
    paths: ["ops/staging-recovery-url-audit.txt"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 6
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTH_MANAGEMENT_TOKEN }}
    steps:
      - name: Verify staging-only Auth URL and email sending configuration
        run: |
          python3 - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          token=os.environ.get("SUPABASE_ACCESS_TOKEN","")
          if not token:
              raise SystemExit("BLOCK: Missing staging Management API credential")
          request=Request("https://api.supabase.com/v1/projects/atyhhjwwxgzeurnwayay/config/auth",headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
          try:
              with urlopen(request,timeout=25) as resp:
                  d=json.load(resp)
          except (HTTPError,URLError):
              raise SystemExit("BLOCK: Staging Auth config read unavailable") from None
          site=d.get("site_url","")
          expected="https://amaris-mathematics-academy-staging-x4ax.onrender.com"
          tests={
              "staging_site_url_correct":isinstance(site,str) and site.rstrip("/")==expected,
              "staging_email_provider_enabled":d.get("external_email_enabled") is True,
              "staging_requires_email_confirmation":d.get("mailer_autoconfirm") is False,
              "staging_smtp_host_present":bool(d.get("smtp_host")),
              "staging_smtp_sender_present":bool(d.get("smtp_admin_email")),
          }
          for name,ok in tests.items():
              print(name+": "+("PASS" if ok else "BLOCK"))
          print("No provider credentials, emails or raw configuration output")
          if not all(tests.values()): raise SystemExit("BLOCK: Do not install staging cross-browser recovery link until URL is corrected")
          PY
