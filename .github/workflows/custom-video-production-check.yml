name: Custom Video Production Check

on:
  push:
    branches: [feature/custom-video-request, feature/custom-video-production-ready-20260929]
  workflow_dispatch:

concurrency:
  group: custom-video-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.15"
  NODE_VERSION: "24"

jobs:
  backend-custom-video:
    name: Custom-video backend and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: "false"
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      PAYFAST_MODE: sandbox
      PUBLIC_SITE_URL: https://students.example.test
      PUBLIC_API_URL: https://api.example.test/api/v1
      PAYFAST_NOTIFY_URL: https://api.example.test/api/v1/payfast/itn/
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Generate masked ephemeral Django secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Check custom-video formatting
        run: black --check --diff content/custom_video_views.py content/services/custom_videos.py content/services/custom_video_invoices.py content/test_custom_videos.py
      - name: Lint custom-video implementation
        run: ruff check content/custom_video_views.py content/services/custom_videos.py content/services/custom_video_invoices.py content/test_custom_videos.py
      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Detect migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput
      - name: Run custom-video regression suite
        run: python manage.py test content.test_custom_videos
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/amaris-openapi.yaml --validate --fail-on-warn

  frontend-custom-video:
    name: Custom-video frontend production checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Performance budgets
        run: npm run check:performance

  dependency-safety:
    name: Dependency safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependency audit
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          pip-audit --requirement backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: JavaScript production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
