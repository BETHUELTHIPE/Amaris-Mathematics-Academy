name: Payment formatting diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Show required Black formatting
        run: black --diff --check content/test_payments.py
