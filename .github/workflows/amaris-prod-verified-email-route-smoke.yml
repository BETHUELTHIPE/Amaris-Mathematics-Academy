name: Production Verified Email Access Smoke
on:
  push:
    branches: ["ops/prod-email-verification-post-deploy-smoke-20261025"]
    paths: ["ops/prod-verified-email-smoke-request.txt"]
permissions:
  contents: read
jobs:
  production-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check production public verification and protected routes
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError
          from urllib.parse import urlparse
          base="https://amaris-mathematics-academy-live-students.onrender.com"
          class NoFollow(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=build_opener(NoFollow())
          def check(path):
              request=Request(base+path,headers={"User-Agent":"AmarisVerifiedEmailPostDeploy/1.0"})
              try: response=opener.open(request,timeout=30)
              except HTTPError as error: response=error
              with response: return response.status,response.headers.get("Location",""),response.read(120000)
          for path in ("/login","/register","/verify-email","/tutor/login","/tutor/register","/tutor/verify-email"):
              code,_,_=check(path)
              if code!=200: raise SystemExit(f"FAIL: public auth route {path} HTTP {code}")
              print(f"PASS: {path} HTTP 200")
          code,_,body=check("/api/auth-state")
          if code!=200 or json.loads(body).get("authenticated") is not False:
              raise SystemExit("FAIL: anonymous auth-state not false")
          print("PASS: anonymous session not authenticated")
          for path,target in (("/dashboard","/login"),("/tutor/dashboard","/tutor/login")):
              code,location,_=check(path)
              if code not in (301,302,303,307,308) or urlparse(location).path!=target:
                  raise SystemExit(f"FAIL: anonymous private access {path} was not blocked")
              print(f"PASS: anonymous {path} redirects to {target}")
          PY
