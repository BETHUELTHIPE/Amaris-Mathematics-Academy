name: Private Course Media

on:
  push:
    branches: [security/owasp-test-suite, main]
    paths:
      - "backend/requirements.txt"
      - "backend/requirements-dev.txt"
      - "backend/content/models.py"
      - "backend/content/admin.py"
      - "backend/content/private_media_storage.py"
      - "backend/content/migrations/**"
      - "backend/amaris_cms/settings.py"
      - "backend/tests/security/test_private_video_assets.py"
      - ".github/workflows/private-course-media.yml"
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "backend/requirements-dev.txt"
      - "backend/content/models.py"
      - "backend/content/admin.py"
      - "backend/content/private_media_storage.py"
      - "backend/content/migrations/**"
      - "backend/amaris_cms/settings.py"
      - "backend/tests/security/test_private_video_assets.py"
      - ".github/workflows/private-course-media.yml"

permissions:
  contents: read

jobs:
  private-video-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: private_video_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d private_video_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/private_video_ci
      DATABASE_SSL_REQUIRED: "false"
      DJANGO_CACHE_URL: redis://localhost:6379/0
      DJANGO_PUBLIC_CACHE_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/2
      CELERY_RESULT_BACKEND: redis://localhost:6379/3
      PRIVATE_VIDEO_S3_BUCKET_NAME: ""
      PRIVATE_VIDEO_S3_ACCESS_KEY_ID: ""
      PRIVATE_VIDEO_S3_SECRET_ACCESS_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      OPENAI_API_KEY: ""
      YOUTUBE_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Format check
        run: |
          black --check content/models.py content/admin.py content/private_media_storage.py tests/security/test_private_video_assets.py || {
            black --diff content/models.py content/admin.py content/private_media_storage.py tests/security/test_private_video_assets.py
            exit 1
          }
      - name: Ruff lint
        run: ruff check content/models.py content/admin.py content/private_media_storage.py tests/security/test_private_video_assets.py
      - name: Django system checks
        run: python manage.py check
      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply additive migrations on isolated PostgreSQL 17
        run: python manage.py migrate --noinput
      - name: Private media provider and authorization tests
        run: python manage.py test tests.security.test_private_video_assets --noinput
