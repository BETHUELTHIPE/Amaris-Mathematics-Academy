name: Render API Capability Check

on:
  push:
    branches: [check-render-api-key-20260918]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Render API secret exists
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "RENDER_API_KEY is not configured in GitHub Actions." >&2
            exit 1
          fi
          echo "RENDER_API_KEY is configured."
