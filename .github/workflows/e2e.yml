name: E2E and Accessibility

on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  browser-smoke:
    name: Browser route and WCAG smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: browser-actions/setup-chrome@v1
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run browser route and accessibility checks
        shell: bash
        run: |
          npm run dev:ci > /tmp/amaris-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/amaris-site.log; exit 1; fi
            sleep 2
          done
          npm run test:accessibility
