name: Staging verified-payment recipient acceptance
on:
  push:
    branches: ["fix/staging-paid-tutor-admin-invoices-20261028"]
    paths:
      - "backend/content/**"
      - "backend/manage.py"
      - "scripts/release/staging_recipient_preflight.py"
      - ".github/workflows/staging-recipient-invoice-acceptance.yml"
permissions:
  contents: read
concurrency:
  group: staging-recipient-invoice-acceptance
  cancel-in-progress: true
jobs:
  backend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amaris_ci
          POSTGRES_USER: amaris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amaris_ci -d amaris_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://amaris_ci@127.0.0.1:5432/amaris_ci
      DATABASE_SSL_REQUIRED: "false"
      SUPABASE_DATABASE_REQUIRED: "false"
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Generate ephemeral Django test secret
        run: |
          secret="$(openssl rand -hex 64)"
          echo "::add-mask::$secret"
          printf 'DJANGO_SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Formatting, lint and type checks
        run: |
          black --check .
          ruff check .
          mypy
      - name: Django and migration checks
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Full isolated Django regression suite
        run: python manage.py test
  runtime-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: staging
    env:
      RENDER_TOKEN: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
      - name: Install read-only PostgreSQL client
        run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify actual isolated staging bindings and pending approved recipients
        run: python scripts/release/staging_recipient_preflight.py
