name: One-time About page dependency security refresh
on:
  push:
    branches: [feat/about-founder-cv-tech-stack-20261024]
    paths:
      - .github/workflows/repair-about-page-dependencies.yml
permissions:
  contents: write
jobs:
  patched-lock:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/feat/about-founder-cv-tech-stack-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate lockfile and verify security without force
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npm run typecheck
          npm run lint
          node --test tests/about-founder-profile.test.mjs
      - name: Commit verified dependency lockfile
        run: |
          set -euo pipefail
          git diff --check
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: lock audited frontend dependencies for About release"
          git push origin HEAD:feat/about-founder-cv-tech-stack-20261024
