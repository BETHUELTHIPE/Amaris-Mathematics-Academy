name: Capacity Contract Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capacity-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify capacity safety contract
        run: python -m unittest load_tests.test_contract
