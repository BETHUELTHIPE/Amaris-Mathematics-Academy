name: Capacity Actions Canary

on:
  push:
    branches:
      - capacity/repeat-1000-20260930
    paths:
      - ".github/workflows/capacity-canary.yml"

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: capacity
    env:
      TARGET_PRESENT: ${{ vars.CAPACITY_TARGET_URL != '' }}
    steps:
      - run: echo "capacity-actions-canary-ok target_present=${TARGET_PRESENT}"
