name: Trusted Django CMS Media Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trusted-django-cms-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-cms-media-real-storage
  cancel-in-progress: false

jobs:
  django-admin-supabase:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 22
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: synthetic-github-runner-only
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DATABASE_URL: sqlite:////tmp/amaris-cms-media-real-s3.sqlite3
      DATABASE_SSL_REQUIRED: 'false'
      SUPABASE_DATABASE_REQUIRED: 'false'
      CMS_STORAGE_BUCKET_NAME: amaris-cms-files
      STUDENT_STORAGE_BUCKET_NAME: Amaris Mathematics Academy
      AWS_S3_ENDPOINT_URL: https://epkcuseloinygkakxxdu.storage.supabase.co/storage/v1/s3
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
      AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked Django and S3 dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Ensure MP4 fixture encoder is present
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -encoders 2>/dev/null | grep libx264
      - name: Initialize empty isolated local SQLite database
        run: python backend/manage.py migrate --noinput
      - name: Run actual Django Admin and Supabase media acceptance
        run: python -u scripts/release/verify_django_marketing_roundtrip.py
