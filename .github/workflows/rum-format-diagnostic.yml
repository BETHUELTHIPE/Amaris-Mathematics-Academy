name: RUM Python Format Diagnostic
on:
  pull_request:
    branches: [production-release-20260923]
    paths:
      - 'backend/content/rum.py'
      - '.github/workflows/rum-format-diagnostic.yml'
permissions:
  contents: read
jobs:
  show-black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install black==25.1.0
      - name: Print required formatting changes without modifying files
        run: python -m black --line-length 119 --diff backend/content/rum.py
