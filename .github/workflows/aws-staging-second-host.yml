name: Connect the second Amaris staging ECS host

on:
  push:
    branches: [ops/aws-staging-second-host-20261126]
    paths:
      - .github/workflows/aws-staging-second-host.yml
      - deploy/aws/ecs/connect-staging-second-host.sh
      - deploy/aws/ecs/staging-second-host.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amaris-stockholm-staging-release
  cancel-in-progress: false

jobs:
  configure:
    if: github.repository == 'BETHUELTHIPE/Amaris-Mathematics-Academy' && github.ref == 'refs/heads/ops/aws-staging-second-host-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ''
      AMARIS_AWS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate the EC2 template and script
        run: |
          bash -n deploy/aws/ecs/connect-staging-second-host.sh
          python3 -m pip install cfn-lint==1.61.0
          cfn-lint -r eu-north-1 -t deploy/aws/ecs/staging-second-host.yml
      - name: Authenticate to AWS using the staging role
        if: env.AMARIS_AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.AMARIS_AWS_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Authenticate to AWS using the configured staging keys
        if: env.AMARIS_AWS_ROLE == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
          allowed-account-ids: '110156539003'
          mask-aws-account-id: true
      - name: Connect and verify the new private ECS host
        run: bash deploy/aws/ecs/connect-staging-second-host.sh
