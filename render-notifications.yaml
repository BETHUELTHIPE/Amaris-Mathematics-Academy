# Apply this Blueprint separately from render.yaml to avoid changing the existing
# Django web service, production cache/broker, or monitoring resources.
# Both background workers use paid Starter compute; review Render billing first.
# The fromService references require those existing resources in this workspace.
services:
  - type: worker
    name: amaris-production-notification-worker
    runtime: python
    plan: starter
    region: frankfurt
    repo: https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
    branch: production-release-20260923
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python ops/check_notifications.py --role notifications &&
      exec celery -A amaris_cms worker --loglevel=INFO
      --queues=notifications --concurrency=1 --events --hostname=notifications@%h
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: SERVICE_ROLE
        value: celery-notifications
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DATABASE_URL
      - key: SUPABASE_DATABASE_REQUIRED
        value: "true"
      - key: SUPABASE_PROJECT_REF
        value: epkcuseloinygkakxxdu
      - key: DATABASE_SCHEMA
        value: public
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: SUPABASE_S3_REQUIRED
        value: "true"
      - key: SUPABASE_S3_ENDPOINT_URL
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_S3_ENDPOINT_URL
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_S3_ADMIN_BUCKET
        value: amaris-cms-files
      - key: SUPABASE_S3_STUDENT_BUCKET
        value: Amaris Mathematics Academy
      - key: SUPABASE_S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_S3_ACCESS_KEY_ID
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_S3_SECRET_ACCESS_KEY
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: EMAIL_HOST
      - key: EMAIL_PORT
        value: "587"
      - key: VIDEO_REQUEST_DAILY_CAPACITY
        value: "2"
      - key: VIDEO_REQUEST_ETA_RANGE_DAYS
        value: "2"
      - key: EMAIL_HOST_USER
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: EMAIL_HOST_PASSWORD
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: DEFAULT_FROM_EMAIL
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DEFAULT_FROM_EMAIL

  - type: worker
    name: amaris-production-beat
    runtime: python
    plan: starter
    region: frankfurt
    repo: https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
    branch: production-release-20260923
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python ops/check_notifications.py --role beat &&
      exec celery -A amaris_cms beat --loglevel=INFO
      --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: SERVICE_ROLE
        value: celery-beat
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DATABASE_URL
      - key: SUPABASE_DATABASE_REQUIRED
        value: "true"
      - key: SUPABASE_PROJECT_REF
        value: epkcuseloinygkakxxdu
      - key: DATABASE_SCHEMA
        value: public
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
