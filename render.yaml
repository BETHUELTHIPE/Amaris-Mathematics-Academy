# Render Blueprint for the production Amaris Django/Celery data plane.
# The release image is immutable and must be updated to the exact tested Git SHA for each release.
# Secrets marked sync:false are supplied from Render/secret-manager configuration, never committed.

services:
  - type: web
    name: amaris-production-web
    runtime: image
    plan: standard
    region: frankfurt
    image:
      url: docker.io/bethuelm/amaris-mathematics-academy:6303fb30d296fd32886695d3d5cc9fe54f8a5b94
    autoDeployTrigger: off
    healthCheckPath: /health/ready/
    preDeployCommand: python manage.py migrate --noinput
    scaling:
      minInstances: 3
      maxInstances: 24
      targetCPUPercent: 70
    dockerCommand: /bin/sh -c 'GUNICORN_BIND=0.0.0.0:$PORT exec gunicorn amaris_cms.asgi:application --config /app/gunicorn.conf.py'
    envVars:
      - key: SERVICE_ROLE
        value: web
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: amaris-production-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://amaris-production-web.onrender.com,https://amaris-mathematics-academy.bethuelthipe.chatgpt.site
      - key: CORS_ALLOWED_ORIGINS
        value: https://amaris-mathematics-academy.bethuelthipe.chatgpt.site
      - key: SUPABASE_URL
        value: https://epkcuseloinygkakxxdu.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_AUTH_TIMEOUT_SECONDS
        value: "4"
      - key: SUPABASE_AUTH_CACHE_SECONDS
        value: "15"
      - key: SUPABASE_STORAGE_ENABLED
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET_NAME
        value: amaris-cms-files
      - key: SUPABASE_STUDENT_DOCUMENTS_BUCKET_NAME
        value: Amaris Mathematics Academy
      - key: SUPABASE_STORAGE_S3_ENDPOINT
        value: https://epkcuseloinygkakxxdu.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_STORAGE_S3_REGION
        value: us-east-1
      - key: SUPABASE_STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ACCEPTANCE_GITHUB_OIDC_ENABLED
        value: "false"
      - key: PAYFAST_MODE
        value: live
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://amaris-mathematics-academy.bethuelthipe.chatgpt.site
      - key: PUBLIC_API_URL
        value: https://amaris-production-web.onrender.com/api/v1
      - key: PAYFAST_RETURN_URL
        value: https://amaris-mathematics-academy.bethuelthipe.chatgpt.site/payments/pending
      - key: PAYFAST_CANCEL_URL
        value: https://amaris-mathematics-academy.bethuelthipe.chatgpt.site/payments/cancelled
      - key: PAYFAST_NOTIFY_URL
        value: https://amaris-production-web.onrender.com/api/v1/payfast/itn/
      - key: DATABASE_URL
        fromDatabase:
          name: amaris-production-postgres
          property: connectionString
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: DATABASE_CONN_MAX_AGE
        value: "600"
      - key: DJANGO_CACHE_URL
        fromService:
          type: keyvalue
          name: amaris-production-cache
          property: connectionString
      - key: DJANGO_PUBLIC_CACHE_URL
        fromService:
          type: keyvalue
          name: amaris-production-cache
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_REGION_NAME
        value: af-south-1

  - type: worker
    name: amaris-production-critical-worker
    runtime: image
    plan: standard
    region: frankfurt
    image:
      url: docker.io/bethuelm/amaris-mathematics-academy:6303fb30d296fd32886695d3d5cc9fe54f8a5b94
    autoDeployTrigger: off
    dockerCommand: celery -A amaris_cms worker --loglevel=INFO --queues=critical,default --concurrency=2 --events --hostname=critical@%h
    envVars:
      - key: SERVICE_ROLE
        value: celery-worker
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: amaris-production-postgres
          property: connectionString
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: DJANGO_CACHE_URL
        fromService:
          type: keyvalue
          name: amaris-production-cache
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: SUPABASE_STORAGE_ENABLED
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET_NAME
        value: amaris-cms-files
      - key: SUPABASE_STUDENT_DOCUMENTS_BUCKET_NAME
        value: Amaris Mathematics Academy
      - key: SUPABASE_STORAGE_S3_ENDPOINT
        value: https://epkcuseloinygkakxxdu.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_STORAGE_S3_REGION
        value: us-east-1
      - key: SUPABASE_STORAGE_S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_STORAGE_S3_ACCESS_KEY_ID
      - key: SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY

  - type: worker
    name: amaris-production-notification-worker
    runtime: image
    plan: starter
    region: frankfurt
    image:
      url: docker.io/bethuelm/amaris-mathematics-academy:6303fb30d296fd32886695d3d5cc9fe54f8a5b94
    autoDeployTrigger: off
    dockerCommand: celery -A amaris_cms worker --loglevel=INFO --queues=notifications --concurrency=2 --events --hostname=notifications@%h
    envVars:
      - key: SERVICE_ROLE
        value: celery-notifications
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: amaris-production-postgres
          property: connectionString
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: worker
    name: amaris-production-beat
    runtime: image
    plan: starter
    region: frankfurt
    image:
      url: docker.io/bethuelm/amaris-mathematics-academy:6303fb30d296fd32886695d3d5cc9fe54f8a5b94
    autoDeployTrigger: off
    dockerCommand: celery -A amaris_cms beat --loglevel=INFO --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    envVars:
      - key: SERVICE_ROLE
        value: celery-beat
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: amaris-production-postgres
          property: connectionString
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString

  - type: keyvalue
    name: amaris-production-broker
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: keyvalue
    name: amaris-production-cache
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

databases:
  - name: amaris-production-postgres
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "17"
    connectionPool: pgbouncer
