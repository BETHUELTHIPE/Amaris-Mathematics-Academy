# Render Blueprint for the production Amaris Django/Celery data plane.
# It deliberately matches the existing amaris-production-web Python runtime.
# Secrets marked sync:false are supplied from Render/secret-manager configuration, never committed.

services:
  - type: web
    name: amaris-production-web
    runtime: python
    plan: standard
    region: frankfurt
    repo: https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: GUNICORN_BIND=0.0.0.0:$PORT gunicorn amaris_cms.asgi:application --config gunicorn.conf.py
    autoDeployTrigger: off
    healthCheckPath: /health/ready/
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: SERVICE_ROLE
        value: web
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: amaris-production-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://amaris-production-web.onrender.com,https://amaris-mathematics-academy-live-students.onrender.com,https://amaris-mathematics-academy.bethuelthipe.chatgpt.site
      - key: CORS_ALLOWED_ORIGINS
        value: https://amaris-mathematics-academy-live-students.onrender.com,https://amaris-mathematics-academy.bethuelthipe.chatgpt.site
      - key: SUPABASE_URL
        value: https://epkcuseloinygkakxxdu.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_AUTH_TIMEOUT_SECONDS
        value: "4"
      - key: SUPABASE_AUTH_CACHE_SECONDS
        value: "15"
      - key: ACCEPTANCE_GITHUB_OIDC_ENABLED
        value: "false"
      - key: PAYFAST_MODE
        value: live
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://amaris-mathematics-academy-live-students.onrender.com
      - key: PUBLIC_API_URL
        value: https://amaris-production-web.onrender.com
      - key: PAYFAST_RETURN_URL
        value: https://amaris-mathematics-academy-live-students.onrender.com/payments/pending
      - key: PAYFAST_CANCEL_URL
        value: https://amaris-mathematics-academy-live-students.onrender.com/payments/cancelled
      - key: PAYFAST_LIVE_CLASS_RETURN_URL
        value: https://amaris-mathematics-academy-live-students.onrender.com/book-online-live-class/confirmation
      - key: PAYFAST_LIVE_CLASS_CANCEL_URL
        value: https://amaris-mathematics-academy-live-students.onrender.com/payments/cancelled
      - key: PAYFAST_VIDEO_REQUEST_RETURN_URL
        value: https://amaris-mathematics-academy-live-students.onrender.com/request-a-video/confirmation
      - key: PAYFAST_VIDEO_REQUEST_CANCEL_URL
        value: https://amaris-mathematics-academy-live-students.onrender.com/payments/cancelled
      - key: VIDEO_REQUEST_DAILY_CAPACITY
        value: "2"
      - key: VIDEO_REQUEST_ETA_RANGE_DAYS
        value: "2"
      - key: PAYFAST_NOTIFY_URL
        value: https://amaris-production-web.onrender.com/api/v1/payfast/itn/
      - key: DATABASE_URL
        sync: false # Supabase Postgres session-pooler URL, supplied in Render secrets
      - key: SUPABASE_DATABASE_REQUIRED
        value: "true"
      - key: SUPABASE_DATABASE_PROJECT_REF
        value: epkcuseloinygkakxxdu
      - key: DATABASE_SCHEMA
        value: public
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: DATABASE_CONN_MAX_AGE
        value: "60"
      - key: DJANGO_CACHE_URL
        fromService:
          type: keyvalue
          name: amaris-production-cache
          property: connectionString
      - key: DJANGO_PUBLIC_CACHE_URL
        fromService:
          type: keyvalue
          name: amaris-production-cache
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: SUPABASE_S3_REQUIRED
        value: "true"
      - key: SUPABASE_S3_ENDPOINT_URL
        value: https://epkcuseloinygkakxxdu.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_S3_ADMIN_BUCKET
        value: amaris-cms-files
      - key: SUPABASE_S3_STUDENT_BUCKET
        value: Amaris Mathematics Academy
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: amaris-production-critical-worker
    runtime: python
    plan: standard
    region: frankfurt
    repo: https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A amaris_cms worker --loglevel=INFO --queues=critical,default --concurrency=2 --events --hostname=critical@%h
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: SERVICE_ROLE
        value: celery-worker
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DATABASE_URL
      - key: SUPABASE_DATABASE_REQUIRED
        value: "true"
      - key: SUPABASE_DATABASE_PROJECT_REF
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_DATABASE_PROJECT_REF
      - key: DATABASE_SCHEMA
        value: public
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: SUPABASE_S3_REQUIRED
        value: "true"
      - key: SUPABASE_S3_ENDPOINT_URL
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_S3_ENDPOINT_URL
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_S3_ADMIN_BUCKET
        value: amaris-cms-files
      - key: SUPABASE_S3_STUDENT_BUCKET
        value: Amaris Mathematics Academy
      - key: SUPABASE_S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_S3_ACCESS_KEY_ID
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_S3_SECRET_ACCESS_KEY
      - key: DJANGO_CACHE_URL
        fromService:
          type: keyvalue
          name: amaris-production-cache
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString

  - type: worker
    name: amaris-production-notification-worker
    runtime: python
    plan: starter
    region: frankfurt
    repo: https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A amaris_cms worker --loglevel=INFO --queues=notifications --concurrency=2 --events --hostname=notifications@%h
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: SERVICE_ROLE
        value: celery-notifications
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DATABASE_URL
      - key: SUPABASE_DATABASE_REQUIRED
        value: "true"
      - key: SUPABASE_DATABASE_PROJECT_REF
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_DATABASE_PROJECT_REF
      - key: DATABASE_SCHEMA
        value: public
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: SUPABASE_S3_REQUIRED
        value: "true"
      - key: SUPABASE_S3_ENDPOINT_URL
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_S3_ENDPOINT_URL
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_S3_ADMIN_BUCKET
        value: amaris-cms-files
      - key: SUPABASE_S3_STUDENT_BUCKET
        value: Amaris Mathematics Academy
      - key: SUPABASE_S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_S3_ACCESS_KEY_ID
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_S3_SECRET_ACCESS_KEY
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: VIDEO_REQUEST_DAILY_CAPACITY
        value: "2"
      - key: VIDEO_REQUEST_ETA_RANGE_DAYS
        value: "2"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: worker
    name: amaris-production-beat
    runtime: python
    plan: starter
    region: frankfurt
    repo: https://github.com/BETHUELTHIPE/Amaris-Mathematics-Academy
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A amaris_cms beat --loglevel=INFO --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: SERVICE_ROLE
        value: celery-beat
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: DATABASE_URL
      - key: SUPABASE_DATABASE_REQUIRED
        value: "true"
      - key: SUPABASE_DATABASE_PROJECT_REF
        fromService:
          type: web
          name: amaris-production-web
          envVarKey: SUPABASE_DATABASE_PROJECT_REF
      - key: DATABASE_SCHEMA
        value: public
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: amaris-production-broker
          property: connectionString

  - type: keyvalue
    name: amaris-production-broker
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: keyvalue
    name: amaris-production-cache
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []
