<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tutor sign in · Amaris</title>
<style>*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#f4f7fc;color:#142544}.card{width:min(420px,calc(100vw - 32px));border:1px solid #e1e9f5;padding:32px;border-radius:22px;background:white;box-shadow:0 15px 40px #0a1e4014}.brand{font-weight:850;color:#0a2c62}h1{margin:28px 0 6px;font-size:28px;letter-spacing:-.035em}p{font-size:14px;color:#61728b;line-height:1.5}label{display:block;font-size:13px;margin-top:18px;font-weight:700}input{display:block;width:100%;padding:13px;margin-top:7px;border:1px solid #bdccdf;border-radius:11px;font-size:16px}button{width:100%;padding:14px;margin-top:23px;background:#0c326a;border:0;border-radius:11px;color:white;font-weight:800;cursor:pointer}.error{color:#9b253d;background:#fff2f3;padding:12px;border-radius:10px;font-size:13px}</style></head>
<body><main class="card"><div class="brand">Amaris Mathematics Academy</div><h1>Tutor sign in</h1><p>View verified activity and your earnings statements. Please use your tutor credentials.</p>
{% if form.errors %}<p class="error" role="alert">Invalid credentials. Please try again.</p>{% endif %}
<form method="post">{% csrf_token %}<label for="id_username">Username</label>{{ form.username }}<label for="id_password">Password</label>{{ form.password }}<input type="hidden" name="next" value="/tutor/dashboard/"><button type="submit">Sign in to dashboard</button></form></main></body></html>
