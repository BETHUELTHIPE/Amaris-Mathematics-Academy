global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]

  - job_name: flower
    metrics_path: /monitoring/flower/metrics
    basic_auth:
      username_file: /tmp/flower_username
      password_file: /tmp/flower_password
    static_configs:
      - targets: ["flower:5555"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres_exporter
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: redis_exporter
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: redis_cache_exporter
    static_configs:
      - targets: ["redis_cache_exporter:9121"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://amaris-mathematics-academy.bethuelthipe.chatgpt.site/
          - http://nginx/health/ready/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
