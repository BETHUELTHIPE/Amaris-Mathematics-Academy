global:
  resolve_timeout: 5m

route:
  receiver: amaris-on-call
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers: [severity="critical"]
      receiver: amaris-on-call
      repeat_interval: 30m

receivers:
  - name: amaris-on-call
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
        max_alerts: 20
        timeout: 10s
