name: amaris-backend

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - statement_timeout=30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/001-performance.sql:/docker-entrypoint-initdb.d/001-performance.sql:ro
    networks: [backend_network, monitoring_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 60s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.5}

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000", "--maxmemory", "${REDIS_BROKER_MAXMEMORY:-512mb}", "--maxmemory-policy", "noeviction", "--tcp-keepalive", "60"]
    volumes: [redis_data:/data]
    networks: [backend_network, monitoring_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    mem_limit: ${REDIS_BROKER_MEMORY_LIMIT:-640m}
    cpus: ${REDIS_BROKER_CPU_LIMIT:-0.75}

  redis_cache:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru", "--tcp-keepalive", "60"]
    networks: [backend_network, monitoring_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    stop_grace_period: 10s
    mem_limit: ${REDIS_CACHE_MEMORY_LIMIT:-320m}
    cpus: ${REDIS_CACHE_CPU_LIMIT:-0.5}

  migrate:
    build: .
    restart: "no"
    init: true
    env_file: .env
    environment:
      SERVICE_ROLE: migrate
      POSTGRES_HOST: db
      DATABASE_STATEMENT_TIMEOUT_MS: 0
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    command: /app/ops/migrate.sh
    volumes:
      - media_data:/backup-source/media:ro
      - backup_metrics:/var/lib/amaris-reliability
    secrets: [restic_password]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend_network, recovery_network]
    stop_grace_period: 10m

  web:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment: {SERVICE_ROLE: web}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    networks: [backend_network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_signal: SIGTERM
    stop_grace_period: 90s
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    cpus: ${WEB_CPU_LIMIT:-1.5}

  celery_worker:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment: {SERVICE_ROLE: celery-worker}
    command: celery -A amaris_cms worker --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-2} --events
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_network, monitoring_network]
    healthcheck:
      test: ["CMD-SHELL", "celery -A amaris_cms inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_signal: SIGTERM
    stop_grace_period: 10m
    mem_limit: ${CELERY_MEMORY_LIMIT:-1g}
    cpus: ${CELERY_CPU_LIMIT:-1.5}

  celery_beat:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment: {SERVICE_ROLE: celery-beat}
    command: celery -A amaris_cms beat --loglevel=INFO --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend_network]
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_signal: SIGTERM
    stop_grace_period: 60s
    mem_limit: ${CELERY_BEAT_MEMORY_LIMIT:-256m}
    cpus: ${CELERY_BEAT_CPU_LIMIT:-0.25}

  payment_reconciler:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment: {SERVICE_ROLE: payment-reconciler}
    command: python manage.py reconcile_payments --loop --interval=${PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-900}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend_network]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_signal: SIGTERM
    stop_grace_period: 60s

  backup:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SERVICE_ROLE: backup
      POSTGRES_HOST: db
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RELIABILITY_METRICS_DIR: /var/lib/amaris-reliability
    command: /app/ops/backup-loop.sh
    volumes:
      - media_data:/backup-source/media:ro
      - backup_metrics:/var/lib/amaris-reliability
    secrets: [restic_password]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend_network, recovery_network]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/amaris-reliability/backup-success && find /var/lib/amaris-reliability/backup-success -mmin -480 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30m
    stop_signal: SIGTERM
    stop_grace_period: 30m

  restore_test_db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RESTORE_TEST_POSTGRES_DB}
      POSTGRES_USER: ${RESTORE_TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RESTORE_TEST_POSTGRES_PASSWORD}
    tmpfs: [/var/lib/postgresql/data]
    networks: [recovery_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESTORE_TEST_POSTGRES_USER} -d ${RESTORE_TEST_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  restore_tester:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SERVICE_ROLE: restore-tester
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RESTORE_TEST_POSTGRES_HOST: restore_test_db
      RELIABILITY_METRICS_DIR: /var/lib/amaris-reliability
    command: /app/ops/restore-test-loop.sh
    volumes: [backup_metrics:/var/lib/amaris-reliability]
    secrets: [restic_password]
    depends_on:
      restore_test_db:
        condition: service_healthy
    networks: [recovery_network]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/amaris-reliability/restore-test-success && find /var/lib/amaris-reliability/restore-test-success -mmin -11520 | grep -q ."]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 2h
    stop_signal: SIGTERM
    stop_grace_period: 30m

  flower:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment: {SERVICE_ROLE: flower}
    command: >-
      /bin/sh -c 'celery -A amaris_cms flower
      --address=0.0.0.0
      --port=$${FLOWER_PORT:-5555}
      --url_prefix=monitoring/flower
      --basic_auth=$$(cat /run/secrets/flower_basic_auth)
      --persistent=True
      --db=/data/flower.db'
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    volumes: [flower_data:/data]
    secrets: [flower_basic_auth]
    networks: [backend_network, monitoring_network]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --user \"$$(cat /run/secrets/flower_basic_auth)\" http://localhost:$${FLOWER_PORT:-5555}/monitoring/flower/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/prometheus/amaris-entrypoint.sh"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/prometheus/entrypoint.sh:/etc/prometheus/amaris-entrypoint.sh:ro
      - prometheus_data:/prometheus
    secrets: [flower_basic_auth]
    networks: [backend_network, monitoring_network]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
      GRAFANA_URL: ${GRAFANA_URL:-http://grafana:3000}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:8080/monitoring/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-false}
      GF_SECURITY_COOKIE_SECURE: ${GF_SECURITY_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets: [grafana_admin_password]
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [monitoring_network]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring_network]

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    networks: [backend_network, monitoring_network]

  redis_exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment: {REDIS_ADDR: redis://redis:6379}
    networks: [backend_network, monitoring_network]

  redis_cache_exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment: {REDIS_ADDR: redis://redis_cache:6379}
    networks: [backend_network, monitoring_network]

  node_exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/var/lib/amaris-reliability"]
    volumes:
      - /:/host:ro,rslave
      - backup_metrics:/var/lib/amaris-reliability:ro
    networks: [monitoring_network]

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [frontend_network, backend_network, monitoring_network]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["${NGINX_PORT:-8080}:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/errors:/usr/share/nginx/html/errors:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend_network, backend_network, monitoring_network]
    stop_signal: SIGQUIT
    stop_grace_period: 60s
    mem_limit: ${NGINX_MEMORY_LIMIT:-256m}
    cpus: ${NGINX_CPU_LIMIT:-0.5}

  pgadmin:
    image: dpage/pgadmin4:9.8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      SCRIPT_NAME: /monitoring/pgadmin
    volumes: [pgadmin_data:/var/lib/pgadmin]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend_network, monitoring_network]

networks:
  frontend_network:
  backend_network:
  recovery_network:
  monitoring_network:
    internal: true

secrets:
  flower_basic_auth:
    environment: FLOWER_BASIC_AUTH
  grafana_admin_password:
    environment: GF_SECURITY_ADMIN_PASSWORD
  restic_password:
    environment: RESTIC_PASSWORD

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  flower_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
  backup_metrics:
