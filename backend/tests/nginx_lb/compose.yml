# Disposable synthetic replicas only: no Django, database, broker or credentials.
services:
  web:
    image: python:3.13.15-slim
    command: ["python", "/fixture/server.py"]
    volumes:
      - ./server.py:/fixture/server.py:ro
    networks: [test_backend]
    mem_limit: 128m
  nginx:
    image: nginx:1.29-alpine
    ports: ["127.0.0.1::80"]
    volumes:
      - ../../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../nginx/errors:/usr/share/nginx/html/errors:ro
    depends_on: [web]
    networks: [test_backend]
    mem_limit: 128m
networks:
  test_backend:
