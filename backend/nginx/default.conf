upstream amaris_django {
    server web:8000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=amaris_enquiry:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=amaris_admin_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=amaris_per_ip:10m;

server {
    listen 80;
    server_name _;
    client_max_body_size 2g;
    resolver 127.0.0.11 ipv6=off valid=30s;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    add_header X-Correlation-ID "AMR-$request_id" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    limit_req_status 429;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;

    location = /errors/502.html {
        internal;
        root /usr/share/nginx/html;
        ssi on;
    }

    location = /errors/503.html {
        internal;
        root /usr/share/nginx/html;
        ssi on;
    }

    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Paid course files must be served later by an authorised/signed endpoint.
    location ^~ /media/videos/ { return 404; }
    location ^~ /media/resources/ { return 404; }

    location /media/ {
        alias /var/www/media/;
        add_header X-Content-Type-Options nosniff;
    }

    # Prometheus scrapes Django directly over the private backend network.
    location = /metrics { return 404; }
    location ^~ /metrics/ { return 404; }
    location = /health/dependencies/ { return 404; }

    location /monitoring/flower/ {
        set $flower_upstream flower:5555;
        proxy_pass http://$flower_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /monitoring/flower;
        proxy_http_version 1.1;
    }

    location /monitoring/grafana/ {
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /monitoring/pgadmin/ {
        set $pgadmin_upstream pgadmin:80;
        proxy_pass http://$pgadmin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /monitoring/pgadmin;
    }

    location = /api/v1/enquiries/ {
        limit_req zone=amaris_enquiry burst=3 nodelay;
        proxy_pass http://amaris_django;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID "AMR-$request_id";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/login/ {
        limit_req zone=amaris_admin_login burst=5 nodelay;
        proxy_pass http://amaris_django;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID "AMR-$request_id";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_conn amaris_per_ip 50;
        proxy_pass http://amaris_django;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID "AMR-$request_id";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}
