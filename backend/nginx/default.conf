limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=enquiries:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

upstream amaris_django {
    server web:8000;
    keepalive 8;
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1025m;
    access_log off;
    limit_req_status 429;
    limit_conn_status 429;
    resolver 127.0.0.11 ipv6=off valid=30s;
    # Docker-only deployment: managed Render services do not run this Nginx.
    # All proxy locations share the same bounded failure/IO behavior.
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    limit_conn per_ip 40;

    add_header X-Correlation-ID "AMR-$request_id" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 429 /errors/429.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;

    location = /errors/429.html {
        internal;
        default_type text/plain;
        return 429 "Too many requests. Please try again shortly.\n";
    }

    location = /errors/502.html {
        internal;
        root /usr/share/nginx/html;
        ssi on;
    }

    location = /errors/503.html {
        internal;
        root /usr/share/nginx/html;
        ssi on;
    }

    location /static/ {
        alias /var/www/static/;
        open_file_cache max=1024 inactive=30s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;
        gzip on;
        gzip_static on;
        gzip_proxied any;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_types text/css application/javascript image/svg+xml;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Paid course files are never exposed by the public reverse proxy.
    location ^~ /media/videos/ { return 404; }
    location ^~ /media/resources/ { return 404; }
    location ^~ /media/student-private/ { return 404; }

    location /media/ {
        alias /var/www/media/;
        add_header X-Content-Type-Options nosniff;
    }

    # Metrics and administration consoles are internal-only. Prometheus scrapes
    # Django/Flower directly over Docker's private networks.
    location = /metrics { return 404; }
    location ^~ /metrics/ { return 404; }
    location ^~ /monitoring/flower/ { return 404; }
    location ^~ /monitoring/grafana/ { return 404; }
    location ^~ /monitoring/pgadmin/ { return 404; }

    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://amaris_django;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID "AMR-$request_id";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /api/v1/enquiries/ {
        limit_req zone=enquiries burst=3 nodelay;
        proxy_pass http://amaris_django;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID "AMR-$request_id";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://amaris_django;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID "AMR-$request_id";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
