# Included only in the four explicit console locations. Dynamic DNS resolution
# lets NGINX start before the monitoring services and survive service restarts.
auth_request /_monitoring_auth;
error_page 401 = @monitoring_login;
proxy_pass http://$monitoring_backend$request_uri;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $monitoring_connection;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_cache off;
proxy_hide_header Cache-Control;
add_header Cache-Control "private, no-store" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
