# One HTTP gateway behind a trusted HTTPS terminator; never expose this port directly.
worker_processes 1;
pid /var/run/nginx.pid;
error_log stderr crit;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/site-trusted-proxies.conf;

    map $http_upgrade $site_connection {
        default upgrade;
        "" "";
    }
    # Match URI boundaries: frontend /api/* BFF routes must not become Django routes.
    map $uri $site_upstream {
        default site_frontend;
        ~^/(api/v1|api/schema|api/docs|admin|static|health|ws)(/|$) site_backend;
    }
    upstream site_backend {
        zone site_backend 64k;
        least_conn;
        resolver 127.0.0.11 ipv6=off valid=5s;
        resolver_timeout 2s;
        server backend:8000 resolve max_fails=1 fail_timeout=10s;
        keepalive 8;
        keepalive_timeout 4s;
    }
    upstream site_frontend {
        zone site_frontend 64k;
        least_conn;
        resolver 127.0.0.11 ipv6=off valid=5s;
        resolver_timeout 2s;
        server frontend:3000 resolve max_fails=1 fail_timeout=10s;
        keepalive 8;
        keepalive_timeout 4s;
    }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1025m;
        client_body_timeout 60s;
        send_timeout 65s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /nginx-health/live/ {
            default_type application/json;
            add_header Cache-Control no-store;
            return 200 '{"status":"ok","component":"nginx"}';
        }
        # No local private media or direct monitoring-console bypass.
        location = /media { return 404; }
        location ^~ /media/ { return 404; }
        location = /metrics { return 404; }
        location ^~ /metrics/ { return 404; }
        location = /monitoring { return 404; }
        location ^~ /monitoring/ { return 404; }

        location / {
            # No URI suffix: paths, query strings and signed callback bodies stay intact.
            proxy_pass http://$site_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # This listener is loopback/private and MUST sit behind enforced HTTPS.
            # Do not trust arbitrary client-supplied scheme or forwarding chains.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID "AMR-$request_id";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $site_connection;
            proxy_connect_timeout 3s;
            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_cache off;
            proxy_intercept_errors off;
            proxy_next_upstream off;
        }
    }
}
