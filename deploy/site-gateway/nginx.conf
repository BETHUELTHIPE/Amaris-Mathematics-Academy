# One HTTP gateway behind a trusted HTTPS terminator; never expose this port directly.
worker_processes 1;
pid /var/run/nginx.pid;
error_log stderr crit;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    # Public objects only; transient cache is bounded and discarded on replacement.
    proxy_cache_path /var/cache/nginx/site-public levels=1:2 keys_zone=site_public:4m
                     max_size=128m inactive=10m use_temp_path=off;
    map $request_method $site_write { default 1; GET 0; HEAD 0; }
    map $http_cookie $site_cookie { default 1; "" 0; }
    map $http_authorization $site_auth { default 1; "" 0; }
    map $args $site_query { default 1; "" 0; }
    map "$http_rsc$http_next_router_state_tree$http_next_router_prefetch$http_next_url$http_next_action" $site_rsc {
        default 1; "" 0;
    }
    map $http_accept $site_stream_request {
        default 0; ~*(text/event-stream|text/x-component) 1;
    }
    map "$http_range$http_upgrade$http_cache_control$http_pragma" $site_special { default 1; "" 0; }
    map "$site_write$site_cookie$site_auth$site_query$site_rsc$site_special$site_stream_request" $site_skip_cache {
        default 1; "0000000" 0;
    }
    # Upstream must explicitly allow public caching. Never ignore its privacy headers.
    map $upstream_http_cache_control $site_response_private {
        default 1; ~*(^|,)\s*public(,|$) 0;
    }
    map $upstream_http_content_type $site_response_stream {
        default 0; ~*^(text/event-stream|text/x-component) 1;
    }
    map $upstream_status $site_response_error { default 1; "200" 0; }
    map $upstream_cache_status $site_cache_result { default $upstream_cache_status; "" OFF; }
    access_log off;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/site-trusted-proxies.conf;

    map $http_upgrade $site_connection {
        default upgrade;
        "" "";
    }
    # Match URI boundaries: frontend /api/* BFF routes must not become Django routes.
    map $uri $site_upstream {
        default site_frontend;
        ~^/(api/v1|api/schema|api/docs|admin|static|health|ws)(/|$) site_backend;
    }
    upstream site_backend {
        zone site_backend 64k;
        least_conn;
        resolver 127.0.0.11 ipv6=off valid=5s;
        resolver_timeout 2s;
        server backend:8000 resolve max_fails=1 fail_timeout=10s;
        keepalive 32;
        keepalive_timeout 4s;
    }
    upstream site_frontend {
        zone site_frontend 64k;
        least_conn;
        resolver 127.0.0.11 ipv6=off valid=5s;
        resolver_timeout 2s;
        server frontend:3000 resolve max_fails=1 fail_timeout=10s;
        keepalive 32;
        keepalive_timeout 4s;
    }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1025m;
        client_body_timeout 60s;
        send_timeout 65s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Amaris-Cache $site_cache_result always;

        location = /nginx-health/live/ {
            default_type application/json;
            add_header Cache-Control no-store;
            return 200 '{"status":"ok","component":"nginx"}';
        }
        # No local private media or direct monitoring-console bypass.
        location = /media { return 404; }
        location ^~ /media/ { return 404; }
        location = /metrics { return 404; }
        location ^~ /metrics/ { return 404; }
        location = /monitoring { return 404; }
        location ^~ /monitoring/ { return 404; }

        # Static assets may be compressed; dynamic/private pages never are here.
        location ~ ^/(?:_next/static/|assets/|static/) {
            include /etc/nginx/site-public-cache.conf;
            gzip on;
            gzip_vary on;
            gzip_proxied any;
            gzip_comp_level 4;
            gzip_min_length 1024;
            gzip_types text/css application/javascript text/javascript application/json
                       application/wasm image/svg+xml;
        }
        # Public JSON only. All frontend page rendering remains unbuffered.
        location ~ ^/api/v1/(?:bootstrap|courses(?:/[a-z0-9-]+)?)/?$ {
            include /etc/nginx/site-public-cache.conf;
        }
        location @site_uncached {
            include /etc/nginx/site-proxy-common.conf;
            proxy_buffering off;
            proxy_cache off;
        }
        location / {
            include /etc/nginx/site-proxy-common.conf;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
