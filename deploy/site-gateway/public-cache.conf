# Safe return-only if dispatch: private/RSC/streaming requests keep unbuffered handling.
error_page 418 = @site_uncached;
if ($site_skip_cache) { return 418; }
include /etc/nginx/site-proxy-common.conf;
proxy_buffering on;
proxy_cache site_public;
proxy_cache_key "$scheme|$http_host|$site_upstream|$request_uri";
proxy_cache_methods GET HEAD;
proxy_cache_valid 200 30s;
proxy_cache_lock on;
proxy_cache_lock_timeout 3s;
proxy_cache_lock_age 5s;
proxy_cache_revalidate on;
# No stale serving: edits/privacy changes take effect after the origin TTL expires.
proxy_no_cache $site_response_stream $site_response_private $site_response_error $upstream_http_set_cookie;
