# Shared routing, identity forwarding and no automatic request replay.
    # No URI suffix: paths, query strings and signed callback bodies stay intact.
    proxy_pass http://$site_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    # This listener is loopback/private and MUST sit behind enforced HTTPS.
    # Do not trust arbitrary client-supplied scheme or forwarding chains.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Correlation-ID "AMR-$request_id";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $site_connection;
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_intercept_errors off;
    proxy_next_upstream off;
